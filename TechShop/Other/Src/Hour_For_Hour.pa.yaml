            OnSelect: "=If(\n    DataCardValue115.Text = \"Paro\" && Value(DataCardValue24.Text) <> 0,\n    Notify(\n        \"La maquina esta en 'Paro', la cantidad debe ser 0\",\n        NotificationType.Error\n    ),\n    If(\n    DataCardValue19.SelectedText.Value = \"\" || DataCardValue21.Text = \"\" || DataCardValue22.Text = \"\" || DataCardValue23.Text = \"\" || DataCardValue24.Text = \"\" || DataCardValue58.Text = \"\"|| DataCardValue19.SelectedText.Value = \"Mañana\"|| DataCardValue19.SelectedText.Value = \"Tarde\"|| DataCardValue19.SelectedText.Value = \"Ayer\" || DataCardValue18.Text = \"\" || DataCardValue63.Text = \"\" || DataCardValue178.SelectedText.Value = \"\"|| DataCardValue160.Text = \"\" || DataCardValue162.Text = \"\" || DataCardValue161.Text = \"\" , \n \n    Notify(\n        \"Los campos no pueden estar en blanco o verifiqué la FECHA y la cantidad debe ser mayor a 0\",\n        NotificationType.Error\n    ), //If(Value( TextInput4.Text) >= Value( TextInput1.Text) ; Notify(\n        //\"Orden llena\";\n        //NotificationType.Information\n    //);\n    /*Notify(\n        \"Registro exitoso\";\n        NotificationType.Information\n    );;*/\n    Set(VarSemana,DataCardValue160);\n    Set(VarInicial,DataCardValue161);\n    Set(VarFinal,DataCardValue162);\n    Set(\n        Hora_Registro1,Text(Now(), \"mm/dd/yyyy hh:mm AM/PM\")\n    );\n  SubmitForm(Form1);\n  SubmitForm(Edit_Quantity);\n  Set(Activate_Alert,true); //)\n  SubmitForm(FormEditRange);\n  \n\n);\n);\n\n\n\n  \n\n"
