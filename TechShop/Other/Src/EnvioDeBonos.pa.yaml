\"Comprobante Financiero Semanal - Semana \" & txt_Semana_EBS.Text,\n        \"Estimado(a),<br><br>Adjunto encontrará el comprobante financiero semanal correspondiente a la semana \" & txt_Semana_EBS.Text & \". Este documento es generado automáticamente por nuestro sistema. Por favor, revise la información con detenimiento.<br><br><br><br>Quedamos a su disposición para cualquier consulta.<br><br>Atentamente,<br>Equipo de desarollo y analisis\",\n        EmployeeCodesString,\n        \"jbrenes@tsicr.com\",\n        LogotipoTech,\n        txt_Semana_EBS.Text,\n        txt_Ubicacion_EBS.Text\n    );\n    ForAll(\n        SelectedEmployees,\n        Patch(\n            BonoSemanals,\n            LookUp(\n                BonoSemanals,\n                ID = SelectedEmployees[@ID]\n            ),\n            {Aprovado: true}\n        )\n    );\n    Notify(\n        \"Comprobante de Bono por selección enviado exitosamente\",\n        NotificationType.Success\n    );\n    UpdateContext({ConVisible: false});\n    Clear(SelectedEmployees);\n    Clear(EmployeeCodes);\n    Set(\n        EmployeeCodesString,\n        \"\"\n    );\n    \n);\n"
