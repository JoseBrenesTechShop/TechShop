                  Fill: =RGBA(40, 134, 222, 1)
                  Height: =38
                  HoverBorderColor: =RGBA(180, 214, 250, 1)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  OnSelect: |-
                    =With(
                        {
                            duplicados: Filter(
                                colSelEO As sel,
                                !IsBlank(
                                    LookUp(
                                        Orden_Ejecucion,
                                        Orden = sel.job && 
                                        Descripcion = sel.description && 
                                        'P/N' = sel.item
                                    )
                                )
                            )
                        },
                        If(
                            IsEmpty(colSelEO),
                            UpdateContext(
                                {
                                    MostrarAviso: true,
                                    mensajeNotificacion: "No existen órdenes por guardar."
                                }
                            ),
                            CountRows(duplicados) > 0,
                            UpdateContext(
                                {
                                    MostrarAviso: true,
                                    mensajeNotificacion: "Las órdenes resaltadas en rojo ya estan registradas, eliminar para continuar"
                                }
                            ),
                            ForAll(
                                colSelEO,
                                Patch(
                                    Orden_Ejecucion,
                                    Defaults(Orden_Ejecucion),
                                    {
                                        Orden: ThisRecord.job,
                                        'P/N': ThisRecord.item,
                                        Operacion: Value(ThisRecord.oper_numFrom),
                                        Descripcion: ThisRecord.description,
                                        Meta: Value(ThisRecord.Meta),
                                        TiempoSetup: Value(ThisRecord.setup_hrs),
                                        Cantidad: Value(ThisRecord.qty_released),
                                        Tarima: Value(ThisRecord.Tarima),
                                        Tiempo_Maquina: Value(ThisRecord.TMaquinado)
                                    }
                                )
                            );
                            Clear(colSelEO);
                            Refresh(Orden_Ejecucion);
                            Refresh(CorPJobOper);
                            Reset(txt_codigo_EO);
                            Reset(txt_PN_EO);
                            UpdateContext({agregar: false});
                            UpdateContext(
                                {
                                    MostrarAviso: true,
                                    mensajeNotificacion: "Órdenes procesadas correctamente"
                                }
                            )
                        )
                    )
