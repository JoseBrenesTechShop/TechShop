                Children:
                  - lbl_PNDato_EC_16:
                      Control: Text@0.0.51
                      Properties:
                        Align: ='TextCanvas.Align'.Center
                        Height: =30
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =18
                        Text: ="Escanee el P/N de la Tarima que desea agregar"
                        VerticalAlign: =VerticalAlign.Top
                        Weight: ='TextCanvas.Weight'.Regular
                        Width: =390
                        X: =82
                        Y: =6
                  - txt_ScanPN_LE:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(40, 134, 222, 1)
                        Default: =
                        DisplayMode: =If(MostrarAviso || good, DisplayMode.Disabled, DisplayMode.Edit)
                        FontWeight: =FontWeight.Semibold
                        Height: =30
                        HoverBorderColor: =RGBA(40, 134, 222, 1)
                        OnChange: |-
                          =With(
                              {
                                  PNCorregido: Substitute(
                                      Substitute(
                                          Substitute(
                                              Upper(Self.Text),
                                              "¡",
                                              "&"
                                          ),
                                          "&",
                                          "/"
                                      ),
                                      "'",
                                      "-"
                                  ),
                                  PNSplit: Split(
                                      Substitute(
                                          Substitute(
                                              Substitute(
                                                  Upper(Self.Text),
                                                  "¡",
                                                  "&"
                                              ),
                                              "&",
                                              "/"
                                          ),
                                          "'",
                                          "-"
                                      ),
                                      "/"
                                  )
                              },
                              With(
                                  {
                                      ident: Last(
                                          FirstN(
                                              PNSplit,
                                              2
                                          )
                                      ).Value,
                                      PN: First(PNSplit).Value,
                                      PO: Last(PNSplit).Value,
                                      item: LookUp(
                                          ContenedorPNS_2,
                                          Nomenclatura = gl_ListaContenedores_LE.Selected.Nomenclatura && Substitute('P/N', " ", "") = Substitute(First(PNSplit).Value, " ", "")
                                      )
                                  },
                                  If(
                                      CountRows(PNSplit) < 3,
                                      UpdateContext(
                                          {
                                              mensajeNotificacion: "El codigo escaneado esta incompleto. Se requiera el numero de tarima y la PO",
                                              MostrarAviso: true,
                                              Disable: true
                                          }
                                      ),
                                      IsBlank(ident),
                                      UpdateContext(
                                          {
                                              mensajeNotificacion: "Debe indicar el identificador de la tarima",
                                              MostrarAviso: true,
                                              Disable: true
                                          }
                                      ),
                                      IsBlank(PO),
                                      UpdateContext(
                                          {
                                              mensajeNotificacion: "Debe indicar la PO",
                                              MostrarAviso: true,
                                              Disable: true
                                          }
                                      ),
                                      IsBlank(item),
                                      UpdateContext(
                                          {
                                              mensajeNotificacion: "El P/N escaneado no exite en este contenedor.",
                                              MostrarAviso: true,
                                              Disable: true
                                          }
                                      ),
                                      item.Cantidad <= item.CantidadActual,
                                      UpdateContext(
                                          {
                                              mensajeNotificacion: "Ya se alcanzo la cantidad maxima de tarimas de ese P/N para este contenedor",
                                              MostrarAviso: true,
                                              Disable: true
                                          }
                                      ),
                                      ident in Split(
                                          item.'P/N_Codigo',
                                          ","
                                      ),
                                      UpdateContext(
                                          {
                                              mensajeNotificacion: "La tarima escaneada ya fue agregada",
                                              MostrarAviso: true,
                                              Disable: true
                                          }
                                      ),
                                      Patch(
                                          ContenedorPNS_2,
                                          item,
                                          {
                                              CantidadActual: item.CantidadActual + 1,
                                              'P/N_Codigo': item.'P/N_Codigo' & ident & ",",
                                              POS: If(
                                                  PO in Split(
                                                      item.POS,
                                                      ","
                                                  ),
                                                  item.POS,
                                                  item.POS & PO & ","
                                              )
                                          }
                                      );
                                      UpdateContext({good: true}),
                                      Refresh(ContenedorPNS_2);
                                      Reset(txt_ScanPN_LE);
                                      SetFocus(txt_ScanPN_LE)
                                  )
                              )
                          )
                        OnSelect: |-
                          =Reset(txt_ScanPN_LE);
                          SetFocus(txt_ScanPN_LE)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Size: =15
