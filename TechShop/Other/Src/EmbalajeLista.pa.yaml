                  Width: =530
            - btn_Aceptar_EM_5:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(52, 152, 47, 1)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =RGBA(52, 152, 47, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Bold
                  Height: =50
                  HoverBorderColor: =RGBA(180, 214, 250, 1)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =RGBA(52, 152, 47, 1)
                  OnSelect: |-
                    =RemoveIf(
                        ContenedorPNS_2,
                        Nomenclatura = ItemEliminar.Nomenclatura
                    );
                    Remove(
                        Contenedors_2,
                        ItemEliminar
                    );

                    Set(varBaseNomenclatura, Left(ItemEliminar.Nomenclatura, Len(ItemEliminar.Nomenclatura) - 1));
                    Set(varLetraEliminar, Right(ItemEliminar.Nomenclatura, 1));

                    Set(varIndicesLetras,
                        Table(
                            {Letra: "A", Indice: 1},
                            {Letra: "B", Indice: 2},
                            {Letra: "C", Indice: 3},
                            {Letra: "D", Indice: 4},
                            {Letra: "E", Indice: 5},
                            {Letra: "F", Indice: 6},
                            {Letra: "G", Indice: 7},
                            {Letra: "H", Indice: 8},
                            {Letra: "I", Indice: 9},
                            {Letra: "J", Indice: 10},
                            {Letra: "K", Indice: 11},
                            {Letra: "L", Indice: 12},
                            {Letra: "M", Indice: 13},
                            {Letra: "N", Indice: 14},
                            {Letra: "O", Indice: 15},
                            {Letra: "P", Indice: 16},
                            {Letra: "Q", Indice: 17},
                            {Letra: "R", Indice: 18},
                            {Letra: "S", Indice: 19},
                            {Letra: "T", Indice: 20},
                            {Letra: "U", Indice: 21},
                            {Letra: "V", Indice: 22},
                            {Letra: "W", Indice: 23},
                            {Letra: "X", Indice: 24},
                            {Letra: "Y", Indice: 25},
                            {Letra: "Z", Indice: 26}
                        )
                    );

                    Set(varIndiceEliminar,
                        LookUp(varIndicesLetras, Letra = varLetraEliminar).Indice
                    );

                    ForAll(
                        Sort(
                            Filter(
                                Contenedors_2,
                                StartsWith(Nomenclatura, varBaseNomenclatura) && 
                                LookUp(varIndicesLetras, Letra = Right(Nomenclatura, 1)).Indice > varIndiceEliminar 
                            ),
                            Nomenclatura,
                            SortOrder.Ascending
                        ),
                        Patch(
                            Contenedors_2,
                            ThisRecord,
                            {
                                Nomenclatura: varBaseNomenclatura & LookUp(varIndicesLetras, Indice = LookUp(varIndicesLetras, Letra = Right(Nomenclatura, 1)).Indice - 1).Letra,
                                Modificado: txt_EmpleadoUso_EM_2.Text,
                                NumContenedor: Right(varBaseNomenclatura & LookUp(varIndicesLetras, Indice = LookUp(varIndicesLetras, Letra = Right(Nomenclatura, 1)).Indice - 1).Letra, 1) 
                            }
                        )
                    );

                    ForAll(
                        Sort(
                            Filter(
                                ContenedorPNS_2,
                                StartsWith(Nomenclatura, varBaseNomenclatura) &&
                                LookUp(varIndicesLetras, Letra = Right(Nomenclatura, 1)).Indice > varIndiceEliminar
                            ),
                            Nomenclatura,
                            SortOrder.Ascending
                        ),
                        Patch(
                            ContenedorPNS_2,
                            ThisRecord,
                            {
                                Nomenclatura: varBaseNomenclatura & LookUp(varIndicesLetras, Indice = LookUp(varIndicesLetras, Letra = Right(Nomenclatura, 1)).Indice - 1).Letra ,
                                ModificadoPNS: txt_EmpleadoUso_EM_2.Text,
                                'NumContenedorP/N': Right(varBaseNomenclatura & LookUp(varIndicesLetras, Indice = LookUp(varIndicesLetras, Letra = Right(Nomenclatura, 1)).Indice - 1).Letra, 1) 
                            }
                        )
                    );

                    UpdateContext({Eliminar: false, ItemEliminar: Blank()})
                  PressedBorderColor: =RGBA(52, 152, 47, 1)
