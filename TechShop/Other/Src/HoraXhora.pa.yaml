                                                                                                      FechaRegistro >= Fecha1 && FechaRegistro <= Fecha2,
                                                                                                      Hora = drp_Hora_HxH.SelectedText.'data-ADB4D7A662F548B49FAC2B986E348A1BValor'
                                                                                                  )
                                                                                              ) >= 2,
                                                                                              UpdateContext({TextoAdvertencia: "Ya existen 2 registros de la maquina a la hora seleccionada"});
                                                                                              UpdateContext({Mostra: true}),
