                  OnSelect: "=If(\n    IsBlank(drp_Comentario_HxH.SelectedText.Value),\n    Notify(\n        \"El comentario no puede estar vacío.\",\n        NotificationType.Error\n    ),\n    Collect(\n        'Hora X Hora',\n        {\n            CodigoEmpleado: LookUp(\n                Empleados,\n                Nombre = drp_Operario_HxH.Selected.Empleado,\n                Codigo\n            ),\n            Operario: drp_Operario_HxH.Selected.Empleado,\n            Maquina: Upper(txt_MaquinaView_HxH.Text),\n            Orden: glr_Info_HxH.Selected.Orden,\n            Operacion: glr_Info_HxH.Selected.Operacion,\n            'P/N': glr_Info_HxH.Selected.'P/N',\n            Cantidad_Por_Hora: If(\n                drp_Causas_HxH.SelectedText.Value = \"Set Up\" && LookUp(\n                    Maquinas,\n                    Maquina = Upper(txt_MaquinaView_HxH.Text),\n                    Ubicacion_Bono\n                ) = \"TSI\",\n                If(\n                    glr_Info_HxH.Selected.TiempoSetup = 0,\n                    CantidadPorHoraGuardar,\n                    1 / glr_Info_HxH.Selected.TiempoSetup\n                ),\n                CantidadPorHoraGuardar\n            ),\n            Cantidad: Value(txt_CantProducida_HxH.Text),\n            Semana: Value(txt_Semana_HxH.Text),\n            Turno: txt_Turno_HxH.Text,\n            User: txtEmpleadoEnUso.Text,\n            'Fecha_Registro_Supervisor ': Text(\n                Text(\n                    FechaSup,\n                    \"mm/dd/yyyy\"\n                ) & \" \" & drp_Hora_HxH.SelectedText.Value\n            ),\n            FechaRegistro: DateTimeValue(\n                Text(\n                    FechaSup,\n                    \"[$-en-US]yyyy-mm-dd\"\n                ) & \" 12:00:00\"\n            ),\n            Tarima: txt_TarimaView_HxH.Text,\n            Comentario: drp_Comentario_HxH.SelectedText.Value,\n            Causa: drp_Causas_HxH.SelectedText.Value,\n            Descripcion: txt_Descripcion_HxH.Text,\n            Ubicacion_Bono: LookUp(\n                Maquinas,\n                Maquina = txt_MaquinaView_HxH.Text,\n                Ubicacion_Bono\n            ),\n            Fecha_Hora: Text(\n                Now(),\n                \"mm/dd/yyyy hh:mm AM/PM\"\n            ),\n            Hora: drp_Hora_HxH.SelectedText.'data-ADB4D7A662F548B49FAC2B986E348A1BValor',\n            Fecha_Registro_Fin: Text(\n                FechaSup,\n                \"mm/dd/yyy\"\n            ),\n            Usuario_Fin: txt_Sup_HxH.Text\n        }\n    );\n    Patch(\n        Orden_Ejecucion,\n        glr_Info_HxH.Selected,\n        {CantidadTotalProducida: txt_CantTotal_HxH.Text + txt_CantProducida_HxH.Text}\n    );\n    If(\n        IsBlank(txt_CantTarima_HxH.Text),\n        Collect(\n            Orden_Tarimas,\n            {\n                Orden: txt_Orden_HxH.Text,\n                Operacion: txt_OP_HxH.Text,\n                Tarima: txt_TarimaView_HxH.Text,\n                CantidadTotalProducida: Value(txt_CantProducida_HxH.Text)\n            }\n        ),\n        Patch(\n            Orden_Tarimas,\n            LookUp(\n                Orden_Tarimas,\n                Orden = glr_Info_HxH.Selected.Orden && Operacion = glr_Info_HxH.Selected.Operacion && Tarima = txt_Tarima_HxH.Text\n            ),\n            {CantidadTotalProducida: txt_CantTarima_HxH.Text + txt_CantProducida_HxH.Text}\n        )\n    );\n    ClearCollect(\n        colExistingRecord,\n        LookUp(\n            HoraxHoraFinals,\n            Codigo_Empleado = drp_Operario_HxH.Selected.Codigo && Hora = drp_Hora_HxH.SelectedText.'data-ADB4D7A662F548B49FAC2B986E348A1BValor' && Fecha = drp_Fecha_HxH.SelectedText.Value\n        )\n    );\n    If(\n        !IsEmpty(colExistingRecord),\n        Patch(\n            HoraxHoraFinals,\n            First(colExistingRecord),\n            {\n                Cantidad_Producida: Sum(\n                    Filter(\n                        'Hora X Hora',\n                        CodigoEmpleado = drp_Operario_HxH.Selected.Codigo,\n                        FechaRegistro >= Fecha1 && FechaRegistro <= Fecha2,\n                        Hora = drp_Hora_HxH.SelectedText.'data-ADB4D7A662F548B49FAC2B986E348A1BValor'\n                    ),\n                    Cantidad\n                ),\n                Meta: If(\n                    drp_Causas_HxH.SelectedText.Value = \"Set Up\" && LookUp(\n                        Maquinas,\n                        Maquina = txt_MaquinaView_HxH.Text,\n                        Ubicacion_Bono\n                    ) = \"TSI\",\n                    If(\n                        glr_Info_HxH.Selected.TiempoSetup = 0,\n                        CantidadPorHoraGuardar,\n                        1 / glr_Info_HxH.Selected.TiempoSetup\n                    ),\n                    Sum(\n                        Filter(\n                            'Hora X Hora',\n                            CodigoEmpleado = drp_Operario_HxH.Selected.Codigo,\n                            FechaRegistro >= Fecha1 && FechaRegistro <= Fecha2,\n                            Hora = drp_Hora_HxH.SelectedText.'data-ADB4D7A662F548B49FAC2B986E348A1BValor'\n                        ),\n                        Cantidad_Por_Hora\n                    )\n                ),\n                Turno: txt_Turno_HxH.Text,\n                Ubicacion_Bono: LookUp(\n                    Maquinas,\n                    Maquina = txt_MaquinaView_HxH.Text,\n                    Ubicacion_Bono\n                ),\n                Semana: Value(txt_Semana_HxH.Text)\n            }\n        ),\n        Collect(\n            HoraxHoraFinals,\n            {\n                Codigo_Empleado: drp_Operario_HxH.Selected.Codigo,\n                Cantidad_Producida: Sum(\n                    Filter(\n                        'Hora X Hora',\n                        CodigoEmpleado = drp_Operario_HxH.Selected.Codigo,\n                        FechaRegistro >= Fecha1 && FechaRegistro <= Fecha2,\n                        Hora = drp_Hora_HxH.SelectedText.'data-ADB4D7A662F548B49FAC2B986E348A1BValor'\n                    ),\n                    Cantidad\n                ),\n                Meta: If(\n                    drp_Causas_HxH.SelectedText.Value = \"Set Up\" && LookUp(\n                        Maquinas,\n                        Maquina = txt_MaquinaView_HxH.Text,\n                        Ubicacion_Bono\n                    ) = \"TSI\",\n                    If(\n                        glr_Info_HxH.Selected.TiempoSetup = 0,\n                        CantidadPorHoraGuardar,\n                        1 / glr_Info_HxH.Selected.TiempoSetup\n                    ),\n                    Sum(\n                        Filter(\n                            'Hora X Hora',\n                            CodigoEmpleado = drp_Operario_HxH.Selected.Codigo,\n                            FechaRegistro >= Fecha1 && FechaRegistro <= Fecha2,\n                            Hora = drp_Hora_HxH.SelectedText.'data-ADB4D7A662F548B49FAC2B986E348A1BValor'\n                        ),\n                        Cantidad_Por_Hora\n                    )\n                ),\n                Fecha_Registro: FechaSup,\n                Turno: txt_Turno_HxH.Text,\n                Hora: drp_Hora_HxH.SelectedText.'data-ADB4D7A662F548B49FAC2B986E348A1BValor',\n                Ubicacion_Bono: LookUp(\n                    Maquinas,\n                    Maquina = txt_MaquinaView_HxH.Text,\n                    Ubicacion_Bono\n                ),\n                Semana: Value(txt_Semana_HxH.Text),\n                Fecha: drp_Fecha_HxH.SelectedText.Value\n            }\n        )\n    );\n    \n);\nRefresh(HoraxHoraFinals);\nReset(txt_Tarima_HxH);\nReset(txt_Maquina_HxH);\nReset(txt_CantProducida_HxH);\nReset(txt_Orden_HxH);\nReset(drp_Hora_HxH);\nReset(drp_Fecha_HxH);\nUpdateContext(\n    {\n        FechaSup: DateTimeValue(\n            Text(\n                drp_Fecha_HxH.SelectedText.Value,\n                \"[$-en-US]yyyy-mm-dd\"\n            ) & \" 12:00:00\"\n        ),\n        Fecha1: DateTimeValue(\n            Text(\n                drp_Fecha_HxH.SelectedText.Value,\n                \"[$-en-US]yyyy-mm-dd\"\n            ) & \" 00:00:00\"\n        ),\n        Fecha2: DateTimeValue(\n            Text(\n                drp_Fecha_HxH.SelectedText.Value,\n                \"[$-en-US]yyyy-mm-dd\"\n            ) & \" 23:59:59\"\n        )\n    }\n);\nUpdateContext({Dia: Weekday(FechaSup)});\nUpdateContext({Hora: Blank()});\nUpdateContext({turnoFinal: Blank()});\nUpdateContext({turnoSeleccionado: Blank()});\nUpdateContext({HoraValor: Blank()});\nUpdateContext({CantidadPorHoraGuardar: Blank()});\nUpdateContext({MostraBloqueo: false});\nUpdateContext({MostraBloqueoAcesso: false});\nUpdateContext({MostraCausa: false});\nNotify(\n    \"Se ha Guardado exitosamente\",\n    NotificationType.Success\n);\n"
