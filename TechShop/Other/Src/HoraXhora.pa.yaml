                                                                          "La cantidad no puede ser negativa",
                                                                          NotificationType.Error
                                                                      ),
                                                                      If(
                                                                          IsBlank(drp_Hora_HxH.SelectedText.Value),
                                                                          Notify(
                                                                              "Debe seleccionar una Hora de registro",
                                                                              NotificationType.Error
                                                                          ),
                                                                          If(
                                                                              Hour(Now()) < drp_Hora_HxH.SelectedText.'data-ADB4D7A662F548B49FAC2B986E348A1BValor' && Text(
                                                                                  Now(),
                                                                                  "mm/dd/yyyy"
                                                                              ) = drp_Fecha_HxH.SelectedText.Value,
                                                                              Notify("No puede agregar datos en horas futuras"),
                                                                              If(
                                                                                  txt_Turno_HxH.Text = "LIBRE",
                                                                                  Notify(
                                                                                      "No se puede crear un registro si el Turno del operario es LIBRE",
                                                                                      NotificationType.Error
                                                                                  ),
                                                                                  If(
                                                                                      (txt_CantProducida_HxH.Text + txt_CantTotal_HxH.Text) = Value(txt_CantMax_HxH.Text),
                                                                                      UpdateContext({TextoAdvertencia: "La cantidad total de la Orden junto a la operación seleccionada ha cumplido con la cantidad maxima deseada."});
                                                                                      UpdateContext({Mostra: true})
                                                                                  );
                                                                                  If(
                                                                                      (Upper(txt_MaquinaView_HxH.Text) = "SIERRABHERINGER1" || Upper(txt_MaquinaView_HxH.Text) = "SIERRABHERINGER2") && txt_OP_HxH.Text <> "10",
                                                                                      UpdateContext({TextoAdvertencia: "Para la maquina seleccionada la operacion debe ser la 10"});
                                                                                      UpdateContext({Mostra: true}),
                                                                                      If(
                                                                                          LookUp(
                                                                                              Maquinas,
                                                                                              Maquina = Upper(txt_Maquina_HxH.Text)
                                                                                          ).Guns = "SI" && (txt_CantProducida_HxH.Text + txt_CantTarima_HxH.Text) > 50,
                                                                                          UpdateContext({TextoAdvertencia: "La cantidad digitada supera la cantidad maxima (50) permitida por tarima. Por favor revisar la informacion digitada."});
                                                                                          UpdateContext({Mostra: true}),
                                                                                          If(
                                                                                              CountRows(
                                                                                                  Filter(
                                                                                                      'Hora X Hora',
                                                                                                      Orden = txt_Orden_HxH.Text,
                                                                                                      Operacion = txt_OP_HxH.Text,
