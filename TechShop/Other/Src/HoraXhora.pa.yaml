                                      =UpdateContext({Efi: (Value(txt_CantProducida_HxH.Text) / Value(txt_Meta_HxH.Text)) * 100});
                                      If(
                                          IsBlank(glr_Info_HxH.Selected),
                                          Notify(
                                              "Debe seleccionar una Orden",
                                              NotificationType.Error
                                          ),
                                          If(
                                              IsBlank(txt_Maquina_HxH.Text),
                                              Notify(
                                                  "Debe indicar la Maquina",
                                                  NotificationType.Error
                                              ),
                                              If(
                                                  LookUp(
                                                      Maquinas,
                                                      Maquina = Upper(txt_Maquina_HxH.Text)
                                                  ).Status = "Paro",
                                                  Notify(
                                                      "La maquina seleccionada esta en Paro",
                                                      NotificationType.Error
                                                  ),
                                                  If(
                                                      IsBlank(
                                                          LookUp(
                                                              Maquinas,
                                                              Maquina = Upper(txt_Maquina_HxH.Text)
                                                          )
                                                      ),
                                                      Notify(
                                                          "La maquina seleccionada NO existe",
                                                          NotificationType.Error
                                                      ),
                                                      If(
                                                          IsBlank(txt_Tarima_HxH.Text),
                                                          Notify(
                                                              "Debe indicar la Tarima",
                                                              NotificationType.Error
                                                          ),
                                                          Mid(
                                                              txt_TarimaView_HxH.Text,
                                                              1,
                                                              1
                                                          ) <> "T",
                                                          Notify(
                                                              "La tarima es incorrecta",
                                                              NotificationType.Error
                                                          ),
                                                          If(
                                                              IsBlank(drp_Operario_HxH.SelectedText.Value),
                                                              Notify(
                                                                  "Debe indicar al Operario",
                                                                  NotificationType.Error
                                                              ),
