                                                              datos_DSCN,
                                                              aprobado
                                                          ).NFilaSolicitud && Tipo_Envio = "Compras"
                                                      );
                                                      With(
                                                          {
                                                              Consecutivo: CountIf(
                                                                  Solicitud_Compras,
                                                                  Soli in soli_num
                                                              )
                                                          },
                                                          Collect(
                                                              Solicitud_Compras,
                                                              {
                                                                  soli_num: If(
                                                                      Consecutivo = 0,
