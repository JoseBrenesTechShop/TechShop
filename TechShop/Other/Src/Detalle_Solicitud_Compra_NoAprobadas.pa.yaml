                                                                          subtotal
                                                                      )
                                                                  ),
                                                                  estado: "Listo"
                                                              }
                                                          );
                                                          ForAll(
                                                              Filter(
                                                                  datos_DSCN,
                                                                  aprobado
                                                              ),
                                                              Collect(
                                                                  Detalle_Solicitud_Compras,
                                                                  {
