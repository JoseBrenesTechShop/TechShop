Screens:
  Detalle_Solicitud_Compra_NoAprobadas:
    Properties:
      BackgroundImage: ='abstracto geométrico blanco y gris'
      ImagePosition: =ImagePosition.Fill
      OnHidden: |-
        =Clear(CheckList_DSC);
        Reset(txt_Solicitante_DSGN_1);
        Reset(txt_Num_Soli_DSGN_1);
        Reset(glr_Detalles_DSCNM_2);
        Reset(glr_Solicitudes_SC);
        Refresh(preqitem);
      OnVisible: |-
        =UpdateContext(
            {
                Guardando: true,
                Soli: glr_Solicitudes_SCN.Selected.Value
            }
        );
        ClearCollect(
            datos_DSCN,
            AddColumns(
                Filter(
                    Compras_NoMarcadas,
                    Enviado = 0,
                    Tipo_Envio = "Compras",
                    NSolicitud = Soli
                ),
                medida,
                With(
                    {myItem: NItem},
                    LookUp(
                        preqitem,
                        req_num = Soli && item = myItem
                    ).u_m
                ),
                cantidad,
                With(
                    {myItem: NItem},
                    LookUp(
                        preqitem,
                        req_num = Soli && item = myItem
                    ).qty_ordered
                ),
                precio,
                With(
                    {myItem: NItem},
                    LookUp(
                        preqitem,
                        req_num = Soli && item = myItem
                    ).unit_mat_cost
                ),
                subtotal,
                With(
                    {myItem: NItem},
                    LookUp(
                        preqitem,
                        req_num = Soli && item = myItem
                    ).qty_ordered * LookUp(
                        preqitem,
                        req_num = Soli && item = myItem
                    ).unit_mat_cost
                ),
                vendNum,
                With(
                    {myItem: NItem},
                    LookUp(
                        preqitem,
                        req_num = Soli && item = myItem
                    ).vend_num
                ),
                vendName,
                With(
                    {myItem: NItem},
                    With(
                        {
                            Vname: LookUp(
                                preqitem,
                                req_num = Soli && item = myItem
                            ).vend_num
                        },
                        LookUp(
                            vendaddr,
                            vend_num = Vname
                        ).name
                    )
                ),
                aprobado,
                false
            )
        );
        UpdateContext({Guardando: false})
