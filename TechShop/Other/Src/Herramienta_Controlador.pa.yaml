                                                    glr_Materiales_HC.AllItems,
                                                    If(
                                                        ThisRecord.nmb_Entregar_HC.Value > 0,
                                                        If(
                                                            IsBlank(
                                                                With(
                                                                    {
                                                                        or: ThisRecord.Orden,
                                                                        op: ThisRecord.Operacion,
                                                                        ma: ThisRecord.Material
                                                                    },
                                                                    LookUp(
                                                                        Controlador_Herramientas,
                                                                        Orden = or && Operacion = op && Material = ma
                                                                    )
                                                                )
                                                            ),
                                                            Collect(
                                                                Controlador_Herramientas,
                                                                {
                                                                    Orden: ThisRecord.Orden,
                                                                    Operacion: ThisRecord.Operacion,
                                                                    'P/N': ThisRecord.'P/N',
                                                                    Material: ThisRecord.Material,
                                                                    Descripcion: ThisRecord.Descripcion,
                                                                    Fecha: Today(),
                                                                    Hora: Value(
                                                                        Text(
                                                                            Now(),
                                                                            "HH"
                                                                        )
                                                                    ),
                                                                    Entregado: ThisRecord.nmb_Entregar_HC.Value,
                                                                    Produccion_Hecha: 0,
                                                                    Produccion_Meta: Value(ThisRecord.txt_Meta_HC.Text),
                                                                    User: txt_User_HC.Text,
                                                                    Operario: drp_Empleado_HC.Selected.Nombre
