 \n);\nPatch(\n    TramitesSolicitudes,\n    GaleriaEstado_2.Selected,\n    {\n        EstadoDeProceso: drp_Estado_EstadosPermisos_1.SelectedText.Value,\n        Remunerado: If(\n            chk_Remunerado_EstadoPermisos.Value,\n            \"SI\",\n            \"NO\"\n        ),\n        JefeDirecto: LookUp(\n            Empleados,\n            Codigo = VarName,\n            Nombre\n        ),\n        FirmaJefes: pnl_FirmaJefe_EstadoPermisos.Image,\n        MotivoRechazo: Left(\n            txt_MotivoRehazo_EstadoPermisos.Text,\n            100\n        )\n    }\n);\nNotify(\n    \"Datos guardados correctamente\",\n    NotificationType.Success\n);\nReset(txt_MotivoRehazo_EstadoPermisos);\nReset(drp_Estado_EstadosPermisos);\nReset(chk_Remunerado_EstadoPermisos);\nReset(chk_NoRemunerado_EstadoPermisos);\nReset(pnl_FirmaJefe_EstadoPermisos)"
