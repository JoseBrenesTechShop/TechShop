echazado fue el siguiente: \" & txt_MotivoRehazo_EstadoPermisos_1.Text & \".<br><br>\" & \"Gracias.<br>\"\n    );\n    \n);\nIf(\n    drp_Estado_EstadosPermisos_1.SelectedText.Value = \"Aprobado\",\n    CorreoConPDF.Run(\n        htmlPDF_1.HtmlText,\n        LookUp(\n            Empleados,\n            Codigo = VarName,\n            Correo\n        ),\n        \"Revisión de Solicitudes\",\n        \"Estimado/a,<br><br>\" & \"Se ha aprobado la solicitud del colaborador \" & GaleriaEstado_2.Selected.Nombre & \", con el ID \" & GaleriaEstado_2.Selected.Codigo & \".<br><br>\" & \"La solicitud aprobada comprende un total de \" & GaleriaEstado_2.Selected.DiasSolicitados & \" días, con fecha de inicio \" & lbl_FechaInicioInf_EstadoPermisos_1.Text & \" y fecha de fin \" & lbl_FechaFinInf_EstadoPermisos_2.Text & \".<br><br>\" & \"Para obtener más detalles sobre la solicitud aceptada, por favor, consulte el PDF adjunto o revise la solicitud desde el módulo correspondiente.<br><br>\" & \"Gracias,<br>\"\n    );\n    \n);\nIf(\n    drp_Estado_EstadosPermisos_1.SelectedText.Value = \"Aprobado\",\n    CorreoConPDF.Run(\n        htmlPDF_1.HtmlText,\n        \"rrhh@tsicr.com\",\n        \"Revisión de Solicitudes\",\n        \"Estimado/a,<br><br>\" & \"Se ha aprobado la solicitud del colaborador \" & GaleriaEstado_2.Selected.Nombre & \", con el ID \" & GaleriaEstado_2.Selected.Codigo & \".<br><br>\" & \"<br><br>Aprobado por: \" & LookUp(\n            Empleados,\n            Codigo = VarName,\n            Nombre\n        ) & \" <br><br>\" & \"La solicitud aprobada comprende un total de \" & GaleriaEstado_2.Selected.DiasSolicitados & \" días, con fecha de inicio \" & lbl_FechaInicioInf_EstadoPermisos_1.Text & \" y fecha de fin \" & lbl_FechaFinInf_EstadoPermisos_2.Text & \".<br><br>\" & \"Para obtener más detalles sobre la solicitud aceptada, por favor, consulte el PDF adjunto o revise la solicitud desde el módulo correspondiente.<br><br>\" & \"Gracias,<br>\"\n    );\n    \n);\nPatch(\