Nombre = \"Aprobado\",\n    CorreoConPDF.Run(\n        htmlPDF_1.HtmlText,\n        LookUp(\n            Empleados,\n            Codigo = VarName,\n            Correo\n        ),\n        \"Revisión de Solicitudes\",\n        \"Estimado/a,<br><br>\" & \"Se ha aprobado la solicitud del colaborador \" & glr_EstadoPermisos_EP.Selected.Nombre & \", con el ID \" & glr_EstadoPermisos_EP.Selected.Codigo & \".<br><br>\" & \"La solicitud aprobada comprende un total de \" & glr_EstadoPermisos_EP.Selected.DiasSolicitados & \" días, con fecha de inicio \" & txt_FechaInicio_EP.Text & \" y fecha de fin \" & txt_FechaFin_EP.Text & \".<br><br>\" & \"Para obtener más detalles sobre la solicitud aceptada, por favor, consulte el PDF adjunto o revise la solicitud desde el módulo correspondiente.<br><br>\" & \"Gracias,<br>\"\n    );\n    \n);\nIf(\n    drp_EstadoPermiso_EP.Selected.Nombre = \"Aprobado\",\n    CorreoConPDF.Run(\n        htmlPDF_1.HtmlText,\n        \"rrhh@tsicr.com\",\n        \"Revisión de Solicitudes\",\n        \"Estimado/a,<br><br>\" & \"Se ha aprobado la solicitud del colaborador \" & glr_EstadoPermisos_EP.Selected.Nombre & \", con el ID \" & glr_EstadoPermisos_EP.Selected.Codigo & \".<br><br>\" & \"<br><br>Aprobado por: \" & LookUp(\n            Empleados,\n            Codigo = VarName,\n            Nombre\n        ) & \" <br><br>\" & \"La solicitud aprobada comprende un total de \" & glr_EstadoPermisos_EP.Selected.DiasSolicitados & \" días, con fecha de inicio \" & txt_FechaInicio_EP.Text & \" y fecha de fin \" & txt_FechaFin_EP.Text & \".<br><br>\" & \"Para obtener más detalles sobre la solicitud aceptada, por favor, consulte el PDF adjunto o revise la solicitud desde el módulo correspondiente.<br><br>\" & \"Gracias,<br>\"\n    );\n    \n);\nPatch(\n    TramitesSolicitudes,\n    glr_EstadoPermisos_EP.Selected,\n    {\n        EstadoDeProceso: drp_EstadoPermiso_EP.Selected.Nombre,\n        Remunerado: If(\n            chk_Remunerado_EP.Value,\n            \"SI\",\n            \"NO\"\n        ),\n        JefeDirecto: LookUp(\n            Empleados,\n            Codigo = VarName,\n            Nombre\n        ),\n        FirmaJefes: pnl_FirmaJefe_EP.Image,\n        MotivoRechazo: txt_MotivoRechazo_EP.Text\n    }\n);\nNotify(\n    \"Datos guardados correctamente\",\n    NotificationType.Success\n);\nUpdateContext({showContainer: false, showContainerView: false, Aviso: false, textoAviso: Blank(), ConVisible: false});\nReset(drp_EstadoPermiso_EP);\nReset(chk_NoRemunerado_EP);\nReset(chk_Remunerado_EP);\nReset(pnl_FirmaJefe_EP);\nReset(txt_MotivoRechazo_EP);\n"
