                                  Properties:
                                    BorderColor: =RGBA(215, 223, 240, 1)
                                    BorderStyle: =BorderStyle.None
                                    Fill: =RGBA(204, 231, 246, 0.3)
                                    Height: =584
                                    Items: "=Sort(\n    If(\n    //Gerente de produccion\n        LookUp(\n            Empleados,\n            Codigo = VarName\n        ).Puesto = \"GERENTE DE PRODUCCION\",\n        Filter(\n            TramitesSolicitudes,\n            EstadoDeProceso = drp_EstadoSolicitud_EP.SelectedText.Value,\n            (IsBlank(txt_Codigo_EP.Text) || Codigo = txt_Codigo_EP.Text),\n            Solicitud = drp_TipoSolicitud_EP.SelectedText.Value || IsBlank(drp_TipoSolicitud_EP.SelectedText.Value),\n            (Departamento = \"PRODUCCION\" || Puesto in [\n                \"ING DE MEJORA CONTINUA\",\n                \"JEFE DE PROGRAMACION\",\n                \"JEFE DESARROLLO Y ANALISIS\"\n            ]) && Puesto <> \"GERENTE DE PRODUCCION\"\n        ),\n\n\n    //Supervisor de Produccion\n        LookUp(\n            Empleados,\n            Codigo = VarName\n        ).Puesto = \"SUPERVISOR DE PRODUCCIÓN\",\n        Filter(\n            TramitesSolicitudes,\n            EstadoDeProceso = drp_EstadoSolicitud_EP.SelectedText.Value,\n            IsBlank(txt_Codigo_EP.Text) || Codigo = txt_Codigo_EP.Text,\n            Solicitud = drp_TipoSolicitud_EP.SelectedText.Value || IsBlank(drp_TipoSolicitud_EP.SelectedText.Value),\n            Departamento = \"PRODUCCION\",\n            Puesto <> \"GERENTE DE PRODUCCION\",\n            Puesto <> \"SUPERVISOR DE PRODUCCIÓN\"\n        ),\n\n\n    //Gerente de Calidad\n        LookUp(\n            Empleados,\n            Codigo = VarName\n        ).Puesto = \"GERENTE CALIDAD\",\n        Filter(\n            TramitesSolicitudes,\n            EstadoDeProceso = drp_EstadoSolicitud_EP.SelectedText.Value,\n            IsBlank(txt_Codigo_EP.Text) || Codigo = txt_Codigo_EP.Text,\n            Solicitud = drp_TipoSolicitud_EP.SelectedText.Value || IsBlank(drp_TipoSolicitud_EP.SelectedText.Value),\n            Departamento = \"CALIDAD\",\n            Puesto <> \"GERENTE CALIDAD\"\n        ),\n\n\n    //Supervisor de Calidad\n        LookUp(\n            Empleados,\n            Codigo = VarName\n        ).Puesto = \"SUPERVISOR DE CALIDAD\",\n        Filter(\n            TramitesSolicitudes,\n            EstadoDeProceso = drp_EstadoSolicitud_EP.SelectedText.Value,\n            IsBlank(txt_Codigo_EP.Text) || Codigo = txt_Codigo_EP.Text,\n            Solicitud = drp_TipoSolicitud_EP.SelectedText.Value || IsBlank(drp_TipoSolicitud_EP.SelectedText.Value),\n            Departamento = \"CALIDAD\",\n            Puesto <> \"GERENTE CALIDAD\",\n            Puesto <> \"SUPERVISOR DE CALIDAD\"\n        ),\n\n\n    //ENCARGADO DE IMPORTACION & EXPORTACIONES\n        LookUp(\n            Empleados,\n            Codigo = VarName\n        ).Puesto = \"ENCARGADO DE IMPORTACION & EXPORTACIONES\",\n        Filter(\n            TramitesSolicitudes,\n            EstadoDeProceso = drp_EstadoSolicitud_EP.SelectedText.Value,\n            IsBlank(txt_Codigo_EP.Text) || Codigo = txt_Codigo_EP.Text,\n            Solicitud = drp_TipoSolicitud_EP.SelectedText.Value || IsBlank(drp_TipoSolicitud_EP.SelectedText.Value),\n            Departamento = \"IMPORTACION & EXPORTACIONES\",\n            Puesto <> \"ENCARGADO DE IMPORTACION & EXPORTACIONES\"\n        ),\n\n\n    //Jefe de mantenimiento\n        LookUp(\n            Empleados,\n            Codigo = VarName\n        ).Puesto = \"JEFE DE MANTENIMIENTO\",\n        Filter(\n            TramitesSolicitudes,\n            EstadoDeProceso = drp_EstadoSolicitud_EP.SelectedText.Value,\n            IsBlank(txt_Codigo_EP.Text) || Codigo = txt_Codigo_EP.Text,\n            Solicitud = drp_TipoSolicitud_EP.SelectedText.Value || IsBlank(drp_TipoSolicitud_EP.SelectedText.Value),\n            Departamento = \"MANTENIMIENTO\",\n            Puesto <> \"JEFE DE MANTENIMIENTO\"\n        ),\n\n\n    //ING DE MEJORA CONTINUA\n        LookUp(\n            Empleados,\n            Codigo = VarName\n        ).Puesto = \"ING DE MEJORA CONTINUA\",\n        Filter(\n            TramitesSolicitudes,\n            EstadoDeProceso = drp_EstadoSolicitud_EP.SelectedText.Value,\n            IsBlank(txt_Codigo_EP.Text) || Codigo = txt_Codigo_EP.Text,\n            Solicitud = drp_TipoSolicitud_EP.SelectedText.Value || IsBlank(drp_TipoSolicitud_EP.SelectedText.Value),\n            Puesto = \"CONTROLADOR DE PRODUCCION\" || Puesto = \"CONTROLADOR DE HERRAMIENTA\",\n            Puesto <> \"ING DE MEJORA CONTINUA\"\n        ),\n\n\n    //JEFE DE C.D.S\n        LookUp(\n            Empleados,\n            Codigo = VarName\n        ).Puesto = \"JEFE DE C.D.S\",\n        Filter(\n            TramitesSolicitudes,\n            EstadoDeProceso = drp_EstadoSolicitud_EP.SelectedText.Value,\n            IsBlank(txt_Codigo_EP.Text) || Codigo = txt_Codigo_EP.Text,\n            Solicitud = drp_TipoSolicitud_EP.SelectedText.Value || IsBlank(drp_TipoSolicitud_EP.SelectedText.Value),\n            Departamento = \"C.D.S\",\n            Puesto <> \"JEFE DE C.D.S\"\n        ),\n\n\n    //JEFE DE PROGRAMACION\n        LookUp(\n            Empleados,\n            Codigo = VarName\n        ).Puesto = \"JEFE DE PROGRAMACION\",\n        Filter(\n            TramitesSolicitudes,\n            EstadoDeProceso = drp_EstadoSolicitud_EP.SelectedText.Value,\n            IsBlank(txt_Codigo_EP.Text) || Codigo = txt_Codigo_EP.Text,\n            Solicitud = drp_TipoSolicitud_EP.SelectedText.Value || IsBlank(drp_TipoSolicitud_EP.SelectedText.Value),\n            Departamento = \"PROGRAMACION\",\n            Puesto <> \"JEFE DE PROGRAMACION\"\n        ),\n\n\n    //JEFE DE CONTABILIDAD\n        LookUp(\n            Empleados,\n            Codigo = VarName\n        ).Puesto = \"JEFE DE CONTABILIDAD\",\n        Filter(\n            TramitesSolicitudes,\n            EstadoDeProceso = drp_EstadoSolicitud_EP.SelectedText.Value,\n            IsBlank(txt_Codigo_EP.Text) || Codigo = txt_Codigo_EP.Text,\n            Solicitud = drp_TipoSolicitud_EP.SelectedText.Value || IsBlank(drp_TipoSolicitud_EP.SelectedText.Value),\n            Departamento = \"CONTABILIDAD\",\n            Puesto <> \"JEFE DE CONTABILIDAD\"\n        ),\n\n\n    //JEFA DE TESORERIA\n        LookUp(\n            Empleados,\n            Codigo = VarName\n        ).Puesto in [\"JEFA DE TESORERIA\", \"TESORERIA\"],\n        Filter(\n            TramitesSolicitudes,\n            EstadoDeProceso = drp_EstadoSolicitud_EP.SelectedText.Value,\n            IsBlank(txt_Codigo_EP.Text) || Codigo = txt_Codigo_EP.Text,\n            Solicitud = drp_TipoSolicitud_EP.SelectedText.Value || IsBlank(drp_TipoSolicitud_EP.SelectedText.Value),\n            Puesto <> \"JEFA DE TESORERIA\"\n        ),\n\n\n    //JEFE DE DESARROLLO Y ANALISIS\n        LookUp(\n            Empleados,\n            Codigo = VarName\n        ).Puesto = \"JEFE DESARROLLO Y ANALISIS\",\n        Filter(\n            TramitesSolicitudes,\n            EstadoDeProceso = drp_EstadoSolicitud_EP.SelectedText.Value,\n            IsBlank(txt_Codigo_EP.Text) || Codigo = txt_Codigo_EP.Text,\n            Solicitud = drp_TipoSolicitud_EP.SelectedText.Value || IsBlank(drp_TipoSolicitud_EP.SelectedText.Value),\n            Departamento = \"DESARROLLO Y ANALISIS\",\n            Puesto <> \"JEFE DESARROLLO Y ANALISIS\"\n        ),\n\n        \n    //GERENTE COMERCIAL Y GERENTE GENERAL\n        LookUp(\n            Empleados,\n            Codigo = VarName\n        ).Puesto = \"GERENTE COMERCIAL\" || LookUp(\n            Empleados,\n            Codigo = VarName\n        ).Puesto = \"GERENTE GENERAL\",\n        Filter(\n            TramitesSolicitudes,\n            EstadoDeProceso = drp_EstadoSolicitud_EP.SelectedText.Value,\n            IsBlank(txt_Codigo_EP.Text) || Codigo = txt_Codigo_EP.Text,\n            Solicitud = drp_TipoSolicitud_EP.SelectedText.Value || IsBlank(drp_TipoSolicitud_EP.SelectedText.Value),\n            Puesto in [\n                \"GERENTE DE PRODUCCION\",\n                \"GERENTE CALIDAD\",\n                \"JEFE MANTENIMIENTO\",\n                \"JEFE DE C.D.S\",\n                \"JEFE DE CONTABILIDAD\",\n                \"JEFA DE TESORERIA\",\n                \"ENCARGADO DE FACTURACION\",\n                \"ENCARGADO DE IMPORTACION & EXPORTACIONES\"\n            ]\n        )\n    ),\n    'Fecha de creación',\n    SortOrder.Descending\n)"
