                                          - Button10_25:
                                              Control: Classic/Button@2.2.0
                                              Properties:
                                                BorderColor: =RGBA(52, 152, 47, 1)
                                                Fill: =RGBA(52, 152, 47, 1)
                                                FontWeight: =FontWeight.Bold
                                                Height: =50
                                                HoverBorderColor: =RGBA(21, 68, 18, 1)
                                                HoverFill: =RGBA(21, 68, 18, 1)
                                                OnSelect: |
                                                  =If(
                                                      IsBlank(txt_Motivo_DSG_3.Text) && CountIf(
                                                          datos_DSGN,
                                                          !aprobado
                                                      ) > 0,
                                                      UpdateContext(
                                                          {
                                                              Aviso: {
                                                                  Ver: true,
                                                                  Tipo: 0,
                                                                  Texto: "Debe indicar el motivo del rechazo de los items"
                                                              }
                                                          }
                                                      ),
                                                      true,
                                                      UpdateContext({Guardando: true});
                                                      RemoveIf(
                                                          Compras_NoMarcadas,
                                                          NSolicitud = Soli && NFilaSolicitud in Filter(
                                                              datos_DSGN,
                                                              aprobado
                                                          ).NFilaSolicitud && Tipo_Envio = varEmpleado.Codigo
                                                      );
                                                      With(
                                                          {
                                                              Consecutivo: CountIf(
                                                                  Solicitud_Compras,
                                                                  Soli in soli_num
                                                              )
                                                          },
                                                          Collect(
                                                              Solicitud_Compras,
                                                              {
                                                                  soli_num: If(
                                                                      Consecutivo = 0,
                                                                      Upper(Soli),
                                                                      Upper(Soli) & "-" & (Consecutivo + 1)
                                                                  ),
                                                                  fecha: DateValue(txt_Fecha_DSGN_2.Text),
                                                                  solicitante: txt_Solicitante_DSGN_2.Text,
                                                                  user: varEmpleado.Nombre,
                                                                  total: Value(
                                                                      Sum(
                                                                          Filter(
                                                                              datos_DSGN,
                                                                              aprobado
                                                                          ),
                                                                          subtotal
                                                                      )
                                                                  ),
                                                                  estado: "Gerencia"
                                                              }
                                                          );
                                                          ForAll(
                                                              Filter(
                                                                  datos_DSGN,
                                                                  aprobado
                                                              ),
                                                              Collect(
                                                                  Detalle_Solicitud_Compras,
                                                                  {
                                                                      soli_num: If(
                                                                          Consecutivo = 0,
                                                                          Upper(Soli),
                                                                          Upper(Soli) & "-" & (Consecutivo + 1)
                                                                      ),
                                                                      item: ThisRecord.NItem,
                                                                      descripcion: ThisRecord.Descripcion,
                                                                      linea: ThisRecord.NFilaSolicitud
                                                                  }
                                                              )
                                                          );
                                                      );
                                                      Reset(txt_Num_Soli_DSGN_2);
                                                      UpdateContext({showContainer: false});
                                                      Reset(txt_Motivo_DSG_3);
                                                      UpdateContext({Guardando: false});
                                                      Clear(datos_DSGN);
                                                      Back(),
                                                      UpdateContext(
                                                          {
                                                              Aviso: {
                                                                  Ver: true,
                                                                  Tipo: 0,
                                                                  Texto: "La solicitud seleccionada ya fue enviada"
                                                              }
                                                          }
