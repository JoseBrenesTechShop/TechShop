                                              Control: Classic/Button@2.2.0
                                              Properties:
                                                BorderColor: =RGBA(52, 152, 47, 1)
                                                Fill: =RGBA(52, 152, 47, 1)
                                                FontWeight: =FontWeight.Bold
                                                Height: =50
                                                HoverBorderColor: =RGBA(21, 68, 18, 1)
                                                HoverFill: =RGBA(21, 68, 18, 1)
                                                OnSelect: |
                                                  =If(
                                                      IsBlank(txt_Motivo_DSC.Text) && CountIf(
                                                          datos_DSC,
                                                          aprobado
                                                      ) < 0,
                                                      UpdateContext(
                                                          {
                                                              Aviso: {
                                                                  Ver: true,
                                                                  Tipo: 0,
                                                                  Texto: "Debe indicar el motivo de aprobacion de los items"
                                                              }
                                                          }
                                                      ),
                                                      CountIf(
                                                          datos_DSC,
                                                          !aprobado && IsBlank(Trim(motivoRechazo))
                                                      ) > 0,
                                                      UpdateContext(
                                                          {
                                                              Aviso: {
                                                                  Ver: true,
                                                                  Tipo: 0,
                                                                  Texto: "Todos los no aprobados deben tener un motivo de porque no fueron aprobados"
                                                              }
                                                          }
                                                      ),
                                                      true,
                                                      UpdateContext({Guardando: true});
                                                      ForAll(
                                                          Filter(
                                                              datos_DSC,
                                                              !aprobado
                                                          ),
                                                          Collect(
                                                              Compras_NoMarcadas,
                                                              {
                                                                  NSolicitud: Upper(Soli),
                                                                  NFilaSolicitud: ThisRecord.crfb9_linea,
                                                                  NItem: ThisRecord.crfb9_item,
                                                                  Descripcion: ThisRecord.crfb9_descripcion,
                                                                  Enviado: 0,
                                                                  Tipo_Envio: "Compras",
                                                                  Motivo: ThisRecord.motivoRechazo
                                                              }
                                                          )
                                                      );
                                                      RemoveIf(
                                                          Compras_NoMarcadas,
                                                          NSolicitud = Soli && NFilaSolicitud in Filter(
                                                              datos_DSC,
                                                              aprobado
                                                          ).crfb9_linea && Enviado = 1 && Tipo_Envio = "Compras"
                                                      );
                                                      Patch(
                                                          Solicitud_Compras,
                                                          glr_Solicitudes_SC.Selected,
                                                          {
                                                              user: txt_User_DSC.Text,
                                                              total: Value(
                                                                  Sum(
                                                                      Filter(
                                                                          datos_DSC,
                                                                          aprobado,
                                                                          moneda = "USD"
                                                                      ),
                                                                      subtotal
                                                                  )
                                                              ),
                                                              totalColones:Value(
                                                                  Sum(
                                                                      Filter(
                                                                          datos_DSC,
                                                                          aprobado,
                                                                          moneda <> "USD"
                                                                      ),
                                                                      subtotal
                                                                  )
                                                              ),
                                                              estado: "Listo",
                                                              Fecha_Listo: Now()
                                                          }
                                                      );
                                                      ForAll(
                                                          datos_DSC,
                                                          If(
                                                              ThisRecord.aprobado,
                                                              Patch(
                                                                  Detalle_Solicitud_Compras,
                                                                  With(
                                                                      {line: ThisRecord.crfb9_linea},
                                                                      LookUp(
                                                                          Detalle_Solicitud_Compras,
                                                                          soli_num = Upper(txt_Num_Soli_DSC.Text) && linea = line
                                                                      )
                                                                  ),
                                                                  {
                                                                      medida: ThisRecord.medida,
                                                                      cantidad: ThisRecord.cantidad,
                                                                      precio: ThisRecord.precio,
                                                                      subtotal: ThisRecord.subtotal,
                                                                      num_vend: ThisRecord.vendNum,
                                                                      provedor: ThisRecord.vendName,
                                                                      moneda: ThisRecord.moneda,
                                                                      motivoSoli: ThisRecord.motivoSolicitud
                                                                  }
                                                              ),
                                                              Remove(
                                                                  Detalle_Solicitud_Compras,
                                                                  With(
                                                                      {line: ThisRecord.crfb9_linea},
                                                                      LookUp(
                                                                          Detalle_Solicitud_Compras,
                                                                          soli_num = Upper(txt_Num_Soli_DSC.Text) && linea = line
                                                                      )
                                                                  )
                                                              )
                                                          )
                                                      );
                                                      Reset(txt_Num_Soli_DSC);
