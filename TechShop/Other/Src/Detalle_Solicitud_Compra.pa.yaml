                                    "SOL"
                                ) && LookUp(
                                    preq,
                                    req_num = Soli,
                                    requester
                                ) <> "vguerrero",
                                "1133",
                                (StartsWith(
                                    Soli,
                                    "TIC"
                                ) ) && LookUp(
                                    preq,
                                    req_num = Soli,
                                    requester
                                ) <> "jbrenes",
                                "2648",
                                "1"
                            )
                        },
                        If(
