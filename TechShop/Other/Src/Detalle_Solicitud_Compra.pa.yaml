Screens:
  Detalle_Solicitud_Compra:
    Properties:
      BackgroundImage: ='abstracto geométrico blanco y gris'
      ImagePosition: =ImagePosition.Fill
      OnHidden: |-
        =Clear(CheckList_DSC);
        Reset(txt_Solicitante_DSC);
        Reset(txt_Num_Soli_DSC);
        Reset(glr_Detalles_DSC);
        Reset(glr_Solicitudes_SC);
        Refresh(preqitem);
      OnVisible: |-
        =UpdateContext(
            {
                Guardando: true,
                Soli: First(
                    Split(
                        glr_Solicitudes_SC.Selected.soli_num,
                        "-"
                    )
                ).Value
            }
        );
        Reset(txt_Solicitante_DSC);
        Reset(txt_Num_Soli_DSC);
        Reset(glr_Detalles_DSC);
        ClearCollect(
            datos_DSC,
            Sort(
                AddColumns(
                    ShowColumns(
                        Filter(
                            Detalle_Solicitud_Compras,
                            soli_num = Soli
                        ),
                        linea,
                        item,
                        descripcion,
                        soli_num
                    ),
                    medida,
                    With(
                        {myItem: crfb9_item},
                        LookUp(
                            preqitem,
                            req_num = Soli && item = myItem
                        ).u_m
                    ),
                    cantidad,
                    With(
                        {myItem: crfb9_item},
                        LookUp(
                            preqitem,
                            req_num = Soli && item = myItem
                        ).qty_ordered
                    ),
                    precio,
                    With(
                        {myItem: crfb9_item},
                        LookUp(
                            preqitem,
                            req_num = Soli && item = myItem
                        ).unit_mat_cost
                    ),
                    subtotal,
                    With(
                        {myItem: crfb9_item},
                        LookUp(
                            preqitem,
                            req_num = Soli && item = myItem
                        ).qty_ordered * LookUp(
                            preqitem,
                            req_num = Soli && item = myItem
                        ).unit_mat_cost
                    ),
                    vendNum,
                    With(
                        {myItem: crfb9_item},
                        LookUp(
                            preqitem,
                            req_num = Soli && item = myItem
                        ).vend_num
                    ),
                    vendName,
                    With(
                        {myItem: crfb9_item},
                        With(
                            {
                                Vname: LookUp(
                                    preqitem,
                                    req_num = Soli && item = myItem
                                ).vend_num
                            },
                            LookUp(
                                vendaddr,
                                vend_num = Vname
                            ).name
                        )
                    ),
                    aprobado,
                    false
                ),
                crfb9_linea,
                SortOrder.Ascending
            )
        );
        UpdateContext({Guardando: false})
