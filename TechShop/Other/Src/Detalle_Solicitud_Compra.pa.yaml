                                    datos_DSC,
                                    aprobado
                                ).crfb9_linea && Enviado = 1 && Tipo_Envio = idGerente
                            )
                        )
                    );
                    UpdateContext(
                        {
                            edit: {
                                view: false,
                                item: Blank()
                            },
                            Aviso: {Ver: false},
                            Rechazo: false
                        }
                    );
                    Clear(datos_DAC);
                    Reset(txt_Num_Soli_DAC);
                    Reset(drp_Estado_AC);
                    UpdateContext({Guardando: false});
