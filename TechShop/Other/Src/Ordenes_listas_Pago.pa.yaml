                  - btn_Guardar_EC_14:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(40, 134, 222, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        DisplayMode: |
                          =If(
                              drp_EstadoPago_OLP_1.Selected.Value = "Parcial" &&
                              CountRows(colPOTtoProcess) >= 2,
                              DisplayMode.Disabled,
                              DisplayMode.Edit
                          )
                        Fill: =RGBA(40, 134, 222, 1)
                        Font: =Font.'Open Sans'
                        Height: =47
                        HoverBorderColor: =RGBA(40, 134, 222, 1)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =RGBA(15, 84, 140, 1)
                        OnSelect: |
                          =UpdateContext({isProcesando: true});
                          If(
                              CountRows(colPOTtoProcess) = 0,
                              UpdateContext(
                                  {
                                      MostrarAviso: true,
                                      mensajeNotificacion: "Selecciona al menos un POT"
                                  }
                              ),
                              CountRows(
                                  Filter(
                                      colPOTtoProcess,
                                      IsBlank(Trim(Num_Referencia))
                                  )
                              ) > 0,
                              UpdateContext(
                                  {
                                      MostrarAviso: true,
                                      mensajeNotificacion: "Debe ingresar la referencia para TODOS los POTs antes de continuar."
                                  }
                              ),
                              IsBlank(txt_montopagar_OPL.Text) || Value(txt_montopagar_OPL.Text) <= 0,
                              UpdateContext(
                                  {
                                      MostrarAviso: true,
                                      mensajeNotificacion: "El monto a pagar no puede estar vacío o ser negativo."
                                  }
                              ),
                              IsBlank(drp_MetodoPago_OLP_1.SelectedText.Value) || IsBlank(drp_EstadoPago_OLP_1.SelectedText.Value),
                              UpdateContext(
                                  {
                                      MostrarAviso: true,
                                      mensajeNotificacion: "Asegurese de seleccionar el metodo de pago y el estado de pago"
                                  }
                              ),
                              IsBlank(txt_totalPOT_OLP.Text) || Value(txt_totalPOT_OLP.Text) < 0,
                              UpdateContext(
                                  {
                                      MostrarAviso: true,
                                      mensajeNotificacion: "El total no puede ser negativo o estar vacío. Revisa los valores antes de continuar."
                                  }
                              ),
                              (drp_MetodoPago_OLP_1.SelectedText.Metodo = "Cheque" || drp_MetodoPago_OLP_1.SelectedText.Metodo = "Transferencia") && IsBlank(txt_NumTransferencia_OLP_1.Text),
                              UpdateContext(
                                  {
                                      MostrarAviso: true,
                                      mensajeNotificacion: "El número de transferencia es obligatorio si el método de pago es Cheque o Transferencia."
                                  }
                              ),
                              UpdateContext({MostrarAviso: false}),
                              Collect(
                                  RegistroPagos,
                                  {
                                      Fecha_Solicitud: gl_ListaContenedores_LE_2.Selected.fecha,
                                      Requisicion: gl_ListaContenedores_LE_2.Selected.soli_num,
                                      Total_Pagar: Value(lbl_montoTotal_OLP.Text),
                                      Total_Cancelado: Value(lbl_montoCancelado_OLP.Text),
                                      Total: Value(txt_totalPOT_OLP.Text),
                                      Fecha_UltimoPago: Today(),
                                      'Estado (crfb9_estado)': drp_EstadoPago_OLP_1.Selected.Value,
                                      Metodo_Pago: drp_MetodoPago_OLP_1.SelectedText.Metodo,
                                      NUM_ID: txt_NumTransferencia_OLP_2.Text
                                  }
                              );
                              ForAll(
                                  colPOTtoProcess,
                                  With(
                                      {
                                          pot: ThisRecord.POT,
                                          codigoproveedor: ThisRecord.Codigo_Proveedor,
                                          nombreproveedor: ThisRecord.Nombre_Proveedor,
                                          totalPo: Value(txt_totalPOT_OLP.Text),
                                          totalCancelado: Value(lbl_montoCancelado_OLP.Text),
                                          montoPago: Value(ThisRecord.MontoAPagar),
                                          numRef: Coalesce(
                                              ThisRecord.Num_Referencia,
                                              txt_NumTransferencia_OLP_1.Text
                                          )
                                      },
                                      If(
                                          drp_EstadoPago_OLP_1.SelectedText.Value = "Parcial",
                                          Collect(
                                              Compras_Pots,
                                              {
                                                  Requisicion: gl_ListaContenedores_LE_2.Selected.soli_num,
                                                  POT: pot,
                                                  Total: Value(txt_montopagar_OPL.Text),
                                                  'Estado (crfb9_estado)': drp_EstadoPago_OLP_1.Selected.Value,
                                                  Num_Vend: codigoproveedor,
                                                  Provedor: nombreproveedor,
                                                  Num_Transferencia: numRef,
                                                  NUM_ID: txt_NumTransferencia_OLP_2.Text,
                                                  Valor_POT:  Text( LookUp(po, po_num = pot, po_cost) )
                                              }
                                          ),
                                          Collect(
                                              Compras_Pots,
                                              {
                                                  Requisicion: gl_ListaContenedores_LE_2.Selected.soli_num,
                                                  POT: pot,
                                                  Total: montoPago,
                                                  'Estado (crfb9_estado)': drp_EstadoPago_OLP_1.Selected.Value,
                                                  Num_Vend: codigoproveedor,
                                                  Provedor: nombreproveedor,
                                                  Num_Transferencia: numRef,
                                                  NUM_ID: txt_NumTransferencia_OLP_2.Text,
                                                  Valor_POT: Text( LookUp(po, po_num = pot, po_cost) )
                                              }
                                          )
                                      )
                                  )
                              );
                              Refresh(RegistroPagos);
                              If(
                                  Sum(
                                      gl_Contenedores_RC_4.AllItems,
                                      txt_Total_Pagar_OLP.Text
                                  ) - Value(lbl_montoCancelado_OLP.Text) = 0,
                                  Patch(
                                      Solicitud_Compras,
                                      LookUp(
                                          Solicitud_Compras,
                                          soli_num = gl_ListaContenedores_LE_2.Selected.soli_num
                                      ),
                                      {estado: "Cancelado"}
                                  )
                              );
                              /*If(
                               Value(gl_ListaContenedores_LE_2.Selected.txt_TotalPagar_OLP.Text) - Value( gl_ListaContenedores_LE_2.Selected.txt_Cantidad_EM_58.Text) = 0  ;
                                  Patch(
                                      Solicitud_Compras;
                                      LookUp(
                                          Solicitud_Compras;
                                          soli_num = gl_ListaContenedores_LE_2.Selected.soli_num
                                      );
                                      {estado: "Cancelado"}
                                  )
                              );;*/
                          Reset(drp_MetodoPago_OLP_1);
                              Reset(drp_EstadoPago_OLP_1);
                              Reset(txt_montopagar_OPL);
                              Clear(colSelectedPOTs);
                              Clear(colPOTtoProcess);
                              UpdateContext({AbrirConfirmar: false});
                              UpdateContext({isProcesando: false});
                              UpdateContext(
