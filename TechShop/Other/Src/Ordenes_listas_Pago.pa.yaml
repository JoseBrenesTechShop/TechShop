                                                OnSelect: |
                                                  =//Use tress collects para que no me diera advertencias...
                                                  //Este trae las pots de esta requisicion

                                                  ClearCollect(
                                                      colComprasFiltered,
                                                      Filter(
                                                          Compras_Pots,
                                                          Requisicion = gl_ListaContenedores_LE_2.Selected.soli_num
                                                      )
                                                  );

                                                  //Este hace el filtrado y distinct

                                                  ClearCollect(
                                                      colPOs,
                                                      Distinct(
                                                          Filter(
                                                              poitem,
                                                              req_num = Text(First(Split(gl_ListaContenedores_LE_2.Selected.soli_num, "-")).Value),
                                                              varReloadPOTs = varReloadPOTs
                                                          ),
                                                          po_num
                                                      )
                                                  );

                                                  //Este traemos el filtrado y le agrego columnas y ya 

                                                  ClearCollect(
                                                      colContenedores,
                                                      AddColumns(
                                                          colPOs,
                                                          pon, Value,   
                                                          TotalPagar,
                                                              Value( LookUp(po, po_num = Value, po_cost) )
                                                              - Sum( Filter(colComprasFiltered, POT = Value), Value(Total) )
                                                      )
                                                  );

                                                  UpdateContext({ AbrirC: true, isLoadingPOTs: true, Disable: true });
                                                  UpdateContext(
                                                      {
                                                          AbrirC: true,
                                                          isLoadingPOTs: true,
                                                          Disable: true
                                                      }
                                                  );
                                                  Refresh(poitem);
                                                  Refresh(po);
                                                  UpdateContext({varReloadPOTs: Now()});
                                                  Clear(colSelectedPOTs);
                                                  Clear(colPOTtoProcess);
                                                  UpdateContext(
                                                      {
                                                          isLoadingPOTs: false,
                                                          Disable: false
                                                      }
                                                  );
