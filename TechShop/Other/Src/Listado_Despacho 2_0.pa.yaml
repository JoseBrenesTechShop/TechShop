                  HoverFill: =
                  OnSelect: "=If(\n    CountRows(\n        Filter(\n            colMaterialesTracking,\n            IsBlank(CantidadRecibida) || !IsNumeric(CantidadRecibida)\n        )\n    ) > 0,\n    UpdateContext({ MostrarAviso: true, mensajeNotificacion: \"Por favor ingrese cantidades válidas para todos los registros.\" }),\n\n    CountRows(\n        Filter(\n            colMaterialesTracking,\n            CantidadRecibida > Cantidades\n        )\n    ) > 0,\n    UpdateContext({ MostrarAviso: true, mensajeNotificacion: \"La cantidad recibida no puede ser mayor que la cantidad.\" }),\n\n    CountRows(\n        Filter(\n            colMaterialesTracking,\n            CantidadRecibida < 0\n        )\n    ) > 0,\n    UpdateContext({ MostrarAviso: true, mensajeNotificacion: \"La cantidad recibida no puede ser negativa.\" }),\n\n    CountRows(\n        Filter(\n            colMaterialesTracking,\n            !IsBlank(CantidadRecibida) && IsNumeric(CantidadRecibida) && Value(CantidadRecibida) = 0\n        )\n    ) > 0,\n    UpdateContext({ MostrarAviso: true, mensajeNotificacion: \"La cantidad recibida no puede ser 0.\" }),\n\n    CountRows(\n        Filter(\n            colMaterialesTracking,\n            IsBlank(CantidadRecibida)\n        )\n    ) > 0,\n    UpdateContext({ MostrarAviso: true, mensajeNotificacion: \"Debe completar todas las cantidades recibidas.\" }),\n\n    \nForAll(\n  colMaterialesTracking,\n  With(\n    {\n      existing: LookUp(\n        LogisticDespachos,\n        POT = ThisRecord.POT && descripcion = ThisRecord.descripcion\n      ),\n      Cantidad: ThisRecord.Cantidades,\n      POT: ThisRecord.POT,\n      CantidadRecibida:ThisRecord.CantidadRecibida,\n      CantidadFaltante: ThisRecord.CantidadFaltante,\n      Descripcion: ThisRecord.Descripcion\n    },\n    If(\n      IsBlank(existing),\n      Patch(\n        LogisticDespachos,\n        Defaults(LogisticDespachos),\n        {\n         POT: POT,   \n         Fecha: Today(), \n        'Estado (crfb9_estado)': \"\", \n         descripcion: Descripcion, \n         Cantidad: Cantidad, \n        'Cantidad Recibida': CantidadRecibida,\n        'Cantidad Faltante': CantidadFaltante\n        }\n      ),\n      Patch(\n        LogisticDespachos,\n        existing,\n        {\n         Fecha: Today(), \n        'Estado (crfb9_estado)': \"\", \n         descripcion: Descripcion, \n         Cantidad: Cantidad, \n        'Cantidad Recibida': CantidadRecibida,\n        'Cantidad Faltante': CantidadFaltante\n        }\n      )\n    )\n  )\n);\n\n\n    UpdateContext(\n        {\n            MostrarAviso: true,\n            mensajeNotificacion: \"Datos guardados correctamente\",\n            AbrirCont: false,\n            AbrirLisDespacho: false\n        }\n    );\n\n    Clear(colPotsExpanded);\n\n    ForAll(\n        colMaterialesTracking,\n        Collect(\n            colPotsExpanded,\n            ForAll(\n                Split(POT, \",\"),\n                {\n                    POT: Trim(Value),\n                    CantidadFaltante: If(IsBlank(CantidadFaltante), 0, Value(Text(CantidadFaltante)))\n                }\n            )\n        )\n    );\n\n    ClearCollect(\n        colPotsSums,\n        AddColumns(\n            GroupBy(colPotsExpanded, POT, Registros),\n            TotalFaltante,\n            Sum(Registros, CantidadFaltante)\n        )\n    );\n\n    ForAll(\n        Filter(colPotsSums, TotalFaltante = 0),\n        With(\n            { thePOT: POT },\n            If(\n                !IsBlank(thePOT),\n                Patch(\n                    Compras_Pots,\n                    LookUp(Compras_Pots, POT = thePOT),\n                    { 'Estado (crfb9_estado)': \"Despachado\" }\n                )\n            )\n        )\n    );\n\nForAll(\n  Filter(colPotsSums, TotalFaltante = 0),\n  With({ thePOT: POT },\n    If(\n      !IsBlank(thePOT),\n      UpdateIf(\n        Logistica_Movimientos,\n        POT = thePOT && ID_Tracking = SelectedTracking.ID_Tracking && Tracking = SelectedTracking.Tracking,\n        { 'Estado (crfb9_estado)': \"Recibido\" }\n      )\n    )\n  )\n);\n\n    Clear(DespachoCollection);\n    Refresh(LogisticDespachos)\n)\n"
                  PressedBorderColor: =Self.Fill
