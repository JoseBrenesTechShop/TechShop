                                                OnSelect: |-
                                                  =ClearCollect(
                                                      colTemp,
                                                      Filter(
                                                          Logistica_Compras,
                                                          Tracking = ThisItem.Tracking && ID_Tracking = ThisItem.ID_Tracking
                                                      )
                                                  );
                                                  ClearCollect(
                                                      colMaterialesTrackingTemp,
                                                      AddColumns(
                                                          Distinct(
                                                              colTemp,
                                                              Materiales
                                                          ),
                                                          Cantidades,
                                                          Sum(
                                                              Filter(
                                                                  colTemp,
                                                                  Materiales = Value
                                                              ),
                                                              If(
                                                                  IsBlank(Value(Cantidad)),
                                                                  0,
                                                                  Value(Cantidad)
                                                              )
                                                          )
                                                      )
                                                  );
                                                  ClearCollect(
                                                      colMaterialesTracking,
                                                      AddColumns(
                                                          colMaterialesTrackingTemp,
                                                          Descripcion,
                                                          Coalesce(
                                                              LookUp(
                                                                  colTemp,
                                                                  Materiales = Value,
                                                                  Descripcion
                                                              ),
                                                              ""
                                                          ),
                                                          POT,
                                                          With(
                                                              {
                                                                  potsStr: Concat(
                                                                      Distinct(
                                                                          Filter(
                                                                              colTemp,
                                                                              Materiales = Value
                                                                          ),
                                                                          POT
                                                                      ),
                                                                      Value & ","
                                                                  )
                                                              },
                                                              If(
                                                                  Len(potsStr) > 0,
                                                                  Left(
                                                                      potsStr,
                                                                      Len(potsStr) - 1
                                                                  ),
                                                                  ""
                                                              )
                                                          ),
                                                          CantidadRecibida,
                                                          LookUp(
                                                              LogisticDespachos,
                                                              descripcion = LookUp(
                                                                  colTemp,
                                                                  Materiales = Value,
                                                                  Descripcion
                                                              ),'Cantidad Recibida'
                                                          ),
                                                          CantidadFaltante,
                                                          LookUp(
                                                              LogisticDespachos,
                                                              descripcion = LookUp(
                                                                  colTemp,
                                                                  Materiales = Value,
                                                                  Descripcion
                                                              ),'Cantidad Faltante'
                                                          )
                                                      )
                                                  );
