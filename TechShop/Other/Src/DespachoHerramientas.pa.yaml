td></tr>\" & \"</table>\" & \"<p>Por favor, tome las medidas necesarias según el motivo del rechazo.</p>\" & \"<p>Saludos cordiales;</p>\" & \"<p>El equipo de desarrollo</p>\" & \"<p><em>Nota: Por favor, no responda a este correo.</em></p>\"\n        },\n        EnviarCorreo.Run(\n            \"supervisoresTSI@tsicr.com; controlherramientas@tsicr.com; produccionyherramientas@tsicr.com\",\n            \"Notificación de Rechazo de Solicitud de Herramientas\",\n            CuerpoCorreo\n        )\n    );\n    Reset(txt_MotivoRechazo_DH);\n    UpdateContext({Disable: false});\n    UpdateContext({Mostrar: false});\n    UpdateContext({MotivoRechazo: false});\n    \n)"
