                        - btn_Guardar_HxHE:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =ColorFade(Self.Fill, -15%)
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(255, 255, 255, 1)
                              DisabledBorderColor: =RGBA(166, 166, 166, 1)
                              DisplayMode: =If(Disable, DisplayMode.Disabled, DisplayMode.Edit)
                              Fill: =RGBA(0, 134, 208, 1)
                              Font: =Font.'Open Sans'
                              Height: =53
                              HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =RGBA(102, 182, 227, 1)
                              OnSelect: |-
                                =UpdateContext({Efi: (Value(txt_CantProducida_HxHE.Text) / Value(txt_Meta_HxHE.Text)) * 100});
                                UpdateContext({Disable: true});
                                If(

                                  //Validacion de maquina
                                    IsBlank(txt_Maquina_HxHE.Text),//Maquina en blanco?
                                    UpdateContext({TextoAdvertencia: "Debe escanear la MAQUINA en la que esta trabajando"});
                                    UpdateContext({Mostra: true}),
                                    IsBlank(
                                        LookUp(
                                            Maquinas,
                                            Maquina = Upper(txt_Maquina_HxHE.Text)
                                        )
                                    ),//Maquina Existe?
                                    UpdateContext({TextoAdvertencia: "La MAQUINA no existe"});
                                    UpdateContext({Mostra: true}),
                                    LookUp(
                                        Maquinas,
                                        Maquina = Upper(txt_Maquina_HxHE.Text)
                                    ).Status = "Paro",//Maquina en paro?
                                    UpdateContext({TextoAdvertencia: "La maquina seleccionada esta en Paro"});
                                    UpdateContext({Mostra: true}),


                                  //Validacion de tarima
                                    IsBlank(txt_Tarima_HxHE.Text),//Tarima en blanco?
                                    UpdateContext({TextoAdvertencia: "Debe escanear la TARIMA que se esta llenando"});
                                    UpdateContext({Mostra: true}),
                                    Len(txt_Tarima_HxHE.Text) < 3 || Left(
                                        txt_Tarima_HxHE.Text,
                                        1
                                    ) <> "T" || !IsNumeric(
                                        Mid(
                                            txt_Tarima_HxHE.Text,
                                            2,
                                            Len(txt_Tarima_HxHE.Text) - 1
                                        )
                                    ),//Formato valido?
                                    UpdateContext({TextoAdvertencia: "El formato de la TARIMA es invalido"});
                                    UpdateContext({Mostra: true}),


                                  //Validacion Turno
                                    txt_Turno_HxHE.Text in [
                                        "LIBRE",
                                        "TV",
                                        "TF"
                                    ],//Turno igual a LIBRE o TV o TF?
                                    UpdateContext({TextoAdvertencia: "No puede guardar registros en el turno seleccionado actual"});
                                    UpdateContext({Mostra: true}),


                                  //Validacion Cantidad
                                    If(
                                        (txt_CantProducida_HxHE.Text + txt_CantTotal_HxHE.Text) >= Value(txt_CantMax_HxHE.Text),
                                        Notify(
                                            "La cantidad total de la Orden junto a la operación seleccionada ha cumplido con la cantidad maxima deseada.",
                                            NotificationType.Information
                                        )
                                    );
                                    LookUp(
                                        Maquinas,
                                        Maquina = Upper(txt_Maquina_HxHE.Text)
                                    ).Guns = "SI" && (txt_CantProducida_HxHE.Text + txt_CantTarima_HxHE.Text) > 50,
                                    UpdateContext({TextoAdvertencia: "La cantidad digitada supera la cantidad maxima (50) permitida por tarima. Por favor revisar la informacion digitada."});
                                    UpdateContext({Mostra: true}),


                                  //Validadcion de registros
                                    CountRows(
                                        Filter(
                                            'Hora X Hora',
                                            Orden = txt_Orden_HxHE.Text,
                                            Operacion = txt_OP_HxHE.Text,
                                            Maquina = txt_Maquina_HxHE.Text,
                                            FechaRegistro = FechaSup,
                                            Hora = drp_Hora_HxHE.SelectedText.'data-ADB4D7A662F548B49FAC2B986E348A1BValor'
                                        )
                                    ) >= 2,
                                    UpdateContext({TextoAdvertencia: "Ya existen 2 registros de esta maquina en la misma hora"});
                                    UpdateContext({Mostra: true}),
                                    CountRows(
                                        Filter(
                                            'Hora X Hora',
                                            CodigoEmpleado = VarName,
                                            FechaRegistro = FechaSup,
                                            Hora = HoraValor
                                        )
                                    ) >= 4,
                                    UpdateContext({TextoAdvertencia: "Se llego al limite de 4 registros por hora del empleado"});
                                    UpdateContext({Mostra: true}),


                                  //lógica para establecer Cantidad_Por_Hora a 0 si ya existe un registro igual
                                    If(
                                        CountRows(
                                            Filter(
                                                'Hora X Hora',
                                                Maquina = txt_Maquina_HxHE.Text,
                                                FechaRegistro = FechaSup,
                                                Hora = HoraValor
                                            )
                                        ) > 0,
                                        UpdateContext({CantidadPorHoraGuardar: 0}),//Si ya existe un registro, establece Cantidad_Por_Hora a 0
                                        UpdateContext({CantidadPorHoraGuardar: Value(txt_Meta_HxHE.Text)})//Si no existe un registro, establece Cantidad_Por_Hora a txtMetaHxH.Text
                                    );


                                  //Aprovacion del 1.5
                                    (txt_CantProducida_HxHE.Text + txt_CantTotal_HxHE.Text) > (txt_CantMax_HxHE.Text + (txt_CantMax_HxHE.Text * 0.015)) && OrdenInfo.'Permiso_1.5' <> "Aprobado",
                                    If(
                                        IsBlank(
                                            LookUp(
                                                'RegistroOredenes_1.5_1',
                                                Orden = OrdenInfo.Orden && Operacion = OrdenInfo.Operacion
                                            )
                                        ),
                                        Collect(
