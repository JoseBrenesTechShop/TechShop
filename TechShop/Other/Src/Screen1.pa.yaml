Screens:
  Screen1:
    Properties:
      OnVisible: |-
        =
        UpdateContext({VarTime: false});
        UpdateContext({VarTime2: false});
        Reset(Timer1);
        Reset(Timer1_1);
        UpdateContext({VarTime: true})
    Children:
      - Image6:
          Control: Image@2.2.3
          Properties:
            Height: =768
            Image: =video_converted
            ImagePosition: =ImagePosition.Fill
            Width: =1366
      - Label3_11:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 0, 0, Timer1_1.Value/Timer1_1.Duration)
            DisplayMode: =DisplayMode.View
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =261
            Size: =60
            Text: =LookUp(Empleados, VarName = Codigo, Nombre)
            VerticalAlign: =VerticalAlign.Top
            Width: =1239
            X: =63
            Y: =253
      - Timer1:
          Control: Timer@2.1.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =ColorFade(Self.BorderColor, 70%)
            DisabledColor: =ColorFade(Self.Fill, 90%)
            DisabledFill: =ColorFade(Self.Fill, 70%)
            DisplayMode: =DisplayMode.View
            Duration: =800
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnTimerEnd: |-
              =UpdateContext({VarTime2: true})
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Start: =VarTime
            Visible: =false
            X: =579
            Y: =40
      - Timer1_1:
          Control: Timer@2.1.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =ColorFade(Self.BorderColor, 70%)
            DisabledColor: =ColorFade(Self.Fill, 90%)
            DisabledFill: =ColorFade(Self.Fill, 70%)
            DisplayMode: =DisplayMode.View
            Duration: =5000
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnTimerEnd: =Navigate(MenuPrincipal, ScreenTransition.Cover)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Start: =VarTime2
            Visible: =false
            X: =579
            Y: =106
      - Label3_4:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 0, 0, Timer1.Value/1000)
            DisplayMode: =DisplayMode.View
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =155
            Size: =60
            Text: "=\"\U0001F496¡Feliz San Valentín!\U0001F496\""
            Width: =981
            X: =193
            Y: =48
      - Label3_5:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 0, 0, Timer1.Value/1000)
            DisplayMode: =DisplayMode.View
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =231
            Size: =34
            Text: ="¡En Techshop celebramos este San Valentín deseándote un día lleno de alegría, conexión y momentos especiales que inspiren nuevos logros y oportunidades en tu vida! "
            Width: =1283
            X: =38
            Y: =514
