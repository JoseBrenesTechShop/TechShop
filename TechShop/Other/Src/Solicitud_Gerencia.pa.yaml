Screens:
  Solicitud_Gerencia:
    Properties:
      BackgroundImage: ='abstracto geométrico blanco y gris'
      ImagePosition: =ImagePosition.Fill
      OnVisible: |-
        =UpdateContext({Guardando: true});
        ClearCollect(
            datos_SG,
            Sort(
                Filter(
                    Distinct(
                        Filter(
                            preqitem,
                            stat = "R"
                        ),
                        req_num
                    ),
                    Not(Value in Solicitud_Compras.soli_num) && Not(
                        Value in Filter(
                            Compras_NoMarcadas,
                            Enviado < 1 && Tipo_Envio = varEmpleado.Codigo
                        ).NSolicitud
                    ),
                    Switch(
                        varEmpleado.Codigo,
                        "1",
                        true,
                        "2692",
                        StartsWith(
                            Value,
                            "PRD"
                        ) && LookUp(
                            preq,
                            req_num = Value,
                            requester
                        ) <> "raraya",
                        "15",
                        StartsWith(
                            Value,
                            "MTO"
                        ) && LookUp(
                            preq,
                            req_num = Value,
                            requester
                        ) <> "rpereira",
                        "2618",
                        StartsWith(
                            Value,
                            "QAL"
                        ) && LookUp(
                            preq,
                            req_num = Value,
                            requester
                        ) <> "icespedes",
                        "1124",
                        (StartsWith(
                            Value,
                            "TLR"
                        ) || StartsWith(
                            Value,
                            "ADM"
                        ) || StartsWith(
                            Value,
                            "OFC"
                        )) && LookUp(
                            preq,
                            req_num = Value,
                            requester
                        ) <> "marias",
                        "1133",
                        StartsWith(
                            Value,
                            "SOL"
                        ) && LookUp(
                            preq,
                            req_num = Value,
                            requester
                        ) <> "vguerrero",
                        "2648",
                        (StartsWith(
                            Value,
                            "TIC"
                        ) ) && LookUp(
                            preq,
                            req_num = Value,
                            requester
                        ) <> "jbrenes"
                    )
                ),
                Value,
                SortOrder.Ascending
            )
        );
        UpdateContext({Guardando: false})
