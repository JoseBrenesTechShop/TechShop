            - btn_Guardar_EC_10:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(40, 134, 222, 1)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  DisplayMode: |
                    =If(
                        Max(
                            Filter(
                                LogisticDespachos,
                                POT = gl_LogisticaDespacho_LD.Selected.POT
                            ),
                            Value(Right(Listado, 1))  // Asegurar que sea valor numérico
                        ) <> Value(Right(ListadoSeleccionado, 1)) ||
                        !IsEmpty(
                            Filter(
                                Compras_Pots,
                                'Estado (crfb9_estado)' = "Despachado" && POT = gl_LogisticaDespacho_LD.Selected.POT
                            )
                        ),
                        DisplayMode.Disabled, 
                        DisplayMode.Edit  
                    )
                  Fill: =RGBA(40, 134, 222, 1)
                  Font: =Font.'Open Sans'
                  Height: =47
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =
                  OnSelect: |-
                    =If(
                        !IsBlank(
                            LookUp(
                                glr_Listado_LD.AllItems,
                                IsBlank(txt_cantidaRecibida_LD.Text) || !IsNumeric(txt_cantidaRecibida_LD.Text)
                            )
                        ),
                        UpdateContext(
                            {
                                MostrarAviso: true,
                                mensajeNotificacion: "Por favor ingrese cantidades válidas para todos los registros."
                            }
                        ),
                        !IsBlank(
                            LookUp(
                                glr_Listado_LD.AllItems,
                                Value(ThisRecord.Cantidades) < Value(txt_cantidaRecibida_LD.Text)
                            )
                        ),
                        UpdateContext(
                            {
                                MostrarAviso: true,
                                mensajeNotificacion: "La cantidad recibida no puede ser mayor que la cantidad."
                            }
                        ),
                        !IsBlank(
                            LookUp(
                                glr_Listado_LD.AllItems,
                                Value(txt_cantidaRecibida_LD.Text) < 0
                            )
                        ),
                        UpdateContext(
                            {
                                MostrarAviso: true,
                                mensajeNotificacion: "La cantidad recibida no puede ser negativa."
                            }
                        ),
                        !IsBlank(
                            LookUp(
                                glr_Listado_LD.AllItems,
                                IsBlank(txt_cantidaRecibida_LD.Text)
                            )
                        ),
                        UpdateContext(
                            {
                                MostrarAviso: true,
                                mensajeNotificacion: "Debe completar todas las cantidades recibidas."
                            }
                        ),
                        UpdateContext(
                            {
                                UltimoListado: If(
                                    IsBlank(ListadoSeleccionado),
                                    If(
                                        IsEmpty(
                                            Filter(
                                                LogisticDespachos,
                                                POT = gl_LogisticaDespacho_LD.Selected.POT
                                            )
                                        ),
                                        1,
                                        Max(
                                            AddColumns(
                                                Filter(
                                                    LogisticDespachos,
                                                    POT = gl_LogisticaDespacho_LD.Selected.POT
                                                ),
                                                NumListado,
                                                Value(Listado)
                                            ),
                                            NumListado
                                        ) + 1
                                    ),
                                    ListadoSeleccionado
                                )
                            }
                        );
                        ForAll(
                            glr_Listado_LD.AllItems,
                            Patch(
                                LogisticDespachos,
                                If(
                                    !IsBlank(ListadoSeleccionado),
                                    With(
                                        {registro: ThisRecord},
                                        LookUp(
                                            LogisticDespachos,
                                            id_item = registro.id_items && Listado = Text(ListadoSeleccionado) && Requisicion = gl_LogisticaDespacho_LD.Selected.Requisicion && descripcion = registro.Descripcion
                                        )
                                    ),
                                    Defaults(LogisticDespachos)
                                ),
                                {
                                    Requisicion: gl_LogisticaDespacho_LD.Selected.Requisicion,
                                    POT: gl_LogisticaDespacho_LD.Selected.POT,
                                    Fecha: gl_LogisticaDespacho_LD.Selected.Fecha_Tech,
                                    Provedor: gl_LogisticaDespacho_LD.Selected.Provedor,
                                    Num_Vend: gl_LogisticaDespacho_LD.Selected.Num_Vend,
                                    'Estado (crfb9_estado)': If(
                                        Value(txt_cantidadFaltante_LD.Text) = 0,
                                        "Despachado",
                                        "Tramitado"
                                    ),
                                    id_item: ThisRecord.id_items,
                                    descripcion: ThisRecord.Descripcion,
                                    Cantidad: Value(ThisRecord.Cantidades),
                                    'Cantidad Recibida': Value(ThisRecord.txt_cantidaRecibida_LD.Text),
                                    'Cantidad Faltante': Value(ThisRecord.txt_cantidadFaltante_LD.Text),
                                    Listado: UltimoListado
                                }
                            )
                        );
                        UpdateContext(
                            {
                                TieneFaltantes: CountIf(
                                    glr_Listado_LD.AllItems,
                                    Value(ThisRecord.txt_cantidadFaltante_LD.Text) > 0
                                ) > 0
                            }
                        );
                        If(
                            TieneFaltantes,
                            UpdateContext({NuevoListado: UltimoListado + 1});
                            ForAll(
                                Filter(
                                    glr_Listado_LD.AllItems,
                                    Value(ThisRecord.txt_cantidadFaltante_LD.Text) > 0
                                ),
                                Patch(
                                    LogisticDespachos,
                                    Defaults(LogisticDespachos),
                                    {
