            Width: =1366
          Children:
            - ButtonCanvas5_3:
                Control: Button@0.0.45
                Properties:
                  BorderRadius: =10
                  FontSize: =30
                  Height: =50
                  Icon: ="CheckmarkCircle"
                  IconStyle: ='ButtonCanvas.IconStyle'.Filled
                  OnSelect: |-
                    =If(
                        !IsBlank(txt_ContrasenaNueva_CC.Text) && !IsBlank(txt_ContrasenaNueva_CC.Text) && txt_ContrasenaNueva_CC.Text = txt_ContrasenaNueva_CC.Text,
                        Patch(
                            Empleados,
                            LookUp(
                                Empleados,
                                VarName = Codigo
                            ),
                            {Contraseña: txt_ContrasenaNueva_CC.Text}
                        );
                        UpdateContext(
                            {
                                MostrarAviso: true,
                                mensajeNotificacion: "Contraseña actualizada con éxito."
                            }
                        );
                        Reset(txt_ContrasenaNueva_CC);
                        Reset(txt_ContrasenaNueva_CC);
                        ,
                        If(
                            IsBlank(txt_ContrasenaNueva_CC.Text),
                            UpdateContext(
                                {
                                    MostrarAviso: true,
                                    mensajeNotificacion: "La nueva contraseña no puede estar vacía."
                                }
                            ),
                            UpdateContext(
                                {
                                    MostrarAviso: true,
                                    mensajeNotificacion: "Las contraseñas no coinciden."
