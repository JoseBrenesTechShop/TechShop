Screens:
  Tesoreria 2.0:
    Properties:
      BackgroundImage: ='abstracto geométrico blanco y gris'
      ImagePosition: =ImagePosition.Fill
      OnVisible: |-
        =// Primero: Cargar SOLO las requisiciones en proceso (esto es delegable)
        ClearCollect(
            colRequisicionesProceso,
            Filter(
                Solicitud_Compras,
                estado = "En Proceso"
            )
        );

        // Segundo: Cargar TODOS los preqitems (delegable)
        ClearCollect(
            colTodosPreqitems,
            preqitem
        );

        // Tercero: Filtrar LOCALMENTE (sin delegación)
        ClearCollect(
            colPreqitemsFiltrados,
            Filter(
                colTodosPreqitems,
                CountRows(
                    Filter(
                        colRequisicionesProceso,
                        soli_num = req_num
                    )
                ) > 0
            )
        );

        ClearCollect(
            ContenedorTesoreria,
            Filter(
                AddColumns(
                    ShowColumns(
                        colPreqitemsFiltrados,
                        po_num,
                        req_num
                    ) As P,
                    pot, With({Pot: P.po_num}, Pot),
                    Requisicion, With({Pot: P.po_num, req: P.req_num}, Coalesce(LookUp(preq, req_num = req, req_num), "No encontrado")),
                    CodigoProveedor, With({Pot: P.po_num}, LookUp(po, po_num = Pot, vend_num)),
                    NombreProveedor, With({Pot: P.po_num, VendNumTemp: LookUp(po, po_num = P.po_num, vend_num)}, LookUp(vendaddr, vend_num = VendNumTemp, name)),
                    Moneda, With({Pot: P.po_num, VendNumTemp: LookUp(po, po_num = P.po_num, vend_num)}, Coalesce(Upper(LookUp(vendor, vend_num = VendNumTemp, curr_code)), "SIN MONEDA")),
                    TotalPagar, With({Pot: P.po_num}, Value(LookUp(po, po_num = Pot, po_cost)) - Sum(Filter(Compras_Pots, POT = Pot), Total))
                ),
                TotalPagar > 0 
            )
        )
