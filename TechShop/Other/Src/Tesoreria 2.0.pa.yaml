                  - btn_Guardar_EC_45:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(40, 134, 222, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        DisplayMode: |
                          =If(
                              drp_EstadoPago_OLP_2.Selected.Value = "Parcial" &&
                              CountRows(colPOTtoProcess) >= 2,
                              DisplayMode.Disabled,
                              DisplayMode.Edit
                          )
                        Fill: =RGBA(40, 134, 222, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =47
                        HoverBorderColor: =RGBA(40, 134, 222, 1)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =RGBA(15, 84, 140, 1)
                        OnSelect: |-
                          =UpdateContext({Guardando: true});
                          If(
                              CountRows(colPOTtoProcess) = 0,
                              UpdateContext(
                                  {
                                      Aviso: {
                                          Ver: true,
                                          Tipo: 0,
                                          Texto: "Selecciona al menos un POT"
                                      }
                                  }
                              ),
                              CountRows(
                                  Filter(
                                      colPOTtoProcess,
                                      Not(
                                          drp_MetodoPago_OLP_2.SelectedText.Metodo in [
                                              "Efectivo",
                                              "Caja chica"
                                          ]
                                      ) && IsBlank(Trim(Num_Referencia))
                                  )
                              ) > 0,
                              UpdateContext(
                                  {
                                      Aviso: {
                                          Ver: true,
                                          Tipo: 0,
                                          Texto: "Debe ingresar la referencia para todas las POTs antes de continuar."
                                      }
                                  }
                              ),
                              IsBlank(txt_montopagar_OPL_1.Text) || Value(txt_montopagar_OPL_1.Text) <= 0,
                              UpdateContext(
                                  {
                                      Aviso: {
                                          Ver: true,
                                          Tipo: 0,
                                          Texto: "El monto a pagar no puede estar vacío o ser negativo."
                                      }
                                  }
                              ),
                              IsBlank(drp_MetodoPago_OLP_2.SelectedText.Value) || IsBlank(drp_EstadoPago_OLP_2.SelectedText.Value),
                              UpdateContext(
                                  {
                                      Aviso: {
                                          Ver: true,
                                          Tipo: 0,
                                          Texto: "Asegurese de seleccionar el metodo de pago y el estado de pago"
                                      }
                                  }
                              ),
                              IsBlank(txt_totalPOT_OLP_2.Text) || Value(txt_totalPOT_OLP_2.Text) < 0,
                              UpdateContext(
                                  {
                                      Aviso: {
                                          Ver: true,
                                          Tipo: 0,
                                          Texto: "El total no puede ser negativo o estar vacío. Revisa los valores antes de continuar."
                                      }
                                  }
                              ),
                              (drp_MetodoPago_OLP_2.SelectedText.Metodo = "Cheque" || drp_MetodoPago_OLP_2.SelectedText.Metodo = "Transferencia") && IsBlank(txt_NumTransferencia_OLP_3.Text),
                              UpdateContext(
                                  {
                                      Aviso: {
                                          Ver: true,
                                          Tipo: 0,
                                          Texto: "El número de transferencia es obligatorio si el método de pago es Cheque o Transferencia."
                                      }
                                  }
                              ),
                              UpdateContext({MostrarAviso: false}),
                              Collect(
                                  RegistroPagos,
                                  {
                                      Total_Pagar: Value(lbl_montoTotal_OLP_2.Text),
                                      Total_Cancelado: Value(lbl_montoCancelado_OLP_2.Text),
                                      Total: Value(txt_totalPOT_OLP_2.Text),
                                      Fecha_UltimoPago: Today(),
                                      'Estado (crfb9_estado)': drp_EstadoPago_OLP_2.Selected.Value,
                                      Metodo_Pago: drp_MetodoPago_OLP_2.SelectedText.Metodo,
                                      NUM_ID: txt_NumTransferencia_OLP_4.Text,
                                      user: varEmpleado.Nombre
                                  }
                              );
                              ForAll(
                                  colPOTtoProcess,
                                  With(
                                      {
                                          pot: ThisRecord.POT,
                                          codigoproveedor: ThisRecord.Codigo_Proveedor,
                                          nombreproveedor: ThisRecord.Nombre_Proveedor,
                                          totalPo: Value(txt_totalPOT_OLP_2.Text),
                                          totalCancelado: Value(lbl_montoCancelado_OLP_2.Text),
                                          montoPago: Value(ThisRecord.MontoAPagar),
                                          requisicion: Upper(ThisRecord.Requisicion),
                                          numRef: Coalesce(
                                              ThisRecord.Num_Referencia,
                                              txt_NumTransferencia_OLP_3.Text
                                          ),
                                          moneda: ThisRecord.Moneda
                                      },
                                      With(
                                          {
                                              existingRecord: LookUp(
                                                  Compras_Pots,
                                                  POT = pot && Requisicion = requisicion
                                              )
                                          },
                                          If(
                                              drp_EstadoPago_OLP_2.SelectedText.Value = "Parcial",
                                              If(
                                                  Not(IsBlank(existingRecord)),
                                                  Patch(
                                                      Compras_Pots,
                                                      existingRecord,
                                                      {
                                                          Total: existingRecord.Total + Value(txt_montopagar_OPL_1.Text),
                                                          'Estado (crfb9_estado)': If(Value(txt_totalPOT_OLP_2.Text) = 0, "Cancelado", "Parcial"),
                                                          Valor__POT_NUM: LookUp(po, po_num = pot, po_cost),
                                                          Valor_POT: Text(LookUp(po, po_num = pot, po_cost)),
                                                          Fecha_Pago: Now(),
                                                          user: varEmpleado.Nombre
                                                      }
                                                  ),
                                                  Collect(
                                                      Compras_Pots,
                                                      {
                                                          Requisicion: requisicion,
                                                          POT: pot,
                                                          Total: Value(txt_montopagar_OPL_1.Text),
                                                          'Estado (crfb9_estado)': If(Value(txt_totalPOT_OLP_2.Text) = 0, "Cancelado", "Parcial"),
                                                          Num_Vend: codigoproveedor,
                                                          Provedor: nombreproveedor,
                                                          Valor__POT_NUM: LookUp(po, po_num = pot, po_cost),
                                                          Valor_POT: Text(LookUp(po, po_num = pot, po_cost)),
                                                          Moneda: moneda,
                                                          Fecha_Pago: Now(),
                                                          user: varEmpleado.Nombre
                                                      }
                                                  )
                                              ),
                                              If(
                                                  Not(IsBlank(existingRecord)),
                                                  Patch(
                                                      Compras_Pots,
                                                      existingRecord,
                                                      {
                                                          Total: existingRecord.Total + montoPago,
                                                          'Estado (crfb9_estado)': drp_EstadoPago_OLP_2.Selected.Value,
                                                          Valor__POT_NUM: LookUp(po, po_num = pot, po_cost),
                                                          Valor_POT: Text(LookUp(po, po_num = pot, po_cost)),
                                                          Fecha_Pago: Now(),
                                                          user: varEmpleado.Nombre
                                                      }
                                                  ),
                                                  Collect(
                                                      Compras_Pots,
                                                      {
                                                          Requisicion: requisicion,
                                                          POT: pot,
                                                          Total: montoPago,
                                                          'Estado (crfb9_estado)': drp_EstadoPago_OLP_2.Selected.Value,
                                                          Num_Vend: codigoproveedor,
                                                          Provedor: nombreproveedor,
                                                          Valor__POT_NUM: LookUp(po, po_num = pot, po_cost),
                                                          Valor_POT: Text(LookUp(po, po_num = pot, po_cost)),
                                                          Moneda: moneda,
                                                          Fecha_Pago: Now(),
                                                          user: varEmpleado.Nombre
                                                      }
                                                  )
                                              )
                                          )
                                      );
                                      Collect(
                                          Pots,
                                          {
                                              Requisición: requisicion,
                                              POT: pot,
                                              Total: If(drp_EstadoPago_OLP_2.SelectedText.Value = "Parcial", Value(txt_montopagar_OPL_1.Text), montoPago),
                                              'Estado (crfb9_estado)': If(drp_EstadoPago_OLP_2.SelectedText.Value = "Parcial", If(Value(txt_totalPOT_OLP_2.Text) = 0, "Cancelado", "Parcial"), drp_EstadoPago_OLP_2.Selected.Value),
                                              Num_Vend: codigoproveedor,
                                              Proveedor: nombreproveedor,
                                              Num_Transferencia: numRef,
                                              Num_ID: txt_NumTransferencia_OLP_4.Text,
                                              Valor_Pagado: LookUp(po, po_num = pot, po_cost),
                                              Valor_total: Value(LookUp(po, po_num = pot, po_cost)),
                                              Moneda: moneda,
                                              Fecha_Pago: Now(),
                                              user: varEmpleado.Nombre
                                          }
                                      )
                                  )
                              );
                              Refresh(RegistroPagos);
                              Refresh(Compras_Pots);
                              Clear(ComprasPotsCanceladas);
                              ForAll(
                                  RequisicionesUnicas,
                                  With(
                                      {req: ThisRecord.Value},
                                      With(
                                          {
                                              TodasPots: Distinct(
                                                  Filter(
                                                      preqitem,
                                                      req_num = req
                                                  ),
                                                  po_num
                                              )
                                          },
                                          Collect(
                                              ComprasPotsCanceladas,
                                              ForAll(
                                                  TodasPots,
                                                  With(
                                                      {potnum: ThisRecord.Value},
                                                      With(
                                                          {
                                                              pot: LookUp(
                                                                  po,
                                                                  po_num = potnum
                                                              ),
                                                              listaPots: Filter(
                                                                  Compras_Pots,
                                                                  POT = potnum
                                                              )
                                                          },
                                                          If(
                                                              pot.po_cost = Sum(
                                                                  listaPots,
                                                                  Total
                                                              ),
                                                              {
                                                                  Completo: 1,
                                                                  Pot: potnum,
                                                                  cost: pot.po_cost,
                                                                  sum: Sum(
                                                                      listaPots,
                                                                      Total
                                                                  )
                                                              },
                                                              {
                                                                  Completo: 0,
                                                                  Pot: potnum,
                                                                  cost: pot.po_cost,
                                                                  sum: Sum(
                                                                      listaPots,
                                                                      Total
                                                                  )
                                                              }
                                                          )
                                                      )
                                                  )
                                              )
                                          );
                                          If(
                                              CountIf(
                                                  ComprasPotsCanceladas,
                                                  Completo = 0
                                              ) = 0,
                                              Patch(
                                                  Solicitud_Compras,
                                                  LookUp(
                                                      Solicitud_Compras,
                                                      soli_num = req
                                                  ),
                                                  {estado: "Cancelado"}
                                              )
                                          );
                                          RemoveIf(
                                              ComprasPotsCanceladas,
                                              true
                                          )
                                      )
                                  )
                              );
                              Reset(drp_MetodoPago_OLP_2);
                              Reset(drp_EstadoPago_OLP_2);
                              Reset(txt_montopagar_OPL_1);
                              Clear(colSelectedPOTs);
