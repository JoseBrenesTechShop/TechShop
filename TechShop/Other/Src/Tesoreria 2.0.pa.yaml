                                    - btn_cargadatos_TS:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =RGBA(0, 0, 0, 1)
                                          BorderThickness: =3
                                          Fill: =RGBA(15, 84, 140, 1)
                                          Height: =35
                                          HoverBorderColor: =RGBA(12, 59, 94, 1)
                                          HoverFill: =RGBA(12, 59, 94, 1)
                                          OnSelect: |-
                                            =UpdateContext({Guardando: true});
                                            ClearCollect(
                                              FiltroRequisicion,
                                              Distinct(
                                                Filter(Solicitud_Compras, estado = "En Proceso"),
                                                soli_num
                                              )
                                            );
                                            Clear(FiltroPots);
                                            ForAll(
                                             FiltroRequisicion,
                                              Collect(
                                                FiltroPots,
                                                Filter(poitem, req_num = Value)      
                                              )
                                            );
                                            ClearCollect(
                                              FiltroPots2,
                                              Distinct(FiltroPots, po_num)
                                            );
                                            Clear(ContenedorTesoreria);
                                            ForAll(
                                              FiltroPots2,
                                              Collect(
                                                ContenedorTesoreria,
                                                AddColumns(
                                                  ShowColumns(
                                                    Filter(preqitem, po_num = Value), 
                                                    po_num,
                                                    req_num
                                                  ) As P,
                                                  pot, P.po_num,
                                                  Requisicion, Coalesce(LookUp(preq, req_num = P.req_num, req_num), "No encontrado"),
                                                  CodigoProveedor, LookUp(po, po_num = P.po_num, vend_num),
                                                  NombreProveedor, With({VendNumTemp: LookUp(po, po_num = P.po_num, vend_num)}, LookUp(vendaddr, vend_num = VendNumTemp, name)),
                                                  Moneda, With({VendNumTemp: LookUp(po, po_num = P.po_num, vend_num)}, Coalesce(Upper(LookUp(vendor, vend_num = VendNumTemp, curr_code)), "SIN MONEDA")),
                                                  TotalPagar, Value(LookUp(po, po_num = P.po_num, po_cost)) - Sum(Filter(Compras_Pots, POT = P.po_num), Total)
                                                )
                                              )
                                            );

                                            RemoveIf(ContenedorTesoreria, TotalPagar <= 0);

                                            ClearCollect(
                                              ContenedorTesoreriaUnico,
                                              ForAll(
                                                Distinct(
                                                  AddColumns(ContenedorTesoreria, Key, pot & "|" & Requisicion),
                                                  Key
                                                ),
                                                First(
                                                  Filter(ContenedorTesoreria, pot & "|" & Requisicion = Value)
                                                )
                                              )
                                            );
                                            UpdateContext({Guardando: false})
