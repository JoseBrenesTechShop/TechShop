                                                        CantidadTarima: Value(txt_CantidadTarimaDato_EM_1.Text),
                                                        ValorPieza: Value(txt_ValorPiezaDato_EM_1.Text),
                                                        Peso: Value(txt_PesoDato_EM_1.Text),
                                                        TipoCaja: LookUp(item, item = txt_PNDato_EM_1.Text, Uf_TipoCaja),
                                                        Tipo: LookUp(item, item = txt_PNDato_EM_1.Text, charfld4),
                                                        Ano: Year(dp_FechaSalida_EM.SelectedDate),
                                                        Semana: WeekNum(dp_FechaSalida_EM.SelectedDate, StartOfWeek.Monday),
                                                        User: txt_EmpleadoUso_EM_2.Text,
                                                        CantidadTotal: Value(txt_CantidadTarimaDato_EM_1.Text) * Value(txt_CantidadDato_EM_1.Text),
                                                        ValorTotal: (Value(txt_CantidadTarimaDato_EM_1.Text) * Value(txt_CantidadDato_EM_1.Text)) * Value(txt_ValorPiezaDato_EM_1.Text),
                                                        PesoTotal: (Value(txt_CantidadTarimaDato_EM_1.Text) * Value(txt_CantidadDato_EM_1.Text)) * Value(txt_PesoDato_EM_1.Text)
