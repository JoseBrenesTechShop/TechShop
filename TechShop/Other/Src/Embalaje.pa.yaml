                                                        MostrarAviso: true,
                                                        Disable: true
                                                    }
                                                ),
                                                (WeekNum(
                                                    dp_FechaSalida_EM.SelectedDate,
                                                    StartOfWeek.Monday
                                                ) < WeekNum(
                                                    Today(),
                                                    StartOfWeek.Monday
                                                ) && Year(dp_FechaSalida_EM.SelectedDate) = Year(Today())) || Year(dp_FechaSalida_EM.SelectedDate) < Year(Today()),
                                                UpdateContext(
                                                    {
                                                        mensajeNotificacion: "No se pudieron agregar los datos. La fecha de salida seleccionada corresponde a una semana o año anterior. Por favor, seleccione una fecha dentro de la semana actual para continuar.",
                                                        MostrarAviso: true,
                                                        Disable: true
                                                    }
