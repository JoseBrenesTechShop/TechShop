            - btn_Registro_EM:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderStyle: =BorderStyle.None
                  Color: =RGBA(255, 255, 255, 1)
                  Fill: =RGBA(0, 134, 208, 1)
                  Height: =26
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =RGBA(102, 182, 227, 1)
                  OnSelect: |-
                    =With(
                        {
                            maximas: LookUp(
                                Orden_Ejecucion,
                                Orden = RegistroOrden.Orden && Operacion = RegistroOrden.Operacion
                            ).Cantidad,
                            producidas: LookUp(
                                Orden_Ejecucion,
                                Orden = RegistroOrden.Orden && Operacion = RegistroOrden.Operacion
                            ).CantidadTotalProducida,
                            dañadas: Sum(
                                Filter(
                                    Scrap_1,
                                    Orden = RegistroOrden.Orden
                                ),
                                Cantidad
                            )
                        },
                        Collect(
                            Registro_Orden_Maquinas,
                            {
                                Creacion_Fecha: RegistroOrden.'Fecha de creación',
                                Orden: RegistroOrden.Orden,
                                Operacion: RegistroOrden.Operacion,
                                'P/N': RegistroOrden.'P/N',
                                Prioridad: RegistroOrden.Prioridad,
                                Meta: RegistroOrden.Meta,
                                Fecha_inicio: RegistroOrden.Fecha_Inicio,
                                Fecha_Inicio_Aprox: RegistroOrden.Fecha_Inicio_Aprox,
                                Fecha_Fin: If(Today() <= RegistroOrden.Fecha_Inicio, RegistroOrden.Fecha_Fin, DateValue(Text(Today() + RegistroOrden.Dias, "dd/mm/yyyy"))),
                                Fecha_Fin_Aprox: RegistroOrden.Fecha_Fin_Aprox,
                                Jornada: LookUp(
                                    JornadaPlannings,
                                    Valor = RegistroOrden.Jornada
                                ).Texto,
                                Zona: RegistroOrden.Zona,
                                Horas: RegistroOrden.Horas,
                                HorasRestantes: If(
                                    Value(RegistroOrden.Meta) > 0,
                                    RoundUp(
                                        ((maximas - (producidas - dañadas)) / (RegistroOrden.Meta * LookUp(
                                            ZonaPlannings,
                                            Texto = RegistroOrden.Zona,
                                            Valor
                                        )) + LookUp(
                                            Orden_Ejecucion,
                                            Orden = RegistroOrden.Orden && Operacion = RegistroOrden.Operacion
                                        ).TiempoSetup) / Max(
                                            1,
                                            CountRows(
                                                Filter(
                                                    Orden_MaquinasLists_1,
                                                    Orden = RegistroOrden.Orden,
                                                    Operacion = RegistroOrden.Operacion
                                                )
                                            )
                                        ),
                                        0
                                    ),
                                    0
                                ),
                                Dias: RegistroOrden.Dias,
                                CantMaquinas: CountIf(
                                    MaquinasOrigin,
                                    true
                                ),
                                CantMax: maximas,
                                CantPro: producidas,
                                CantDañada: dañadas,
                                User: RegistroOrden.User
                            }
                        )
                    );
                    ForAll(
                        InfoMaquinasViejas,
                        With(
                            {
                                Maquina: ThisRecord,
                                m: ThisRecord.Maquina,
                                ORD: ThisRecord.Orden,
                                OP: ThisRecord.Operacion,
                                HorasPro: CountIf(
                                    Distinct(
                                        Filter(
                                            'Hora X Hora',
                                            Orden = ThisRecord.Orden,
                                            Operacion = ThisRecord.Operacion,
                                            Maquina = ThisRecord.Maquina
                                        ),
                                        'Fecha_Registro_Supervisor '
                                    ),
                                    true
                                )
                            },
                            Collect(
                                Registro_Orden_MaquinasLists,
                                {
                                    Creacion_Fecha: Maquina.Fecha,
