            - btn_OrdenesAfectadas_OM:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =RGBA(72, 163, 62, 1)
                  Font: =Font.'Open Sans'
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =RGBA(21, 68, 18, 1)
                  OnSelect: |-
                    =If(
                        !IsEmpty(MaquinaRemplazo),
                        ForAll(
                            OrdenRemplazo,
                            With(
                                {
                                    // Obtiene la primera prioridad disponible que no esté en uso y no sea 1
                                    NewPri: If(
                                        IsEmpty(
                                            Filter(
                                                Prioridades,
                                                !(Value in Filter(
                                                    Orden_MaquinasLists_1,
                                                    Maquina in Filter(
                                                        Orden_MaquinasLists_1,
                                                        Orden = ThisRecord.Orden,
                                                        Operacion = ThisRecord.Operacion
                                                    ).Maquina
                                                ).Prioridad) && Value <> 1
                                            )
                                        ),
                                        Max(
                                            Filter(
                                                Orden_MaquinasLists_1,
                                                Maquina in Filter(
                                                    Orden_MaquinasLists_1,
                                                    Orden = ThisRecord.Orden,
                                                    Operacion = ThisRecord.Operacion
                                                ).Maquina
                                            ),
                                            Prioridad
                                        ) + 1,
                                        First(
                                            Filter(
                                                Prioridades,
                                                !(Value in Filter(
                                                    Orden_MaquinasLists_1,
                                                    Maquina in Filter(
                                                        Orden_MaquinasLists_1,
                                                        Orden = ThisRecord.Orden,
                                                        Operacion = ThisRecord.Operacion
                                                    ).Maquina
                                                ).Prioridad) && Value <> 1
                                            )
                                        ).Value
                                    ),
                                    ORD: ThisRecord.Orden,
                                    OP: ThisRecord.Operacion
                                },
                                Collect(
                                    infoOrdenAntigua,
                                    LookUp(
                                        Orden_Maquinas_1,
                                        Orden = ORD && Operacion = OP
                                    )
                                );
                                Patch(
                                    Orden_Maquinas_1,
                                    LookUp(
                                        Orden_Maquinas_1,
                                        Orden = ORD && Operacion = OP
                                    ),
                                    {Prioridad: If(
                                        IsEmpty(
                                            Filter(
                                                Prioridades,
                                                !(Value in Filter(
                                                    Orden_MaquinasLists_1,
                                                    Maquina in Filter(
                                                        Orden_MaquinasLists_1,
                                                        Orden = ORD,
                                                        Operacion = OP
                                                    ).Maquina
                                                ).Prioridad) && Value <> 1
                                            )
                                        ),
                                        Max(
                                            Filter(
                                                Orden_MaquinasLists_1,
                                                Maquina in Filter(
                                                    Orden_MaquinasLists_1,
                                                    Orden = ORD,
                                                    Operacion = OP
                                                ).Maquina
                                            ),
                                            Prioridad
                                        ) + 1,
                                        First(
                                            Filter(
                                                Prioridades,
                                                !(Value in Filter(
                                                    Orden_MaquinasLists_1,
                                                    Maquina in Filter(
                                                        Orden_MaquinasLists_1,
                                                        Orden = ORD,
                                                        Operacion = OP
                                                    ).Maquina
                                                ).Prioridad) && Value <> 1
                                            )
                                        ).Value
                                    )}
                                );
                                With(
                                    {
                                        Maquinas: Filter(
                                            Orden_MaquinasLists_1,
                                            Orden = ORD,
                                            Operacion = OP
                                        )
                                    },
                                    ForAll(
                                        Maquinas,
                                        With(
                                            {
                                                m: ThisRecord.Maquina,
                                                Maquina: ThisRecord,
                                                ORDM: ThisRecord.Orden,
                                                OPM: ThisRecord.Operacion
                                            },
                                            Collect(
                                                InfoMaquinasAntigua,
                                                LookUp(
                                                    Orden_MaquinasLists_1,
                                                    Orden = ORDM && Operacion = OPM && Maquina = m
                                                )
                                            );
                                            Patch(
                                                Orden_MaquinasLists_1,
                                                LookUp(
                                                    Orden_MaquinasLists_1,
                                                    Orden = ORDM && Operacion = OPM && Maquina = m
                                                ),
                                                {Prioridad: If(
                                        IsEmpty(
                                            Filter(
                                                Prioridades,
                                                !(Value in Filter(
                                                    Orden_MaquinasLists_1,
                                                    Maquina in Filter(
                                                        Orden_MaquinasLists_1,
                                                        Orden = ORDM,
                                                        Operacion = OPM
                                                    ).Maquina
                                                ).Prioridad) && Value <> 1
                                            )
                                        ),
                                        Max(
                                            Filter(
                                                Orden_MaquinasLists_1,
                                                Maquina in Filter(
                                                    Orden_MaquinasLists_1,
                                                    Orden = ORDM,
                                                    Operacion = OPM
                                                ).Maquina
                                            ),
                                            Prioridad
                                        ) + 1,
                                        First(
                                            Filter(
                                                Prioridades,
                                                !(Value in Filter(
                                                    Orden_MaquinasLists_1,
                                                    Maquina in Filter(
                                                        Orden_MaquinasLists_1,
                                                        Orden = ORDM,
                                                        Operacion = OPM
                                                    ).Maquina
                                                ).Prioridad) && Value <> 1
                                            )
                                        ).Value
                                    )}
                                            )
                                        )
                                    )
                                )
                            )
                        )
                    );
                    ForAll(
                        infoOrdenAntigua,
                        With(
                            {
                                maximas: LookUp(
                                    Orden_Ejecucion,
                                    Orden = ThisRecord.Orden && Operacion = ThisRecord.Operacion
                                ).Cantidad,
                                producidas: LookUp(
                                    Orden_Ejecucion,
                                    Orden = ThisRecord.Orden && Operacion = ThisRecord.Operacion
                                ).CantidadTotalProducida,
                                dañadas: Sum(
                                    Filter(
                                        Scrap_1,
                                        Orden = ThisRecord.Orden
                                    ),
                                    Cantidad
                                ),
                                O: ThisRecord,
                                Z: ThisRecord.Zona,
                                J: ThisRecord.Jornada,
                                ORD: ThisRecord.Orden,
                                OP: ThisRecord.Operacion
                            },
                            Collect(
                                Registro_Orden_Maquinas,
                                {
                                    Creacion_Fecha: O.'Fecha de creación',
                                    Orden: O.Orden,
                                    Operacion: O.Operacion,
                                    'P/N': O.'P/N',
                                    Prioridad: O.Prioridad,
                                    Meta: O.Meta,
                                    Fecha_inicio: O.Fecha_Inicio,
                                    Fecha_Inicio_Aprox: O.Fecha_Inicio_Aprox,
                                    Fecha_Fin: If(Today() <= O.Fecha_Inicio, O.Fecha_Fin, DateValue(Text(Today() + O.Dias, "dd/mm/yyyy"))),
                                    Fecha_Fin_Aprox: O.Fecha_Fin_Aprox,
                                    Jornada: LookUp(
                                        JornadaPlannings,
                                        Valor = J
                                    ).Texto,
                                    Zona: O.Zona,
                                    Horas: O.Horas,
                                    HorasRestantes: If(
                                        Value(O.Meta) > 0,
                                        RoundUp(
                                            ((maximas - (producidas - dañadas)) / (O.Meta * LookUp(
                                                ZonaPlannings,
                                                Texto = Z,
                                                Valor
                                            )) + LookUp(
                                                Orden_Ejecucion,
                                                Orden = ORD && Operacion = OP
                                            ).TiempoSetup) / Max(
                                                1,
                                                CountRows(
                                                    Filter(
                                                        Orden_MaquinasLists_1,
                                                        Orden = ORD,
                                                        Operacion = OP
                                                    )
                                                )
                                            ),
                                            0
                                        ),
                                        0
                                    ),
                                    Dias: O.Dias,
                                    CantMaquinas: CountIf(
                                        Filter(
                                            Orden_MaquinasLists_1,
                                            Orden = ORD,
                                            Operacion = OP
                                        ),
                                        true
                                    ),
                                    CantMax: maximas,
                                    CantPro: producidas,
                                    CantDañada: dañadas,
                                    User: O.User
                                }
                            )
                        )
                    );
                    ForAll(
                        InfoMaquinasAntigua,
                        With(
                            {
                                Maquina: ThisRecord,
                                m: ThisRecord.Maquina,
                                ORD: ThisRecord.Orden,
                                OP: ThisRecord.Operacion
                            },
                            Collect(
                                Registro_Orden_MaquinasLists,
                                {
                                    Creacion_Fecha: Maquina.Fecha,
                                    Maquina: Maquina.Maquina,
                                    Orden: ORD,
                                    Operacion: OP,
                                    'P/N': Maquina.'P/N',
                                    Prioridad: Maquina.Prioridad,
                                    Meta: Maquina.Meta,
                                    Horas: Maquina.Horas,
                                    HorasProducidas: CountIf(
                                        Distinct(
                                            Filter(
                                                'Hora X Hora',
                                                Orden = ORD,
                                                Operacion = OP,
                                                Maquina = m
                                            ),
                                            'Fecha_Registro_Supervisor '
                                        ),
                                        true
                                    ),
                                    HorasRes: Maquina.Horas - CountIf(
                                        Distinct(
                                            Filter(
                                                'Hora X Hora',
                                                Orden = ORD,
                                                Operacion = OP,
                                                Maquina = m
                                            ),
                                            'Fecha_Registro_Supervisor '
                                        ),
