                            },
                            If(
                                IsBlank(
                                    LookUp(
                                        Orden_MaquinasLists_1,
                                        Orden = info.Orden && Operacion = info.Operacion && Maquina = m
                                    )
                                ),
                                //Crea un registro de la maquina
                                Collect(
