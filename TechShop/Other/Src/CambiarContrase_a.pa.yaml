            - ButtonCanvas5:
                Control: Button@0.0.44
                Properties:
                  FontSize: =30
                  Height: =50
                  OnSelect: "=If(\n    !IsBlank(txtNuevaContra.Text) && !IsBlank(txtContraConfirmacion.Text) && txtNuevaContra.Text = txtContraConfirmacion.Text,\n    Patch(\n        Empleados,\n        LookUp(\n            Empleados,\n            VarName = Codigo\n        ),\n        {Contraseña: txtNuevaContra.Text}\n    );\n    Notify(\"Contraseña actualizada con éxito.\", NotificationType.Success);\n    Reset(txtNuevaContra); Reset(txtContraConfirmacion);\n    Navigate(MenuPrincipal);\n \n,\n    If(\n        IsBlank(txtNuevaContra.Text),\n        Notify(\"La nueva contraseña no puede estar vacía.\", NotificationType.Error),\n        Notify(\"Las contraseñas no coinciden.\", NotificationType.Error)\n    )\n)"
