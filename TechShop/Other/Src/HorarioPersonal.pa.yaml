            HtmlText: "=Concatenate(\n  \"<!DOCTYPE html>\",\n  \"<html>\",\n  \"<head>\",\n    \"<title>Horarios</title>\",\n    \"<style>\",\n      \"body { font-family: Arial, sans-serif; margin: 20px; }\",\n      \"h1 { color: #333; font-weight: bold; margin-bottom: 10px; }\",\n      \"table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }\",\n      \"th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }\",\n      \"th { background-color: #f0f0f0; }\",\n      \".cell { padding: 10px; border-bottom: 1px solid #ddd; }\",\n      \".button { background-color: #4CAF50; color: #fff; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }\",\n      \".button:hover { background-color: #3e8e41; }\",\n    \"</style>\",\n  \"</head>\",\n  \"<body>\",\n    \"<h1>Horario</h1>\",\n    \"<table>\",\n      \"<tr>\",\n        \"<th>Día</th>\",\n        \"<th>Turno</th>\",\n        \"<th>Horario</th>\",\n      \"</tr>\",\n      \"<tr>\",\n        \"<td class='cell'>Lunes</td>\",\n        \"<td class='cell'>\", drpTurno_L.SelectedText.Value, \"</td>\",\n        \"<td class='cell'>\", lblHorario_L.Text, \"</td>\",\n      \"</tr>\",\n      \"<tr>\",\n        \"<td class='cell'>Martes</td>\",\n        \"<td class='cell'>\", drpTurno_K.SelectedText.Value, \"</td>\",\n        \"<td class='cell'>\", lblHorario_K.Text, \"</td>\",\n      \"</tr>\",\n      \"<tr>\",\n        \"<td class='cell'>Miércoles</td>\",\n        \"<td class='cell'>\", drpTurno__M.SelectedText.Value, \"</td>\",\n        \"<td class='cell'>\", lblHorario_M.Text, \"</td>\",\n      \"</tr>\",\n      \"<tr>\",\n        \"<td class='cell'>Jueves</td>\",\n        \"<td class='cell'>\", drpTurno_J.SelectedText.Value, \"</td>\",\n        \"<td class='cell'>\", lblHorario_J.Text, \"</td>\",\n      \"</tr>\",\n      \"<tr>\",\n        \"<td class='cell'>Viernes</td>\",\n        \"<td class='cell'>\", drpTurno_V.SelectedText.Value, \"</td>\",\n        \"<td class='cell'>\", lblHorario_V.Text, \"</td>\",\n      \"</tr>\",\n      \"<tr>\",\n        \"<td class='cell'>Sábado</td>\",\n        \"<td class='cell'>\", drpTurno_S.SelectedText.Value, \"</td>\",\n        \"<td class='cell'>\", lblHorario_S.Text, \"</td>\",\n      \"</tr>\",\n      \"<tr>\",\n        \"<td class='cell'>Domingo</td>\",\n        \"<td class='cell'>\", drpTurno_D.SelectedText.Value, \"</td>\",\n        \"<td class='cell'>\", lblHorario_D.Text, \"</td>\",\n      \"</tr>\",\n    \"</table>\",\n    \n    \"<h1>Máquinas Asignadas</h1>\",\n    \"<table>\",\n      \"<tr>\",\n        \"<th>Máquina 1</th>\",\n        \"<th>Máquina 2</th>\",\n        \"<th>Máquina 3</th>\",\n        \"<th>Máquina 4</th>\",\n      \"</tr>\",\n      \"<tr>\",\n        \"<td class='cell'>\", drpMaquina.SelectedText.Value, \"</td>\",\n        \"<td class='cell'>\", drpMaquina2.SelectedText.Value, \"</td>\",\n        \"<td class='cell'>\", drpMaquina3.SelectedText.Value, \"</td>\",\n        \"<td class='cell'>\", drpMaquina4.SelectedText.Value, \"</td>\",\n      \"</tr>\",\n    \"</table>\",\n    \n    \"<h1>Información Adicional</h1>\",\n    \"<table>\",\n      \"<tr>\",\n        \"<th>Empleado</th>\",\n        \"<th>Fecha Inicio</th>\",\n        \"<th>Fecha Fin</th>\",\n        \"<th>Semana</th>\",\n        \"<th>Horas Trabajadas</th>\",\n        \"<th>Horas Pagadas</th>\",\n      \"</tr>\",\n      \"<tr>\",\n        \"<td class='cell'>\", Drp_Empleado_HP.SelectedText.Value, \"</td>\",\n        \"<td class='cell'>\", Text(dpFechaInicio.SelectedDate, \"[$-en-US]yyyy-mm-dd\"), \"</td>\",\n        \"<td class='cell'>\", Text(dpFechaFin.SelectedDate, \"[$-en-US]yyyy-mm-dd\"), \"</td>\",\n        \"<td class='cell'>\", Text(WeekNum(dpFechaInicio.SelectedDate)), \"</td>\",\n        \"<td class='cell'>\", txtHorasTrabajadas.Text, \"</td>\",\n        \"<td class='cell'>\", txtHorasPagadas.Text, \"</td>\",\n      \"</tr>\",\n    \"</table>\",\n  \"</body>\",\n  \"</html>\"\n)"
            Visible: =false
            Width: =143
      - HtmlCuerpo_HP:
          Control: HtmlViewer@2.1.0
          Properties:
            DisabledBorderColor: =RGBA(56, 56, 56, 1)
            Font: =Font.'Open Sans'
            Height: =14
            HtmlText: ="Estimado/a,<br><br>" & "Le informamos que se ha asignado o actualizado su horario. Para obtener más información, por favor revise el archivo PDF adjunto..<br><br>" & "Si tiene alguna duda, queja o sugerencia hablar con el encargado de asiganar los horarios.<br><br>" & "Gracias<br>"
            Visible: =false
            Width: =111
            X: =184
