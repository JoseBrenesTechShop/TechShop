Screens:
  Screen3:
    Children:
      - Table3:
          Control: Table@1.0.278
          Properties:
            Height: =600
            Items: =Distinct(Filter(Orden_Ejecucion, Estado_Orden = "Ejecucion"), Orden)
            Width: =1366
            Y: =156
          Children:
            - Value3:
                Control: TableDataField@1.5.0
                Variant: textualColumn
                IsLocked: true
                Properties:
                  FieldDisplayName: ="Value"
                  FieldName: ="Value"
                  FieldType: ="s"
                  Order: =1
      - TextInput20:
          Control: ModernTextInput@1.1.0
          Properties:
            X: =40
            Y: =40
