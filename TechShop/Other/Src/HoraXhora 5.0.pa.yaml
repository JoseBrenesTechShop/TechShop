                        - txt_Sup_HxH5:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0, 18, 107, 1)
                              BorderStyle: =BorderStyle.None
                              Default: |-
                                =If(
                                    HoraValor >= 0 && HoraValor <= 6 && Dia = 2,
                                    With(
                                        {
                                            supervisores: Filter(
                                                HorarioSemanals,
                                                (Fecha_Fin = DateAdd(
                                                    FechaHorario,
                                                    -1,
                                                    TimeUnit.Days
                                                )) && Zona = LookUp(
                                                    Maquinas,
                                                    Maquina = txt_Maquina_HxH5.Text,
                                                    Ubicacion_Bono
                                                )
                                            )
                                        },
                                        LookUp(
                                            supervisores,
                                            With(
                                                {Turno: ThisRecord.Domingo},
                                                !IsBlank(
                                                    LookUp(
                                                        Tipo_Turnos,
                                                        Horario = Turno && ((Hora_Inicio <= HoraValor && HoraValor <= 23 && Hora_Inicio >= 18) || (Hora_Fin >= HoraValor && HoraValor >= 0 && Hora_Fin <= 6))
                                                    )
                                                )
                                            )
                                        ).Empleado
                                    ),
                                    If(
                                        HoraValor >= 0 && HoraValor <= 6,
                                        With(
                                            {
                                                supervisores: Filter(
                                                    HorarioSemanals,
                                                    Fecha_Inicio <= FechaHorario && Fecha_Fin >= FechaHorario && Zona = LookUp(
                                                        Maquinas,
                                                        Maquina = txt_Maquina_HxH5.Text,
                                                        Ubicacion_Bono
                                                    )
                                                )
                                            },
                                            Switch(
                                                Dia,
                                                1,
                                                LookUp(
                                                    supervisores,
                                                    With(
                                                        {Turno: ThisRecord.Sabado},
                                                        !IsBlank(
                                                            LookUp(
                                                                Tipo_Turnos,
                                                                Horario = Turno && ((Hora_Inicio <= HoraValor && HoraValor <= 23 && Hora_Inicio >= 18) || (Hora_Fin >= HoraValor && HoraValor >= 0 && Hora_Fin <= 6))
                                                            )
                                                        )
                                                    )
                                                ).Empleado,
                                                3,
                                                LookUp(
                                                    supervisores,
                                                    With(
                                                        {Turno: ThisRecord.Lunes},
                                                        !IsBlank(
                                                            LookUp(
                                                                Tipo_Turnos,
                                                                Horario = Turno && ((Hora_Inicio <= HoraValor && HoraValor <= 23 && Hora_Inicio >= 18) || (Hora_Fin >= HoraValor && HoraValor >= 0 && Hora_Fin <= 6))
                                                            )
                                                        )
                                                    )
                                                ).Empleado,
                                                4,
                                                LookUp(
                                                    supervisores,
                                                    With(
                                                        {Turno: ThisRecord.Martes},
                                                        !IsBlank(
                                                            LookUp(
                                                                Tipo_Turnos,
                                                                Horario = Turno && ((Hora_Inicio <= HoraValor && HoraValor <= 23 && Hora_Inicio >= 18) || (Hora_Fin >= HoraValor && HoraValor >= 0 && Hora_Fin <= 6))
                                                            )
                                                        )
                                                    )
                                                ).Empleado,
                                                5,
                                                LookUp(
                                                    supervisores,
                                                    With(
                                                        {Turno: ThisRecord.Miercoles},
                                                        !IsBlank(
                                                            LookUp(
                                                                Tipo_Turnos,
                                                                Horario = Turno && ((Hora_Inicio <= HoraValor && HoraValor <= 23 && Hora_Inicio >= 18) || (Hora_Fin >= HoraValor && HoraValor >= 0 && Hora_Fin <= 6))
                                                            )
                                                        )
                                                    )
                                                ).Empleado,
                                                6,
                                                LookUp(
                                                    supervisores,
                                                    With(
                                                        {Turno: ThisRecord.Jueves},
                                                        !IsBlank(
                                                            LookUp(
                                                                Tipo_Turnos,
                                                                Horario = Turno && ((Hora_Inicio <= HoraValor && HoraValor <= 23 && Hora_Inicio >= 18) || (Hora_Fin >= HoraValor && HoraValor >= 0 && Hora_Fin <= 6))
                                                            )
                                                        )
                                                    )
                                                ).Empleado,
                                                7,
                                                LookUp(
                                                    supervisores,
                                                    With(
                                                        {Turno: ThisRecord.Viernes},
                                                        !IsBlank(
                                                            LookUp(
                                                                Tipo_Turnos,
                                                                Horario = Turno && ((Hora_Inicio <= HoraValor && HoraValor <= 23 && Hora_Inicio >= 18) || (Hora_Fin >= HoraValor && HoraValor >= 0 && Hora_Fin <= 6))
                                                            )
                                                        )
                                                    )
                                                ).Empleado
                                            )
                                        ),
                                        If(
                                            HoraValor >= 18 && HoraValor <= 23,
                                            With(
                                                {
