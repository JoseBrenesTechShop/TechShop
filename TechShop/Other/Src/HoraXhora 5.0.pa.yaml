                        - btn_Guardar_HxH5:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =ColorFade(Self.Fill, -15%)
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(255, 255, 255, 1)
                              DisabledBorderColor: =RGBA(166, 166, 166, 1)
                              DisplayMode: =If(Disable, DisplayMode.Disabled, DisplayMode.Edit)
                              Fill: =RGBA(0, 134, 208, 1)
                              Font: =Font.'Open Sans'
                              Height: =63
                              HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =RGBA(102, 182, 227, 1)
                              OnSelect: |-
                                =UpdateContext({Efi: (Value(txt_CantProducida_HxH5.Text + txt_CantDañada_HxH5.Text) / Value(txt_Meta_HxH5.Text)) * 100});
                                UpdateContext({Disable: true});
                                If(
                                    IsBlank(LookUp(
                                        Orden_MaquinasLists_1,
                                        Maquina = txt_Maquina_HxH5.Text && Prioridad = 1
                                    )),//Maquina en blanco?
                                    UpdateContext(
                                        {
                                            TextoAdvertencia: "La maquina no esta en prioridad 1 o no exite",
                                            Mostra: true
                                        }
                                    ),
                                    LookUp(
                                        Orden_MaquinasLists_1,
                                        Maquina = txt_Maquina_HxH5.Text && Prioridad = 1
                                    ).LimpiezaLinea <> "Completo" && Value(txt_CantProducida_HxH5.Text + txt_CantDañada_HxH5.Text) > 1,
                                    UpdateContext(
                                        {
                                            TextoAdvertencia: "Se debe realizar la limpieza de linea a la maquina para poder ingresar cantidades superiores a 1",
                                            Mostra: true
                                        }
                                    ),
                                  //Validacion de maquina
                                    IsBlank(txt_Maquina_HxH5.Text),//Maquina en blanco?
                                    UpdateContext({TextoAdvertencia: "Debe indicar la MAQUINA con la que esta trabajando"});
                                    UpdateContext({Mostra: true}),
                                    IsBlank(
                                        LookUp(
                                            Maquinas,
                                            Maquina = Upper(txt_Maquina_HxH5.Text)
                                        )
                                    ),//Maquina Existe?
                                    UpdateContext({TextoAdvertencia: "La MAQUINA no existe"});
                                    UpdateContext({Mostra: true}),
                                    LookUp(
                                        Maquinas,
                                        Maquina = Upper(txt_Maquina_HxH5.Text)
                                    ).Status = "Paro",//Maquina en paro?
                                    UpdateContext({TextoAdvertencia: "La MAQUINA seleccionada esta en Paro"});
                                    UpdateContext({Mostra: true}),
                                  //Validacion de tarima
                                    IsBlank(txt_Tarima_HxH5.Text),//Tarima en blanco?
                                    UpdateContext({TextoAdvertencia: "Debe indicar la TARIMA que se esta llenando"});
                                    UpdateContext({Mostra: true}),
                                    (Len(txt_Tarima_HxH5.Text) < 3 || Not(
                                        Left(
                                            txt_Tarima_HxH5.Text,
                                            1
                                        ) in [
                                            "T",
                                            "t"
                                        ]
                                    )) || !IsNumeric(
                                        Mid(
                                            txt_Tarima_HxH5.Text,
                                            2,
                                            Len(txt_Tarima_HxH5.Text) - 1
                                        )
                                    ),//Formato valido?
                                    UpdateContext({TextoAdvertencia: "El formato de la TARIMA es invalido"});
                                    UpdateContext({Mostra: true}),
                                  //Validacion Hora y operario
                                    IsBlank(drp_Hora_HxH5.SelectedText),
                                    UpdateContext({TextoAdvertencia: "Debe indicar la HORA del registro"});
                                    UpdateContext({Mostra: true}),
                                    IsBlank(txt_Operario_HxH5.Text),
                                    UpdateContext({TextoAdvertencia: "Debe indicar al OPERARIO que se le esta haciendo el registro"});
                                    UpdateContext({Mostra: true}),
                                  //Validacion Turno
                                    txt_Turno_HxH5.Text in [
                                        "LIBRE",
                                        "TV",
                                        "TF"
                                    ],//Turno igual a LIBRE o TV o TF?
                                    UpdateContext({TextoAdvertencia: "No puede guardar registros en turno " & txt_Turno_HxH5.Text & "."});
                                    UpdateContext({Mostra: true}),
                                  //Validacion Cantidad
                                    !IsNumeric(txt_CantDañada_HxH5.Text) || !IsNumeric(txt_CantProducida_HxH5.Text),
                                    UpdateContext({TextoAdvertencia: "Las cantidades deben ser NÚMERICAS"});
                                    UpdateContext({Mostra: true}),
                                    Value(txt_CantDañada_HxH5.Text) < 0 || Value(txt_CantProducida_HxH5.Text) < 0,
                                    UpdateContext({TextoAdvertencia: "Las cantidades NO pueden ser NEGATIVAS"});
                                    UpdateContext({Mostra: true}),
                                    If(
                                        ((txt_CantProducida_HxH5.Text + txt_CantDañada_HxH5.Text) + txt_CantTotal_HxH5.Text) >= Value(txt_CantMax_HxH5.Text),
                                        Notify(
                                            "La cantidad total de la Orden junto a la operación seleccionada ha cumplido con la cantidad maxima deseada.",
                                            NotificationType.Information
                                        )
                                    );
                                    LookUp(
                                        Maquinas,
                                        Maquina = Upper(txt_Maquina_HxH5.Text)
                                    ).Guns = "SI" && ((txt_CantProducida_HxH5.Text + txt_CantDañada_HxH5.Text) + txt_CantTarima_HxH5.Text) > 50,
                                    UpdateContext({TextoAdvertencia: "La cantidad digitada supera la cantidad maxima (50) permitida por tarima. Por favor revisar la informacion digitada."});
                                    UpdateContext({Mostra: true}),
                                  //Validadcion de registros
                                    CountRows(
                                        Filter(
                                            'Hora X Hora',
                                            Orden = txt_Orden_HxH5.Text,
                                            Operacion = txt_OP_HxH5.Text,
                                            Maquina = Upper(txt_Maquina_HxH5.Text),
                                            FechaRegistro >= Fecha1 && FechaRegistro <= Fecha2,
                                            Hora = drp_Hora_HxH5.SelectedText.'data-ADB4D7A662F548B49FAC2B986E348A1BValor'
                                        )
                                    ) >= 2,
                                    UpdateContext({TextoAdvertencia: "Ya existen 2 registros de esta maquina en la misma hora"});
                                    UpdateContext({Mostra: true}),
                                    CountRows(
                                        Filter(
                                            'Hora X Hora',
                                            CodigoEmpleado = drp_Operario_HxH2_2.SelectedText.Codigo,
                                            FechaRegistro >= Fecha1 && FechaRegistro <= Fecha2,
                                            Hora = HoraValor
                                        )
                                    ) >= 4,
                                    UpdateContext({TextoAdvertencia: "Se llego al limite de 4 registros por hora del empleado"});
                                    UpdateContext({Mostra: true}),
                                  //lógica para establecer Cantidad_Por_Hora a 0 si ya existe un registro igual
                                    If(
                                        CountRows(
                                            Filter(
                                                'Hora X Hora',
                                                Maquina = Upper(txt_Maquina_HxH5.Text),
                                                FechaRegistro >= Fecha1 && FechaRegistro <= Fecha2,
                                                Hora = HoraValor
                                            )
                                        ) > 0,
                                        UpdateContext({CantidadPorHoraGuardar: 0}),//Si ya existe un registro, establece Cantidad_Por_Hora a 0
                                        UpdateContext({CantidadPorHoraGuardar: Value(txt_Meta_HxH5.Text)})//Si no existe un registro, establece Cantidad_Por_Hora a txtMetaHxH.Text
                                    );
                                    //Aprovacion del 1.5
                                (txt_CantProducida_HxH5.Text + txt_CantTotal_HxH5.Text) > (txt_CantMax_HxH5.Text + (txt_CantMax_HxH5.Text * 0.015)) && OrdenInfo.'Permiso_1.5' <> "Aprobado",
                                    If(
                                        IsBlank(
                                            LookUp(
                                                'RegistroOredenes_1.5_1',
                                                Orden = OrdenInfo.Orden && Operacion = OrdenInfo.Operacion
                                            )
                                        ),
                                        Collect(
                                            'RegistroOredenes_1.5_1',
                                            {
                                                Orden: OrdenInfo.Orden,
                                                Operacion: OrdenInfo.Operacion,
                                                User_Solicitud: txtEmpleadoEnUso_HxHE_3.Text,
                                                Respuesta: "En Espera"
                                            }
                                        ),
                                        Remove(
                                            'RegistroOredenes_1.5_1',
                                            LookUp(
                                                'RegistroOredenes_1.5_1',
                                                Orden = OrdenInfo.Orden && Operacion = OrdenInfo.Operacion
                                            )
                                        );
                                        Collect(
                                            'RegistroOredenes_1.5_1',
                                            {
                                                Orden: OrdenInfo.Orden,
                                                Operacion: OrdenInfo.Operacion,
                                                User_Solicitud: txtEmpleadoEnUso_HxHE_3.Text,
                                                Respuesta: "En Espera"
                                            }
                                        )
                                    );
                                    UpdateContext({MostraBloqueo: true}),
                                  //Guarda el registro
                                    If(
                                        Efi < 80,
                                        UpdateContext({MostraCausa: true}),
                                        Collect(
                                            'Hora X Hora',
                                            {
                                                CodigoEmpleado: varEmpleado.Codigo,
                                                Operario: varEmpleado.Nombre,
                                                Maquina: Upper(txt_Maquina_HxH5.Text),
                                                Orden: OrdenInfo.Orden,
                                                Operacion: OrdenInfo.Operacion,
                                                'P/N': OrdenInfo.'P/N',
                                                Cantidad_Por_Hora: CantidadPorHoraGuardar,
                                                Cantidad: Value(txt_CantProducida_HxH5.Text),
                                                Scrap: Value(txt_CantDañada_HxH5.Text),
                                                Semana: Value(txt_Semana_HxH5.Text),
                                                Turno: txt_Turno_HxH5.Text,
                                                User: txtEmpleadoEnUso_HxHE_3.Text,
                                                'Fecha_Registro_Supervisor ': Text(
                                                    Text(
                                                        FechaSup,
                                                        "mm/dd/yyyy"
                                                    ) & " " & drp_Hora_HxH5.SelectedText.Value
                                                ),
                                                FechaRegistro: DateTimeValue(
                                                    Text(
                                                        FechaSup,
                                                        "[$-en-US]yyyy-mm-dd"
                                                    ) & " 12:00:00"
                                                ),
                                                Tarima: Upper(txt_Tarima_HxH5.Text),
                                                Comentario: drp_Comentario_HxH5.SelectedText.Value,
                                                Causa: "Bien",
                                                Descripcion: txt_Descripcion_HxH5.Text,
                                                Ubicacion_Bono: LookUp(
                                                    Maquinas,
                                                    Maquina = Upper(txt_Maquina_HxH5.Text),
                                                    Ubicacion_Bono
                                                ),
                                                Fecha_Hora: Text(
                                                    Now(),
                                                    "mm/dd/yyyy hh:mm AM/PM"
                                                ),
                                                Hora: drp_Hora_HxH2_1.SelectedText.'data-ADB4D7A662F548B49FAC2B986E348A1BValor',
                                                Usuario_Fin: txt_Sup_HxH5.Text
                                            }
                                        );
                                        Patch(
                                            Orden_Ejecucion,
                                            OrdenInfo,
                                            {CantidadTotalProducida: txt_CantTotal_HxH5.Text + txt_CantProducida_HxH5.Text + txt_CantDañada_HxH5.Text}
                                        );
                                        If(
                                            IsBlank(txt_CantTarima_HxH5.Text),
                                            Collect(
                                                Orden_Tarimas,
                                                {
                                                    Orden: txt_Orden_HxH5.Text,
                                                    Operacion: txt_OP_HxH5.Text,
                                                    Tarima: Upper(txt_Tarima_HxH5.Text),
                                                    CantidadTotalProducida: Value(txt_CantProducida_HxH5.Text + txt_CantDañada_HxH5.Text)
                                                }
                                            ),
                                            Patch(
                                                Orden_Tarimas,
                                                LookUp(
                                                    Orden_Tarimas,
                                                    Orden = OrdenInfo.Orden && Operacion = OrdenInfo.Operacion && Tarima = txt_Tarima_HxH2_1.Text
                                                ),
                                                {CantidadTotalProducida: txt_CantTarima_HxH5.Text + txt_CantProducida_HxH5.Text + txt_CantDañada_HxH5.Text}
                                            )
                                        );
                                        UpdateContext(
                                            {
                                                RecordHerramienta: Filter(
                                                    Herramientas,
                                                    Maquina = Upper(txt_Maquina_HxH5.Text),
                                                    Operacion = OrdenInfo.Operacion
                                                )
                                            }
                                        );
                                        ForAll(
                                            RecordHerramienta,
                                            Patch(
                                                Herramientas,
                                                ThisRecord,
                                                {Cant_Actual: Cant_Actual + Value(txt_CantProducida_HxH5.Text + txt_CantDañada_HxH5.Text)}
                                            )
                                        );
                                        Reset(txt_Maquina_HxH5);
                                        Reset(txt_Tarima_HxH5);
                                        Reset(drp_Comentario_HxH5);
                                        Reset(drp_Causas_HxH5);
                                        Reset(drp_Fecha_HxH2_2);
                                        Reset(drp_Hora_HxH5);
                                        Reset(txt_CantDañada_HxH5);
                                        Reset(txt_CantProducida_HxH5);
                                        UpdateContext(
                                            {
                                                FechaSup: DateTimeValue(
                                                    Text(
                                                        Today(),
                                                        "[$-en-US]yyyy-mm-dd"
                                                    ) & " 12:00:00"
                                                ),
                                                Fecha1: DateTimeValue(
                                                    Text(
                                                        Today(),
                                                        "[$-en-US]yyyy-mm-dd"
                                                    ) & " 00:00:00"
                                                ),
                                                Fecha2: DateTimeValue(
                                                    Text(
                                                        Today(),
                                                        "[$-en-US]yyyy-mm-dd"
                                                    ) & " 23:59:59"
                                                ),
                                                Comentarios: {
                                                    Comentario: "PRODUCION",
                                                    Causa: "Bien"
                                                },
                                                FechaHorario: DateValue(Today()),
                                                Dia: Weekday(FechaSup),
                                                Hora: Blank(),
                                                turnoFinal: Blank(),
                                                turnoSeleccionado: Blank(),
                                                HoraValor: Blank(),
                                                OrdenInfo: Blank(),
                                                Disable: false,
                                                CantidadPorHoraGuardar: Blank()
                                            }
                                        );
                                        Notify(
                                            "Se ha Guardado exitosamente",
                                            NotificationType.Success
                                        )
                                    )
                                )
                              PressedBorderColor: =Self.Fill
                              PressedColor: =Self.Fill
                              PressedFill: =Self.Color
                              Text: ="Guardar"
