                          "<h3 style='margin: 0;'>FO-CH-01</h3>",
                      "</div>",
                  "</td>",
              "</tr>",
                  "</table>",
                  "<h1>TRAMITE PARA PERMISOS, VACACIONES E INCAPACIDADES</h1>",
                  "<table>",
                  "<tr>",
                  "<td>Fecha: ",
                  txt_Fecha_PI.Text,
