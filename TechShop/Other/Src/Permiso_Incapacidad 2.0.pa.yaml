                  txt_Codigo_PI.Text,
                  "</td>",
                  "</tr>",
                  "<tr>",
                  "<td colspan='2'>Estado: Aprobado",
                  "</td>",
                  "</tr>",
                  "</table>",
                  "<h1>Detalles de Solicitud</h1>",
