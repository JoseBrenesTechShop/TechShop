            - btn_OrdenesAfectadas_OMP:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =RGBA(72, 163, 62, 1)
                  Font: =Font.'Open Sans'
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =RGBA(21, 68, 18, 1)
                  OnSelect: |-
                    =If(
                        !IsEmpty(MaquinaRemplazo),
                        ForAll(
                            OrdenRemplazo,
                            With(
                                {
                                    // Obtiene la primera prioridad disponible que no esté en uso y no sea 1
                                    NewPri: If(
                                        IsEmpty(
                                            Filter(
                                                Prioridades,
                                                !(Value in Filter(
                                                    Orden_MaquinasLists_1,
                                                    Maquina in Filter(
                                                        Orden_MaquinasLists_1,
                                                        Orden = ThisRecord.Orden,
                                                        Operacion = ThisRecord.Operacion
                                                    ).Maquina && Prioridad <> OrdenSelected.Prioridad
                                                ).Prioridad) && Value <> 1
                                            )
                                        ),
                                        Max(
                                            Filter(
                                                Orden_MaquinasLists_1,
                                                Maquina in Filter(
                                                    Orden_MaquinasLists_1,
                                                    Orden = ThisRecord.Orden,
                                                    Operacion = ThisRecord.Operacion
                                                ).Maquina
                                            ),
                                            Prioridad
                                        ) + 1,
                                        First(
                                            Filter(
                                                Prioridades,
                                                !(Value in Filter(
                                                    Orden_MaquinasLists_1,
                                                    Maquina in Filter(
                                                        Orden_MaquinasLists_1,
                                                        Orden = ThisRecord.Orden,
                                                        Operacion = ThisRecord.Operacion
                                                    ).Maquina && Prioridad <> OrdenSelected.Prioridad
                                                ).Prioridad) && Value <> 1
                                            )
                                        ).Value
                                    ),
                                    ORD: ThisRecord.Orden,
                                    OP: ThisRecord.Operacion
                                },
                                Collect(
                                    infoOrdenAntigua,
                                    LookUp(
                                        Orden_Maquinas_1,
                                        Orden = ORD && Operacion = OP
                                    )
                                );
                                Patch(
                                    Orden_Maquinas_1,
                                    LookUp(
                                        Orden_Maquinas_1,
                                        Orden = ORD && Operacion = OP
                                    ),
                                    {
                                        Prioridad: NewPri
                                    }
                                );
                                With(
                                    {
                                        Maquinas: Filter(
                                            Orden_MaquinasLists_1,
                                            Orden = ORD,
                                            Operacion = OP
                                        )
                                    },
                                    ForAll(
                                        Maquinas,
                                        With(
                                            {
                                                m: ThisRecord.Maquina,
                                                Maquina: ThisRecord,
                                                ORDM: ThisRecord.Orden,
                                                OPM: ThisRecord.Operacion
                                            },
                                            Collect(
                                                InfoMaquinasAntigua,
                                                LookUp(
                                                    Orden_MaquinasLists_1,
                                                    Orden = ORDM && Operacion = OPM && Maquina = m
                                                )
                                            );
                                            Patch(
                                                Orden_MaquinasLists_1,
                                                LookUp(
                                                    Orden_MaquinasLists_1,
                                                    Orden = ORDM && Operacion = OPM && Maquina = m
                                                ),
                                                {
                                                    Prioridad: NewPri
                                                }
                                            )
                                        )
                                    )
                                )
                            )
                        )
                    );
                    ForAll(
                        infoOrdenAntigua,
                        With(
                            {
                                maximas: LookUp(
                                    Orden_Ejecucion,
                                    Orden = ThisRecord.Orden && Operacion = ThisRecord.Operacion
                                ).Cantidad,
                                producidas: LookUp(
                                    Orden_Ejecucion,
                                    Orden = ThisRecord.Orden && Operacion = ThisRecord.Operacion
                                ).CantidadTotalProducida,
                                dañadas: Sum(
                                    Filter(
                                        Scrap_1,
                                        Orden = ThisRecord.Orden
                                    ),
                                    Cantidad
                                ),
                                O: ThisRecord,
                                Z: ThisRecord.Zona,
                                J: ThisRecord.Jornada,
                                ORD: ThisRecord.Orden,
                                OP: ThisRecord.Operacion
                            },
                            Collect(
                                Registro_Orden_Maquinas,
                                {
                                    Creacion_Fecha: O.'Fecha de creación',
                                    Orden: O.Orden,
                                    Operacion: O.Operacion,
                                    'P/N': O.'P/N',
                                    Prioridad: O.Prioridad,
                                    Meta: O.Meta,
                                    Fecha_inicio: O.Fecha_Inicio,
                                    Fecha_Fin: If(Today() <= O.Fecha_Inicio, O.Fecha_Fin, DateValue(Text(Today() + O.Dias, "dd/mm/yyyy"))),
                                    Fecha_Fin_Aprox: O.Fecha_Fin_Aprox,
                                    Jornada: LookUp(
                                        JornadaPlannings,
                                        Valor = J
                                    ).Texto,
                                    Zona: O.Zona,
                                    Horas: O.Horas,
                                    HorasRestantes: If(
                                        Value(O.Meta) > 0,
                                        RoundUp(
                                            ((maximas - (producidas - dañadas)) / (O.Meta * LookUp(
