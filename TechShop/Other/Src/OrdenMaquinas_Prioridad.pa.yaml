                  OnSelect: "=Select(btn_OrdenesAfectadas_OMP);\n//Crea la orden en caso de no existir. Si ya exite la edita\nWith(\n    {\n        Sitem: glr_Ordenes_OMP.Selected,\n        SORD: glr_Ordenes_OMP.Selected.Orden,\n        SOP: glr_Ordenes_OMP.Selected.Operacion\n    },\n    //Almacena el registro anterior de una orden antes de editarlo\n    UpdateContext(\n        {\n            RegistroOrden: LookUp(\n                Orden_Maquinas_1,\n                Orden = SORD && Operacion = SOP\n            )\n        }\n    );\n    Patch(//Edita el registro de una orden\n        Orden_Maquinas_1,\n        LookUp(\n            Orden_Maquinas_1,\n            Orden = SORD && Operacion = SOP\n        ),\n        {\n            Orden: SORD,\n            Operacion: SOP,\n            'P/N': Sitem.'P/N',\n            Meta: Sitem.Meta,\n            User: txt_User_OM_2.Text,\n            Prioridad: NewPri,\n            Fecha_Inicio: dp_Fecha_OMP.SelectedDate,\n            Fecha_Fin: If(Today() <= dp_Fecha_OMP.SelectedDate, DateValue(Text(txt_FechaFin_OMP.Text, \"dd/mm/yyyy\")), DateValue(Text(Today() + Sitem.Dias, \"dd/mm/yyyy\"))),\n            Jornada: Sitem.Jornada,\n            Horas: Sitem.Horas,\n            Dias: Sitem.Dias,\n            Zona: Sitem.Zona\n        }\n    );\n    //Guarda, edita o elimina las maquinas de la orden\nForAll(\n        MaquinasOrigin,\n        With(\n            {m: ThisRecord.Maquina},\n            //Almacena el registro anterior de la maquina antes de editarlo\n            Collect(\n                InfoMaquinasViejas,\n                LookUp(\n                    Orden_MaquinasLists_1,\n                    Orden = SORD && Operacion = SOP && Maquina = m\n                )\n            );\n            Patch(//Edita el registro de la maquina\n                Orden_MaquinasLists_1,\n                LookUp(\n                    Orden_MaquinasLists_1,\n                    Orden = SORD && Operacion = SOP && Maquina = m\n                ),\n                {\n                    Fecha: Now(),\n                    Maquina: m,\n                    Orden: SORD,\n                    Operacion: SOP,\n                    Prioridad: NewPri,\n                    Horas: Sitem.Horas / CountIf(\n                        MaquinasOrigin,\n                        true\n                    ),\n                    Meta: If(\n                        m in [\n                            \"MORI1\",\n                            \"MORI2\",\n                            \"MORI12\",\n                            \"MORI13\",\n                            \"MORI14\",\n                            \"MORI15\"\n                        ],\n                        Sitem.Meta + (Sitem.Meta * 0.1),\n                        Sitem.Meta\n                    )\n                }\n            )\n        )\n    );\n    \n);\nSelect(btn_Registro_EM_1);\nClear(MaquinasList);\nRefresh(Maquinas);\nUpdateContext({Guardar: false});\nReset(dp_Fecha_OMP);\nReset(txt_FechaFin_OMP);\nSelect(btn_Prioridades_OMP)"
