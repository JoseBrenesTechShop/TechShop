            - Button3_21:
                Control: Classic/Button@2.2.0
                Properties:
                  Color: =RGBA(255, 255, 255, 1)
                  DisplayMode: =
                  Fill: =RGBA(40, 134, 222, 1)
                  Height: =38
                  HoverBorderColor: =RGBA(180, 214, 250, 1)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  OnSelect: |-
                    =If(
                        IsBlank(txtOrdenM.Text) || IsBlank(txtPNM.Text) || IsBlank(txtOperacionM.Text) || IsBlank(txtDescripcionM.Text) || IsBlank(txtCantidadM.Text) || IsBlank(txtTarimaM.Text) || IsBlank(txtMetaM.Text) || IsBlank(txtTiempoMM.Text) || IsBlank(drp_estado_OE_1.SelectedText.Tipo_Ejecucion),
                        UpdateContext(
                            {
                                MostrarAviso: true,
                                mensajeNotificacion: "Debe completar todos los campos del formulario"
                            }
                        ),
                        If(
                            gl_EjecucionOrdenes.Selected.Estado_Orden = "Ejecucion" && drp_estado_OE.SelectedText.Value = "Finalizado",
                            With(
                                {
                                    ItemEliminar: LookUp(
                                        Orden_Maquinas,
                                        Orden = gl_EjecucionOrdenes.Selected.Orden && Operacion = gl_EjecucionOrdenes.Selected.Operacion
                                    )
                                },
                                Patch(
                                    Orden_Ejecucion,
                                    LookUp(
                                        Orden_Ejecucion,
                                        Orden = ItemEliminar.Orden && Operacion = ItemEliminar.Operacion
                                    ),
                                    {Estado_Orden: "Finalizado"}
                                );
                                Remove(
                                    Orden_Maquinas,
                                    ItemEliminar
                                );
                                With(
                                    {
                                        MaquinasEliminar: Filter(
                                            Orden_MaquinasLists,
                                            Orden = ItemEliminar.Orden,
                                            Operacion = ItemEliminar.Operacion
                                        )
                                    },
                                    ForAll(
                                        MaquinasEliminar,
                                        Collect(
                                            InfoMaquinasEliminar,
                                            ThisRecord
                                        );
                                        Remove(
                                            Orden_MaquinasLists,
                                            ThisRecord
                                        )
                                    )
                                );
                                With(
                                    {
                                        maximas: LookUp(
                                            Orden_Ejecucion,
                                            Orden = ItemEliminar.Orden && Operacion = ItemEliminar.Operacion
                                        ).Cantidad,
                                        producidas: LookUp(
                                            Orden_Ejecucion,
                                            Orden = ItemEliminar.Orden && Operacion = ItemEliminar.Operacion
                                        ).CantidadTotalProducida,
                                        dañadas: Sum(
                                            Filter(
                                                Scrap_1,
                                                Orden = ItemEliminar.Orden
                                            ),
                                            Cantidad
                                        )
                                    },
                                    Collect(
                                        Registro_Orden_Maquinas,
                                        {
                                            Creacion_Fecha: ItemEliminar.'Fecha de creación',
                                            Orden: ItemEliminar.Orden,
                                            Operacion: ItemEliminar.Operacion,
                                            'P/N': ItemEliminar.'P/N',
                                            Prioridad: ItemEliminar.Prioridad,
                                            Meta: ItemEliminar.Meta,
                                            Fecha_inicio: ItemEliminar.Fecha_Inicio,
                                            Fecha_Fin: If(
                                                Today() <= ItemEliminar.Fecha_Inicio,
                                                ItemEliminar.Fecha_Fin,
                                                DateValue(
                                                    Text(
                                                        Today() + ItemEliminar.Dias,
                                                        "dd/mm/yyyy"
                                                    )
                                                )
                                            ),
                                            Fecha_Inicio_Aprox: ItemEliminar.Fecha_Inicio_Aprox,
                                            Fecha_Fin_Aprox: ItemEliminar.Fecha_Fin_Aprox,
                                            Jornada: LookUp(
                                                JornadaPlannings,
                                                Valor = ItemEliminar.Jornada
                                            ).Texto,
                                            Zona: ItemEliminar.Zona,
                                            Horas: ItemEliminar.Horas,
                                            HorasRestantes: If(
                                                Value(ItemEliminar.Meta) > 0,
                                                RoundUp(
                                                    ((maximas - (producidas - dañadas)) / (ItemEliminar.Meta * LookUp(
                                                        ZonaPlannings,
                                                        Texto = ItemEliminar.Zona,
                                                        Valor
                                                    )) + LookUp(
                                                        Orden_Ejecucion,
                                                        Orden = ItemEliminar.Orden && Operacion = ItemEliminar.Operacion
                                                    ).TiempoSetup) / Max(
                                                        1,
                                                        CountRows(
                                                            Filter(
                                                                Orden_MaquinasLists,
                                                                Orden = ItemEliminar.Orden,
                                                                Operacion = ItemEliminar.Operacion
                                                            )
                                                        )
                                                    ),
                                                    0
                                                ),
                                                0
                                            ),
                                            Dias: ItemEliminar.Dias,
                                            CantMaquinas: CountIf(
                                                Filter(
                                                    Orden_MaquinasLists,
                                                    Orden = ItemEliminar.Orden,
                                                    Operacion = ItemEliminar.Operacion
                                                ),
                                                true
                                            ),
                                            CantMax: maximas,
                                            CantPro: producidas,
                                            CantDañada: dañadas,
                                            User: ItemEliminar.User
                                        }
                                    )
                                );
                                ForAll(
                                    InfoMaquinasEliminar,
                                    With(
                                        {
                                            Maquina: ThisRecord,
                                            m: ThisRecord.Maquina,
                                            ORD: ThisRecord.Orden,
                                            OP: ThisRecord.Operacion,
                                            HorasPro: CountIf(
                                                Distinct(
                                                    Filter(
                                                        'Hora X Hora',
                                                        Orden = ThisRecord.Orden,
                                                        Operacion = ThisRecord.Operacion,
                                                        Maquina = ThisRecord.Maquina
                                                    ),
                                                    'Fecha_Registro_Supervisor '
                                                ),
                                                true
                                            )
                                        },
                                        Collect(
                                            Registro_Orden_MaquinasLists,
                                            {
                                                Creacion_Fecha: Maquina.Fecha,
                                                Maquina: Maquina.Maquina,
                                                Orden: ORD,
                                                Operacion: OP,
                                                'P/N': ItemEliminar.'P/N',
                                                Prioridad: Maquina.Prioridad,
                                                Meta: Maquina.Meta,
                                                Horas: Maquina.Horas,
                                                HorasProducidas: CountIf(
                                                    Distinct(
                                                        Filter(
                                                            'Hora X Hora',
                                                            Orden = ORD,
                                                            Operacion = OP,
                                                            Maquina = m
                                                        ),
                                                        'Fecha_Registro_Supervisor '
                                                    ),
                                                    true
                                                ),
                                                HorasRes: Maquina.Horas - CountIf(
                                                    Distinct(
                                                        Filter(
                                                            'Hora X Hora',
                                                            Orden = ORD,
                                                            Operacion = OP,
                                                            Maquina = m
                                                        ),
                                                        'Fecha_Registro_Supervisor '
                                                    ),
                                                    true
                                                ),
                                                CantPro: Sum(
                                                    Filter(
                                                        'Hora X Hora',
                                                        Orden = ORD,
                                                        Operacion = OP,
                                                        Maquina = m
                                                    ),
                                                    Cantidad
                                                ),
                                                CantDañada: Sum(
                                                    Filter(
                                                        Scrap_1,
                                                        Orden = ORD,
                                                        Maquina = m
                                                    ),
                                                    Cantidad
                                                )
                                            }
                                        )
                                    )
                                );
                            );
                            SubmitForm(frm_Editar_EditarOrden_1),
                            SubmitForm(frm_Editar_EditarOrden_1)
                        )
                    );
                    ResetForm(frm_Editar_EditarOrden_1);
                    Reset(drp_estado_EO)
