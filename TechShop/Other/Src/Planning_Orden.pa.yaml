            - Container44:
                Control: GroupContainer@1.3.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(52, 152, 47, 1)
                  BorderThickness: =3
                  DropShadow: =DropShadow.ExtraBold
                  Fill: =RGBA(255, 255, 255, 1)
                  RadiusBottomLeft: =15
                  RadiusBottomRight: =15
                  RadiusTopLeft: =15
                  RadiusTopRight: =15
                  Visible: =FinOperacion
                  Width: =550
                  X: =15
                  Y: =10
                Children:
                  - btn_FinOp_PO:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =ColorFade(Self.Fill, -15%)
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        Fill: =RGBA(52, 152, 47, 1)
                        Font: =Font.'Open Sans'
                        Height: =50
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =RGBA(21, 68, 18, 1)
                        OnSelect: |-
                          =Patch(
                              Orden_Ejecucion,
                              LookUp(
                                  Orden_Ejecucion,
                                  Orden = ItemEliminar.Orden && Operacion = ItemEliminar.Operacion
                              ),
                              {Estado_Orden: "Finalizado"}
                          );
                          Remove(
                              Orden_Maquinas_1,
                              ItemEliminar
                          );
                          With(
                              {
                                  MaquinasEliminar: Filter(
                                      Orden_MaquinasLists_1,
                                      Orden = ItemEliminar.Orden,
                                      Operacion = ItemEliminar.Operacion
                                  )
                              },
                              ForAll(
                                  MaquinasEliminar,
                                  Collect(
                                      InfoMaquinasEliminar,
                                      ThisRecord
                                  );
                                  Remove(
                                      Orden_MaquinasLists_1,
                                      ThisRecord
                                  )
                              )
                          );
                          With(
                              {
                                  maximas: LookUp(
                                      Orden_Ejecucion,
                                      Orden = ItemEliminar.Orden && Operacion = ItemEliminar.Operacion
                                  ).Cantidad,
                                  producidas: LookUp(
                                      Orden_Ejecucion,
                                      Orden = ItemEliminar.Orden && Operacion = ItemEliminar.Operacion
                                  ).CantidadTotalProducida,
                                  dañadas: Sum(
                                      Filter(
                                          Scrap_1,
                                          Orden = ItemEliminar.Orden
                                      ),
                                      Cantidad
                                  )
                              },
                              Collect(
                                  Registro_Orden_Maquinas,
                                  {
                                      Creacion_Fecha: ItemEliminar.'Fecha de creación',
                                      Orden: ItemEliminar.Orden,
                                      Operacion: ItemEliminar.Operacion,
                                      'P/N': ItemEliminar.'P/N',
                                      Prioridad: ItemEliminar.Prioridad,
                                      Meta: ItemEliminar.Meta,
                                      Fecha_inicio: ItemEliminar.Fecha_Inicio,
                                      Fecha_Fin: If(Today() <= ItemEliminar.Fecha_Inicio, ItemEliminar.Fecha_Fin, DateValue(Text(Today() + ItemEliminar.Dias, "dd/mm/yyyy"))),
                                      Fecha_Inicio_Aprox: ItemEliminar.Fecha_Inicio_Aprox,
                                      Fecha_Fin_Aprox: ItemEliminar.Fecha_Fin_Aprox,
                                      Jornada: LookUp(
                                          JornadaPlannings,
                                          Valor = ItemEliminar.Jornada
                                      ).Texto,
                                      Zona: ItemEliminar.Zona,
                                      Horas: ItemEliminar.Horas,
                                      HorasRestantes: If(
                                          Value(ItemEliminar.Meta) > 0,
                                          RoundUp(
                                              ((maximas - (producidas - dañadas)) / (ItemEliminar.Meta * LookUp(
                                                  ZonaPlannings,
                                                  Texto = ItemEliminar.Zona,
                                                  Valor
                                              )) + LookUp(
                                                  Orden_Ejecucion,
                                                  Orden = ItemEliminar.Orden && Operacion = ItemEliminar.Operacion
                                              ).TiempoSetup) / Max(
                                                  1,
                                                  CountRows(
                                                      Filter(
                                                          Orden_MaquinasLists_1,
                                                          Orden = ItemEliminar.Orden,
                                                          Operacion = ItemEliminar.Operacion
                                                      )
                                                  )
                                              ),
                                              0
                                          ),
                                          0
                                      ),
                                      Dias: ItemEliminar.Dias,
                                      CantMaquinas: CountIf(
                                          Filter(
                                              Orden_MaquinasLists_1,
                                              Orden = ItemEliminar.Orden,
                                              Operacion = ItemEliminar.Operacion
                                          ),
                                          true
                                      ),
                                      CantMax: maximas,
                                      CantPro: producidas,
                                      CantDañada: dañadas,
                                      User: ItemEliminar.User
                                  }
                              )
                          );
                          ForAll(
                              InfoMaquinasEliminar,
                              With(
                                  {
                                      Maquina: ThisRecord,
                                      m: ThisRecord.Maquina,
                                      ORD: ThisRecord.Orden,
                                      OP: ThisRecord.Operacion,
                                      HorasPro: CountIf(
                                          Distinct(
                                              Filter(
                                                  'Hora X Hora',
                                                  Orden = ThisRecord.Orden,
                                                  Operacion = ThisRecord.Operacion,
                                                  Maquina = ThisRecord.Maquina
                                              ),
                                              'Fecha_Registro_Supervisor '
                                          ),
                                          true
                                      )
                                  },
                                  Collect(
                                      Registro_Orden_MaquinasLists,
                                      {
                                          Creacion_Fecha: Maquina.Fecha,
                                          Maquina: Maquina.Maquina,
                                          Orden: ORD,
                                          Operacion: OP,
                                          'P/N': ItemEliminar.'P/N',
                                          Prioridad: Maquina.Prioridad,
                                          Meta: Maquina.Meta,
                                          Horas: Maquina.Horas,
                                          HorasProducidas: CountIf(
                                              Distinct(
                                                  Filter(
                                                      'Hora X Hora',
                                                      Orden = ORD,
                                                      Operacion = OP,
                                                      Maquina = m
                                                  ),
                                                  'Fecha_Registro_Supervisor '
                                              ),
                                              true
                                          ),
                                          HorasRes: Maquina.Horas - CountIf(
                                              Distinct(
                                                  Filter(
                                                      'Hora X Hora',
                                                      Orden = ORD,
                                                      Operacion = OP,
                                                      Maquina = m
                                                  ),
                                                  'Fecha_Registro_Supervisor '
                                              ),
                                              true
                                          ),
                                          CantPro: Sum(
                                              Filter(
                                                  'Hora X Hora',
                                                  Orden = ORD,
                                                  Operacion = OP,
                                                  Maquina = m
                                              ),
                                              Cantidad
                                          ),
                                          CantDañada: Sum(
                                              Filter(
                                                  Scrap_1,
                                                  Orden = ORD,
                                                  Maquina = m
                                              ),
                                              Cantidad
                                          )
                                      }
                                  )
                              )
                          );
                          UpdateContext(
                              {
                                  ItemEliminar: Blank(),
                                  MaquinasOrigin: Blank()
                              }
                          );
                          Clear(InfoMaquinasEliminar);
                          UpdateContext(
                              {
                                  Eliminar: false,
                                  ItemEliminar: Blank(),
                                  FinOperacion: false
                              }
                          );
                          Select(btn_Prioridades_PO)
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =Self.Color
                        Text: ="Finalizar Operacion"
                        Width: =200
                        X: =290
                        Y: =135
                  - btn_CancelarOP_PO:
                      Control: Classic/Button@2.2.0
