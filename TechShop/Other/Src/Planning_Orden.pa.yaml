            - Container44_1:
                Control: GroupContainer@1.3.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(255, 191, 0, 1)
                  BorderThickness: =3
                  DropShadow: =DropShadow.ExtraBold
                  Fill: =RGBA(255, 255, 255, 1)
                  RadiusBottomLeft: =15
                  RadiusBottomRight: =15
                  RadiusTopLeft: =15
                  RadiusTopRight: =15
                  Visible: =FinOrden
                  Width: =550
                  X: =15
                  Y: =10
                Children:
                  - btn_CancelarOrden_PO:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =ColorFade(Self.Fill, -15%)
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        Fill: =RGBA(215, 58, 60, 1)
                        Font: =Font.'Open Sans'
                        Height: =50
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =RGBA(132, 40, 38, 1)
                        OnSelect: |-
                          =UpdateContext({FinOrden: false});
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =Self.Color
                        Text: ="Cancelar"
                        Width: =200
                        X: =60
                        Y: =135
                  - TextInput10_1:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        Align: =Align.Center
                        Default: |-
                          ="¿Esta seguro/a de finalizar todas las Operaciones de la Orden: " & ItemEliminar.Orden & "?"
                        DisplayMode: =DisplayMode.View
                        FontWeight: =FontWeight.Semibold
                        Height: =87
                        Mode: =TextMode.MultiLine
                        Size: =18
                        Width: =500
                        X: =25
                        Y: =25
                  - btn_FinOrden_PO:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =ColorFade(Self.Fill, -15%)
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        Fill: =RGBA(255, 191, 0, 1)
                        Font: =Font.'Open Sans'
                        Height: =50
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =RGBA(171, 129, 5, 1)
                        OnSelect: |-
                          =With(
                              {
                                  Operaciones: Filter(
                                      Orden_Ejecucion,
                                      Orden = ItemEliminar.Orden
                                  ).Operacion
                              },
                              ForAll(
                                  Operaciones,
                                  With(
                                      {
                                          ORD: ItemEliminar.Orden,
                                          OP: ThisRecord.Operacion
                                      },
                                      Patch(
                                          Orden_Ejecucion,
                                          LookUp(
                                              Orden_Ejecucion,
                                              Orden = ORD && Operacion = OP
                                          ),
                                          {Estado_Orden: "Finalizado"}
                                      );
                                      If(
                                          !IsBlank(
                                              LookUp(
                                                  Orden_Maquinas_1,
                                                  Orden = ORD && Operacion = OP
                                              )
                                          ),
                                          Collect(
                                              infoOrdenEliminar,
                                              LookUp(
                                                  Orden_Maquinas_1,
                                                  Orden = ORD && Operacion = OP
                                              )
                                          );
                                          Remove(
                                              Orden_Maquinas_1,
                                              LookUp(
                                                  Orden_Maquinas_1,
                                                  Orden = ORD && Operacion = OP
                                              )
                                          )
                                      );
                                      With(
                                          {
                                              MaquinasEliminar: Filter(
                                                  Orden_MaquinasLists_1,
                                                  Orden = ORD,
                                                  Operacion = OP
                                              )
                                          },
                                          ForAll(
                                              MaquinasEliminar,
                                              Collect(
                                                  InfoMaquinasEliminar,
                                                  ThisRecord
                                              );
                                              Remove(
                                                  Orden_MaquinasLists_1,
                                                  ThisRecord
                                              )
                                          )
                                      )
                                  )
                              )
                          );
                          ForAll(
                              infoOrdenEliminar,
                              With(
                                  {
                                      maximas: LookUp(
                                          Orden_Ejecucion,
                                          Orden = ThisRecord.Orden && Operacion = ThisRecord.Operacion
                                      ).Cantidad,
                                      producidas: LookUp(
                                          Orden_Ejecucion,
                                          Orden = ThisRecord.Orden && Operacion = ThisRecord.Operacion
                                      ).CantidadTotalProducida,
                                      dañadas: Sum(
                                          Filter(
                                              Scrap_1,
                                              Orden = ThisRecord.Orden
                                          ),
                                          Cantidad
                                      ),
                                      O: ThisRecord,
                                      Z: ThisRecord.Zona,
                                      J: ThisRecord.Jornada,
                                      ORD: ThisRecord.Orden,
                                      OP: ThisRecord.Operacion
                                  },
                                  Collect(
                                      Registro_Orden_Maquinas,
                                      {
                                          Creacion_Fecha: O.'Fecha de creación',
                                          Orden: O.Orden,
                                          Operacion: O.Operacion,
                                          'P/N': O.'P/N',
                                          Prioridad: O.Prioridad,
                                          Meta: O.Meta,
                                          Fecha_inicio: O.Fecha_Inicio,
                                          Fecha_Fin: If(
                                              Today() <= O.Fecha_Inicio,
                                              O.Fecha_Fin,
                                              DateValue(
                                                  Text(
                                                      Today() + O.Dias,
                                                      "dd/mm/yyyy"
                                                  )
                                              )
                                          ),
                                          Fecha_Inicio_Aprox: O.Fecha_Inicio_Aprox,
                                          Fecha_Fin_Aprox: O.Fecha_Fin_Aprox,
                                          Jornada: LookUp(
                                              JornadaPlannings,
                                              Valor = J
                                          ).Texto,
                                          Zona: O.Zona,
                                          Horas: O.Horas,
                                          HorasRestantes: If(
                                              Value(O.Meta) > 0,
                                              RoundUp(
                                                  ((maximas - (producidas - dañadas)) / (O.Meta * LookUp(
                                                      ZonaPlannings,
                                                      Texto = Z,
                                                      Valor
                                                  )) + LookUp(
                                                      Orden_Ejecucion,
                                                      Orden = ORD && Operacion = OP
                                                  ).TiempoSetup) / Max(
                                                      1,
                                                      CountRows(
                                                          Filter(
                                                              Orden_MaquinasLists_1,
                                                              Orden = ORD,
                                                              Operacion = OP
                                                          )
                                                      )
                                                  ),
                                                  0
                                              ),
                                              0
                                          ),
                                          Dias: O.Dias,
                                          CantMaquinas: CountIf(
                                              Filter(
                                                  Orden_MaquinasLists_1,
                                                  Orden = ORD,
                                                  Operacion = OP
                                              ),
                                              true
                                          ),
                                          CantMax: maximas,
                                          CantPro: producidas,
                                          CantDañada: dañadas,
                                          User: O.User
                                      }
                                  )
                              )
                          );
                          ForAll(
                              InfoMaquinasEliminar,
                              With(
                                  {
                                      Maquina: ThisRecord,
                                      m: ThisRecord.Maquina,
                                      ORD: ThisRecord.Orden,
                                      OP: ThisRecord.Operacion
                                  },
                                  Collect(
                                      Registro_Orden_MaquinasLists,
                                      {
                                          Creacion_Fecha: Maquina.Fecha,
                                          Maquina: Maquina.Maquina,
                                          Orden: ORD,
                                          Operacion: OP,
                                          'P/N': LookUp(
                                              infoOrdenAntigua,
                                              Orden = ORD && Operacion = OP
                                          ).'P/N',
                                          Prioridad: Maquina.Prioridad,
                                          Meta: Maquina.Meta,
                                          Horas: Maquina.Horas,
                                          HorasProducidas: CountIf(
                                              Distinct(
                                                  Filter(
                                                      'Hora X Hora',
                                                      Orden = ORD,
                                                      Operacion = OP,
                                                      Maquina = m
                                                  ),
                                                  'Fecha_Registro_Supervisor '
                                              ),
                                              true
                                          ),
                                          HorasRes: Maquina.Horas - CountIf(
                                              Distinct(
                                                  Filter(
                                                      'Hora X Hora',
                                                      Orden = ORD,
                                                      Operacion = OP,
                                                      Maquina = m
                                                  ),
                                                  'Fecha_Registro_Supervisor '
                                              ),
                                              true
                                          ),
                                          CantPro: Sum(
                                              Filter(
                                                  'Hora X Hora',
                                                  Orden = ORD,
                                                  Operacion = OP,
                                                  Maquina = m
                                              ),
                                              Cantidad
                                          ),
                                          CantDañada: Sum(
                                              Filter(
                                                  Scrap_1,
                                                  Orden = ORD,
                                                  Maquina = m
                                              ),
                                              Cantidad
                                          )
                                      }
                                  )
                              )
                          );
                          Clear(InfoMaquinasEliminar);
                          Clear(infoOrdenEliminar);
                          UpdateContext(
                              {
                                  Eliminar: false,
                                  ItemEliminar: Blank(),
                                  FinOrden: false
                              }
                          );
                          Select(btn_Prioridades_PO)
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =Self.Color
                        Text: ="Finalizar Orden"
                        Width: =200
                        X: =290
                        Y: =135
