                        - Button14_3:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(52, 152, 47, 1)
                              Fill: =RGBA(52, 152, 47, 1)
                              Height: =150
                              HoverBorderColor: =RGBA(52, 152, 47, 1)
                              HoverFill: =RGBA(45, 128, 40, 1)
                              OnSelect: |
                                =If(
                                    IsBlank(drp_Orden_SP_1.Selected) || IsBlank(drp_Maquina_SP_1.Selected) || IsBlank(txt_Zona_SP_1.Text) || IsBlank(drp_Operario_SP_1.Selected) || IsBlank(drp_Turno_SP_1.Selected) || IsBlank(txt_Bache_SP_1.Text) || IsBlank(txt_Cant_SP_1.Text) || IsBlank(txt_Tarima_SP_1.Text) || IsBlank(drp_Insepccion_SP_1.Selected) || IsBlank(drp_Incoformidad_SP_1.Selected) || IsBlank(txt_Item_SP_1.Text),
                                    UpdateContext(
                                        {
                                            TextoAviso: "Todos los campos deben estar completos antes de guardar el registro",
                                            aviso: true
                                        }
                                    ),
                                    Value(txt_Bache_SP_1.Text) <= 0 || Value(txt_Bache_SP_1.Text) > 50,
                                    UpdateContext(
                                        {
                                            TextoAviso: "El bache debe ser mayor a 0 y menor o igual a 50",
                                            aviso: true
                                        }
                                    ),
                                    Value(txt_Cant_SP_1.Text) <= 0 || Value(txt_Cant_SP_1.Text) > Value(txt_Bache_SP_1.Text),
                                    UpdateContext(
                                        {
                                            TextoAviso: "La cantidad de scrap no puede ser menor que 0 ni mayor que el bache",
                                            aviso: true
                                        }
                                    ),
                                    /*(LookUp(
                                        Scrap_Tarimas;
                                        Tarima = Upper(txt_Tarima_SP_1.Text) && Orden = drp_Orden_SP_1.Selected.Value
                                    ).Cantidad + txt_Cant_SP_1.Text) > 50;
                                    UpdateContext(
                                        {
                                            TextoAviso: "La cantidad maxima por tarima es de 50 unidades";
                                            aviso: true
                                        }
                                    );*/
                                    ClearCollect(//InspecionCalidadContenedor Asigna las cantidades buenas a los P/N correspondientes segun el contenedor seleccionado.
                                        colContenedor,
                                        Filter(
                                            Sort(
                                                InspeccionCalidadContenedors,
                                                Prioridad,
                                                SortOrder.Ascending
                                            ),
                                            Nomenclatura = txt_Nomenclatura_SP.Text && 'P/N' = txt_PN_SP_1.Text && Value(Revisado) < Value(Cantidad)
                                        )
                                    );
                                    UpdateContext({restante: Value(txt_Bache_SP_1.Text) - Value(txt_Cant_SP_1.Text)});
                                    With(
                                        {dato1: First(colContenedor)},
                                        If(
                                            restante + dato1.Revisado <= dato1.Cantidad,
                                            Patch(
                                                InspeccionCalidadContenedors,
                                                dato1,
                                                {Revisado: dato1.Revisado + restante}
                                            ),
                                            Patch(
                                                InspeccionCalidadContenedors,
                                                dato1,
                                                {Revisado: dato1.Revisado + (dato1.Cantidad - dato1.Revisado)}
                                            );
                                            UpdateContext({restante: restante - (dato1.Cantidad - dato1.Revisado)});
                                            Remove(
                                                colContenedor,
                                                dato1
                                            );
                                            If(
                                                IsEmpty(colContenedor),
                                                Patch(
                                                    InspeccionCalidadContenedors,
                                                    dato1,
                                                    {Revisado: dato1.Revisado + restante}
                                                ),
                                                With(
                                                    {dato2: First(colContenedor)},
                                                    If(
                                                        restante + dato2.Revisado <= dato2.Cantidad,
                                                        Patch(
                                                            InspeccionCalidadContenedors,
                                                            dato2,
                                                            {Revisado: dato2.Revisado + restante}
                                                        ),
                                                        Patch(
                                                            InspeccionCalidadContenedors,
                                                            dato2,
                                                            {Revisado: dato2.Revisado + (dato2.Cantidad - dato2.Revisado)}
                                                        );
                                                        UpdateContext({restante: restante - (dato2.Cantidad - dato2.Revisado)});
                                                        Remove(
                                                            colContenedor,
                                                            dato2
                                                        );
                                                        If(
                                                            IsEmpty(colContenedor),
                                                            Patch(
                                                                InspeccionCalidadContenedors,
                                                                dato2,
                                                                {Revisado: dato2.Revisado + restante}
                                                            ),
                                                            With(
                                                                {dato3: First(colContenedor)},
                                                                Patch(
                                                                    InspeccionCalidadContenedors,
                                                                    dato3,
                                                                    {Revisado: dato3.Revisado + restante}
                                                                )
                                                            )
                                                        )
                                                    )
                                                )
                                            )
                                        )
                                    );
                                    With(
                                        {
                                            TarimaScrap: LookUp(
                                                Scrap_Tarimas,
                                                Tarima = First(Split(txt_ContenedorTarima_SP_1.Text, " - ")).Value && 'P/N' = txt_PN_SP_1.Text && Contenedor = Nomenclatura
                                            ),
                                            tarimaText: First(Split(txt_ContenedorTarima_SP_1.Text, " - ")).Value
                                        },
                                        If(
                                            IsBlank(TarimaScrap),
                                            Collect(
                                                Scrap_Tarimas,
                                                {
                                                    'P/N': txt_PN_SP_1.Text,
                                                    Contenedor: Nomenclatura,
                                                    Tarima: tarimaText,
                                                    Cantidad: Value(txt_Bache_SP_1.Text - txt_Cant_SP_1.Text)
                                                }
                                            ); UpdateContext({UsedTarimas: tarimaText}),
                                            TarimaScrap.Cantidad + Value(txt_Bache_SP_1.Text - txt_Cant_SP_1.Text) <= 50,
                                            Patch(
                                                Scrap_Tarimas,
                                                TarimaScrap,
                                                {Cantidad: TarimaScrap.Cantidad + Value(txt_Bache_SP_1.Text - txt_Cant_SP_1.Text)}
                                            ); UpdateContext({UsedTarimas: tarimaText}),
                                            With(
                                                {
                                                    suma: (50 - TarimaScrap.Cantidad),
                                                    tarimaNumber: Mid(
                                                        TarimaScrap.Tarima,
                                                        2
                                                    )
                                                },
                                                Patch(
                                                    Scrap_Tarimas,
                                                    TarimaScrap,
                                                    {Cantidad: TarimaScrap.Cantidad + Value(suma)}
                                                );
                                                Collect(
                                                    Scrap_Tarimas,
                                                    {
                                                        'P/N': txt_PN_SP_1.Text,
                                                        Contenedor: Nomenclatura,
                                                        Tarima: "T" & Text(Value(tarimaNumber) + 1, "00"),
                                                        Cantidad: Value(txt_Bache_SP_1.Text - txt_Cant_SP_1.Text) - suma
                                                    }
                                                ); UpdateContext({UsedTarimas: tarimaText & " - T" & Text(Value(tarimaNumber) + 1, "00")})
                                            )
                                        )
                                    );
                                    Collect(
                                        Scrap_1,
                                        {
                                            Fecha: Text(
                                                drp_Fecha_SP_1.Selected.fecha,
                                                "mm/dd/yyyy"
                                            ),
                                            FechaIngreso: DateValue(drp_Fecha_SP_1.Selected.fecha),
                                            Orden: drp_Orden_SP_1.Selected.Value,
                                            'P/N': txt_PN_SP_1.Text,
                                            Contenedor: Nomenclatura,
                                            Maquina: drp_Maquina_SP_1.Selected.M,
                                            Ubicacion: txt_Zona_SP_1.Text,
                                            Codigo: drp_Operario_SP_1.Selected.Codigo,
                                            Operario: drp_Operario_SP_1.Selected.Nombre,
                                            Turno: drp_Turno_SP_1.Selected.Turno_Op,
                                            Bache: Value(txt_Bache_SP_1.Text),
                                            /*If(
                                                IsBlank(
                                                    LookUp(
                                                        Scrap_1;
                                                        Orden = drp_Orden_SP_1.Selected.Value && Tarima = Upper(txt_Tarima_SP_1.Text)
                                                    )
                                                );
                                                Value(txt_Bache_SP_1.Text);
                                                0
                                            );*/
                                            Cantidad: Value(txt_Cant_SP_1.Text),
                                            Tarima: Upper(txt_Tarima_SP_1.Text),
                                            Tarima_Contenedor: Upper(UsedTarimas),
                                            Inspeccion: drp_Insepccion_SP_1.Selected.Value,
                                            'No-conformidad': drp_Incoformidad_SP_1.Selected.Value,
                                            Item: txt_Item_SP_1.Text,
                                            Usuario: txt_User_Sp_1.Text
                                        }
                                    );
                                    Reset(drp_Fecha_SP_1);
                                    Reset(drp_Orden_SP_1);
                                    Reset(drp_Maquina_SP_1);
                                    Reset(txt_Zona_SP_1);
                                    Reset(drp_Operario_SP_1);
                                    Reset(drp_Turno_SP_1);
                                    Reset(txt_Bache_SP_1);
                                    Reset(txt_Cant_SP_1);
                                    Reset(txt_Tarima_SP_1);
                                    Reset(drp_Insepccion_SP_1);
                                    Reset(drp_Incoformidad_SP_1);
                                    Reset(txt_Item_SP_1);
                                    Reset(drp_PN_SP);
                                    Notify(
                                        "Guardado exitoso",
                                        NotificationType.Success
                                    )
                                );
                              PressedBorderColor: =RGBA(52, 152, 47, 1)
                              PressedColor: =RGBA(52, 152, 47, 1)
                              PressedFill: =RGBA(255, 255, 255, 1)
                              Text: ="Guardar"
