                        - Button14_2:
                            Control: Classic/Button@2.2.0
                            Properties:
                              OnSelect: =UpdateContext({Editar:true})
                              Text: ="Editar"
                              Visible: =VarName in ["1133"] || LookUp(Empleados, Codigo = VarName, Rol) in ["ADMIN"]
                              Width: =100
