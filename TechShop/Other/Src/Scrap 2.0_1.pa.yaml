            - btn_ContinuarAviso_HxH_33:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(132, 40, 38, 1)
                  DisabledColor: =RGBA(132, 40, 38, 1)
                  DisplayMode: =If(VarName in ["1133"] || LookUp(Empleados, Codigo = VarName).Rol in ["ADMIN"], DisplayMode.Edit, DisplayMode.Disabled)
                  Fill: =RGBA(215, 58, 60, 1)
                  Font: =Font.'Open Sans'
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =RGBA(132, 40, 38, 1)
                  OnSelect: |-
                    =With(
                        {
                            TarimaScrap: First(
                                Sort(
                                    Filter(
                                        Scrap_Tarimas,
                                        'P/N' = tbl_Scrap_SP_1.Selected.'P/N' && Contenedor = tbl_Scrap_SP_1.Selected.Contenedor
                                    ),
                                    'Fecha de creación',
                                    SortOrder.Descending
                                )
                            )
                        },
                        If(
                            IsBlank(TarimaScrap),
                            "",
                            TarimaScrap.Cantidad - Value(txt_Edit_Bache_SP_1.Text - txt_Edit_Cant_SP_1.Text) >= 0,
                            Patch(
                                Scrap_Tarimas,
                                TarimaScrap,
                                {Cantidad: TarimaScrap.Cantidad - Value(txt_Edit_Bache_SP_1.Text - txt_Edit_Cant_SP_1.Text)}
                            ),
                            With(
                                {
                                    suma: (Value(txt_Edit_Bache_SP_1.Text - txt_Edit_Cant_SP_1.Text) - TarimaScrap.Cantidad),
                                    tarimaNumber: Mid(
                                        TarimaScrap.Tarima,
                                        2
                                    )
                                },
                                Patch(
                                    Scrap_Tarimas,
                                    TarimaScrap,
                                    {Cantidad: 0}
                                );
                                Patch(
                                    Scrap_Tarimas,
                                    LookUp(
                                        Scrap_Tarimas,
                                        'P/N' = tbl_Scrap_SP_1.Selected.'P/N' && Contenedor = tbl_Scrap_SP_1.Selected.Contenedor && Tarima = Text(
                                            "T" & Text(
                                                Value(tarimaNumber) - 1,
                                                "00"
                                            )
                                        )
                                    ),
                                    {Cantidad: 50 - suma}
                                )
                            )
                        )
                    );
                    ClearCollect(//InspecionCalidadContenedor Asigna las cantidades buenas a los P/N correspondientes segun el contenedor seleccionado.
                        colContenedor,
                        Filter(
                            Sort(
                                InspeccionCalidadContenedors,
                                Prioridad,
                                SortOrder.Descending
                            ),
                            Nomenclatura = tbl_Scrap_SP_1.Selected.Contenedor && 'P/N' = tbl_Scrap_SP_1.Selected.'P/N' && Value(Revisado) > 0
                        )
                    );
                    UpdateContext({restante: Value(tbl_Scrap_SP_1.Selected.Bache) - Value(tbl_Scrap_SP_1.Selected.Cantidad)});
                    With(
                        {dato1: First(colContenedor)},
                        If(
                            dato1.Revisado >= restante,
                            Patch(
                                InspeccionCalidadContenedors,
                                dato1,
                                {Revisado: dato1.Revisado - restante}
                            ),
                            Patch(
                                InspeccionCalidadContenedors,
                                dato1,
                                {Revisado: 0}
                            );
                            UpdateContext({restante: restante - dato1.Revisado});
                            Remove(
                                colContenedor,
                                dato1
                            );
                            With(
                                {dato2: First(colContenedor)},
                                If(
                                    restante <= dato2.Revisado,
                                    Patch(
                                        InspeccionCalidadContenedors,
                                        dato2,
                                        {Revisado: dato2.Revisado - restante}
                                    ),
                                    Patch(
                                        InspeccionCalidadContenedors,
                                        dato2,
                                        {Revisado: 0}
                                    );
                                    UpdateContext({restante: restante - dato2.Revisado});
                                    Remove(
                                        colContenedor,
                                        dato2
                                    );
                                    With(
                                        {dato3: First(colContenedor)},
                                        Patch(
                                            InspeccionCalidadContenedors,
                                            dato3,
                                            {Revisado: dato3.Revisado - restante}
                                        )
                                    )
                                )
                            )
                        )
                    );
                    Remove(
                        Scrap_1,
                        tbl_Scrap_SP_1.Selected
                    );
                    Reset(drp_Edit_Maquina_SP_1);
                    Reset(drp_Edit_Operario_SP_1);
                    Reset(drp_Edit_Turno_SP_1);
                    Reset(txt_Edit_Zona_SP_1);
                    Reset(txt_Edit_Bache_SP_1);
                    Reset(txt_Edit_Cant_SP_1);
                    UpdateContext({Editar: false})
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Text: ="Eliminar"
                  X: =51
                  Y: =208
