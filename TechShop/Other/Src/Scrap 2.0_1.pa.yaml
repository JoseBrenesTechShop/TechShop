                  OnSelect: "=If(\n    IsBlank(drp_Edit_Maquina_SP_1.Selected) || IsBlank(drp_Edit_Turno_SP_1.Selected) || IsBlank(txt_Edit_Zona_SP_1.Text) || IsBlank(drp_Edit_Operario_SP_1.Selected) || IsBlank(txt_Edit_Bache_SP_1.Text) || IsBlank(txt_Edit_Cant_SP_1.Text),\n    UpdateContext(\n        {\n            aviso: true,\n            TextoAviso: \"Debe llenar todos los campos\"\n        }\n    ),\n    With(\n        {\n            tarimaScrap: LookUp(\n                Scrap_Tarimas,\n                Tarima = tbl_Scrap_SP_1.Selected.Tarima && Orden = tbl_Scrap_SP_1.Selected.Orden\n            )\n        },\n        If(\n            ((tarimaScrap.Cantidad - tbl_Scrap_SP_1.Selected.Cantidad) + txt_Edit_Cant_SP_1.Text) > 50,\n            UpdateContext(\n                {\n                    aviso: true,\n                    TextoAviso: \"La cantidad maxima por tarima es de 50 unidades\"\n                }\n            ),\n            Patch(\n                Scrap_Tarimas,\n                tarimaScrap,\n                {Cantidad: (tarimaScrap.Cantidad - tbl_Scrap_SP_1.Selected.Cantidad) + txt_Edit_Cant_SP_1.Text}\n            );\n            If(\n                tbl_Scrap_SP_1.Selected.Cantidad < Value(txt_Edit_Cant_SP_1.Text),\n                ClearCollect(//InspecionCalidadContenedor Asigna las cantidades buenas a los P/N correspondientes segun el contenedor seleccionado.\n                    colContenedor,\n                    Filter(\n                        Sort(\n                            InspeccionCalidadContenedors,\n                            Prioridad,\n                            SortOrder.Descending\n                        ),\n                        Nomenclatura = tbl_Scrap_SP_1.Selected.Contenedor && 'P/N' = tbl_Scrap_SP_1.Selected.'P/N' && Value(Revisado) > 0\n                    )\n                );\n                UpdateContext({restante: Value(txt_Edit_Cant_SP_1.Text) - tbl_Scrap_SP_1.Selected.Cantidad});\n                With(\n                    {dato1: First(colContenedor)},\n                    If(\n                        dato1.Revisado >= restante,\n                        Patch(\n                            InspeccionCalidadContenedors,\n                            dato1,\n                            {Revisado: dato1.Revisado - restante}\n                        ),\n                        Patch(\n                            InspeccionCalidadContenedors,\n                            dato1,\n                            {Revisado: 0}\n                        );\n                        UpdateContext({restante: restante - dato1.Revisado});\n                        Remove(\n                            colContenedor,\n                            dato1\n                        );\n                        With(\n                            {dato2: First(colContenedor)},\n                            If(\n                                restante <= dato2.Revisado,\n                                Patch(\n                                    InspeccionCalidadContenedors,\n                                    dato2,\n                                    {Revisado: dato2.Revisado - restante}\n                                ),\n                                Patch(\n                                    InspeccionCalidadContenedors,\n                                    dato2,\n                                    {Revisado: 0}\n                                );\n                                UpdateContext({restante: restante - dato2.Revisado});\n                                Remove(\n                                    colContenedor,\n                                    dato2\n                                );\n                                With(\n                                    {dato3: First(colContenedor)},\n                                    Patch(\n                                        InspeccionCalidadContenedors,\n                                        dato3,\n                                        {Revisado: dato3.Revisado - restante}\n                                    )\n                                )\n                            )\n                        )\n                    )\n                );\n                With(\n                    {\n                        TarimaScrap: First(\n                            Sort(\n                                Filter(\n                                    Scrap_Tarimas,\n                                    'P/N' = tbl_Scrap_SP_1.Selected.'P/N' && Contenedor = tbl_Scrap_SP_1.Selected.Contenedor\n                                ),\n                                'Fecha de creación',\n                                SortOrder.Descending\n                            )\n                        )\n                    },\n                    If(\n                        IsBlank(TarimaScrap),\n                        \"\",\n                        TarimaScrap.Cantidad - (Value(txt_Edit_Cant_SP_1.Text) - tbl_Scrap_SP_1.Selected.Cantidad) >= 0,\n                        Patch(\n                            Scrap_Tarimas,\n                            TarimaScrap,\n                            {Cantidad: TarimaScrap.Cantidad - (Value(txt_Edit_Cant_SP_1.Text) - tbl_Scrap_SP_1.Selected.Cantidad)}\n                        ),\n                        With(\n                            {\n                                suma: ((Value(txt_Edit_Cant_SP_1.Text) - tbl_Scrap_SP_1.Selected.Cantidad) - TarimaScrap.Cantidad),\n                                tarimaNumber: Mid(\n                                    TarimaScrap.Tarima,\n                                    2\n                                )\n                            },\n                            Patch(\n                                Scrap_Tarimas,\n                                TarimaScrap,\n                                {Cantidad: 0}\n                            );\n                            Patch(\n                                Scrap_Tarimas,\n                                LookUp(\n                                    Scrap_Tarimas,\n                                    'P/N' = tbl_Scrap_SP_1.Selected.'P/N' && Contenedor = tbl_Scrap_SP_1.Selected.Contenedor && Tarima = Text(\n                                        \"T\" & Text(\n                                            Value(tarimaNumber) - 1,\n                                            \"00\"\n                                        )\n                                    )\n                                ),\n                                {Cantidad: 50 - suma}\n                            )\n                        )\n                    )\n                ),\n                ClearCollect(//InspecionCalidadContenedor Asigna las cantidades buenas a los P/N correspondientes segun el contenedor seleccionado.\n                    colContenedor,\n                    Filter(\n                        Sort(\n                            InspeccionCalidadContenedors,\n                            Prioridad,\n                            SortOrder.Ascending\n                        ),\n                        Nomenclatura = tbl_Scrap_SP_1.Selected.Contenedor && 'P/N' = tbl_Scrap_SP_1.Selected.'P/N' && Value(Revisado) < Value(Cantidad)\n                    )\n                );\n                UpdateContext({restante: tbl_Scrap_SP_1.Selected.Cantidad - Value(txt_Edit_Cant_SP_1.Text)});\n                With(\n                    {dato1: First(colContenedor)},\n                    If(\n                        restante + dato1.Revisado <= dato1.Cantidad,\n                        Patch(\n                            InspeccionCalidadContenedors,\n                            dato1,\n                            {Revisado: dato1.Revisado + restante}\n                        ),\n                        Patch(\n                            InspeccionCalidadContenedors,\n                            dato1,\n                            {Revisado: dato1.Revisado + (dato1.Cantidad - dato1.Revisado)}\n                        );\n                        UpdateContext({restante: restante - (dato1.Cantidad - dato1.Revisado)});\n                        Remove(\n                            colContenedor,\n                            dato1\n                        );\n                        If(\n                            IsEmpty(colContenedor),\n                            Patch(\n                                InspeccionCalidadContenedors,\n                                dato1,\n                                {Revisado: dato1.Revisado + restante}\n                            ),\n                            With(\n                                {dato2: First(colContenedor)},\n                                If(\n                                    restante + dato2.Revisado <= dato2.Cantidad,\n                                    Patch(\n                                        InspeccionCalidadContenedors,\n                                        dato2,\n                                        {Revisado: dato2.Revisado + restante}\n                                    ),\n                                    Patch(\n                                        InspeccionCalidadContenedors,\n                                        dato2,\n                                        {Revisado: dato2.Revisado + (dato2.Cantidad - dato2.Revisado)}\n                                    );\n                                    UpdateContext({restante: restante - (dato2.Cantidad - dato2.Revisado)});\n                                    Remove(\n                                        colContenedor,\n                                        dato2\n                                    );\n                                    If(\n                                        IsEmpty(colContenedor),\n                                        Patch(\n                                            InspeccionCalidadContenedors,\n                                            dato2,\n                                            {Revisado: dato2.Revisado + restante}\n                                        ),\n                                        With(\n                                            {dato3: First(colContenedor)},\n                                            Patch(\n                                                InspeccionCalidadContenedors,\n                                                dato3,\n                                                {Revisado: dato3.Revisado + restante}\n                                            )\n                                        )\n                                    )\n                                )\n                            )\n                        )\n                    )\n                );\n                With(\n                    {\n                        TarimaScrap: First(\n                            Sort(\n                                Filter(\n                                    Scrap_Tarimas,\n                                    'P/N' = tbl_Scrap_SP_1.Selected.'P/N' && Contenedor = tbl_Scrap_SP_1.Selected.Contenedor\n                                ),\n                                'Fecha de creación',\n                                SortOrder.Descending\n                            )\n                        )\n                    },\n                    If(\n                        IsBlank(TarimaScrap),\n                        \"\",\n                        TarimaScrap.Cantidad - (tbl_Scrap_SP_1.Selected.Cantidad - Value(txt_Edit_Cant_SP_1.Text)) <= 50,\n                        Patch(\n                            Scrap_Tarimas,\n                            TarimaScrap,\n                            {Cantidad: TarimaScrap.Cantidad + Value(tbl_Scrap_SP_1.Selected.Cantidad - Value(txt_Edit_Cant_SP_1.Text))}\n                        ),\n                        With(\n                            {\n                                suma: (50 - TarimaScrap.Cantidad),\n                                tarimaNumber: Mid(\n                                    TarimaScrap.Tarima,\n                                    2\n                                )\n                            },\n                            Patch(\n                                Scrap_Tarimas,\n                                TarimaScrap,\n                                {Cantidad: suma}\n                            );\n                            Collect(\n                                Scrap_Tarimas,\n                                {\n                                    'P/N': tbl_Scrap_SP_1.Selected.'P/N',\n                                    Contenedor: tbl_Scrap_SP_1.Selected.Contenedor,\n                                    Tarima:\"T\" & Text(\n                                            Value(tarimaNumber) - 1,\n                                            \"00\"\n                                        ),\n                                    Cantidad: Value(tbl_Scrap_SP_1.Selected.Cantidad - Value(txt_Edit_Cant_SP_1.Text))- suma}\n                            )\n                        )\n                    )\n                );\n            );\n            Patch(\n                Scrap_1,\n                tbl_Scrap_SP_1.Selected,\n                {\n                    Operario: drp_Edit_Operario_SP_1.Selected.Nombre,\n                    Turno: drp_Edit_Turno_SP_1.Selected.Turno_Op,\n                    Ubicacion: txt_Edit_Zona_SP_1.Text,\n                    Maquina: drp_Edit_Maquina_SP_1.Selected.M,\n                    Bache: Value(txt_Edit_Bache_SP_1.Text),\n                    Cantidad: Value(txt_Edit_Cant_SP_1.Text),\n                    Usuario: txt_User_Sp_1.Text\n                }\n            );\n            Reset(drp_Edit_Maquina_SP_1);\n            Reset(drp_Edit_Operario_SP_1);\n            Reset(drp_Edit_Turno_SP_1);\n            Reset(txt_Edit_Zona_SP_1);\n            Reset(txt_Edit_Bache_SP_1);\n            Reset(txt_Edit_Cant_SP_1);\n            UpdateContext({Editar: false})\n        )\n    );\n    \n)"
