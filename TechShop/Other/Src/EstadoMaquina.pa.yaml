                      <head>
                        <style>
                          body {
                            font-family: Arial, sans-serif;
                            font-size: 14px;
                          }
                         .machine-state {
                            font-weight: bold;
                          }
                        </style>
                      </head>
                      <body>
                        <p>Estimado/a,</p>
                        <p>Le informamos que la máquina <span class=""machine-state"">" & txt_MaquinaView_EM.Text & "</span> ha cambiado su estado a <span class=""machine-state"">" & drp_EstadoEdits_EM.SelectedText.Value & "</span>.</p>
                        <p>Comentario del Cambio: " & drp_Comentario_EM.SelectedText.Value & "</p>
                        <p>Causa del Cambio: " & drp_Causa_EM.SelectedText.Value & "</p>
                        <p>Descripcion del Cambio: " & txt_Descripcion_EM.Text & "</p>
                      </body>
                    </html>
                    "
                  Visible: =false
