                        UpdateContext({MostrarAviso: true, mensajeNotificacion: "Hay cantidades en blanco. No se puede guardar."}),

                        CountRows(Filter(glr_Pots_7.AllItems, IsMatch(CantidadMats_1.Text,"^\-?\d+(\.\d+)?$") && Value(CantidadMats_1.Text) < 0)) > 0,
