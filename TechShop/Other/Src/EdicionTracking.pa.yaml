                                mensajeNotificacion: "No existe ninguna POT con materiales agregados."
                            }
                        ),
                        Collect(
                            Logistica_Compras,
                            ForAll(
                                PotsSeleccionadas,
                                {
                                    POT: POT,
                                    Materiales: Item,
                                    Descripcion: Description,
                                    Cantidad: Text(Cantidad),
                                    Observacion: Observacion,
                                    ID_Tracking: Ref_1.Text,
                                    Tracking: Ref.Text
                                }
                            )
                        );
                        Collect(
                            Logistica_Movimientos,
                            {
                                ID_Tracking: Ref_1.Text,
                                Tracking: Ref.Text,
                                Transporte: drp_MetodoTransporte_LO_1.Selected.Value,
                                Tipo_Envio: drp_TipoEnvio_LO_1.Selected.Value,
                                Fecha_Miami: dt_FechaMiami_LO_1.SelectedDate,
                                Ref_Miami: txt_refMiamo_LO_1.Text,
                                Fecha_Tech: dt_FechaTech_LO_1.SelectedDate,
                                Ref_Tech: txt_refTech_LO_1.Text,
                                'Estado (crfb9_estado)': ""
                            }
                        );
                    ForAll(
                        colEstadoPOT,
                        If(
                            !IsBlank(LookUp(PotsSeleccionadas, POT = EPOT) ),
                            UpdateIf(
                                Compras_Pots,
                                POT = EPOT,
                                { 'Estado (crfb9_estado)': EstadoP }
                            )
                        )
                    );
                        UpdateContext(
                            {
                                MostrarAviso: true,
                                mensajeNotificacion: "Datos guardados correctamente.",
                                Materiales: false,
                                reset: true,
                                AbrirPots: false,
                                seleccion: false,
                                AbrirCompletar: false,
                                rellenar: false
                            }
                        );
                        UpdateContext({reset: false});
                        Refresh(Compras_Pots);
                        Reset(dt_FechaMiami_LO_1);
                        Reset(txt_refMiamo_LO_1);
                        Reset(dt_FechaTech_LO_1);
                        Reset(txt_refTech_LO_1);
                        Reset(drp_MetodoTransporte_LO_1);
                        Reset(drp_TipoEnvio_LO_1);
                        Reset(Ref);
                        Clear(PotsSeleccionadas);
                        Clear(colEstadoPOT)
                    )
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Text: ="Guardar"
