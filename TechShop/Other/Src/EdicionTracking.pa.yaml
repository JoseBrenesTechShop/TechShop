                                MostrarAviso: true,
                                mensajeNotificacion: "Se digitó una cantidad negativa. No se puede guardar."
                            }
                        ),
                        CountRows(
                            Filter(
                                glr_Pots_6.AllItems,
                                IsMatch(
                                    CantidadMats_3.Text,
                                    "^\-?\d+(\.\d+)?$"
                                ) && Value(CantidadMats_3.Text) > Value(txtCantidadDisponible_2.Text)
                            )
                        ) > 0,
                        UpdateContext(
                            {
                                MostrarAviso: true,
                                mensajeNotificacion: "Alguna cantidad supera la cantidad disponible. Revise y corrija."
                            }
                        ),
                        CountRows(
                            Filter(
