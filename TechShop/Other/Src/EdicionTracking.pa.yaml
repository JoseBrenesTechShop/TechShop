                                PotsSeleccionadas,
                                LookUp(PotsSeleccionadas, POT = ThisRecord.POT && Item = ThisRecord.Item),
                                { Cantidad: ThisRecord.NuevaCantidad, Observacion: ThisRecord.NuevaObs }
                            )
                        );

                        ForAll(
                            Distinct(tempEdits, POT),
                            If(
                                CountRows(Filter(tempEdits, POT = Value && NuevaCantidad <> Disponible)) = 0,
                                If(
                                    CountRows(Filter(colEstadoPOT, EPOT = Value)) = 0,
