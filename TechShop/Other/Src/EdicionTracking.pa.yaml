                                    EstadoP: "Tramitado"
                                }
                            ),
                            UpdateIf(
                                colEstadoPOT,
                                EPOT = glr_Pots_6.Selected.po_num,
                                {EstadoP: "Tramitado"}
                            )
                        )
                    );


                    If(
                        CountRows(
                            Filter(
                                glr_Pots_6.AllItems,
                                IsBlank(Trim(CantidadMats_3.Text))
                            )
                        ) > 0,
                        UpdateContext(
                            {
                                MostrarAviso: true,
                                mensajeNotificacion: "Hay cantidades en blanco. No se puede guardar."
                            }
                        ),
                        CountRows(
                            Filter(
                                glr_Pots_6.AllItems,
                                IsMatch(
                                    CantidadMats_3.Text,
                                    "^\-?\d+(\.\d+)?$"
                                ) && Value(CantidadMats_3.Text) < 0
                            )
                        ) > 0,
                        UpdateContext(
