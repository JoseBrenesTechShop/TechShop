                        CountRows(Filter(glr_Pots_7.AllItems, IsMatch(CantidadMats_1.Text,"^\-?\d+(\.\d+)?$") && Value(CantidadMats_1.Text) > Value(txtCantidadDisponible_1.Text))) > 0,
                        UpdateContext({MostrarAviso: true, mensajeNotificacion: "Alguna cantidad supera la cantidad disponible. Revise y corrija."}),

                        CountRows(Filter(glr_Pots_7.AllItems, IsMatch(CantidadMats_1.Text,"^\-?\d+(\.\d+)?$") && Value(CantidadMats_1.Text) < Value(txtCantidadDisponible_1.Text) && IsBlank(Trim(txtObservacion_1.Text)))) > 0,
                        UpdateContext({MostrarAviso: true, mensajeNotificacion: "Faltan observaciones para materiales con cantidad menor a la disponible."}),

                        CountRows(Filter(glr_Pots_7.AllItems, IsMatch(CantidadMats_1.Text,"^\-?\d+(\.\d+)?$") && Value(CantidadMats_1.Text) <> 0)) = 0,
                        UpdateContext({MostrarAviso: true, mensajeNotificacion: "Todas las cantidades están en 0. No hay materiales para guardar."}),

                        ClearCollect(
                            tempEdits,
                            ForAll(
                                glr_Pots_7.AllItems,
                                {
                                    POT: ThisRecord.POT,
                                    Item: ThisRecord.Item,
                                    NuevaCantidad: If(IsMatch(CantidadMats_1.Text,"^\-?\d+(\.\d+)?$"), Value(CantidadMats_1.Text), 0),
