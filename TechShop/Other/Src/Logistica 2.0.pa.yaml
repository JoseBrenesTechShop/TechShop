                  Width: =1289
            - btn_Guardar_EC_24:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(40, 134, 222, 1)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  DisplayMode: =
                  Fill: =RGBA(40, 134, 222, 1)
                  Font: =Font.'Open Sans'
                  Height: =33
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =
                  OnSelect: |+
                    =If(

                         CountRows(
                            Filter(
                                glr_Pots_2.AllItems,
                                IsBlank(Trim(CantidadMats_1.Text))
                            )
                        ) > 0,
                        UpdateContext({
                            MostrarAviso: true,
                            mensajeNotificacion: "Hay cantidades en blanco. No se puede guardar."
                        }),

                        CountRows(
                            Filter(
                                glr_Pots_2.AllItems,
                                IsMatch(CantidadMats_1.Text,"^\-?\d+(\.\d+)?$") &&
                                Value(CantidadMats_1.Text) < 0
                            )
                        ) > 0,
                        UpdateContext({
                            MostrarAviso: true,
                            mensajeNotificacion: "Se digitó una cantidad negativa. No se puede guardar."
                        }),

                        CountRows(
                            Filter(
                                glr_Pots_2.AllItems,
                                IsMatch(CantidadMats_1.Text,"^\-?\d+(\.\d+)?$") &&
                                Value(CantidadMats_1.Text) > Value(txtCantidadDisponible_1.Text)
                            )
                        ) > 0,
                        UpdateContext({
                            MostrarAviso: true,
                            mensajeNotificacion: "Alguna cantidad supera la cantidad disponible. Revise y corrija."
                        }),

                        CountRows(
                            Filter(
                                glr_Pots_2.AllItems,
                                IsMatch(CantidadMats_1.Text,"^\-?\d+(\.\d+)?$") &&
                                Value(CantidadMats_1.Text) < Value(txtCantidadDisponible_1.Text) &&
                                IsBlank(Trim(txtObservacion_1.Text))
                            )
                        ) > 0,
                        UpdateContext({
                            MostrarAviso: true,
                            mensajeNotificacion: "Faltan observaciones para materiales con cantidad menor a la disponible."
                        }),

                        CountRows(
                            Filter(
                                glr_Pots_2.AllItems,
                                IsMatch(CantidadMats_1.Text,"^\-?\d+(\.\d+)?$") &&
                                Value(CantidadMats_1.Text) <> 0
                            )
                        ) = 0,
                        UpdateContext({
                            MostrarAviso: true,
                            mensajeNotificacion: "Todas las cantidades están en 0. No hay materiales para guardar."
                        }),

                        ForAll(
                            glr_Pots_2.AllItems,
                            Patch(
                                PotsSeleccionadas,
                                LookUp(
                                    PotsSeleccionadas,
                                    POT = ThisRecord.POT && Item = ThisRecord.Item
                                ),
                                {
                                    Cantidad: Value(CantidadMats_1.Text),
                                    Observacion: txtObservacion_1.Text
                                }
                            )
                        );

                        UpdateContext({
                            MostrarAviso: true,
                            mensajeNotificacion: "Materiales editados correctamente.",
                            reset: true,
                            Editar: false
                        });
                        UpdateContext({reset: false})
                    )
                  PressedBorderColor: =Self.Fill
