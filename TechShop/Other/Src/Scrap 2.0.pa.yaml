                        - Button14:
                            Control: Classic/Button@2.2.0
                            Properties:
                              OnSelect: |+
                                =
                                If(
                                    IsBlank(drp_Orden_SP.Selected) || IsBlank(drp_OP_SP.Selected) || IsBlank(drp_Maquina_SP.Selected) || IsBlank(txt_Zona_SP.Text) || IsBlank(drp_Operario_SP.Selected) || IsBlank(drp_Turno_SP.Selected) || IsBlank(txt_Bache_SP.Text) || IsBlank(txt_Cant_SP.Text) || IsBlank(txt_Tarima_SP.Text) || IsBlank(drp_Insepccion_SP.Selected) || IsBlank(drp_Incoformidad_SP.Selected) || IsBlank(txt_Item_SP.Text),
                                    UpdateContext(
                                        {
                                            TextoAviso: "Todos los campos deben estar completos antes de guardar el registro",
                                            aviso: true
                                        }
                                    ),
                                    (LookUp(
                                        Scrap_Tarimas,
                                        Tarima = Upper(txt_Tarima_SP.Text) && Orden = drp_Orden_SP.Selected.Value && Operacion = drp_OP_SP.Selected.Operacion
                                    ).Cantidad + txt_Cant_SP.Text) > 50,
                                    UpdateContext(
                                        {
                                            TextoAviso: "La cantidad maxima por tarima es de 50 unidades",
                                            aviso: true
                                        }
                                    ),
                                    Collect(
                                        Scrap_1,
                                        {
                                            Fecha: Text(
                                                drp_Fecha_SP.Selected.fecha,
                                                "mm/dd/yyyy"
                                            ),
                                            FechaIngreso: DateValue(drp_Fecha_SP.Selected.fecha),
                                            Orden: drp_Orden_SP.Selected.Value,
                                            OP: Value(drp_OP_SP.Selected.Operacion),
                                            'P/N': txt_PN_SP.Text,
                                            Maquina: drp_Maquina_SP.Selected.M,
                                            Ubicacion: txt_Zona_SP.Text,
                                            Codigo: drp_Operario_SP.Selected.Codigo,
                                            Operario: drp_Operario_SP.Selected.Nombre,
                                            Turno: drp_Turno_SP.Selected.Turno_Op,
                                            Bache: If(IsBlank(LookUp(Scrap_1, Orden = drp_Orden_SP.Selected.Value && Value(drp_OP_SP.Selected.Operacion) && Tarima = Upper(txt_Tarima_SP.Text))), Value(txt_Bache_SP.Text), 0),
                                            Cantidad: Value(txt_Cant_SP.Text),
                                            Tarima: Upper(txt_Tarima_SP.Text),
                                            Inspeccion: drp_Insepccion_SP.Selected.Value,
                                            'No-conformidad': drp_Incoformidad_SP.Selected.Value,
                                            Item: txt_Item_SP.Text,
                                            Usuario: txt_User_Sp.Text
                                        }
                                    );
                                    With(
                                        {
                                            TarimaScrap: LookUp(
                                                Scrap_Tarimas,
                                                Tarima = Upper(txt_Tarima_SP.Text) && Orden = drp_Orden_SP.Selected.Value && Operacion = drp_OP_SP.Selected.Operacion
                                            )
                                        },
                                        If(
                                            IsBlank(TarimaScrap),
                                            Collect(
                                                Scrap_Tarimas,
                                                {
                                                    Orden: drp_Orden_SP.Selected.Value,
                                                    Operacion: drp_OP_SP.Selected.Operacion,
                                                    Tarima: Upper(txt_Tarima_SP.Text),
                                                    Cantidad: Value(txt_Cant_SP.Text)
                                                }
                                            ),
                                            Patch(
                                                Scrap_Tarimas,
                                                TarimaScrap,
                                                {Cantidad: TarimaScrap.Cantidad + Value(txt_Cant_SP.Text)}
                                            )
                                        )
                                    );
                                    Reset(drp_Fecha_SP);
                                    Reset(drp_Orden_SP);
                                    Reset(drp_OP_SP);
                                    Reset(drp_Maquina_SP);
                                    Reset(txt_Zona_SP);
