                                  {
                                      SubTotal: Value(Trim(txt_SubTotal_BS.Text)),
                                      PorcentajeScrap: Value(txt_PorScrap_BS.Text),
                                      PorIncumplimiento: Value(txt_Icum_BS.Text),
                                      User: txt_User_BS.Text,
                                      Justificacion: txt_Justificacion_BS.Text
                                  }
                              );
                              Reset(txt_Justificacion_BS);
                              Refresh(BonoSemanals);
                              UpdateContext({Mostrar: false});
                              UpdateContext({Justi: false});
                          )
