            - btn_GuardarCambios_BS:
                Control: Classic/Button@2.2.0
                Properties:
                  Color: =RGBA(255, 255, 255, 1)
                  DisplayMode: =If(Justi, DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =RGBA(71, 158, 245, 1)
                  Height: =45
                  HoverColor: =RGBA(255, 255, 255, 1)
                  OnSelect: |-
                    =If(
                        IsBlank(txt_SubTotal_BS.Text) || IsBlank(txt_Icum_BS.Text) || IsBlank(txt_PorScrap_BS.Text),//Pregunta
                        Notify(
                            "No puede dejar campos vacios",
                            NotificationType.Error
                        ),
                        Value(txt_Icum_BS.Text) > 100 || Value(txt_PorScrap_BS.Text) > 100,//Pregunta
                        Notify(
                            "Los porcentajes no pueden ser mayores que 100",
                            NotificationType.Error
                        ),
                        UpdateContext({Justi:true})
                    )
                  Size: =18
                  Text: ="Guardar Cambios"
                  Width: =639
                  X: =11
                  Y: =450
