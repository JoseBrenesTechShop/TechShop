Screens:
  Detalle_Aprobacion_Compra:
    Properties:
      BackgroundImage: ='abstracto geométrico blanco y gris'
      ImagePosition: =ImagePosition.Fill
      OnHidden: |-
        =
        UpdateContext({edit: {view: false, item: Blank()}, Aviso: false, mensajeNotificacion: "", Rechazo: false, reset: false});
        Clear(compras);
        Reset(txt_Num_Soli_DAC);
        Reset(txt_Comentario_DAC);
      OnVisible: "=UpdateContext(\n    {\n        Nsoli: Text(\n            First(\n                Split(\n                    glr_Solicitud_AC.Selected.soli_num,\n                    \"-\"\n                )\n            ).Value\n        )\n    }\n);\nClear(compras);\nIf(\n    \"-\" in glr_Solicitud_AC.Selected.soli_num && IsEmpty(\n        Filter(\n            Detalle_Solicitud_Compras,\n            soli_num = glr_Solicitud_AC.Selected.soli_num\n        )\n    ),\n    \n    ForAll(\n        With(\n            {\n                Nfila: Filter(\n                    Compras_NoMarcadas,\n                    NSolicitud = Nsoli && Enviado = 1\n                ).NFilaSolicitud\n            },\n            Filter(\n                Filter(\n                    preqitem,\n                    req_num = Nsoli\n                ),\n                req_line in Nfila\n            )\n        ),\n        Collect(\n            compras,\n            {\n                req_line: ThisRecord.req_line,\n                item: ThisRecord.item,\n                descripcion: ThisRecord.description,\n                medida: ThisRecord.u_m,\n                cantidad: ThisRecord.qty_ordered,\n                precio: ThisRecord.unit_mat_cost,\n                num_vendedor: ThisRecord.vend_num,\n                aprobado: true,\n                comentario: \"\"\n            }\n        )\n    ),\n    \"-\" in glr_Solicitud_AC.Selected.soli_num,\n    ForAll(\n        With(\n            {\n                Nfila: Filter(\n                    Detalle_Solicitud_Compras,\n                    soli_num = glr_Solicitud_AC.Selected.soli_num\n                ).linea\n            },\n            Filter(\n                Filter(\n                    preqitem,\n                    req_num = Nsoli\n                ),\n                req_line in Nfila\n            )\n        ),\n        Collect(\n            compras,\n            {\n                req_line: ThisRecord.req_line,\n                item: ThisRecord.item,\n                descripcion: ThisRecord.description,\n                medida: ThisRecord.u_m,\n                cantidad: ThisRecord.qty_ordered,\n                precio: ThisRecord.unit_mat_cost,\n                num_vendedor: ThisRecord.vend_num,\n                aprobado: true,\n                comentario: \"\"\n            }\n        )\n    ),\n    With(\n        {\n            NoMarcadas: Filter(\n                Compras_NoMarcadas,\n                NSolicitud = Nsoli\n            )\n        },\n        ForAll(\n            Filter(\n                Filter(\n                    preqitem,\n                    req_num = Nsoli\n                ),\n                Not(req_line in NoMarcadas.NFilaSolicitud)\n            ),\n            Collect(\n                compras,\n                {\n                    req_line: ThisRecord.req_line,\n                    item: ThisRecord.item,\n                    descripcion: ThisRecord.description,\n                    medida: ThisRecord.u_m,\n                    cantidad: ThisRecord.qty_ordered,\n                    precio: ThisRecord.unit_mat_cost,\n                    num_vendedor: ThisRecord.vend_num,\n                    aprobado: true,\n                    comentario: \"\"\n                }\n            )\n        )\n    )\n)"
