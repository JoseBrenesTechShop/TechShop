            RadiusTopRight: =20
            Visible: =Rechazo
            Width: =400
            X: =483
            Y: =289
          Children:
            - txt_MensajeNoti_EM_6:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Font: =Font.Arial
                  Height: =129
                  Size: =18
                  Text: |-
                    =If(reset, "¿Esta seguro que desea restablecer el estado de esta solicitud?
                    Se perderan los cambios hechos",
                    "¿Esta seguro que desea devolver a gerencia esta solicitud?")
                  Width: =400
            - btn_Aceptar_EM_7:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(52, 152, 47, 1)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =RGBA(52, 152, 47, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Normal
                  HoverBorderColor: =RGBA(52, 152, 47, 1)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =RGBA(21, 68, 18, 1)
                  OnSelect: |
                    =UpdateContext({Guardando: true});
                    If(
                        !reset,
                        With(
                            {
                                idGerente: If(
                                    StartsWith(
                                        Nsoli,
                                        "PRD"
                                    ),
                                    "16",
                                    StartsWith(
                                        Nsoli,
                                        "MTO"
                                    ),
                                    "15",
                                    StartsWith(
                                        Nsoli,
                                        "QAL"
                                    ),
                                    "2618",
                                    (StartsWith(
                                        Nsoli,
                                        "TLR"
                                    ) || StartsWith(
                                        Nsoli,
                                        "ADM"
                                    ) || StartsWith(
                                        Nsoli,
                                        "OFC"
                                    )),
                                    "1124",
                                    StartsWith(
                                        Nsoli,
                                        "SOL"
                                    ),
                                    "1133",
                                    StartsWith(
                                        Nsoli,
                                        "TIC"
                                    ),
                                    "2648"
                                )
                            },
                            Patch(
                                Solicitud_Compras,
                                glr_Solicitud_AC.Selected,
                                {estado: "Devuelto"}
                            );
                            ForAll(
                                datos_DAC,
                                Collect(
                                    Compras_NoMarcadas,
                                    {
                                        NSolicitud: Upper(Nsoli),
                                        NFilaSolicitud: ThisRecord.linea,
                                        NItem: ThisRecord.item,
                                        Descripcion: ThisRecord.descripcion,
                                        Enviado: 0,
                                        Tipo_Envio: idGerente,
                                        Motivo: "Rechazo por Don Erick"
                                    }
                                )
                            );
                            RemoveIf(
                                Compras_NoMarcadas,
                                NSolicitud = Nsoli && NFilaSolicitud in Filter(
                                    datos_DAC,
                                    aprobado
                                ).linea && Enviado = 1 && Tipo_Envio = idGerente
                            );
                            EnviarCorreo.Run(
                                LookUp(
                                    Empleados,
                                    Codigo = idGerente,
                                    Correo
                                ) & "emarin@tsicr.com; rocervantes@tsicr.com; marias@tsicr.com",
                                "Solicitud no aprobada por Don Eric",
                                "Buenas,
                    La solicitud " & Nsoli & " no fue aprobada por gerencia. Por favor, revise el motivo de la no aprobación y, de ser necesario, corrija la observación indicada o vuelva a enviar la solicitud.
                    Una vez realizado el ajuste, comuníquese con Don Eric para gestionar nuevamente la aprobación.
                    Saludos cordiales,
                    Departamento de Tecnologia"
                            )
                        ),
                        Patch(
                            Solicitud_Compras,
                            glr_Solicitud_AC.Selected,
                            {estado: "Listo"}
                        )
                    );
                    UpdateContext(
                        {
                            edit: {
                                view: false,
                                item: Blank()
                            },
                            Aviso: {Ver: false},
                            Rechazo: false
                        }
                    );
                    Clear(datos_DAC);
                    Reset(txt_Num_Soli_DAC);
                    Reset(drp_Estado_AC);
                    UpdateContext({Guardando: false});
                    Back();
                  PressedBorderColor: =RGBA(52, 152, 47, 1)
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Text: ="Aceptar"
                  Width: =150
                  X: =212
                  Y: =129
