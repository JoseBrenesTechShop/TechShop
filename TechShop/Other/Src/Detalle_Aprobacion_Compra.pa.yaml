      - cnt_Rechazo_DAC:
          Control: GroupContainer@1.3.0
          Variant: ManualLayout
          Properties:
            BorderColor: =RGBA(215, 58, 60, 1)
            BorderThickness: =5
            DropShadow: =DropShadow.ExtraBold
            Fill: =RGBA(255, 255, 255, 1)
            Height: =190
            RadiusBottomLeft: =20
            RadiusBottomRight: =20
            RadiusTopLeft: =20
            RadiusTopRight: =20
            Visible: =Rechazo
            Width: =400
            X: =483
            Y: =289
          Children:
            - txt_MensajeNoti_EM_6:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Font: =Font.Arial
                  Height: =129
                  Size: =18
                  Text: |-
                    =If(reset, "¿Esta seguro que desea restablecer el estado de esta solicitud?
                    Se perderan los cambios hechos",
                    "¿Esta seguro que desea rechazar esta solicitud?")
                  Width: =400
            - btn_Aceptar_EM_7:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(52, 152, 47, 1)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =RGBA(52, 152, 47, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Normal
                  HoverBorderColor: =RGBA(52, 152, 47, 1)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =RGBA(21, 68, 18, 1)
                  OnSelect: |
                    =If(
                        !reset,
                        Patch(
                            Solicitud_Compras,
                            glr_Solicitud_AC.Selected,
                            {
                                comentario: txt_Comentario_DAC.Text,
                                estado: "Rechazado"
                            }
                        ),
                        RemoveIf(
                            Detalle_Solicitud_Compras,
                            soli_num = Upper(txt_Num_Soli_DAC.Text)
                        );
                        Patch(
                            Solicitud_Compras,
                            glr_Solicitud_AC.Selected,
                            {
                                total: Value(
                                    Sum(
                                        Filter(
                                            glr_Detalles_DAC.AllItems,
                                            chk_Aprobar_DAC.Value
                                        ),
                                        cantidad * precio
                                    )
                                ),
                                comentario: Blank(),
                                estado: "Listo"
                            }
                        )
                    );
                    UpdateContext(
                        {
                            edit: {
                                view: false,
                                item: Blank()
                            },
                            Aviso: false,
                            mensajeNotificacion: "",
                            Rechazo: false
                        }
                    );
                    Clear(compras);
                    Reset(txt_Num_Soli_DAC);
                    Reset(drp_Estado_AC);
                    Back();
                  PressedBorderColor: =RGBA(52, 152, 47, 1)
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Text: ="Aceptar"
                  Width: =150
                  X: =212
                  Y: =129
            - btn_Aceptar_EM_8:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(215, 58, 60, 1)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =RGBA(215, 58, 60, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Bold
                  HoverBorderColor: =RGBA(215, 58, 60, 1)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =RGBA(132, 40, 38, 1)
                  OnSelect: |-
                    =UpdateContext({Rechazo: false})
                  PressedBorderColor: =RGBA(215, 58, 60, 1)
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Text: ="Cancelar"
                  Width: =150
                  X: =37
                  Y: =129
