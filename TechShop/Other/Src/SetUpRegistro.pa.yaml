            - btn_GuardarComent_HxH2_11:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  DisplayMode: |-
                    =If( AvisoSetUp,
                        DisplayMode.Disabled,
                        DisplayMode.Edit
                    )
                  Fill: =RGBA(72, 163, 62, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Bold
                  Height: =50
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =RGBA(52, 152, 47, 1)
                  OnSelect: |-
                    =If(
                        IsEmpty(glr_SetUpGuardado_SU_1.AllItems),
                        UpdateContext(
                            {
                                TextoAvisoSetUp:"Debe de guardar los materiales primero antes de continuar.", 
                                AvisoSetUp: true 
                            }
                        ),
                        !IsEmpty(Materiales_SetUp),
                         UpdateContext(
                            {
                                TextoAvisoSetUp:"Por favor limpiar Listado Set Up antes de continuar",
                                AvisoSetUp: true 
                            }
                        ),
                        IsBlank(txt_UbiSetCompleto_ST_2.Value),
                          UpdateContext(
                            {
                                TextoAvisoSetUp:"Debe digitar primero la ubicación del setup.",
                                AvisoSetUp: true 
                            }
                        ),
                        IsBlank(
                            LookUp(
                                Estado_SetUps_1,
                                Orden = info.Orden && OperacionNum = Value(info.Operacion) && Maquina = Text(info.Maquina)
                            )
                        ),
                        Collect(
                            Estado_SetUps_1,
                            {
                                Orden: info.Orden,
                                Maquina: info.Maquina,
                                OperacionNum: Value(info.Operacion),
                                User: LookUp(
                                    Empleados,
                                    Codigo = VarName,
                                    Nombre
                                ),
                                EstadoSetUp: "Completo",
                                UbicacionSetUp: Upper(txt_UbiSetCompleto_ST_2.Value)
                            }
                        ),
                        Patch(
                            Estado_SetUps_1,
                            LookUp(
                                Estado_SetUps_1,
                                Orden = info.Orden && OperacionNum = Value(info.Operacion) && Maquina = Text(info.Maquina)
                            ),
                            {
                                EstadoSetUp: "Completo",
                                UbicacionSetUp: Upper(txt_UbiSetCompleto_ST_2.Value),
                                 User: LookUp(
                                    Empleados,
                                    Codigo = VarName,
                                    Nombre
                                )
                            }
                        );
                        ClearCollect(
                            MaterialesFiltrados,
                            Filter(
                                SetUp_Registros_1,
                                Orden = info.Orden && OperacionNum = Value(info.Operacion) && Maquina = Text(info.Maquina) && Estado_SetUp in [
                                    "Incompleto",
                                    "Completo"
                                ]
                            )
                        );
                        ForAll(
                            MaterialesFiltrados,
                            Patch(
                                SetUp_Registros_1,
                                ThisRecord,
                                {Estado_SetUp: "Completo"}
                            )
                        );
                        UpdateContext(
                            {
                                ContenedorVisible: false,
                                Disable: false
                            }
                        );
                        Clear(Materiales_SetUp)
                    )
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Text: ="Guardar"
                  Width: =180
                  X: =338
                  Y: =173
