                        - btn_Guardar_HxHE_1:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =ColorFade(Self.Fill, -15%)
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(255, 255, 255, 1)
                              DisabledBorderColor: =RGBA(166, 166, 166, 1)
                              DisplayMode: =If(Disable, DisplayMode.Disabled, DisplayMode.Edit)
                              Fill: =RGBA(0, 134, 208, 1)
                              Font: =Font.'Open Sans'
                              Height: =63
                              HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =RGBA(102, 182, 227, 1)
                              OnSelect: |-
                                =UpdateContext({Efi: (Value(txt_CantProducida_HxH2.Text + txt_CantDañada_HxH2.Text) / Value(txt_Meta_HxH2.Text)) * 100});
                                UpdateContext({Disable: true});
                                If(
                                  //Validacion de maquina
                                    IsBlank(txt_Maquina_HxH2.Text),//Maquina en blanco?
                                    UpdateContext({TextoAdvertencia: "Debe indicar la MAQUINA con la que esta trabajando"});
                                    UpdateContext({Mostra: true}),
                                    IsBlank(
                                        LookUp(
                                            Maquinas,
                                            Maquina = Upper(txt_Maquina_HxH2.Text)
                                        )
                                    ),//Maquina Existe?
                                    UpdateContext({TextoAdvertencia: "La MAQUINA no existe"});
                                    UpdateContext({Mostra: true}),
                                    LookUp(
                                        Maquinas,
                                        Maquina = Upper(txt_Maquina_HxH2.Text)
                                    ).Status = "Paro",//Maquina en paro?
                                    UpdateContext({TextoAdvertencia: "La MAQUINA seleccionada esta en Paro"});
                                    UpdateContext({Mostra: true}),
                                  //Validacion de tarima
                                    IsBlank(txt_Tarima_HxH2.Text),//Tarima en blanco?
                                    UpdateContext({TextoAdvertencia: "Debe indicar la TARIMA que se esta llenando"});
                                    UpdateContext({Mostra: true}),
                                    (Len(txt_Tarima_HxH2.Text) < 3 || Not(
                                        Left(
                                            txt_Tarima_HxH2.Text,
                                            1
                                        ) in [
                                            "T",
                                            "t"
                                        ]
                                    )) || !IsNumeric(
                                        Mid(
                                            txt_Tarima_HxH2.Text,
                                            2,
                                            Len(txt_Tarima_HxH2.Text) - 1
                                        )
                                    ),//Formato valido?
                                    UpdateContext({TextoAdvertencia: "El formato de la TARIMA es invalido"});
                                    UpdateContext({Mostra: true}),
                                  //Validacion Hora y operario
                                    IsBlank(drp_Hora_HxH2.SelectedText),
                                    UpdateContext({TextoAdvertencia: "Debe indicar la HORA del registro"});
                                    UpdateContext({Mostra: true}),
                                    IsBlank(drp_Operario_HxH2.SelectedText),
                                    UpdateContext({TextoAdvertencia: "Debe indicar al OPERARIO que se le esta haciendo el registro"});
                                    UpdateContext({Mostra: true}),
                                  //Validacion Turno
                                    txt_Turno_HxH2.Text in [
                                        "LIBRE",
                                        "TV",
                                        "TF"
                                    ],//Turno igual a LIBRE o TV o TF?
                                    UpdateContext({TextoAdvertencia: "No puede guardar registros en turno " & txt_Turno_HxH2.Text & "."});
                                    UpdateContext({Mostra: true}),
                                  //Validacion Cantidad
                                    !IsNumeric(txt_CantDañada_HxH2.Text) || !IsNumeric(txt_CantProducida_HxH2.Text),
                                    UpdateContext({TextoAdvertencia: "Las cantidades deben ser NÚMERICAS"});
                                    UpdateContext({Mostra: true}),
                                    Value(txt_CantDañada_HxH2.Text) < 0 || Value(txt_CantProducida_HxH2.Text) < 0,
                                    UpdateContext({TextoAdvertencia: "Las cantidades NO pueden ser NEGATIVAS"});
                                    UpdateContext({Mostra: true}),
                                    If(
                                        ((txt_CantProducida_HxH2.Text + txt_CantDañada_HxH2.Text) + txt_CantTotal_HxH2.Text) >= Value(txt_CantMax_HxH2.Text),
                                        Notify(
                                            "La cantidad total de la Orden junto a la operación seleccionada ha cumplido con la cantidad maxima deseada.",
                                            NotificationType.Information
                                        )
                                    );
                                    LookUp(
                                        Maquinas,
                                        Maquina = Upper(txt_Maquina_HxH2.Text)
                                    ).Guns = "SI" && ((txt_CantProducida_HxH2.Text + txt_CantDañada_HxH2.Text) + txt_CantTarima_HxH2.Text) > 50,
                                    UpdateContext({TextoAdvertencia: "La cantidad digitada supera la cantidad maxima (50) permitida por tarima. Por favor revisar la informacion digitada."});
                                    UpdateContext({Mostra: true}),
                                  //Validadcion de registros
                                    CountRows(
                                        Filter(
                                            'Hora X Hora',
