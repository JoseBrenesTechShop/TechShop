            {
                FechaSup: DateTimeValue(
                    Text(
                        Today(),
                        "[$-en-US]yyyy-mm-dd"
                    ) & " 12:00:00"
                ),
                Fecha1: DateTimeValue(
                    Text(
                        Today(),
                        "[$-en-US]yyyy-mm-dd"
                    ) & " 00:00:00"
                ),
                Fecha2: DateTimeValue(
                    Text(
                        Today(),
                        "[$-en-US]yyyy-mm-dd"
                    ) & " 23:59:59"
                ),
                FechaHorario: DateValue(Today())
