                        - btn_Guardar_HxHR:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Color: =RGBA(255, 255, 255, 1)
                              DisplayMode: =If(Eliminar, DisplayMode.View, DisplayMode.Edit)
                              Fill: =RGBA(40, 134, 222, 1)
                              FontWeight: =FontWeight.Bold
                              Height: =54
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =RGBA(15, 108, 189, 1)
                              OnSelect: |-
                                =If(
                                    tbl_Info_HxHR.Selected.FechaRegistro <= DateTimeValue(Text(Today(), "[$-en-US]yyyy-mm-dd") & " 23:59") && tbl_Info_HxHR.Selected.FechaRegistro >= DateTimeValue(Text(Today() - 5, "[$-en-US]yyyy-mm-dd") & " 00:00"),
                                    UpdateContext(
                                        {
                                            InfoVieja: {
                                                codigo: tbl_Info_HxHR.Selected.CodigoEmpleado,
                                                fechaRegsitro: tbl_Info_HxHR.Selected.FechaRegistro,
                                                fecha1: DateTimeValue(Text(tbl_Info_HxHR.Selected.FechaRegistro, "[$-en-US]yyyy-mm-dd") & " 00:00"),
                                                fecha2: DateTimeValue(Text(tbl_Info_HxHR.Selected.FechaRegistro, "[$-en-US]yyyy-mm-dd") & " 23:59"),
                                                hour: tbl_Info_HxHR.Selected.Hora,
                                                semana: tbl_Info_HxHR.Selected.Semana,
                                                maquina: tbl_Info_HxHR.Selected.Maquina,
                                                turno: tbl_Info_HxHR.Selected.Turno,
                                                estado: LookUp(
                                                    Orden_Ejecucion,
                                                    Orden = tbl_Info_HxHR.Selected.Orden && Operacion = tbl_Info_HxHR.Selected.Operacion,
                                                    'Permiso_1.5'
                                                )
                                            }
                                        }
                                    );
                                    UpdateContext(
                                        {
                                            InfoNueva: {
                                                codigo: tbl_Info_HxHR.Selected.CodigoEmpleado,
                                                fecha: FechaSup,
                                                hour: drpHoraSupervisorHxH_1.SelectedText.'data-ADB4D7A662F548B49FAC2B986E348A1BValor',
                                                semana: tbl_Info_HxHR.Selected.Semana,
                                                maquina: tbl_Info_HxHR.Selected.Maquina,
                                                turno: tbl_Info_HxHR.Selected.Turno
                                            }
                                        }
                                    );
                                    UpdateContext(
                                        {
                                            OrdenEjecucion: LookUp(
                                                Orden_Ejecucion,
                                                Orden = tbl_Info_HxHR.Selected.Orden && Operacion = tbl_Info_HxHR.Selected.Operacion
                                            )
                                        }
                                    );
                                    UpdateContext(
                                        {
                                            OrdenTarima: LookUp(
                                                Orden_Tarimas,
                                                Orden = tbl_Info_HxHR.Selected.Orden && Operacion = tbl_Info_HxHR.Selected.Operacion && Tarima = tbl_Info_HxHR.Selected.Tarima
                                            )
                                        }
                                    );
                                    UpdateContext({ProTotal: OrdenEjecucion.CantidadTotalProducida - tbl_Info_HxHR.Selected.Cantidad});
                                    UpdateContext({TarimaTotal: OrdenTarima.CantidadTotalProducida - tbl_Info_HxHR.Selected.Cantidad});
                                    If(
                                        IsBlank(txt_Cantidad_HxHR.Text),
                                        Notify(
                                            "La cantidad no puede estar vacia",
                                            NotificationType.Error
                                        ),
                                        If(
                                            Value(txt_CantProducida_HxH.Text) < 0 || Left(
                                                txt_CantProducida_HxH.Text,
                                                1
                                            ) = "-",
                                            Notify(
                                                "La cantidad no puede ser negativa",
                                                NotificationType.Error
                                            ),
                                            If(
                                                Hour(Now()) < drpHoraSupervisorHxH_1.SelectedText.'data-ADB4D7A662F548B49FAC2B986E348A1BValor' && Text(
                                                    Now(),
                                                    "mm/dd/yyyy"
                                                ) = drp_Fecha_HxHR.SelectedText.Value,
                                                Notify("No puede agregar datos en horas futuras"),
                                                If(
                                                    LookUp(
                                                        Maquinas,
                                                        Maquina = tbl_Info_HxHR.Selected.Maquina
                                                    ).Guns = "SI" && TarimaTotal + Value(txt_Cantidad_HxHR.Text) > 50,
                                                    UpdateContext({Aviso: true}),
                                                    If(
                                                        ProTotal + Value(txt_Cantidad_HxHR.Text) >= OrdenEjecucion.Cantidad + (OrdenEjecucion.Cantidad * 0.015) && InfoVieja.estado <> "Aprobado",
                                                        If(
                                                            IsBlank(
                                                                LookUp(
                                                                    'RegistroOredenes_1.5_1',
                                                                    Orden = tbl_Info_HxHR.Selected.Orden && Operacion = tbl_Info_HxHR.Selected.Operacion
                                                                )
                                                            ),
                                                            Collect(
                                                                'RegistroOredenes_1.5_1',
                                                                {
                                                                    Orden: tbl_Info_HxHR.Selected.Orden,
                                                                    Operacion: tbl_Info_HxHR.Selected.Operacion,
                                                                    User_Solicitud: txtEmpleadoEnUso_1.Text,
                                                                    Respuesta: "En Espera"
                                                                }
                                                            ),
                                                            Remove(
                                                                'RegistroOredenes_1.5_1',
                                                                LookUp(
                                                                    'RegistroOredenes_1.5_1',
                                                                    Orden = tbl_Info_HxHR.Selected.Orden && Operacion = tbl_Info_HxHR.Selected.Operacion
                                                                )
                                                            );
                                                            Collect(
                                                                'RegistroOredenes_1.5_1',
                                                                {
                                                                    Orden: tbl_Info_HxHR.Selected.Orden,
                                                                    Operacion: tbl_Info_HxHR.Selected.Operacion,
                                                                    User_Solicitud: txtEmpleadoEnUso_1.Text,
                                                                    Respuesta: "En Espera"
                                                                }
                                                            )
                                                        );
                                                        UpdateContext({Bloqueo: true}),
                                                        /*If(
                                                            ((Value(txt_Cantidad_HxHR.Text) / Value(txt_Meta_HxHR.Text)) * 100) < 85,
                                                            UpdateContext({AvisoCausa: true}),*/
                                                        Patch(
                                                            Orden_Ejecucion,
                                                            OrdenEjecucion,
                                                            {CantidadTotalProducida: ProTotal + Value(txt_Cantidad_HxHR.Text)}
                                                        );
                                                        Patch(
                                                            Orden_Tarimas,
                                                            OrdenTarima,
                                                            {CantidadTotalProducida: TarimaTotal + Value(txt_Cantidad_HxHR.Text)}
                                                        );
                                                        Patch(
                                                            'Hora X Hora',
                                                            tbl_Info_HxHR.Selected,
                                                            {
                                                                Cantidad: Value(txt_Cantidad_HxHR.Text),
                                                                Cantidad_Por_Hora: Value(txt_Meta_HxHR.Text),
                                                                Comentario: "PRODUCCION",
                                                                Causa: "Bien",
                                                                FechaRegistro: FechaSup,
                                                                'Fecha_Registro_Supervisor ': Text(
                                                                    Text(
                                                                        FechaSup,
                                                                        "mm/dd/yyyy"
                                                                    ) & " " & drpHoraSupervisorHxH_1.SelectedText.Value
                                                                ),
                                                                Fecha_Hora: Text(
                                                                    Now(),
                                                                    "mm/dd/yyyy hh:mm AM/PM"
                                                                ),
                                                                Hora: drpHoraSupervisorHxH_1.SelectedText.'data-ADB4D7A662F548B49FAC2B986E348A1BValor'
                                                            }
                                                        );
                                                        If(
                                                            InfoNueva.hour <> InfoVieja.hour || InfoNueva.fecha <> InfoVieja.fecha,
                                                            If(
                                                                !IsBlank(
                                                                    LookUp(
                                                                        'Hora X Hora',
                                                                        CodigoEmpleado = InfoVieja.codigo && Hora = InfoVieja.hour && FechaRegistro = InfoVieja.fecha
                                                                    )
                                                                ),
                                                                Patch(
                                                                    HoraxHoraFinals,
                                                                    LookUp(
                                                                        HoraxHoraFinals,
                                                                        Codigo_Empleado = InfoVieja.codigo && Hora = InfoVieja.hour && Fecha = Text(
                                                                            InfoVieja.fecha,
                                                                            "mm/dd/yyyy"
                                                                        )
                                                                    ),
                                                                    {
                                                                        Cantidad_Producida: Sum(
                                                                            Filter(
                                                                                'Hora X Hora',
                                                                                CodigoEmpleado = InfoVieja.codigo,
                                                                                FechaRegistro >= InfoVieja.fecha1 && FechaRegistro <= InfoVieja.fecha2,
                                                                                Hora = InfoVieja.hour
                                                                            ),
                                                                            Cantidad
                                                                        ),
                                                                        Meta: Sum(
                                                                            Filter(
                                                                                'Hora X Hora',
                                                                                CodigoEmpleado = InfoVieja.codigo,
                                                                                FechaRegistro >= InfoVieja.fecha1 && FechaRegistro <= InfoVieja.fecha2,
                                                                                Hora = InfoVieja.hour
                                                                            ),
                                                                            Cantidad_Por_Hora
                                                                        ),
                                                                        Turno: InfoVieja.turno,
                                                                        Ubicacion_Bono: LookUp(
                                                                            Maquinas,
                                                                            Maquina = InfoVieja.maquina,
                                                                            Ubicacion_Bono
                                                                        ),
                                                                        Semana: InfoVieja.semana
                                                                    }
                                                                ),
                                                                Remove(
                                                                    HoraxHoraFinals,
                                                                    LookUp(
                                                                        HoraxHoraFinals,
                                                                        Codigo_Empleado = InfoVieja.codigo && Hora = InfoVieja.hour && Fecha = Text(
                                                                            InfoVieja.fecha,
                                                                            "mm/dd/yyyy"
                                                                        )
                                                                    )
                                                                )
                                                            )
                                                        );
                                                        ClearCollect(
                                                            colExistingRecord,
                                                            LookUp(
                                                                HoraxHoraFinals,
                                                                Codigo_Empleado = InfoNueva.codigo && Hora = InfoNueva.hour && Fecha = Text(
                                                                    InfoNueva.fecha,
                                                                    "mm/dd/yyyy"
                                                                )
                                                            )
                                                        );
                                                        If(
                                                            !IsEmpty(colExistingRecord),
                                                            Patch(
                                                                HoraxHoraFinals,
                                                                First(colExistingRecord),
                                                                {
                                                                    Cantidad_Producida: Sum(
                                                                        Filter(
                                                                            'Hora X Hora',
                                                                            CodigoEmpleado = InfoNueva.codigo,
                                                                            FechaRegistro >= Fecha3 && FechaRegistro <= Fecha4,
                                                                            Hora = InfoNueva.hour
                                                                        ),
                                                                        Cantidad
                                                                    ),
                                                                    Meta: Sum(
                                                                        Filter(
                                                                            'Hora X Hora',
                                                                            CodigoEmpleado = InfoNueva.codigo,
                                                                            FechaRegistro >= Fecha3 && FechaRegistro <= Fecha4,
                                                                            Hora = InfoNueva.hour
                                                                        ),
                                                                        Cantidad_Por_Hora
                                                                    ),
                                                                    Turno: InfoNueva.turno,
                                                                    Ubicacion_Bono: LookUp(
                                                                        Maquinas,
                                                                        Maquina = InfoNueva.maquina,
                                                                        Ubicacion_Bono
                                                                    ),
                                                                    Semana: InfoNueva.semana
                                                                }
                                                            ),
                                                            Collect(
                                                                HoraxHoraFinals,
                                                                {
                                                                    Codigo_Empleado: InfoNueva.codigo,
                                                                    Cantidad_Producida: Sum(
                                                                        Filter(
                                                                            'Hora X Hora',
                                                                            CodigoEmpleado = InfoNueva.codigo,
                                                                            FechaRegistro >= Fecha3 && FechaRegistro <= Fecha4,
                                                                            Hora = InfoNueva.hour
                                                                        ),
                                                                        Cantidad
                                                                    ),
                                                                    Meta: Sum(
                                                                        Filter(
                                                                            'Hora X Hora',
                                                                            CodigoEmpleado = InfoNueva.codigo,
                                                                            FechaRegistro >= Fecha3 && FechaRegistro <= Fecha4,
                                                                            Hora = InfoNueva.hour
                                                                        ),
                                                                        Cantidad_Por_Hora
                                                                    ),
                                                                    Fecha_Registro: InfoNueva.fecha,
                                                                    Turno: InfoNueva.turno,
                                                                    Hora: InfoNueva.hour,
                                                                    Ubicacion_Bono: LookUp(
                                                                        Maquinas,
                                                                        Maquina = InfoNueva.maquina,
                                                                        Ubicacion_Bono
                                                                    ),
                                                                    Semana: InfoNueva.semana,
                                                                    Fecha: Text(
                                                                        InfoNueva.fecha,
                                                                        "mm/dd/yyyy"
                                                                    )
                                                                }
                                                            )
                                                        );
                                                        Refresh('Hora X Hora');
                                                        SubmitForm(frm_Info_HxHR);
                                                        ResetForm(frm_Info_HxHR);
                                                        UpdateContext({Mostra: false})
                                                    )
                                                )
                                            )
                                        )
                                    ),
                                    Notify("No se pueden editar registros de mas de 5 dias", NotificationType.Error)
                                )
                              Text: ="Guardar Cambios"
                              Width: =175
                              X: =7
                              Y: =597
