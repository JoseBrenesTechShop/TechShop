                        UpdateContext({ProTotal: OrdenEjecucion.CantidadTotalProducida - tbl_Info_HxHR.Selected.Cantidad});
                        UpdateContext({TarimaTotal: OrdenTarima.CantidadTotalProducida - tbl_Info_HxHR.Selected.Cantidad});
