                                        FechaRegistro = FechaSup,
                                        Hora = InfoNueva.hour
                                    ),
                                    Cantidad_Por_Hora
                                ),
                                Turno: InfoNueva.turno,
                                Ubicacion_Bono: LookUp(
                                    Maquinas,
                                    Maquina = InfoNueva.maquina,
                                    Ubicacion_Bono
                                ),
                                Semana: InfoNueva.semana
                            }
                        ),
                        Collect(
                            HoraxHoraFinals,
                            {
                                Codigo_Empleado: InfoNueva.codigo,
                                Cantidad_Producida: Sum(
                                    Filter(
                                        'Hora X Hora',
                                        CodigoEmpleado = InfoNueva.codigo,
                                        FechaRegistro = FechaSup,
                                        Hora = InfoNueva.hour
                                    ),
