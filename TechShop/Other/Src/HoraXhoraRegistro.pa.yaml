                                ),
                                Semana: InfoNueva.semana,
                                Fecha: Text(
                                    InfoNueva.fecha,
                                    "mm/dd/yyyy"
                                )
                            }
                        )
                    );
                    Refresh('Hora X Hora');
                    UpdateContext({AvisoCausa: false});
                    UpdateContext({Bloqueo: false});
                    UpdateContext({Mostra: false})
