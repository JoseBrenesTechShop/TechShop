Screens:
  Screen2:
    Properties:
      BackgroundImage: ='abstracto geométrico blanco y gris'
      ImagePosition: =ImagePosition.Fill
    Children:
      - TextInput12:
          Control: Classic/TextInput@2.3.2
          Properties:
            X: =215
            Y: =52
      - TextInput12_1:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: =First(codigoSlit).Value
            Width: =279
            X: =215
            Y: =160
      - TextInput12_2:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: =Last(FirstN(codigoSlit, 2)).Value
            X: =523
            Y: =160
      - TextInput12_3:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: =Last(codigoSlit).Value
            X: =866
            Y: =160
      - TextInput12_4:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: |-
              =Substitute(
                          Substitute(
                              Upper(
                                  TextInput12.Text
                              ),
                              "&",
                              "/"
                          ),
                          "'",
                          "-"
                      )
            OnChange: |-
              =UpdateContext(
                  {
                      codigoSlit: Split(
                          Self.Text,
                          "/"
                      )
                  }
              )
            X: =578
            Y: =52
      - TextInput12_5:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: |-
              =If(
                  Find(
                      "/",
                      TextInput12_4.Text
                  ) > 0,
                  Mid(
                      TextInput12_4.Text,
                      Find(
                          "/",
                          TextInput12_4.Text
                      ) + 1
                  ),
                  Blank()
              )
            OnChange: |-
              =UpdateContext(
                  {
                      codigoSlit: Split(
                          Self.Text,
                          "/"
                      )
                  }
              )
            X: =927
            Y: =52
      - TextInput12_6:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: =First(codigoSlit).Value
            X: =494
            Y: =407
