            - btn_AcepEliminar_HxHR_1:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =RGBA(233, 79, 76, 1)
                  Font: =Font.'Open Sans'
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =RGBA(138, 10, 10, 1)
                  OnSelect: |
                    =If(
                        tbl_Info_HxHR2.Selected.FechaRegistro <= DateTimeValue(
                            Text(
                                Today(),
                                "[$-en-US]yyyy-mm-dd"
                            ) & " 23:59"
                        ) && tbl_Info_HxHR2.Selected.FechaRegistro >= DateTimeValue(
                            Text(
                                Today() - 5,
                                "[$-en-US]yyyy-mm-dd"
                            ) & " 00:00"
                        ),
                        UpdateContext(
                            {
                                OrdenEjecucion: LookUp(
                                    Orden_Ejecucion,
                                    Orden = tbl_Info_HxHR2.Selected.Orden && Operacion = tbl_Info_HxHR2.Selected.Operacion
                                )
                            }
                        );
                        UpdateContext(
                            {
                                OrdenTarima: LookUp(
                                    Orden_Tarimas,
                                    Orden = tbl_Info_HxHR2.Selected.Orden && Operacion = tbl_Info_HxHR2.Selected.Operacion && Tarima = tbl_Info_HxHR2.Selected.Tarima
                                )
                            }
                        );
                        UpdateContext(
                            {
                                ProTotal: OrdenEjecucion.CantidadTotalProducida - (tbl_Info_HxHR2.Selected.Cantidad + tbl_Info_HxHR2.Selected.Scrap),
                                TarimaTotal: OrdenTarima.CantidadTotalProducida - (tbl_Info_HxHR2.Selected.Cantidad + tbl_Info_HxHR2.Selected.Scrap)
                            }
                        );
                        Patch(
                            Orden_Ejecucion,
                            OrdenEjecucion,
                            {CantidadTotalProducida: ProTotal}
                        );
                        Patch(
                            Orden_Tarimas,
                            OrdenTarima,
                            {CantidadTotalProducida: TarimaTotal}
                        );
                        UpdateContext(
                            {
                                RecordHerramienta: Filter(
                                    Herramientas,
                                    Maquina = Upper(tbl_Info_HxHR2.Selected.Maquina),
                                    Operacion = tbl_Info_HxHR2.Selected.Operacion,
                                    Cant_Actual > 0
                                )
                            }
                        );
                        ForAll(
                            RecordHerramienta,
                            With(
                                {
                                    Herra: ThisRecord,
                                    cantNew: (ThisRecord.Cant_Actual - (tbl_Info_HxHR2.Selected.Cantidad + tbl_Info_HxHR2.Selected.Scrap)) + Cantidad
                                },
                                Patch(
                                    Herramientas,
                                    Herra,
                                    {
                                        Cant_Actual: If(
                                            cantNew < 0,
                                            0,
                                            cantNew
                                        )
                                    }
                                )
                            )
                        );
                        UpdateContext(
                            {
                                RecordControladorHerramienta: Filter(
                                    Controlador_Herramientas,
                                    Orden = tbl_Info_HxHR2.Selected.Orden,
                                    Operacion = tbl_Info_HxHR2.Selected.Operacion,
                                    Maquina = Upper(tbl_Info_HxHR2.Selected.Maquina),
                                    Produccion_Hecha > 0
                                )
                            }
                        );
                        ForAll(
                            RecordControladorHerramienta,
                            With(
                                {
                                    Herra: ThisRecord,
                                    cantNew: (ThisRecord.Produccion_Hecha - (tbl_Info_HxHR2.Selected.Cantidad + tbl_Info_HxHR2.Selected.Scrap)) + Cantidad
                                },
                                Patch(
                                    Controlador_Herramientas,
                                    Herra,
                                    {
                                        Produccion_Hecha: If(
                                            cantNew < 0,
                                            0,
                                            cantNew
                                        )
                                    }
                                )
                            )
                        );
                        Remove(
                            'Hora X Hora',
                            tbl_Info_HxHR2.Selected
                        );
                        Refresh('Hora X Hora');
                        UpdateContext(
                            {
                                Mostra: false,
                                Aviso: false,
                                AvisoCausa: false,
                                Bloqueo: false,
                                Disable: false,
                                Eliminar: false
                            }
                        ),
                        Notify(
                            "No se pueden eliminar registros de mas de 5 dias",
                            NotificationType.Error
                        )
                    );
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Text: ="Eliminar"
                  X: =233
                  Y: =83
