        =UpdateContext({infoMaquina: glr_Maquinas_PM.Selected});
        UpdateContext(
            {
                info: {
                    Maquina: infoMaquina.Maquina,
                    Orden: infoMaquina.Orden,
                    Operacion: infoMaquina.Operacion,
                    Maquinado: LookUp(
                        CorPJobOper,
                        job = infoMaquina.Orden && oper_numFrom = Value(infoMaquina.Operacion),
                        TMaquinado
