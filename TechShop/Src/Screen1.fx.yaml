Screen1 As screen:
    Fill: =Color.White
    LoadingSpinnerColor: =App.Theme.Colors.Primary
    OnVisible: |-
        =
        UpdateContext({VarTime: false});
        UpdateContext({VarTime2: false});
        Reset(Timer1);
        Reset(Timer1_1);
        UpdateContext({VarTime: true})

    Image1 As image:
        BorderColor: =App.Theme.Colors.Darker40
        DisabledBorderColor: =RGBA(166, 166, 166, 1)
        DisabledFill: =RGBA(244, 244, 244, 1)
        Height: =768
        Image: ='fireworks-happy4th-of-july'
        ImagePosition: =ImagePosition.Fill
        Width: =1366
        ZIndex: =1

    Label3_11 As label:
        Align: =Align.Center
        BorderColor: =RGBA(0, 18, 107, 1)
        Color: =RGBA(255, 209, 3, Timer1_1.Value/Timer1_1.Duration)
        DisabledColor: =RGBA(166, 166, 166, 1)
        DisplayMode: =DisplayMode.View
        FontWeight: =FontWeight.Bold
        Height: =261
        Size: =60
        Text: =LookUp(Empleados, VarName = Codigo, Nombre)
        VerticalAlign: =VerticalAlign.Top
        Width: =1239
        X: =63
        Y: =253
        ZIndex: =3

    Timer1 As timer:
        DisplayMode: =DisplayMode.View
        Duration: =800
        Fill: =RGBA(56, 96, 178, 1)
        HoverColor: =RGBA(255, 255, 255, 1)
        HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
        OnTimerEnd: |-
            =UpdateContext({VarTime2: true})
        Start: =VarTime
        Visible: =false
        X: =579
        Y: =40
        ZIndex: =4

    Timer1_1 As timer:
        DisplayMode: =DisplayMode.View
        Duration: =5000
        Fill: =RGBA(56, 96, 178, 1)
        HoverColor: =RGBA(255, 255, 255, 1)
        HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
        OnTimerEnd: =Navigate(MenuPrincipal, ScreenTransition.Cover)
        Start: =VarTime2
        Visible: =false
        X: =579
        Y: =106
        ZIndex: =5

    Label3_4 As label:
        Align: =Align.Center
        BorderColor: =RGBA(0, 18, 107, 1)
        Color: =RGBA(255, 209, 3, Timer1.Value/1000)
        DisabledColor: =RGBA(166, 166, 166, 1)
        DisplayMode: =DisplayMode.View
        FontWeight: =FontWeight.Bold
        Height: =155
        Size: =70
        Text: ="¡Feliz año nuevo!"
        Width: =913
        X: =223
        Y: =48
        ZIndex: =6

    Label3_5 As label:
        Align: =Align.Center
        BorderColor: =RGBA(0, 18, 107, 1)
        Color: =RGBA(255, 209, 3, Timer1.Value/1000)
        DisabledColor: =RGBA(166, 166, 166, 1)
        DisplayMode: =DisplayMode.View
        FontWeight: =FontWeight.Bold
        Height: =213
        Size: =40
        Text: |-
            ="
            ¡Techshop te desea un próspero y exitoso Año Nuevo, lleno de logros y nuevas oportunidades!"
        Width: =1283
        X: =41
        Y: =539
        ZIndex: =7

