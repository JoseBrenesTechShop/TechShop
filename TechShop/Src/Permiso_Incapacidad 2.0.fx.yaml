        Icon8_3 As icon.CheckBadge:
            BorderColor: =App.Theme.Colors.Darker40
            Color: =App.Theme.Colors.Darker30
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisabledColor: =RGBA(244, 244, 244, 1)
            HoverFill: =RGBA(180, 214, 250, 1)
            Icon: =Icon.CheckBadge
            OnSelect: |-
                =Set(varFirmaJefeIncapacidad, JSON(pnl_FirmaJefe_PI.Image, JSONFormat.IncludeBinaryData));
                If(
                    VarName <> "yaraya@tsicr.com" && VarName <> "respinoza@tsicr.com", 
                    CorreoConPDF.Run(
                        PdfIncapacidad_2.HtmlText,
                        LookUp(
                            Empleados,
                            Codigo = VarName,
                            Correo
                        ),
                        "Revisión de Solicitudes",
                        "Estimado/a,<br><br>" &
                        "Se ha aprobado la solicitud del colaborador " & txtNombre_Incapacidad_1.Value & 
                        ", con el ID " & txtCodigoEmpleado_Incapacidad_1.Value & 
                        ".<br><br>" &
                        "La solicitud aprobada comprende un total de " & txtDiasSolicitados_Incapacidad_1.Value & 
                        " días, con fecha de inicio " & dateFechaInicio_Incapacidad_1.SelectedDate & 
                        " y fecha de fin " & dateFechaFin_Incapacidad_1.SelectedDate & 
                        ".<br><br>" &
                        "Para obtener más detalles sobre la solicitud aceptada, por favor, consulte el PDF adjunto o revise la solicitud desde el módulo correspondiente.<br><br>" &
                        "Gracias,<br>"
                    );
                );
                
                
                CorreoConPDF.Run(
                 PdfIncapacidad_2.HtmlText,
                    "yaraya@tsicr.com; respinoza@tsicr.com",
                     "Revisión de Solicitudes",
                        "Estimado/a,<br><br>" &
                        "Se ha aprobado la solicitud del colaborador " & txtNombre_Incapacidad_1.Value & 
                        ", con el ID " & txtCodigoEmpleado_Incapacidad_1.Value & 
                        ".<br><br>" &
                        "La solicitud aprobada comprende un total de " & txtDiasSolicitados_Incapacidad_1.Value & 
                        " días, con fecha de inicio " & dateFechaInicio_Incapacidad_1.SelectedDate & 
                        " y fecha de fin " & dateFechaFin_Incapacidad_1.SelectedDate & 
                        ".<br><br>" &
                        "Para obtener más detalles sobre la solicitud aceptada, por favor, consulte el PDF adjunto o revise la solicitud desde el módulo correspondiente.<br><br>" &
                        "Gracias,<br>"
                );
                
                
                
                
                UpdateContext({ConVisible: false});
                UpdateContext({ModeBoton: false});
                Patch(
                    TramitesSolicitudes,
                    Defaults(TramitesSolicitudes),
                    {
                        Nombre: Left(txtNombre_Incapacidad_1.Value, 20),
                        Codigo: Left(txtCodigoEmpleado_Incapacidad.Value, 20),
                        Solicitud: dropSolicitud_Incapacidad.SelectedText.Value,
                        Institucion: dropInstitucion_Incapacidad.SelectedText.Value,
                        NumDocumento: Left(txtNumDocumento_Incapacidad.Value, 20),
                        DiasSolicitados: Value(txtDiasSolicitados_Incapacidad.Value),
                        Fecha_Inicio: dateFechaInicio_Incapacidad.SelectedDate,
                        Fecha_Fin: dateFechaFin_Incapacidad.SelectedDate,
                        Motivo: Left(txtMotivo_Incapacidad.Value, 100),
                        OtraInstitucion: Left(txtOtraInstitucion_Incapacidad.Value, 20),
                        FechaTramite: txtFechaTramite_Incapacidad.Value,
                        FirmaJefes: pnFirmaJefe.Image,
                        JefeDirecto: LookUp(Empleados, Codigo = VarName, Nombre),
                        EstadoDeProceso: "Aprobado",
                        Departamento:LookUp(Empleados, Codigo = txtCodigoEmpleado_Incapacidad.Value, Departamento),
                        Puesto:LookUp(Empleados, Codigo = txtCodigoEmpleado_Incapacidad.Value, Puesto)
                    }
                );
                ResetForm(ApprovalForm1_2);
                Notify("Datos guardados correctamente", NotificationType.Success);
                
                UpdateContext({Continuar: false})
