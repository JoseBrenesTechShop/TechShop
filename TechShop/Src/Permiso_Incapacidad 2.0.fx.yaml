                "<meta name='viewport' content='width=device-width, initial-scale=1.0'>",
                "<title>Trámite para Permisos y Solicitudes de Vacaciones</title>",
                "<style>",
                "body { font-family: Arial, sans-serif; margin: 20px; }",
                "h1 { color: #333; font-weight: bold; margin-bottom: 10px; text-align: center; }",
                "table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }",
                "td { border: 1px solid #ddd; padding: 8px; text-align: left; }",
                "th { background-color: #87CEFA; border: 1px solid #ddd; padding: 8px; text-align: left; }",
                "</style>",
                "</head>",
                "<body>",
                  "<table style='width: 100%; border: none;'>",
               "<tr>",
                "<td style='width: 50%; text-align: left; padding: 0;'>",
                "<img src=", LogotipoTechShop, " style='width: 200px;'></img>",
                "</td>",
                "<td style='width: 50%; text-align: right; padding: 0;'>",
                   "<div style='text-align: right; margin-right: 20px;'>",
                        "<h3 style='margin: 0;'>FO-CH-01</h3>",
                    "</div>",
                "</td>",
            "</tr>",
                "</table>",
                "<h1>TRAMITE PARA PERMISOS, VACACIONES E INCAPACIDADES</h1>",
                "<table>",
                "<tr>",
                "<td>Fecha: ",
                txtFechaTramite_Incapacidad_1.Value,
                "</td>",
                "<td>Código de empleado: ",
                txtCodigoEmpleado_Incapacidad_1.Value,
                "</td>",
                "</tr>",
                "<tr>",
                "<td colspan='2'>Estado: Aprobado",
                "</td>",
                "</tr>",
                "</table>",
                "<h1>Detalles de Solicitud</h1>",
                "<table>",
                "<tr>",
                "<td><strong>Nombre completo:</strong> ",
                txtNombre_Incapacidad_1.Value,
                "</td>",
                "<td><strong>Tipo de solicitud:</strong> ",
                dropSolicitud_Incapacidad.SelectedText.Value,
                "</td>",
                "</tr>",
                "<tr>",
                "<td><strong>Fecha de inicio:</strong> ",
                dateFechaInicio_Incapacidad.SelectedDate,
                "</td>",
                "<td><strong>Fecha de fin:</strong> ",
