                                        mensajeNotificacion: If(
                                            IsEmpty(Contenedores),
                                            "No hay datos en la tabla Contenedores para guardar.",
                                            If(
                                                WeekNum(dt_FechaSalida_EM.SelectedDate, StartOfWeek.Monday) < WeekNum(Today(), StartOfWeek.Monday) || 
                                                Year(dt_FechaSalida_EM.SelectedDate) < Year(Today()),
                                                "No se puede agregar, la fecha de salida pertenece a una semana anterior. Por favor cambiar a una fecha de la semana actual",
                                                "La fecha y el país son obligatorios."
                                            )
                                        ),
                                        MostrarAviso: true,
                                        Disable: true
                                    }
                                ),
                                UpdateContext({ isSaving: true }),
                            
                                ForAll(
                                    Contenedores,
                                    Collect(
                                        Contenedors,
                                        {
