Solicitud_Gerencia_NoAprobadas As screen:
    BackgroundImage: ='abstracto geométrico blanco y gris'
    Fill: =Color.White
    ImagePosition: =ImagePosition.Fill
    LoadingSpinnerColor: =App.Theme.Colors.Primary
    OnVisible: |
        =UpdateContext({Guardando: true});
        ClearCollect(
            datos_SGN,
            AddColumns(
                Distinct(
                    Filter(
                        Compras_NoMarcadas,
                        Enviado = 0,
                        If(
                            varEmpleado.Codigo in [
                                "16",
                                "15",
                                "2618",
                                "1124",
                                "1133",
                                "2648"
                            ],
                            Tipo_Envio = varEmpleado.Codigo,
                            Tipo_Envio <> "Compras" && Tipo_Envio <> "Aprobado"
                        )
                    ),
                    NSolicitud
                ),
                fecha,
                With(
                    {},
                    LookUp(
                        preq,
                        req_num = Value,
                        req_date
                    )
                ),
                total,
                Sum(
                    Filter(
                        Filter(
                            preqitem,
                            req_num = Value
                        ),
                        req_line in Filter(
                            Compras_NoMarcadas,
                            Enviado = 0,
                            If(
                                varEmpleado.Codigo in [
                                    "16",
                                    "15",
                                    "2618",
                                    "1124",
                                    "1133",
                                    "2648"
                                ],
                                Tipo_Envio = varEmpleado.Codigo,
                                Tipo_Envio <> "Compras" && Tipo_Envio <> "Aprobado"
                            )
                        ).NFilaSolicitud
                    ),
                    qty_ordered * unit_mat_cost
                ),
                solicitante,
                With(
                    {},
                    If(
                        !IsBlank(
                            LookUp(
                                preq,
                                req_num = Value,
                                requester
                            )
                        ),
                        With(
                            {
                                email: LookUp(
                                    preq,
                                    req_num = Value,
                                    requester
                                ),
                                name: First(
                                    Filter(
                                        Empleados,
                                        Left(
                                            Correo,
                                            Find(
                                                "@",
                                                Correo
                                            ) - 1
                                        ) = LookUp(
                                            preq,
                                            req_num = Value,
                                            requester
                                        )
                                    )
                                ).Nombre
                            },
                            If(
                                IsBlank(name),
                                email,
                                name
                            )
                        ),
                        "Sin correo"
                    )
                )
            )
        );
        UpdateContext({Guardando: false});

