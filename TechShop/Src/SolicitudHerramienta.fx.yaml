                btn_buscar_SH_1 As Botón:
                    Align: =Align.Center
                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                    BorderColor: =RGBA(9, 33, 98, 1)
                    BorderRadiusBottomLeft: =15
                    BorderRadiusBottomRight: =15
                    BorderRadiusTopLeft: =15
                    BorderRadiusTopRight: =15
                    BorderStyle: =BorderStyle.Solid
                    BorderThickness: =2
                    DisplayMode: =If(Disable, DisplayMode.Disabled, DisplayMode.Edit)
                    Font: =Font.Arial
                    FontSize: =20
                    Height: =45
                    Icon: ="Search"
                    IconStyle: ='ButtonCanvas.IconStyle'.Filled
                    OnSelect: |
                        =// Verifica si el campo de búsqueda de pieza está en blanco
                        If(
                            IsBlank(txt_BuscarPieza_SH_3.Text),
                            Notify("Por favor, ingresa un código de pieza para buscar.", NotificationType.Warning),
                            // Si no está en blanco, continúa con la búsqueda
                            Set(
                                insertoEsFueraDeRuta,
                                IsBlank(
                                    LookUp(
                                        jobmatl,
                                        job = LookUp(Maquina_Ordens_1, Maquina = txt_Maquina_SH_1.Text, Orden) &&
                                        oper_num = Value(LookUp(Maquina_Ordens_1, Maquina = txt_Maquina_SH_1.Text, Operacion)) &&
                                        item = txt_BuscarPieza_SH_3.Text
                                    )
                                )
                            );
                        
                            // Actualiza el contexto con la información del inserto
                            UpdateContext(
                                {
                                    ruta: LookUp(
                                        jobmatl,
                                        item = txt_BuscarPieza_SH_3.Text
                                    )
                                }
                            );
                        
                            // Verifica si la ruta está vacía después de la búsqueda
                            If(
                                IsBlank(ruta),
                                Notify("El inserto no existe en la base de datos.", NotificationType.Error),
                                // Si se encuentra la ruta, continúa con la recolección
                                With(
                                    {
                                        Cant_de_Inserto: 0,
                                        Cant_X_Inserto: 0,
                                        Cantidad_Actual: Coalesce(
                                            LookUp(
                                                Herramientas,
                                                Maquina = txt_Maquina_SH_1.Text && Orden = ruta.job && Operacion = Text(ruta.oper_num) && ID_Inserto = ruta.item
                                            ).Cant_Actual,
                                            0
                                        )
                                    },
                        
                                    Collect(
                                        Materiales,
                                        {
                                            item: ruta.item,
                                            description: ruta.description,
                                            Cant_x_Inserto: Text(Cant_X_Inserto),
                                            Cant_Inserto: Text(Cant_de_Inserto),
                                            Cant_Maxima: Text(Cant_X_Inserto * Cant_de_Inserto),
                                            Cant_Actual: Text(Cantidad_Actual),
                                            QTY: ruta.matl_qty,
                                            job: ruta.job,
                                            oper_num: Value(ruta.oper_num),
                                            VerificacionInserto: Text(Cant_de_Inserto),
                                            esFueraDeRuta: insertoEsFueraDeRuta
                                        }
                                    );
                        
                                    // Notifica si el inserto fue agregado o si es fuera de ruta
                                    If(
                                        insertoEsFueraDeRuta,
                                        Notify("El inserto fue agregado, pero no pertenece a la ruta especificada.", NotificationType.Warning),
                                        Notify("Inserto agregado correctamente a la ruta.", NotificationType.Success)
                                    )
                                )
                            )
                        )
