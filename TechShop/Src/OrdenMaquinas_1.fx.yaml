                                )
                            ),
                            Fecha_Fin: Blank(),
                            Jornada: drp_Joranada_OM.SelectedText.Valor,
                            Horas: Value(txt_Horas_OM.Text),
                            Dias: Value(txt_Dias_OM.Text),
                            Zona: drp_Zona_OM.SelectedText.Texto
                        }
                    )
                );
                //Guarda, edita o elimina las maquinas de la orden
                ForAll(
                    MaquinasList,
                    With(
