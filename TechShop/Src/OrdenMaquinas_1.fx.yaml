                =If(
                    !IsEmpty(MaquinaRemplazo),
                    ForAll(
                        OrdenRemplazo,
                        With(
                            {
                                // Obtiene la primera prioridad disponible que no esté en uso y no sea 1
                                NewPri: If(
                                    IsEmpty(
                                        Filter(
                                            Prioridades,
                                            !(Value in Filter(
                                                Orden_MaquinasLists_1,
                                                Maquina in Filter(
                                                    Orden_MaquinasLists_1,
                                                    Orden = ThisRecord.Orden,
                                                    Operacion = ThisRecord.Operacion
                                                ).Maquina
                                            ).Prioridad) && Value <> 1
                                        )
                                    ),
                                    Max(
                                        Filter(
                                            Orden_MaquinasLists_1,
                                            Maquina in Filter(
                                                Orden_MaquinasLists_1,
                                                Orden = ThisRecord.Orden,
                                                Operacion = ThisRecord.Operacion
                                            ).Maquina
                                        ),
                                        Prioridad
                                    ) + 1,
                                    First(
                                        Filter(
                                            Prioridades,
                                            !(Value in Filter(
                                                Orden_MaquinasLists_1,
                                                Maquina in Filter(
                                                    Orden_MaquinasLists_1,
                                                    Orden = ThisRecord.Orden,
                                                    Operacion = ThisRecord.Operacion
                                                ).Maquina
                                            ).Prioridad) && Value <> 1
                                        )
                                    ).Value
                                ),
                                ORD: ThisRecord.Orden,
                                OP: ThisRecord.Operacion
                            },
                            Collect(
                                infoOrdenAntigua,
                                LookUp(
                                    Orden_Maquinas_1,
                                    Orden = ORD && Operacion = OP
                                )
                            );
                            Patch(
                                Orden_Maquinas_1,
                                LookUp(
                                    Orden_Maquinas_1,
                                    Orden = ORD && Operacion = OP
                                ),
                                {Prioridad: If(
                                    IsEmpty(
                                        Filter(
                                            Prioridades,
                                            !(Value in Filter(
                                                Orden_MaquinasLists_1,
                                                Maquina in Filter(
                                                    Orden_MaquinasLists_1,
                                                    Orden = ORD,
                                                    Operacion = OP
                                                ).Maquina
                                            ).Prioridad) && Value <> 1
                                        )
                                    ),
                                    Max(
                                        Filter(
                                            Orden_MaquinasLists_1,
                                            Maquina in Filter(
                                                Orden_MaquinasLists_1,
                                                Orden = ORD,
                                                Operacion = OP
                                            ).Maquina
                                        ),
                                        Prioridad
                                    ) + 1,
                                    First(
                                        Filter(
                                            Prioridades,
                                            !(Value in Filter(
                                                Orden_MaquinasLists_1,
                                                Maquina in Filter(
                                                    Orden_MaquinasLists_1,
                                                    Orden = ORD,
                                                    Operacion = OP
                                                ).Maquina
                                            ).Prioridad) && Value <> 1
                                        )
                                    ).Value
                                )}
                            );
                            With(
                                {
                                    Maquinas: Filter(
                                        Orden_MaquinasLists_1,
                                        Orden = ORD,
                                        Operacion = OP
                                    )
                                },
                                ForAll(
                                    Maquinas,
                                    With(
                                        {
                                            m: ThisRecord.Maquina,
                                            Maquina: ThisRecord,
                                            ORDM: ThisRecord.Orden,
                                            OPM: ThisRecord.Operacion
                                        },
                                        Collect(
                                            InfoMaquinasAntigua,
                                            LookUp(
                                                Orden_MaquinasLists_1,
                                                Orden = ORDM && Operacion = OPM && Maquina = m
