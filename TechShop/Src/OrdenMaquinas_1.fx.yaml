                            Zona: drp_Zona_OM.SelectedText.Texto
                        }
                    ),
                    //Almacena el registro anterior de una orden antes de editarlo
                    UpdateContext(
                        {
                            RegistroOrden: LookUp(
                                Orden_Maquinas_1,
                                Orden = info.Orden && Operacion = info.Operacion
                            )
                        }
                    );
                    Patch(//Edita el registro de una orden
                        Orden_Maquinas_1,
                        LookUp(
                            Orden_Maquinas_1,
                            Orden = info.Orden && Operacion = info.Operacion
                        ),
                        {
                            Orden: info.Orden,
                            Operacion: info.Operacion,
                            'P/N': info.'P/N',
                            Meta: Value(txt_Meta_OM.Text),
                            User: txt_User_OM.Text,
                            Prioridad: Value(drp_Pri_OM.SelectedText.Value),
                            Fecha_Inicio: dp_Fecha_OM.SelectedDate,
                            Fecha_Fin_Aprox: DateValue(
