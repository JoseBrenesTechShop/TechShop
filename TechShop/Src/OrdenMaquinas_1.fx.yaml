                            =If(
                                IsBlank(glr_Ordenes_OMP.Selected),
                                UpdateContext(
                                    {
                                        Aviso: true,
                                        TextoAdvertencia: "Debe selecionar una Orden"
                                    }
                                ),
                                IsBlank(drp_Op_OM.SelectedText.Value),
                                UpdateContext(
                                    {
                                        Aviso: true,
                                        TextoAdvertencia: "Debe selecionar la Operacion"
                                    }
                                ),
                                IsBlank(txt_Meta_OM.Text) || txt_Meta_OM.Text = "0",
                                UpdateContext(
                                    {
                                        Aviso: true,
                                        TextoAdvertencia: "La meta debe ser mayor a 0"
                                    }
                                ),
                                IsBlank(drp_Pri_OM.SelectedText.Value),
                                UpdateContext(
                                    {
                                        Aviso: true,
                                        TextoAdvertencia: "Debe seleccionar la prioridad de la Orden"
                                    }
                                ),
                                drp_Pri_OM.SelectedText.Value = "1" && IsBlank(dp_Fecha_OM.SelectedDate),
                                UpdateContext(
                                    {
                                        Aviso: true,
                                        TextoAdvertencia: "Debe seleccionar la fecha de inico"
                                    }
                                ),
                                CountIf(
                                    MaquinasList,
                                    true
                                ) = 0,
                                UpdateContext(
                                    {
                                        Aviso: true,
                                        TextoAdvertencia: "Debe seleccionar al menos una maquina"
                                    }
                                ),
                                Collect(
                                    MaquinaRemplazo,
                                    ForAll(
                                        MaquinasList,
                                        With(
                                            {thisMaquina: ThisRecord.Maquina},
                                            If(
                                                Not(
                                                    IsBlank(
                                                        LookUp(
                                                            Orden_MaquinasLists_1,
                                                            Maquina = thisMaquina && Prioridad = Value(drp_Pri_OM.SelectedText.Value) && (Orden <> info.Orden || Operacion <> info.Operacion)
                                                        )
                                                    )
                                                ),
                                                LookUp(
                                                    Orden_MaquinasLists_1,
                                                    Maquina = thisMaquina && Prioridad = Value(drp_Pri_OM.SelectedText.Value) && (Orden <> info.Orden || Operacion <> info.Operacion)
                                                )
                                            )
                                        )
                                    )
                                );
                                ForAll(
                                    MaquinaRemplazo,
                                    With(
                                        {
                                            OP: ThisRecord.Operacion,
                                            Ord: ThisRecord.Orden,
                                            pri: ThisRecord.Prioridad
                                        },
                                        If(
