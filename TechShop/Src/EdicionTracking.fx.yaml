        btn_GuardarSeleccioandos_1 As button:
            BorderColor: =RGBA(40, 134, 222, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisabledColor: =RGBA(166, 166, 166, 1)
            DisabledFill: =RGBA(244, 244, 244, 1)
            DisplayMode: |+
                =If(loading, DisplayMode.Disabled, DisplayMode.Edit)
                
            Fill: =RGBA(40, 134, 222, 1)
            FontWeight: =FontWeight.Semibold
            Height: =68
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =
            OnSelect: |-
                =If(
                    CountRows(
                        Filter(
                            glr_Pots_3.AllItems,
                            !IsMatch(
                                CantidadMats_2.Text,
                                "^\-?\d+(\.\d+)?$"
                            ) || Value(CantidadMats_2.Text) < 0
                        )
                    ) > 0,
                    UpdateContext(
                        {
                            MostrarAviso: true,
                            mensajeNotificacion: "Hay cantidades inválidas o negativas. Revisa los valores."
                        }
                    ),
                    CountRows(
                        Filter(
                            glr_Pots_3.AllItems,
                            IsBlank(Trim(CantidadMats_2.Text))
                        )
                    ) > 0,
                    UpdateContext(
                        {
                            MostrarAviso: true,
                            mensajeNotificacion: "Hay cantidades en blanco. No se puede guardar."
                        }
                    ),
                
                 CountRows(
                        Filter(
                            glr_Pots_3.AllItems,
                            IsMatch(ThisRecord.CantidadMats_2.Text, "^\-?\d+(\.\d+)?$")
                            && ( If(IsBlank(ThisRecord.CantidadMats_2.Text), 0, Value(ThisRecord.CantidadMats_2.Text)) ) < ThisRecord.usado
                            && IsBlank(Trim(ThisRecord.txtObservacion_2.Text))
                        )
                    ) > 0,
                    UpdateContext({MostrarAviso: true, mensajeNotificacion: "Faltan observaciones para materiales cuya cantidad se reduce. Revisa las filas."}),
                    
                    CountRows(
                        Filter(
                            glr_Pots_3.AllItems,
                            IsMatch(
                                CantidadMats_2.Text,
                                "^\-?\d+(\.\d+)?$"
                            ) && Value(CantidadMats_2.Text) <> 0
                        )
                    ) = 0,
                    UpdateContext(
                        {
                            MostrarAviso: true,
                            mensajeNotificacion: "Todas las cantidades están en 0. No hay materiales para agregar."
                        }
                    ),
                    If(
                        CountIf(
                            ClearCollect(
                                Validacion_Tracking,
                                ForAll(
                                    glr_Pots_3.AllItems,
                                    If(
                                        Value(CantidadEditada) = usado,
                                        false,
                                        Value(CantidadEditada) > usado,
                                        With(
                                            {Valor: Value(CantidadEditada) - usado},
                                            If(
                                                Valor > (bodega - usado),
                                                true,
                                                false
                                            )
                                        ),
                                        Value(CantidadEditada) < usado,
                                        false,
                                        true
                                    )
                                )
                            ),
                            Value = true
                        ) > 0,
                        UpdateContext(
                            {
                                MostrarAviso: true,
                                mensajeNotificacion: "Alguna cantidad supera la disponible. Revisa las filas."
                            }
                        ),
                        ForAll(
                            glr_Pots_3.AllItems,
                            With(
                                {
                                    MaterialesEdit: ThisRecord.MaterialesEdicion,
                                    CantidadEdit: ThisRecord.CantidadMats_2.Text,
                                    ObservacionEdit: ThisRecord.txtObservacion_2.Text
                                },
                                Patch(
                                    Logistica_Compras,
                                    LookUp(
                                        Logistica_Compras,
                                        POT = gl_PotsEdicion.Selected.Value && ID_Tracking = gl_PuestoCompras_LO_1.Selected.ID_Tracking && Tracking = gl_PuestoCompras_LO_1.Selected.Tracking && Materiales = MaterialesEdit
                                    ),
                                    {
                                        Cantidad: Value(CantidadEdit),
                                        Observacion: ObservacionEdit,
                                        Usuario_Edit:varEmpleado.Nombre
                                    }
                                )
                            )
                        );
                        ClearCollect(
                            Validacion_Estado,
                            ForAll(
                                glr_Pots_3.AllItems,
                                {
                                    Disponible: (bodega - If(
                                        IsBlank(CantidadMats_2.Text),
                                        usado,
                                        Value(CantidadMats_2.Text)
                                    ))
                                }
                            )
                        );
                        If(
                            CountIf(
                                Validacion_Estado,
                                Disponible > 0
                            ) > 0,
                            Patch(
                                Compras_Pots,
                                LookUp(
                                    Compras_Pots,
                                    POT = gl_PotsEdicion.Selected.Value
                                ),
                                {'Estado (crfb9_estado)': "Colocado"}
                            ),
                            Patch(
                                Compras_Pots,
                                LookUp(
                                    Compras_Pots,
                                    POT = gl_PotsEdicion.Selected.Value
                                ),
                                {'Estado (crfb9_estado)': "Tramitado"}
                            )
                        );
                        Refresh(Logistica_Compras);
                        UpdateContext(
                            {
                                MostrarAviso: true,
                                mensajeNotificacion: "Materiales editados correctamente."
                            }
                        ),
                        UpdateContext({AbrirPots: false, Borrar: false})
                    )
                )
