        btn_GuardarSeleccioandos_2 As button:
            BorderColor: =RGBA(40, 134, 222, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisabledColor: =RGBA(166, 166, 166, 1)
            DisabledFill: =RGBA(244, 244, 244, 1)
            DisplayMode: |
                =If(loading, DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =RGBA(40, 134, 222, 1)
            FontWeight: =FontWeight.Semibold
            Height: =68
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =
            OnSelect: |
                =If(
                    CountRows(PotsSeleccionadas) = 0,
                    UpdateContext({
                        MostrarAviso: true,
                        mensajeNotificacion: "No existe ninguna POT con materiales agregados."
                    }),
                
                    If(
                        IsBlank(gl_PuestoCompras_LO_1.Selected) ||
                        IsBlank(gl_PuestoCompras_LO_1.Selected.ID_Tracking) ||
                        IsBlank(gl_PuestoCompras_LO_1.Selected.Tracking),
                        UpdateContext({
                            MostrarAviso: true,
                            mensajeNotificacion: "Selecciona primero la POT/Tracking en la galería antes de guardar."
                        }),
                
                        ForAll(
                            PotsSeleccionadas,
                            With(
                                {
                                    POTEd: ThisRecord.POT,
                                    MaterialEd: ThisRecord.Item,
                                    DescEd: ThisRecord.Description,
                                    CantEdTxt: ThisRecord.Cantidad,
                                    CantEdNum: If(IsBlank(ThisRecord.Cantidad), 0, Value(ThisRecord.Cantidad)),
                                    ObsEd: ThisRecord.Observacion,
                                    idTrackSel: gl_PuestoCompras_LO_1.Selected.ID_Tracking,
                                    trackSel: gl_PuestoCompras_LO_1.Selected.Tracking
                                },
                
                                With(
                                    { targetRec: LookUp(Logistica_Compras,
                                                        POT = POTEd &&
                                                        Materiales = MaterialEd &&
                                                        ID_Tracking = idTrackSel &&
                                                        Tracking = trackSel) },
                                    If(
                                        IsBlank(targetRec),
                                        Patch(
                                            Logistica_Compras,
                                            Defaults(Logistica_Compras),
                                            {
                                                POT: POTEd,
                                                Materiales: MaterialEd,
                                                Descripcion: DescEd,
                                                Cantidad: CantEdNum,
                                                Observacion: ObsEd,
                                                ID_Tracking: idTrackSel,
                                                Tracking: trackSel,
                                                Usuario_Edit: varEmpleado.Nombre
                                            }
                                        ),
                                        Patch(
                                            Logistica_Compras,
                                            targetRec,
                                            {
                                                Cantidad: If(
                                                    IsBlank(targetRec.Cantidad),
                                                    CantEdNum,
                                                    Value(targetRec.Cantidad) + CantEdNum
                                                ),
                                                Observacion: If(
                                                    !IsBlank(Trim(ObsEd)),
                                                    Trim(ObsEd),
                                                    targetRec.Observacion
                                                ),
                                                Usuario_Edit: varEmpleado.Nombre
                                            }
                                        )
                                    )
                                )
                            )
                        );
                        ForAll(
                            colEstadoPOT,
                            If(
                                !IsBlank(LookUp(PotsSeleccionadas, POT = EPOT)),
                                UpdateIf(
                                    Compras_Pots,
                                    POT = EPOT,
                                    { 'Estado (crfb9_estado)': EstadoP }
                                )
                            )
                        );
                
                        UpdateContext({
                            MostrarAviso: true,
                            mensajeNotificacion: "Datos guardados correctamente.",
                            Materiales: false,
                            reset: true,
                            AbrirPots: false,
                            AgregarPot: false,
                            seleccion: false,
                            AbrirCompletar: false,
                            rellenar: false,
                            Borrar: false
                        });
                        UpdateContext({ reset: false });
                        Refresh(Compras_Pots);
                        Clear(PotsSeleccionadas);
                        Clear(colEstadoPOT)
                    )
                )
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =15
            Text: ="Guardar"
            Width: =191
            X: =1098
            Y: =504
            ZIndex: =1

