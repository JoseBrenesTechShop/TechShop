            Color: =RGBA(0, 0, 0, 1)
            DisabledColor: =RGBA(166, 166, 166, 1)
            Font: =App.Theme.Font
            Height: =86
            Size: =18
            Text: ="Seleccione la causa "
            Width: =556
            X: =40
            ZIndex: =9

