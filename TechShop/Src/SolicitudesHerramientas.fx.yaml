                    btn_enviar_sh_1 As button:
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        DisabledColor: =RGBA(166, 166, 166, 1)
                        DisabledFill: =RGBA(244, 244, 244, 1)
                        DisplayMode: =If(Disable || Aviso, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =RGBA(40, 134, 222, 1)
                        FontWeight: =FontWeight.Bold
                        Height: =50
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =RGBA(15, 108, 189, 1)
                        OnSelect: |-
                            =If(
                                IsEmpty(Materiales),
                                UpdateContext(
                                    {
                                        TextoAviso: "No hay items en la tabla Materiales",
                                        Aviso: true
                                    }
                                ),
                                If(
                                    IsBlank(drop_Operario_SH_3.Selected),
                                    UpdateContext(
                                        {
                                            TextoAviso: "por favor, seleccione un operario",
                                            Aviso: true
                                        }
                                    ),
                                    UpdateContext(
                                        {
                                            Causa: false,
                                            estado: "Aprobado",
                                            Disable: false
                                        }
                                    );
                                    ClearCollect(
                                        Verificacion,
                                        ForAll(
                                            Materiales,
                                            With(
                                                {
                                                    subconsumo: Value(ThisRecord.Cant_Actual) < ThisRecord.Cant_Maxima - (ThisRecord.Cant_Maxima * 0.1),
                                                    sobreconsumo: Value(ThisRecord.Cant_Actual) > Value(ThisRecord.Cant_Maxima) + (ThisRecord.Cant_Maxima * 0.1),
                                                    insertosEditados: Value(ThisRecord.Cant_Inserto) <> Value(ThisRecord.VerificacionInserto) ,
                                                    insertosEn0: Text(ThisRecord.Cant_Inserto) = "0",
                                                    insertoFueraDeRuta: ThisRecord.esFueraDeRuta,
                                                    InfoInserto: ThisRecord,
                                                    sinStock: ThisRecord.CantidadInventario <= 0,
                                                    excedidoRuta: ThisRecord.Surtido > ThisRecord.Requerido
                                                },
                                                {
                                                    veri: subconsumo || insertosEditados || insertosEn0 || insertoFueraDeRuta || sinStock || excedidoRuta || sobreconsumo,
                                                    Inserto0: insertosEn0,
                                                    sobre: sobreconsumo,
                                                    sub: subconsumo,
                                                    rutaOut: insertosEditados || insertosEn0 || insertoFueraDeRuta,
                                                    stockInvalido: sinStock,
                                                    excedidoRuta: excedidoRuta,
                                                    InsertoEditado: insertosEditados
                                                }
                                            )
                                        )
                                    );
                                    UpdateContext(
                                        {
                                            HaySobreconsumo: CountRows(
                                                Filter(
                                                    Materiales,
                                                    Value(Cant_Actual) > Value(Cant_Maxima)
                                                )
                                            ) > 0
                                        }
                                    );
                                    If(
                                        CountRows(
                                            Filter(
                                                Verificacion,
                                                veri
                                            )
                                        ) = 0,
                                        Collect(
                                            SolicitudHerramientas,
                                            {
                                                Maquina: Upper(txt_Maquina_SH_2.Text),
                                                Orden: gl_HerramientasSeleccionadas_sh_3.Selected.job,
                                                Operario: drop_Operario_SH_3.Selected.Nombre,
                                                User: LookUp(
                                                    Empleados,
                                                    Codigo = VarName,
                                                    Nombre
                                                ),
                                                Operacion: Text(gl_HerramientasSeleccionadas_sh_3.Selected.oper_num),
                                                'Estado (crfb9_estado)': "Aprobado",
                                                Causa: "TOOL LIFE",
                                                'P/N': LookUp(
                                                    Maquina_Ordens_1,
                                                    Maquina = txt_Maquina_SH_2.Text,
                                                    'P/N'
                                                ),
                                                RazonCausa: If(
                                                    HaySobreconsumo,
                                                    "TOOL LIFE, Sobreconsumo",
                                                    "TOOL LIFE"
                                                ),
                                                FechaSoli: Text(Today())
                                            }
                                        );
                                        With(
                                            {
                                                Id: First(
                                                    Sort(
                                                        Filter(
                                                            SolicitudHerramientas,
                                                            Maquina = txt_Maquina_SH_2.Text && Orden = info.Orden && Operacion = info.Operacion
                                                        ),
                                                        'Fecha de creación',
                                                        SortOrder.Descending
                                                    )
                                                ).ID
                                            },
                                            UpdateContext(
                                                {
                                                    herra: {
                                                        id: Id,
                                                        maquina: LookUp(
                                                            SolicitudHerramientas,
                                                            ID = Id,
                                                            Maquina
                                                        ),
                                                        operacion: LookUp(
                                                            SolicitudHerramientas,
                                                            ID = Id,
                                                            Operacion
                                                        ),
                                                        orden: LookUp(
                                                            SolicitudHerramientas,
                                                            ID = Id,
                                                            Orden
                                                        ),
                                                        PN: LookUp(
