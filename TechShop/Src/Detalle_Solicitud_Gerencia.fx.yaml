Detalle_Solicitud_Gerencia As screen:
    BackgroundImage: ='abstracto geométrico blanco y gris'
    Fill: =Color.White
    ImagePosition: =ImagePosition.Fill
    LoadingSpinnerColor: =App.Theme.Colors.Primary
    OnHidden: |
        =Clear(CheckList_DSC);
        Clear(datos_DSG);
        Reset(txt_Solicitante_DSG);
        Reset(txt_Num_Soli_DSG);
        Reset(glr_Detalles_DSG);
        Reset(glr_Solicitudes_SC);
        Refresh(preqitem);
    OnVisible: |-
        =UpdateContext({Guardando: true});
        Clear(CheckList_DSC);
        Reset(txt_Solicitante_DSG);
        Reset(txt_Num_Soli_DSG);
        Reset(glr_Detalles_DSG);
        ClearCollect(
            datos_DSG,
            AddColumns(
                ShowColumns(
                    Filter(
                        preqitem,
                        req_num = glr_Solicitudes_SG.Selected.Value
                    ),
                    item,
                    req_line,
                    description,
                    u_m,
                    qty_ordered,
                    unit_mat_cost,
                    vend_num
                ),
                vend_name,
                With(
                    {vend: vend_num},
                    LookUp(
                        vendaddr,
                        vend_num = vend,
                        name
                    )
                ),
                aprovado,
                false,
                subtotal,
                With(
                    {
                        qty: qty_ordered,
                        cost: unit_mat_cost
                    },
                    qty * cost
                )
            )
        );
        UpdateContext({Guardando: false})

