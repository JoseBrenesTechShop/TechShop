Solicitud_Gerencia As screen:
    BackgroundImage: ='abstracto geométrico blanco y gris'
    Fill: =Color.White
    ImagePosition: =ImagePosition.Fill
    LoadingSpinnerColor: =App.Theme.Colors.Primary
    OnHidden: =
    OnVisible: |-
        =UpdateContext({Guardando: true});
        ClearCollect(
            datos_SG,
            Sort(
                AddColumns(
                    Filter(
                        Distinct(
                            Filter(
                                preqitem,
                                stat = "R"
                            ),
                            req_num
                        ),
                        Not(Value in Solicitud_Compras.soli_num) && Not(
                            Value in Filter(
                                Compras_NoMarcadas,
                                Enviado < 1 && Tipo_Envio = varEmpleado.Codigo
                            ).NSolicitud
                        ),
                        Switch(
                            varEmpleado.Codigo,
                            "1",
                            true,
                            "2692",
                            StartsWith(
                                Value,
                                "PRD"
                            ) && LookUp(
                                preq,
                                req_num = Value,
                                requester
                            ) <> "raraya",
                            "15",
                            StartsWith(
                                Value,
                                "MTO"
                            ) && LookUp(
                                preq,
                                req_num = Value,
                                requester
                            ) <> "rpereira",
                            "2618",
                            StartsWith(
                                Value,
                                "QAL"
                            ) && LookUp(
                                preq,
                                req_num = Value,
                                requester
                            ) <> "icespedes",
                            "1124",
                            (StartsWith(
                                Value,
                                "TLR"
                            ) || StartsWith(
                                Value,
                                "ADM"
                            ) || StartsWith(
                                Value,
                                "OFC"
                            )) && LookUp(
                                preq,
                                req_num = Value,
                                requester
                            ) <> "marias",
                            "1133",
                            StartsWith(
                                Value,
                                "SOL"
                            ) && LookUp(
                                preq,
                                req_num = Value,
                                requester
                            ) <> "vguerrero",
                            "2648",
                            (StartsWith(
                                Value,
                                "TIC"
                            ) ) && LookUp(
                                preq,
                                req_num = Value,
                                requester
                            ) <> "jbrenes"
                        )
                    ),
                    fecha,
                    With(
                        {},
                        LookUp(
                            preq,
                            req_num = Value,
                            req_date
                        )
                    ),
                    total,
                    With(
                        {},
                        Text(
                            Sum(
                                Filter(
                                    preqitem,
                                    req_num = Value
                                ),
                                qty_ordered * unit_mat_cost
                            ),
                            "###,###,##0.00"
                        )
                    ),
                    solicitante,
                    With(
                        {},
                        If(
                            !IsBlank(
                                LookUp(
                                    preq,
                                    req_num = Value,
                                    requester
                                )
                            ),
                            With(
                                {
                                    email: LookUp(
                                        preq,
                                        req_num = Value,
                                        requester
                                    ),
                                    name: First(
                                        Filter(
                                            Empleados,
                                            Left(
                                                Correo,
                                                Find(
                                                    "@",
                                                    Correo
                                                ) - 1
                                            ) = LookUp(
                                                preq,
                                                req_num = Value,
                                                requester
                                            )
                                        )
                                    ).Nombre
                                },
                                If(
                                    IsBlank(name),
                                    email,
                                    name
                                )
                            ),
                            "Sin correo"
                        )
                    )
                ),
                Value,
                SortOrder.Ascending
            )
        );
        UpdateContext({Guardando: false})

