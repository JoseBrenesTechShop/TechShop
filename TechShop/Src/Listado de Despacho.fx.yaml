                        )
                    ),
                    UpdateContext(
                        {
                            MostrarAviso: true,
                            mensajeNotificacion: "Debe completar todas las cantidades recibidas."
                        }
                    ),
                    UpdateContext(
                        {
                            UltimoListado: "L" & Text(
                                If(
                                    IsEmpty(
                                        Filter(
                                            LogisticDespachos,
                                            POT = gl_LogisticaDespacho_LD.Selected.POT
                                        )
