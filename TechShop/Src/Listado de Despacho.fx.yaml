                            ListadoSeleccionado: Blank(),
                            UltimoListado: Blank(),
                            NuevoListado: Blank(),
                            TieneFaltantes: false
                        }
                    );
                    Clear(DespachoCollection);
                    Refresh(LogisticDespachos);
                    Clear(colOverrides)
