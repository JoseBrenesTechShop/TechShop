                            Value(txt_cantidaRecibida_LD.Text) < 0
                        )
                    ),
                    UpdateContext(
                        {
                            MostrarAviso: true,
                            mensajeNotificacion: "La cantidad recibida no puede ser negativa."
                        }
                    ),
                    !IsBlank(
                        LookUp(
                            glr_Listado_LD.AllItems,
