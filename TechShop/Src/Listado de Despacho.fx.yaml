                                    1,
                                    Max(
                                        AddColumns(
                                            Filter(
                                                LogisticDespachos,
                                                POT = gl_LogisticaDespacho_LD.Selected.POT
                                            ),
                                            NumListado,
                                            Value(
                                                Mid(
                                                    Listado,
                                                    2,
                                                    Len(Listado) - 1
                                                )
                                            )
                                        ),
                                        NumListado
                                    ) + 1
                                )
                            )
                        }
                    );
                    ForAll(
                        glr_Listado_LD.AllItems,
                        Patch(
                            LogisticDespachos,
                            Defaults(LogisticDespachos),
                            {
                                Requisicion: gl_LogisticaDespacho_LD.Selected.Requisicion,
                                POT: gl_LogisticaDespacho_LD.Selected.POT,
                                Fecha: gl_LogisticaDespacho_LD.Selected.Fecha_Tech,
                                Provedor: gl_LogisticaDespacho_LD.Selected.Provedor,
                                Num_Vend: gl_LogisticaDespacho_LD.Selected.Num_Vend,
                                'Estado (crfb9_estado)': If(
                                    Value(txt_cantidadFaltante_LD.Text) = 0,
                                    "Despachado",
                                    "Tramitado"
                                ),
                                id_item: ThisRecord.id_items,
                                descripcion: ThisRecord.Descripcion,
                                Cantidad: Value(ThisRecord.Cantidades),
                                'Cantidad Recibida': Value(ThisRecord.txt_cantidaRecibida_LD.Text),
                                'Cantidad Faltante': Value(ThisRecord.txt_cantidadFaltante_LD.Text),
                                Listado: UltimoListado
                            }
                        )
                    );
                    UpdateContext(
                        {
                            TieneFaltantes: CountIf(
                                glr_Listado_LD.AllItems,
                                Value(ThisRecord.txt_cantidadFaltante_LD.Text) > 0
                            ) > 0
                        }
                    );
                    If(
                        TieneFaltantes,
                        UpdateContext(
                            {
                                NuevoListado: "L" & Text(
                                    Value(
                                        Mid(
                                            UltimoListado,
                                            2,
                                            Len(UltimoListado) - 1
                                        )
                                    ) + 1
                                )
                            }
                        );
                        ForAll(
                            Filter(
                                glr_Listado_LD.AllItems,
                                Value(ThisRecord.txt_cantidadFaltante_LD.Text) > 0
                            ),
                            Patch(
                                LogisticDespachos,
                                Defaults(LogisticDespachos),
                                {
                                    Requisicion: gl_LogisticaDespacho_LD.Selected.Requisicion,
                                    POT: gl_LogisticaDespacho_LD.Selected.POT,
