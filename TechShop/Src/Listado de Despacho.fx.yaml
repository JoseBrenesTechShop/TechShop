                                    ),
                                    id_item: ThisRecord.id_items,
                                    descripcion: ThisRecord.Descripcion,
                                    Cantidad: Value(ThisRecord.txt_cantidadFaltante_LD.Text),
                                    'Cantidad Recibida': Value(ThisRecord.txt_cantidaRecibida_LD.Text),
                                    'Cantidad Faltante': Value(ThisRecord.txt_cantidadFaltante_LD.Text),
                                    Listado: NuevoListado
                                }
                            )
                        )
                    );
                    If(
                        CountIf(
                            glr_Listado_LD.AllItems,
                            Value(ThisRecord.txt_cantidadFaltante_LD.Text) > 0
                        ) = 0,
                        Patch(
                            Compras_Pots,
                            LookUp(
                                Compras_Pots,
                                POT = gl_LogisticaDespacho_LD.Selected.POT && Requisicion = gl_LogisticaDespacho_LD.Selected.Requisicion
                            ),
                            {'Estado (crfb9_estado)': "Despachado"}
                        )
                    );
                    UpdateContext(
                        {
                            MostrarAviso: true,
                            mensajeNotificacion: "Datos guardados correctamente"
                        }
                    );
                    UpdateContext(
                        {
                            AbrirCont: false,
