                        (txt_CantProducida_HxH2_2.Text + txt_CantTotal_HxH2_2.Text) > (txt_CantMax_HxH2_2.Text + (txt_CantMax_HxH2_2.Text * 0.015)) && OrdenInfo.'Permiso_1.5' <> "Aprobado",
