                            LookUp(
                                Maquinas,
                                Maquina = Upper(txt_Maquina_HxH3_1.Text)
                            ).Status = "Paro",//Maquina en paro?
                            UpdateContext({TextoAdvertencia: "La MAQUINA seleccionada esta en Paro"});
                            UpdateContext({Mostra: true}),
                          //Validacion de tarima
                            IsBlank(txt_Tarima_HxH2_2.Text),//Tarima en blanco?
                            UpdateContext({TextoAdvertencia: "Debe indicar la TARIMA que se esta llenando"});
                            UpdateContext({Mostra: true}),
                            (Len(txt_Tarima_HxH2_2.Text) < 3 || Not(
                                Left(
                                    txt_Tarima_HxH2_2.Text,
                                    1
                                ) in [
                                    "T",
                                    "t"
                                ]
                            )) || !IsNumeric(
                                Mid(
                                    txt_Tarima_HxH2_2.Text,
                                    2,
                                    Len(txt_Tarima_HxH2_2.Text) - 1
                                )
                            ),//Formato valido?
                            UpdateContext({TextoAdvertencia: "El formato de la TARIMA es invalido"});
                            UpdateContext({Mostra: true}),
                          //Validacion Hora y operario
                            IsBlank(drp_Hora_HxH2_2.SelectedText),
                            UpdateContext({TextoAdvertencia: "Debe indicar la HORA del registro"});
                            UpdateContext({Mostra: true}),
                            IsBlank(txt_Operario_HxH2_2.Text),
                            UpdateContext({TextoAdvertencia: "Debe indicar al OPERARIO que se le esta haciendo el registro"});
                            UpdateContext({Mostra: true}),
                          //Validacion Turno
                            txt_Turno_HxH2_2.Text in [
                                "LIBRE",
                                "TV",
                                "TF"
                            ],//Turno igual a LIBRE o TV o TF?
                            UpdateContext({TextoAdvertencia: "No puede guardar registros en turno " & txt_Turno_HxH2_2.Text & "."});
                            UpdateContext({Mostra: true}),
                          //Validacion Cantidad
                            !IsNumeric(txt_CantDañada_HxH2_2.Text) || !IsNumeric(txt_CantProducida_HxH2_2.Text),
                            UpdateContext({TextoAdvertencia: "Las cantidades deben ser NÚMERICAS"});
                            UpdateContext({Mostra: true}),
