                        DisabledColor: =RGBA(166, 166, 166, 1)
                        DisabledFill: =RGBA(244, 244, 244, 1)
                        DisplayMode: =If(isSaving || isEditing || Disable, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =RGBA(40, 134, 222, 1)
                        FontWeight: =FontWeight.Semibold
                        Height: =37
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =
                        OnSelect: |-
                            =If(
                             
                                IsEmpty(Contenedores) || 
                                WeekNum(dt_FechaSalida_EM_1.SelectedDate, StartOfWeek.Monday) < WeekNum(Today(), StartOfWeek.Monday) || 
                                Year(dt_FechaSalida_EM_1.SelectedDate) < Year(Today()) || 
                                IsBlank(dt_FechaSalida_EM_1.SelectedDate) || IsBlank(drp_Pais_EM_2.SelectedText),
                                UpdateContext(
                                    {
                                        mensajeNotificacion: If(
                                            IsEmpty(Contenedores),
                                            "No hay datos en la tabla Contenedores para guardar.",
                                            If(
                                                WeekNum(dt_FechaSalida_EM_1.SelectedDate, StartOfWeek.Monday) < WeekNum(Today(), StartOfWeek.Monday) || 
                                                Year(dt_FechaSalida_EM_1.SelectedDate) < Year(Today()),
                                                "No se puede agregar, la fecha de salida pertenece a una semana anterior. Por favor cambiar a una fecha de la semana actual",
                                                "La fecha y el país son obligatorios."
                                            )
                                        ),
                                        MostrarAviso: true,
                                        Disable: true
                                    }
                                ),
                                UpdateContext({ isSaving: true }),
                            
                                 Collect(
                                        Contenedors_1,
                                        {
                                            Fecha: dt_FechaSalida_EM.SelectedDate,
                                            FechaTexto: Text(dt_FechaSalida_EM.SelectedDate),
                                            Nomenclatura: nomenclaturaGenerada,
                                            Pais: drp_Pais_EM.SelectedText.Value,
                                            Estado_Contenedor: "Pendiente",
                                            NumContenedor: contenedorTexto,
                                            Semana: Text( WeekNum(
                                                dt_FechaSalida_EM.SelectedDate,
                                                StartOfWeek.Monday
                                            )),
                                            Año: Text(Year(dt_FechaSalida_EM.SelectedDate)),
                                            User: txt_EmpleadoUso_EM.Text,
                                            Cantidad_Total: Sum(gl_Contenedores_EM.AllItems, CantidadTotal),
                                            Peso_Total:Sum(gl_Contenedores_EM.AllItems, PesoTotal) ,
                                            ValorTotal: Sum(gl_Contenedores_EM.AllItems, ValorTotal)
                                            
                                        }
                                    );
                            
                                ForAll(
                                    Contenedores,
                                    Collect(
                                        ContenedorPNS_1,
                                        {
                                            'P/N': ThisRecord.PN,
                                            Cantidad: ThisRecord.Cantidad,
                                            Cantidad_Tarima: ThisRecord.CantidadTarima,
                                            Valor_Pieza: ThisRecord.ValorPieza,
                                            Peso: ThisRecord.Peso,
                                            TipoCaja: ThisRecord.TipoCaja,
                                            Tipo: ThisRecord.Tipo,
                                            Nomenclatura: ThisRecord.Nomenclatura,
                                            'NumContenedorP/N': ThisRecord.Contenedor,
                                            User: ThisRecord.User,
                                            CantidadTotal: ThisRecord.CantidadTotal,
                                            ValorTotal: ThisRecord.ValorTotal,
                                            PesoTotal: ThisRecord.PesoTotal
                                        }
                                    )
                                );
                                Clear(Contenedores);
                                Reset(dt_FechaSalida_EM);
                                Reset(drp_Pais_EM);
                                Reset(txt_PNDato_EM);
                                Reset(txt_CantidadDato_EM);
                                UpdateContext(
                                    {
                                        contenedorTexto: Blank(),
                                        nomenclaturaGenerada: Blank(),
                                        txt_Destino2: 0,
                                        txt_Destino: ""
                                    }
                                );
                                 UpdateContext(
                                    {
                                        mensajeNotificacion: "Datos guardados correctamente.",
                                        MostrarAviso: true,
                                        Disable: true
                                    }
