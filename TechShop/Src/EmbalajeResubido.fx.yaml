                        Height: =31
                        OnChange: |
                            =ClearCollect(
                                ContenedoresRecientes,
                                Contenedors
                            );
                            
                            ClearCollect(
                                ContenedoresSemanaActual,
                                Filter(
                                    ContenedoresRecientes,
                                    Year(Fecha) = Year(dt_FechaSalida_EM_1.SelectedDate) && 
                                    WeekNum(Fecha) = WeekNum(dt_FechaSalida_EM_1.SelectedDate)
                                )
                            );
                            
                            UpdateContext(
                                {
                                    contenedorTexto: If(
                                        CountRows(ContenedoresSemanaActual) = 0,
                                        "A", 
                                        Upper(
                                            Char(65 + CountRows(ContenedoresSemanaActual))
                                        )
                                    )
                                }
                            );
                            
                            UpdateContext(
                                {
                                    nomenclaturaGenerada: 
                                        "C" & 
                                        Right(
                                            Text(Year(dt_FechaSalida_EM_1.SelectedDate)), 
                                            2
                                        ) & 
                                        Text(
                                            WeekNum(dt_FechaSalida_EM_1.SelectedDate),
                                            "0"
                                        ) & 
                                        contenedorTexto
                                }
                            );
                        Width: =188
