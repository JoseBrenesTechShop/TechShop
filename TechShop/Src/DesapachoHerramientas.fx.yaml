        btn_ContinuarAviso_HxH_8 As button:
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisabledColor: =RGBA(166, 166, 166, 1)
            DisabledFill: =RGBA(244, 244, 244, 1)
            Fill: =RGBA(233, 79, 76, 1)
            FontWeight: =FontWeight.Semibold
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(184, 36, 33, 1)
            OnSelect: |-
                =If(
                    IsBlank(txt_MotivoRechazo_DH.Text),
                    Notify(
                        "Por favor escribe la razón del rechazo",
                        NotificationType.Error
                    ),
                    Set(
                        varSolicitudID,
                        glr_Solicitudes_DH.Selected.ID
                    );
                    ForAll(
                        Gallery2_1.AllItems,
                        Patch(
                            RegistroHerramientas_1,
                            Defaults(RegistroHerramientas_1),
                            {
                                Cant_Inserto: ThisRecord.Cant_Insertos,
                                Causa: ThisRecord.Causa,
                                Descripcion: ThisRecord.Descripcion,
                                ID_Inserto: ThisRecord.ID_Inserto,
                                id_Solicitud: varSolicitudID,
                                Maquina: glr_Solicitudes_DH.Selected.Maquina,
                                Operario: glr_Solicitudes_DH.Selected.Operario,
                                Operacion: glr_Solicitudes_DH.Selected.Operacion,
                                Orden: glr_Solicitudes_DH.Selected.Orden,
                                Piezas_Hechas: ThisRecord.Cant_Actual,
                                Piezas_Meta: ThisRecord.Cant_Maxima,
                                User: LookUp(
                                    Empleados,
                                    Codigo = VarName,
                                    Nombre
                                ),
                                RazonCausa: glr_Solicitudes_DH.Selected.RazonCausa,
                                MotivoRechazo: txt_MotivoRechazo_DH.Text,
                                'P/N': ThisRecord.'P/N'
                            }
                        );
                        Patch(
                            Herramientas,
                            ThisRecord,
                            {'Estado (crfb9_estado)': "Rechazado"}
                        )
                    );
                    Patch(
                        SolicitudHerramientas,
                        glr_Solicitudes_DH.Selected,
                        {
                            'Estado (crfb9_estado)': "Rechazado",
                            MotivoRechazo: txt_MotivoRechazo_DH.Text
                        }
                    );
                    With(
                        {
                            CuerpoCorreo: "<p>Estimado equipo;</p>" & "<p>Se informa que la solicitud de herramientas con los siguientes detalles ha sido <strong>rechazada</strong>:</p>" & "<table border='1' cellpadding='5' cellspacing='0'>" & "<tr><td><strong>Solicitud ID</strong></td><td>" & varSolicitudID & "</td></tr>" & "<tr><td><strong>Máquina</strong></td><td>" & glr_Solicitudes_DH.Selected.Maquina & "</td></tr>" & "<tr><td><strong>Orden</strong></td><td>" & glr_Solicitudes_DH.Selected.Orden & "</td></tr>" & "<tr><td><strong>Operario</strong></td><td>" & glr_Solicitudes_DH.Selected.Operario & "</td></tr>" & "<tr><td><strong>Usuario</strong></td><td>" & LookUp(
                                Empleados,
                                Codigo = VarName,
                                Nombre
                            ) & "</td></tr>" & "<tr><td><strong>Operación</strong></td><td>" & glr_Solicitudes_DH.Selected.Operacion & "</td></tr>" & "<tr><td><strong>Causa</strong></td><td>" & glr_Solicitudes_DH.Selected.Causa & "</td></tr>" & "<tr><td><strong>Razón de la causa</strong></td><td>" & glr_Solicitudes_DH.Selected.RazonCausa & "</td></tr>" & "<tr><td><strong>Motivo del rechazo</strong></td><td>" & txt_MotivoRechazo_DH.Text & "</td></tr>" & "<tr><td><strong>Fecha de Solicitud</strong></td><td>" & Text(Today()) & "</td></tr>" & "</table>" & "<p>Por favor, tome las medidas necesarias según el motivo del rechazo.</p>" & "<p>Saludos cordiales;</p>" & "<p>El equipo de desarrollo</p>" & "<p><em>Nota: Por favor, no responda a este correo.</em></p>"
                        },
                        EnviarCorreo.Run(
                            "desarrollo02@tsicr.com",
                            "Notificación de Rechazo de Solicitud de Herramientas",
                            CuerpoCorreo
                        )
                    );
                    Reset(txt_MotivoRechazo_DH);
                    UpdateContext({Disable: false});
                    UpdateContext({Mostrar: false});
                    UpdateContext({MotivoRechazo: false});
                    
