                        Maquina = txt_Maquina_MO_1.Text
                    )
                ),
                Collect(
                    Maquina_Ordens_1,
                    {
                        Maquina: txt_Maquina_MO_1.Text,
                        User: txt_User_MO_1.Text
                    }
