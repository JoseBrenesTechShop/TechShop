                );
                Remove(
                    Orden_Maquinas_1,
                    ItemEliminar
                );
                With(
                    {
                        MaquinasEliminar: Filter(
                            Orden_MaquinasLists_1,
                            Orden = ItemEliminar.Orden,
                            Operacion = ItemEliminar.Operacion
                        )
                    },
                    ForAll(
                        MaquinasEliminar,
                        Collect(
                            InfoMaquinasEliminar,
                            ThisRecord
                        );
                        Remove(
                            Orden_MaquinasLists_1,
                            ThisRecord
                        )
                    )
                );
                With(
                    {
                        maximas: LookUp(
                            Orden_Ejecucion,
                            Orden = ItemEliminar.Orden && Operacion = ItemEliminar.Operacion
                        ).Cantidad,
                        producidas: LookUp(
                            Orden_Ejecucion,
                            Orden = ItemEliminar.Orden && Operacion = ItemEliminar.Operacion
                        ).CantidadTotalProducida,
                        dañadas: Sum(
                            Filter(
                                Scrap_1,
                                Orden = ItemEliminar.Orden
                            ),
                            Cantidad
                        )
                    },
                    Collect(
                        Registro_Orden_Maquinas,
                        {
                            Creacion_Fecha: ItemEliminar.'Fecha de creación',
                            Orden: ItemEliminar.Orden,
                            Operacion: ItemEliminar.Operacion,
                            'P/N': ItemEliminar.'P/N',
