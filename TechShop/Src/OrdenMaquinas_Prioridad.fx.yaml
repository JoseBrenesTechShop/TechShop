                            Horas: Sitem.Horas,
                            Dias: Sitem.Dias,
                            Zona: Sitem.Zona
                        }
                    );
                    //Guarda, edita o elimina las maquinas de la orden
                ForAll(
                        MaquinasOrigin,
                        With(
                            {m: ThisRecord.Maquina},
                            //Almacena el registro anterior de la maquina antes de editarlo
                            Collect(
