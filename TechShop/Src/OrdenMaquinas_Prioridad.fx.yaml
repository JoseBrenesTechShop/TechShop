                                Fecha_Fin_Aprox: O.Fecha_Fin_Aprox,
                                Jornada: LookUp(
                                    JornadaPlannings,
                                    Valor = J
                                ).Texto,
                                Zona: O.Zona,
                                Horas: O.Horas,
                                HorasRestantes: If(
                                    Value(O.Meta) > 0,
                                    RoundUp(
                                        ((maximas - (producidas - dañadas)) / (O.Meta * LookUp(
                                            ZonaPlannings,
                                            Texto = Z,
                                            Valor
                                        )) + LookUp(
                                            Orden_Ejecucion,
                                            Orden = ORD && Operacion = OP
                                        ).TiempoSetup) / Max(
                                            1,
                                            CountRows(
                                                Filter(
                                                    Orden_MaquinasLists_1,
                                                    Orden = ORD,
                                                    Operacion = OP
                                                )
                                            )
                                        ),
                                        0
                                    ),
                                    0
                                ),
                                Dias: O.Dias,
                                CantMaquinas: CountIf(
                                    Filter(
                                        Orden_MaquinasLists_1,
                                        Orden = ORD,
                                        Operacion = OP
                                    ),
                                    true
                                ),
                                CantMax: maximas,
                                CantPro: producidas,
                                CantDañada: dañadas,
                                User: O.User
                            }
                        )
                    )
                );
                ForAll(
