                                                    Operacion = ThisRecord.Operacion
                                                ).Maquina && Prioridad <> OrdenSelected.Prioridad
                                            ).Prioridad) && Value <> 1
                                        )
                                    ),
                                    Max(
                                        Filter(
                                            Orden_MaquinasLists_1,
                                            Maquina in Filter(
                                                Orden_MaquinasLists_1,
                                                Orden = ThisRecord.Orden,
                                                Operacion = ThisRecord.Operacion
                                            ).Maquina
                                        ),
                                        Prioridad
                                    ) + 1,
                                    First(
                                        Filter(
                                            Prioridades,
                                            !(Value in Filter(
