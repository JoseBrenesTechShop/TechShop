                                            Operacion = OP,
                                            Maquina = m
                                        ),
                                        'Fecha_Registro_Supervisor '
                                    ),
                                    true
                                ),
                                HorasRes: Maquina.Horas - CountIf(
                                    Distinct(
                                        Filter(
                                            'Hora X Hora',
                                            Orden = ORD,
                                            Operacion = OP,
                                            Maquina = m
                                        ),
                                        'Fecha_Registro_Supervisor '
                                    ),
                                    true
                                ),
                                CantPro: Sum(
                                    Filter(
                                        'Hora X Hora',
                                        Orden = ORD,
                                        Operacion = OP,
                                        Maquina = m
                                    ),
                                    Cantidad
                                ),
                                CantDañada: Sum(
                                    Filter(
                                        Scrap_1,
                                        Orden = ORD,
                                        Maquina = m
                                    ),
                                    Cantidad
                                )
                            }
                        )
                    )
                );
                UpdateContext(
                    {
                        ItemEliminar: Blank()
                    }
                );
                Clear(InfoMaquinasEliminar);
                UpdateContext(
                    {
                        Eliminar: false,
