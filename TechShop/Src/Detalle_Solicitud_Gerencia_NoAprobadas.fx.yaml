Detalle_Solicitud_Gerencia_NoAprobadas As screen:
    BackgroundImage: ='abstracto geométrico blanco y gris'
    Fill: =Color.White
    ImagePosition: =ImagePosition.Fill
    LoadingSpinnerColor: =App.Theme.Colors.Primary
    OnHidden: |-
        =Clear(CheckList_DSC);
        Reset(txt_Solicitante_DSGN);
        Reset(txt_Num_Soli_DSGN);
        Reset(glr_Detalles_DSCNM_1);
        Reset(glr_Solicitudes_SC);
        Refresh(preqitem);
    OnVisible: |-
        =UpdateContext(
            {
                Guardando: true,
                Soli: glr_Solicitudes_SCNM_1.Selected.Value
            }
        );
        ClearCollect(
            datos_DSGN,
            AddColumns(
                Filter(
                    Compras_NoMarcadas,
                    Enviado = 0,
                    Tipo_Envio = varEmpleado.Codigo,
                    NSolicitud = Soli
                ),
                medida,
                With(
                    {myItem: NItem},
                    LookUp(
                        preqitem,
                        req_num = Soli && item = myItem
                    ).u_m
                ),
                cantidad,
                With(
                    {myItem: NItem},
                    LookUp(
                        preqitem,
                        req_num = Soli && item = myItem
                    ).qty_ordered
                ),
                precio,
                With(
                    {myItem: NItem},
                    LookUp(
                        preqitem,
                        req_num = Soli && item = myItem
                    ).unit_mat_cost
                ),
                subtotal,
                With(
                    {myItem: NItem},
                    LookUp(
                        preqitem,
                        req_num = Soli && item = myItem
                    ).qty_ordered * LookUp(
                        preqitem,
                        req_num = Soli && item = myItem
                    ).unit_mat_cost
                ),
                vendNum,
                With(
                    {myItem: NItem},
                    LookUp(
                        preqitem,
                        req_num = Soli && item = myItem
                    ).vend_num
                ),
                vendName,
                With(
                    {myItem: NItem},
                    With(
                        {
                            Vname: LookUp(
                                preqitem,
                                req_num = Soli && item = myItem
                            ).vend_num
                        },
                        LookUp(
                            vendaddr,
                            vend_num = Vname
                        ).name
                    )
                ),
                aprobado,
                false
            )
        );
        UpdateContext({Guardando: false})

    cnt_Avisos_BC_9 As groupContainer.manualLayoutContainer:
        DropShadow: =DropShadow.Light
        Fill: =RGBA(0, 0, 0, 0.15)
        Height: =768
        RadiusBottomLeft: =12
        RadiusBottomRight: =12
        RadiusTopLeft: =12
        RadiusTopRight: =12
        Visible: =Guardando || Aviso.Ver 
        Width: =1366
        ZIndex: =2

        Icon3_97 As icon:
            BorderColor: =RGBA(12, 59, 94, 1)
            BorderStyle: =BorderStyle.None
            BorderThickness: =2
            Color: =If(Aviso.Tipo = 0, RGBA(255, 0, 0, 1), Aviso.Tipo = 1, RGBA(255, 191, 0, 1), RGBA(54, 176, 75, 1))
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisabledColor: =RGBA(244, 244, 244, 1)
            DisplayMode: =DisplayMode.View
            FocusedBorderThickness: =20
            Height: =150
            HoverBorderColor: =App.Theme.Colors.Darker10
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =App.Theme.Colors.Darker10
            Icon: =If(Aviso.Tipo = 0, Icon.Error, Aviso.Tipo = 1, Icon.Warning, Icon.CheckBadge)
            OnSelect: |
                =Navigate(MenuAdministrativo);
            PaddingBottom: =5
            PaddingLeft: =5
            PaddingRight: =5
            PaddingTop: =5
            Visible: =Aviso.Ver && !Guardando
            Width: =150
            X: =600
            Y: =217
            ZIndex: =1

        Container70_11 As groupContainer.manualLayoutContainer:
            BorderColor: =If(Aviso.Tipo = 0, RGBA(255, 0, 0, 1), Aviso.Tipo = 1, RGBA(255, 191, 0, 1), RGBA(54, 176, 75, 1))
            BorderThickness: =4
            DropShadow: =DropShadow.Light
            Fill: =RGBA(255, 255, 255, 1)
            Height: =112
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Visible: =Aviso.Ver && !Guardando
            X: =425
            Y: =377
            ZIndex: =2

            TextInput15_11 As text:
                Align: =Align.Center
                BorderColor: =App.Theme.Colors.Darker40
                BorderThickness: =2
                Color: =RGBA(0, 0, 0, 1)
                Default: =Aviso.Texto
                DisabledBorderColor: =RGBA(166, 166, 166, 1)
                DisabledColor: =RGBA(166, 166, 166, 1)
