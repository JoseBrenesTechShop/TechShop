Detalle_Solicitud_Gerencia_NoAprobadas As screen:
    BackgroundImage: ='abstracto geométrico blanco y gris'
    Fill: =Color.White
    ImagePosition: =ImagePosition.Fill
    LoadingSpinnerColor: =App.Theme.Colors.Primary
    OnHidden: |-
        =Clear(CheckList_DSC);
        Reset(txt_Solicitante_DSGN);
        Reset(txt_Num_Soli_DSGN);
        Reset(glr_Detalles_DSCNM_1);
        Reset(glr_Solicitudes_SC);
        Refresh(preqitem);
    OnVisible: |-
        =UpdateContext(
            {
                Guardando: true,
                Soli: glr_Solicitudes_SGN.Selected.Value
            }
        );
        ClearCollect(
            datos_DSGN,
            AddColumns(
                Filter(
                    Compras_NoMarcadas,
                    Enviado = 0,
                    Tipo_Envio = varEmpleado.Codigo,
                    NSolicitud = Soli
                ),
                medida,
                With(
                    {
                        myItem: NItem,
                        linea: NFilaSolicitud
                    },
                    LookUp(
                        preqitem,
                        req_num = Soli && item = myItem && req_line = linea
                    ).u_m
                ),
                cantidad,
                With(
                    {
                        myItem: NItem,
                        linea: NFilaSolicitud
                    },
                    LookUp(
                        preqitem,
                        req_num = Soli && item = myItem && req_line = linea
                    ).qty_ordered
                ),
                precio,
                With(
                    {
                        myItem: NItem,
                        linea: NFilaSolicitud
                    },
                    LookUp(
                        preqitem,
                        req_num = Soli && item = myItem && req_line = linea
                    ).unit_mat_cost
                ),
                subtotal,
                With(
                    {
                        myItem: NItem,
                        linea: NFilaSolicitud
                    },
                    LookUp(
                        preqitem,
                        req_num = Soli && item = myItem && req_line = linea
                    ).qty_ordered * LookUp(
                        preqitem,
                        req_num = Soli && item = myItem && req_line = linea
                    ).unit_mat_cost
                ),
                vendNum,
                With(
                    {
                        myItem: NItem,
                        linea: NFilaSolicitud
                    },
                    LookUp(
                        preqitem,
                        req_num = Soli && item = myItem && req_line = linea
                    ).vend_num
                ),
                vendName,
                With(
                    {
                        myItem: NItem,
                        linea: NFilaSolicitud
                    },
                    With(
                        {
                            Vname: LookUp(
                                preqitem,
                                req_num = Soli && item = myItem && req_line = linea
                            ).vend_num
                        },
                        LookUp(
                            vendaddr,
                            vend_num = Vname
                        ).name
                    )
                ),
                aprobado,
                false
            )
        );
        UpdateContext({Guardando: false})

