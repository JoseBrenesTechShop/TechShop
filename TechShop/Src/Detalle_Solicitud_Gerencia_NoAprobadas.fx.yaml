                Height: =12
                Width: =(tmp_Aviso_BC_11.Value / 3200) * 500
                Y: =100
                ZIndex: =3

        tmp_Aviso_BC_11 As timer:
            BorderColor: =App.Theme.Colors.Primary
            Color: =App.Theme.Colors.PrimaryForeground
            DisabledBorderColor: =RGBA(244, 244, 244, 1)
            DisabledColor: =RGBA(166, 166, 166, 1)
            DisabledFill: =RGBA(244, 244, 244, 1)
            Duration: =3500
            Fill: =App.Theme.Colors.Primary
            Font: =App.Theme.Font
            HoverBorderColor: =App.Theme.Colors.Darker10
            HoverColor: =App.Theme.Colors.PrimaryForeground
            HoverFill: =App.Theme.Colors.Darker10
            OnTimerEnd: |-
                =UpdateContext({Aviso: {Ver: false, Tipo: 3, Texto: ""}, Guardando: false}); Reset(Self)
            PressedBorderColor: =App.Theme.Colors.Darker40
            PressedColor: =Self.Color
            PressedFill: =App.Theme.Colors.Darker40
            Start: =Aviso.Ver
            Visible: =false
            ZIndex: =3

        cnt_spinner_7 As groupContainer.manualLayoutContainer:
            DropShadow: =DropShadow.Light
            Fill: =RGBA(255, 255, 255, 1)
            Height: =125
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Visible: =Guardando && !Aviso.Ver
            Width: =468
            X: =441
            Y: =301
            ZIndex: =4

            "Spinner1_11 As 'Indicador giratorio'":
