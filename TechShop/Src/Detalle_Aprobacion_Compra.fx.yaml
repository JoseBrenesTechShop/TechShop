Detalle_Aprobacion_Compra As screen:
    BackgroundImage: ='abstracto geométrico blanco y gris'
    Fill: =Color.White
    ImagePosition: =ImagePosition.Fill
    LoadingSpinnerColor: =App.Theme.Colors.Primary
    OnHidden: |-
        =
        UpdateContext({edit: {view: false, item: Blank()}, Aviso: false, mensajeNotificacion: "", Rechazo: false, reset: false});
        Clear(compras);
        Reset(txt_Num_Soli_DAC);
        Reset(txt_Comentario_DAC);
    OnVisible: |-
        =UpdateContext(
            {
                Nsoli: Text(
                    First(
                        Split(
                            glr_Solicitud_AC.Selected.soli_num,
                            "-"
                        )
                    ).Value
                )
            }
        );
        Clear(compras);
        If(
            "-" in glr_Solicitud_AC.Selected.soli_num && IsEmpty(
                Filter(
                    Detalle_Solicitud_Compras,
                    soli_num = glr_Solicitud_AC.Selected.soli_num
                )
            ),
            
            ForAll(
                With(
                    {
                        Nfila: Filter(
                            Compras_NoMarcadas,
                            NSolicitud = Nsoli && Enviado = 1
                        ).NFilaSolicitud
                    },
                    Filter(
                        Filter(
                            preqitem,
                            req_num = Nsoli
                        ),
                        req_line in Nfila
                    )
                ),
                Collect(
                    compras,
                    {
                        req_line: ThisRecord.req_line,
                        item: ThisRecord.item,
                        descripcion: ThisRecord.description,
                        medida: ThisRecord.u_m,
                        cantidad: ThisRecord.qty_ordered,
                        precio: ThisRecord.unit_mat_cost,
                        num_vendedor: ThisRecord.vend_num,
                        aprobado: true,
                        comentario: ""
                    }
                )
            ),
            "-" in glr_Solicitud_AC.Selected.soli_num,
            ForAll(
                With(
                    {
                        Nfila: Filter(
                            Detalle_Solicitud_Compras,
                            soli_num = glr_Solicitud_AC.Selected.soli_num
                        ).linea
                    },
                    Filter(
                        Filter(
                            preqitem,
                            req_num = Nsoli
                        ),
                        req_line in Nfila
                    )
                ),
                Collect(
                    compras,
                    {
                        req_line: ThisRecord.req_line,
                        item: ThisRecord.item,
                        descripcion: ThisRecord.description,
                        medida: ThisRecord.u_m,
                        cantidad: ThisRecord.qty_ordered,
                        precio: ThisRecord.unit_mat_cost,
                        num_vendedor: ThisRecord.vend_num,
                        aprobado: true,
                        comentario: ""
                    }
                )
            ),
            With(
                {
                    NoMarcadas: Filter(
                        Compras_NoMarcadas,
                        NSolicitud = Nsoli
                    )
                },
                ForAll(
                    Filter(
                        Filter(
                            preqitem,
                            req_num = Nsoli
                        ),
                        Not(req_line in NoMarcadas.NFilaSolicitud)
                    ),
                    Collect(
                        compras,
                        {
                            req_line: ThisRecord.req_line,
                            item: ThisRecord.item,
                            descripcion: ThisRecord.description,
                            medida: ThisRecord.u_m,
                            cantidad: ThisRecord.qty_ordered,
                            precio: ThisRecord.unit_mat_cost,
                            num_vendedor: ThisRecord.vend_num,
                            aprobado: true,
                            comentario: ""
                        }
                    )
                )
            )
        )

