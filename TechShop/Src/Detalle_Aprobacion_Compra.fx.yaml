        btn_Aceptar_EM_7 As button:
            BorderColor: =RGBA(52, 152, 47, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisabledColor: =RGBA(166, 166, 166, 1)
            DisabledFill: =RGBA(244, 244, 244, 1)
            Fill: =RGBA(52, 152, 47, 1)
            HoverBorderColor: =RGBA(52, 152, 47, 1)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(21, 68, 18, 1)
            OnSelect: |
                =UpdateContext({Guardando: true});
                If(
                    !reset,
                    With(
                        {
                            idGerente: If(
                                StartsWith(
                                    Nsoli,
                                    "PRD"
                                ),
                                "16",
                                StartsWith(
                                    Nsoli,
                                    "MTO"
                                ),
                                "15",
                                StartsWith(
                                    Nsoli,
                                    "QAL"
                                ),
                                "2618",
                                (StartsWith(
                                    Nsoli,
                                    "TLR"
                                ) || StartsWith(
                                    Nsoli,
                                    "ADM"
                                ) || StartsWith(
                                    Nsoli,
                                    "OFC"
                                )),
                                "1124",
                                StartsWith(
                                    Nsoli,
                                    "SOL"
                                ),
                                "1133",
                                StartsWith(
                                    Nsoli,
                                    "TIC"
                                ),
                                "2648"
                            )
                        },
                        Patch(
                            Solicitud_Compras,
                            glr_Solicitud_AC.Selected,
                            {estado: "Devuelto", Fecha_Devuelto: Now()}
                        );
                        ForAll(
                            datos_DAC,
                            Collect(
                                Compras_NoMarcadas,
                                {
                                    NSolicitud: Upper(Nsoli),
                                    NFilaSolicitud: ThisRecord.linea,
                                    NItem: ThisRecord.item,
                                    Descripcion: ThisRecord.descripcion,
                                    Enviado: 0,
                                    Tipo_Envio: idGerente,
                                    Motivo: "Rechazo por Don Erick"
                                }
                            )
                        );
                        RemoveIf(
                            Compras_NoMarcadas,
                            NSolicitud = Nsoli && NFilaSolicitud in Filter(
                                datos_DAC,
                                aprobado
                            ).linea && Enviado = 1 && Tipo_Envio = idGerente
                        );
                        EnviarCorreo.Run(
                            LookUp(
                                Empleados,
                                Codigo = idGerente,
                                Correo
                            ) & "emarin@tsicr.com; rocervantes@tsicr.com; marias@tsicr.com",
                            "Solicitud no aprobada por Don Eric",
                            "Buenas,
                La solicitud " & Nsoli & " no fue aprobada por gerencia. Por favor, revise el motivo de la no aprobación y, de ser necesario, corrija la observación indicada o vuelva a enviar la solicitud.
                Una vez realizado el ajuste, comuníquese con Don Eric para gestionar nuevamente la aprobación.
                Saludos cordiales,
                Departamento de Tecnologia"
                        )
                    ),
                    Patch(
                        Solicitud_Compras,
                        glr_Solicitud_AC.Selected,
                        {estado: "Listo", Fecha_Listo: Blank()}
                    )
                );
                UpdateContext(
                    {
                        edit: {
                            view: false,
                            item: Blank()
                        },
                        Aviso: {Ver: false},
                        Rechazo: false
                    }
                );
                Clear(datos_DAC);
                Reset(txt_Num_Soli_DAC);
                Reset(drp_Estado_AC);
                UpdateContext({Guardando: false});
                Back();
            PressedBorderColor: =RGBA(52, 152, 47, 1)
            Size: =15
            Text: ="Aceptar"
            Width: =150
            X: =212
            Y: =129
            ZIndex: =71

