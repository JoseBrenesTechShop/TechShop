Screen2 As screen:
    Fill: =Color.White
    LoadingSpinnerColor: =App.Theme.Colors.Primary

    "TextInputCanvas1 As 'Entrada de texto'":
        Align: =Align.Center
        DisplayMode: =DisplayMode.Edit
        Height: =32
        Width: =320
        X: =550
        Y: =70
        ZIndex: =2

    "TextInputCanvas1_1 As 'Entrada de texto'":
        Align: =Align.Center
        DisplayMode: =DisplayMode.Edit
        Height: =32
        Value: =Left(TextInputCanvas1.Value, Find("&", TextInputCanvas1.Value) - 1)
        Width: =250
        X: =490
        Y: =132
        ZIndex: =3

    "TextInputCanvas1_2 As 'Entrada de texto'":
        Align: =Align.Center
        DisplayMode: =DisplayMode.Edit
        Height: =32
        Value: |-
            =
            Mid(TextInputCanvas1.Value, Find("&", TextInputCanvas1.Value) + 1)
        Width: =59
        X: =420
        Y: =132
        ZIndex: =4

    "TextInputCanvas1_3 As 'Entrada de texto'":
        Align: =Align.Center
        DisplayMode: =DisplayMode.Edit
        Height: =32
        Value: =Substitute(Upper(TextInputCanvas1_1.Value), "'", "-")
        Width: =250
        X: =750
        Y: =132
        ZIndex: =5

    Label31 As label:
        Align: =Align.Center
        BorderColor: =App.Theme.Colors.Darker40
        Color: =RGBA(0, 0, 0, 1)
        DisabledColor: =RGBA(166, 166, 166, 1)
        Font: =App.Theme.Font
        Height: =25
        Size: =11
        Text: ="Codigo"
        Width: =60
        X: =420
        Y: =107
        ZIndex: =6

    Label31_1 As label:
        Align: =Align.Center
        BorderColor: =App.Theme.Colors.Darker40
        Color: =RGBA(0, 0, 0, 1)
        DisabledColor: =RGBA(166, 166, 166, 1)
        Font: =App.Theme.Font
        Height: =25
        Size: =11
        Text: ="P/N"
        Width: =250
        X: =490
        Y: =107
        ZIndex: =7

    Label31_2 As label:
        Align: =Align.Center
        BorderColor: =App.Theme.Colors.Darker40
        Color: =RGBA(0, 0, 0, 1)
        DisabledColor: =RGBA(166, 166, 166, 1)
        Font: =App.Theme.Font
        Height: =25
        Size: =11
        Text: ="P/N Corregido"
        Width: =250
        X: =750
        Y: =107
        ZIndex: =8

