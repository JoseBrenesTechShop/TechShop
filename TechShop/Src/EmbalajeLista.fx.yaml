                            Nomenclatura: varBaseNomenclatura & LookUp(varIndicesLetras, Indice = LookUp(varIndicesLetras, Letra = Right(Nomenclatura, 1)).Indice - 1).Letra,
                            Modificado: txt_EmpleadoUso_EM_2.Text,
