                Height: =30
                HoverBorderColor: =RGBA(40, 134, 222, 1)
                HoverColor: =RGBA(0, 0, 0, 1)
                HoverFill: =App.Theme.Colors.Lighter70
                OnChange: |-
                    =With(
                        {
                        PNCorregido: Substitute(
                                        Substitute(
                                            Substitute(
                                                Substitute(
                                                    Upper(Self.Text),
                                                    "¿",
                                                    "¡"
                                                ),
                                                "¡",
                                                "&"
                                            ),
                                            "&",
                                            "/"
                                        ),
                                        "'",
                                        "-"
                                    ),
                    
                        PNSplit: Split(
                                    Substitute(
                                        Substitute(
                                            Substitute(
                                                Substitute(
                                                    Upper(Self.Text),
                                                    "¿",
                                                    "¡"
                                                ),
                                                "¡",
                                                "&"
                                            ),
                                            "&",
                                            "/"
                                        ),
                                        "'",
                                        "-"
                                    ),
                                    "/"
                                )
                    },
                        With(
                            {
                                ident: Last(
                                    FirstN(
                                        PNSplit,
                                        2
                                    )
                                ).Value,
                                PN: First(PNSplit).Value,
                                PO: Last(PNSplit).Value,
                                item: LookUp(
                                    gl_Contenedores_RC_2.AllItems,
                                    Nomenclatura = gl_ListaContenedores_LE.Selected.Nomenclatura && Substitute('P/N', " ", "") = Substitute(First(PNSplit).Value, " ", "")
                                )
                            },
                            If(
                                CountRows(PNSplit) < 3,
                                UpdateContext(
                                    {
                                        mensajeNotificacion: "El codigo escaneado esta incompleto. Se requiera el numero de tarima y la PO",
                                        MostrarAviso: true,
                                        Disable: true
                                    }
                                ),
                                IsBlank(ident),
                                UpdateContext(
                                    {
                                        mensajeNotificacion: "Debe indicar el identificador de la tarima",
                                        MostrarAviso: true,
                                        Disable: true
                                    }
                                ),
                                IsBlank(PO),
                                UpdateContext(
                                    {
                                        mensajeNotificacion: "Debe indicar la PO",
                                        MostrarAviso: true,
                                        Disable: true
                                    }
                                ),
                                IsBlank(item),
                                UpdateContext(
                                    {
                                        mensajeNotificacion: "El P/N escaneado no exite en este contenedor.",
                                        MostrarAviso: true,
                                        Disable: true
                                    }
                                ),
                                /*((item.CantidadActual + 1) * item.Cantidad_Tarima) > Sum(Filter(InspeccionCalidadContenedors; Nomenclatura = txt_Nomenclatura_EC_5.Text && 'P/N' = PN); Revisado);
