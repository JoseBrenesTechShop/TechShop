                                        fechaRegsitro: tbl_Info_HxHR_1.Selected.FechaRegistro,
                                        fecha1: DateTimeValue(Text(tbl_Info_HxHR_1.Selected.FechaRegistro, "[$-en-US]yyyy-mm-dd") & " 00:00"),
                                        fecha2: DateTimeValue(Text(tbl_Info_HxHR_1.Selected.FechaRegistro, "[$-en-US]yyyy-mm-dd") & " 23:59"),
                                        hour: tbl_Info_HxHR_1.Selected.Hora,
                                        semana: tbl_Info_HxHR_1.Selected.Semana,
                                        maquina: tbl_Info_HxHR_1.Selected.Maquina,
                                        turno: tbl_Info_HxHR_1.Selected.Turno,
                                        estado: LookUp(
                                            Orden_Ejecucion,
                                            Orden = tbl_Info_HxHR_1.Selected.Orden && Operacion = tbl_Info_HxHR_1.Selected.Operacion,
                                            'Permiso_1.5'
                                        )
                                    }
                                }
                            );
                            UpdateContext(
                                {
                                    InfoNueva: {
                                        codigo: tbl_Info_HxHR_1.Selected.CodigoEmpleado,
                                        fecha: FechaSup,
                                        hour: drpHoraSupervisorHxH_2.SelectedText.'data-ADB4D7A662F548B49FAC2B986E348A1BValor',
                                        semana: tbl_Info_HxHR_1.Selected.Semana,
                                        maquina: tbl_Info_HxHR_1.Selected.Maquina,
                                        turno: tbl_Info_HxHR_1.Selected.Turno
                                    }
                                }
                            );
                            UpdateContext(
                                {
                                    OrdenEjecucion: LookUp(
                                        Orden_Ejecucion,
                                        Orden = tbl_Info_HxHR_1.Selected.Orden && Operacion = tbl_Info_HxHR_1.Selected.Operacion
                                    )
                                }
                            );
                            UpdateContext(
                                {
                                    OrdenTarima: LookUp(
                                        Orden_Tarimas,
                                        Orden = tbl_Info_HxHR_1.Selected.Orden && Operacion = tbl_Info_HxHR_1.Selected.Operacion && Tarima = tbl_Info_HxHR_1.Selected.Tarima
                                    )
                                }
                            );
                            UpdateContext({ProTotal: OrdenEjecucion.CantidadTotalProducida - tbl_Info_HxHR_1.Selected.Cantidad});
                            UpdateContext({TarimaTotal: OrdenTarima.CantidadTotalProducida - tbl_Info_HxHR_1.Selected.Cantidad});
                            If(
                                IsBlank(txt_Cantidad_HxHR_1.Text),
                                Notify(
                                    "La cantidad no puede estar vacia",
                                    NotificationType.Error
                                ),
                                If(
                                    Value(txt_CantProducida_HxH.Text) < 0 || Left(
                                        txt_CantProducida_HxH.Text,
                                        1
                                    ) = "-",
                                    Notify(
                                        "La cantidad no puede ser negativa",
                                        NotificationType.Error
                                    ),
                                    If(
                                        Hour(Now()) < drpHoraSupervisorHxH_2.SelectedText.'data-ADB4D7A662F548B49FAC2B986E348A1BValor' && Text(
                                            Now(),
                                            "mm/dd/yyyy"
                                        ) = drp_Fecha_HxHR_1.SelectedText.Value,
                                        Notify("No puede agregar datos en horas futuras"),
                                        If(
                                            LookUp(
                                                Maquinas,
                                                Maquina = tbl_Info_HxHR_1.Selected.Maquina
                                            ).Guns = "SI" && TarimaTotal + Value(txt_Cantidad_HxHR_1.Text) > 50,
                                            UpdateContext({Aviso: true}),
                                            If(
                                                ProTotal + Value(txt_Cantidad_HxHR_1.Text) >= OrdenEjecucion.Cantidad + (OrdenEjecucion.Cantidad * 0.015) && InfoVieja.estado <> "Aprobado",
                                                If(
                                                    IsBlank(
                                                        LookUp(
                                                            'RegistroOredenes_1.5_1',
                                                            Orden = tbl_Info_HxHR_1.Selected.Orden && Operacion = tbl_Info_HxHR_1.Selected.Operacion
                                                        )
                                                    ),
                                                    Collect(
