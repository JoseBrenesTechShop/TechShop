                    HoverFill: =RGBA(15, 108, 189, 1)
                    OnSelect: |-
                        =If(
                            tbl_Info_HxHR_1.Selected.FechaRegistro <= DateTimeValue(Text(Today(), "[$-en-US]yyyy-mm-dd") & " 23:59") && tbl_Info_HxHR_1.Selected.FechaRegistro >= DateTimeValue(Text(Today() - 3, "[$-en-US]yyyy-mm-dd") & " 00:00"),
