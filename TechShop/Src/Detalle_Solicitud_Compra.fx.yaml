Detalle_Solicitud_Compra As screen:
    BackgroundImage: ='abstracto geométrico blanco y gris'
    Fill: =Color.White
    ImagePosition: =ImagePosition.Fill
    LoadingSpinnerColor: =App.Theme.Colors.Primary
    OnHidden: |-
        =Clear(CheckList_DSC);
        Reset(txt_Solicitante_DSC);
        Reset(txt_Num_Soli_DSC);
        Reset(glr_Detalles_DSC);
        Reset(glr_Solicitudes_SC);
        Refresh(preqitem);
    OnVisible: |-
        =UpdateContext(
            {
                Guardando: true,
                Soli: First(
                    Split(
                        glr_Solicitudes_SC.Selected.soli_num,
                        "-"
                    )
                ).Value
            }
        );
        Reset(txt_Solicitante_DSC);
        Reset(txt_Num_Soli_DSC);
        Reset(glr_Detalles_DSC);
        ClearCollect(
            datos_DSC,
            Sort(
                AddColumns(
                    ShowColumns(
                        Filter(
                            Detalle_Solicitud_Compras,
                            soli_num = glr_Solicitudes_SC.Selected.soli_num
                        ),
                        linea,
                        item,
                        descripcion,
                        soli_num
                    ),
                    medida,
                    With(
                        {
                            myItem: crfb9_item,
                            linea: crfb9_linea
                        },
                        LookUp(
                            preqitem,
                            req_num = Soli && item = myItem && req_line = linea
                        ).u_m
                    ),
                    cantidad,
                    With(
                        {
                            myItem: crfb9_item,
                            linea: crfb9_linea
                        },
                        LookUp(
                            preqitem,
                            req_num = Soli && item = myItem && req_line = linea
                        ).qty_ordered
                    ),
                    precio,
                    With(
                        {
                            myItem: crfb9_item,
                            linea: crfb9_linea
                        },
                        LookUp(
                            preqitem,
                            req_num = Soli && item = myItem && req_line = linea
                        ).unit_mat_cost
                    ),
                    subtotal,
                    With(
                        {
                            myItem: crfb9_item,
                            linea: crfb9_linea
                        },
                        LookUp(
                            preqitem,
                            req_num = Soli && item = myItem && req_line = linea
                        ).qty_ordered * LookUp(
                            preqitem,
                            req_num = Soli && item = myItem && req_line = linea
                        ).unit_mat_cost
                    ),
                    vendNum,
                    With(
                        {
                            myItem: crfb9_item,
                            linea: crfb9_linea
                        },
                        LookUp(
                            preqitem,
                            req_num = Soli && item = myItem && req_line = linea
                        ).vend_num
                    ),
                    vendName,
                    With(
                        {
                            myItem: crfb9_item,
                            linea: crfb9_linea
                        },
                        With(
                            {
                                Vname: LookUp(
                                    preqitem,
                                    req_num = Soli && item = myItem && req_line = linea
                                ).vend_num
                            },
                            LookUp(
                                vendaddr,
                                vend_num = Vname
                            ).name
                        )
                    ),
                    aprobado,
                    false,
                    ver,
                    false,
                    motivoRechazo,
                    "",
                    noExiste,
                    With(
                        {
                            myItem: crfb9_item,
                            linea: crfb9_linea
                        },
                        IsBlank(
                            LookUp(
                                preqitem,
                                req_num = Soli && item = myItem && req_line = linea
                            )
                        )
                    ),
                    nuevo,
                    false,
                    motivoSolicitud,
                    With(
                        {
                            myItem: crfb9_item,
                            linea: crfb9_linea
                        },
                        ComentarioSoli.Run(
                            LookUp(
                                preqitem,
                                req_num = Soli && item = myItem && req_line = linea
                            ).RowPointer
                        ).comentario
                    ),
                    moneda,
                    With(
                        {
                            myItem: crfb9_item,
                            linea: crfb9_linea
                        },
                        With(
                            {
                                Vend: LookUp(
                                    preqitem,
                                    req_num = Soli && item = myItem && req_line = linea
                                ).vend_num
                            },
                            LookUp(
                                vendor,
                                vend_num = Vend,
                                curr_code
                            )
                        )
                    )
                ),
                crfb9_linea,
                SortOrder.Ascending
            )
        );
        ForAll(
            Filter(
                preqitem,
                req_num = Soli && stat = "R"
            ),
            With(
                {
                    myItem: ThisRecord.item,
                    myLinea: ThisRecord.req_line,
                    des: description,
                    med: u_m,
                    cant: qty_ordered,
                    pre: unit_mat_cost,
                    vend: vend_num
                },
                If(
                    IsBlank(
                        LookUp(
                            Detalle_Solicitud_Compras,
                            soli_num = Soli && item = myItem && linea = myLinea
                        )
                    ) && IsBlank(
                        LookUp(
                            Compras_NoMarcadas,
                            NSolicitud = Soli && NFilaSolicitud = myLinea && NItem = myItem
                        )
                    ),
                    Collect(
                        datos_DSC,
                        {
                            crfb9_linea: myLinea,
                            crfb9_item: myItem,
                            crfb9_descripcion: des,
                            crfb9_soli_num: glr_Solicitudes_SC.Selected.soli_num,
                            medida: med,
                            cantidad: cant,
                            precio: pre,
                            subtotal: cant * pre,
                            vendNum: vend,
                            vendName: LookUp(
                                vendaddr,
                                vend_num = vend
                            ).name,
                            aprobado: false,
                            ver: false,
                            motivoRechazo: "",
                            noExiste: false,
                            nuevo: true
                        }
                    )
                )
            )
        );
        UpdateContext({Guardando: false})

