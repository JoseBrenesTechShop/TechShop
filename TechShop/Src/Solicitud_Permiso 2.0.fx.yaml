                        HoverFill: =App.Theme.Colors.Darker10
                        OnSelect: |-
                            =UpdateContext({fechaFinal: dp_FechaInicio_SPV.SelectedDate});
                            ClearCollect(
                                finDeSemana,
                                ForAll(
                                    Sequence((Value(txt_Dias_SPV.Text) - 1)),
                                    If(
                                        Weekday(
                                            DateAdd(
                                                fechaFinal,
                                                ThisRecord.Value,
                                                TimeUnit.Days
                                            )
                                        ) = 7,
                                        {valor: 2},
                                        {valor: 0}
                                    )
                                )
                            );
                            With(
                                {
                                    newFecha: DateAdd(
                                        dp_FechaInicio_SPV.SelectedDate,
                                        (Value(txt_Dias_SPV.Text) - 1) + Sum(
                                            finDeSemana,
                                            valor
                                        )
                                    )
                                },
                                If(
                                    Weekday(newFecha) in [7, 1],
                                    UpdateContext(
                                        {
                                            fechaFinal: DateAdd(
                                                newFecha,
                                                2
                                            )
                                        }
                                    ),
                                    UpdateContext({fechaFinal: newFecha})
                                )
                            )
                        PaddingBottom: =2
                        PaddingLeft: =2
                        PaddingRight: =2
                        PaddingTop: =2
                        PressedBorderColor: =App.Theme.Colors.Darker40
