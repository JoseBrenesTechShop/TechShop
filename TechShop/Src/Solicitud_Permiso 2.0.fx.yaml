                    dp_FechaFin_SPV As datepicker:
                        BorderColor: =App.Theme.Colors.Darker40
                        BorderStyle: =BorderStyle.None
                        CalendarHeaderFill: =App.Theme.Colors.Primary
                        Color: =RGBA(0, 0, 0, 1)
                        DefaultDate: |-
                            =If(
                                LookUp(
                                    Empleados,
                                    Codigo = VarName,
                                    Contrato
                                ) in "Mensual",
                                fechaFinal,
                                DateAdd(
                                    dp_FechaInicio_SPV.SelectedDate,
                                    Value(txt_Dias_SPV.Text) - 1
                                )
                            )
                        DisabledBorderColor: =RGBA(40, 134, 222, 1)
                        DisabledColor: =RGBA(0, 0, 0, 1)
                        DisabledFill: =RGBA(255, 255, 255, 1)
                        DisplayMode: =DisplayMode.Disabled
                        Font: =App.Theme.Font
                        Height: =32
                        HoverDateFill: =App.Theme.Colors.Lighter70
                        IconBackground: =App.Theme.Colors.Primary
                        IconFill: =App.Theme.Colors.PrimaryForeground
                        PaddingTop: =5
                        SelectedDateFill: =App.Theme.Colors.Primary
                        Size: =12
                        Width: =245
                        ZIndex: =1

                    btn_calcularFechaFin_SPV As button:
                        BorderColor: =RGBA(40, 134, 222, 1)
                        Color: =App.Theme.Colors.PrimaryForeground
                        DisabledBorderColor: =RGBA(244, 244, 244, 1)
                        DisabledColor: =RGBA(166, 166, 166, 1)
                        DisabledFill: =RGBA(244, 244, 244, 1)
                        Fill: =RGBA(40, 134, 222, 1)
                        Font: =App.Theme.Font
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        HoverBorderColor: =App.Theme.Colors.Darker10
                        HoverColor: =App.Theme.Colors.PrimaryForeground
                        HoverFill: =App.Theme.Colors.Darker10
                        OnSelect: |-
                            =UpdateContext({fechaFinal: dp_FechaInicio_SPV.SelectedDate});
                            ClearCollect(
                                finDeSemana,
                                ForAll(
                                    Sequence((Value(txt_Dias_SPV.Text) - 1)),
                                    If(
                                        Weekday(
                                            DateAdd(
                                                fechaFinal,
                                                ThisRecord.Value,
                                                TimeUnit.Days
                                            )
                                        ) = 7,
                                        {valor: 2},
                                        {valor: 0}
                                    )
                                )
                            );
                            With(
                                {
                                    newFecha: DateAdd(
                                        dp_FechaInicio_SPV.SelectedDate,
                                        (Value(txt_Dias_SPV.Text) - 1) + Sum(
                                            finDeSemana,
                                            valor
                                        )
                                    )
                                },
                                If(
                                    Weekday(newFecha) in [7, 1],
                                    UpdateContext(
                                        {
                                            fechaFinal: DateAdd(
                                                newFecha,
                                                2
                                            )
                                        }
                                    ),
                                    UpdateContext({fechaFinal: newFecha})
                                )
                            )
