        btn_OrdenesAfectadas_OM As button:
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisabledColor: =RGBA(166, 166, 166, 1)
            DisabledFill: =RGBA(244, 244, 244, 1)
            Fill: =RGBA(72, 163, 62, 1)
            FontWeight: =FontWeight.Semibold
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(21, 68, 18, 1)
            OnSelect: |
                =If(
                    !IsEmpty(MaquinaRemplazo),
                    ForAll(
                        OrdenRemplazo,
                        With(
                            {
                                // Obtiene la primera prioridad disponible que no esté en uso y no sea 1
                                NewPri: If(
                                    IsEmpty(
                                        Filter(
                                            Prioridades,
                                            !(Value in Filter(
                                                Orden_MaquinasLists_1,
                                                Maquina in Filter(
                                                    Orden_MaquinasLists_1,
                                                    Orden = ThisRecord.Orden,
                                                    Operacion = ThisRecord.Operacion
                                                ).Maquina
                                            ).Prioridad) && Value <> 1
                                        )
                                    ),
                                    Max(
                                        Filter(
                                            Orden_MaquinasLists_1,
                                            Maquina in Filter(
                                                Orden_MaquinasLists_1,
                                                Orden = ThisRecord.Orden,
                                                Operacion = ThisRecord.Operacion
                                            ).Maquina
                                        ),
                                        Prioridad
                                    ) + 1,
                                    First(
                                        Filter(
                                            Prioridades,
                                            !(Value in Filter(
