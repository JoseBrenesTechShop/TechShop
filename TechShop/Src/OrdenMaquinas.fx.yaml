        btn_Registro_EM As button:
            BorderColor: =App.Theme.Colors.Primary
            BorderStyle: =BorderStyle.None
            DisabledBorderColor: =RGBA(244, 244, 244, 1)
            DisabledColor: =RGBA(166, 166, 166, 1)
            DisabledFill: =RGBA(244, 244, 244, 1)
            Fill: =RGBA(0, 134, 208, 1)
            Font: =App.Theme.Font
            FontWeight: =FontWeight.Semibold
            Height: =26
            HoverBorderColor: =App.Theme.Colors.Darker10
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(102, 182, 227, 1)
            OnSelect: |-
                =With(
                    {
                        maximas: LookUp(
                            Orden_Ejecucion,
                            Orden = RegistroOrden.Orden && Operacion = RegistroOrden.Operacion
                        ).Cantidad,
                        producidas: LookUp(
                            Orden_Ejecucion,
                            Orden = RegistroOrden.Orden && Operacion = RegistroOrden.Operacion
                        ).CantidadTotalProducida,
                        dañadas: Sum(
                            Filter(
                                Scrap_1,
                                Orden = RegistroOrden.Orden
                            ),
                            Cantidad
                        )
                    },
                    Collect(
                        Registro_Orden_Maquinas,
                        {
                            Creacion_Fecha: RegistroOrden.'Fecha de creación',
                            Orden: RegistroOrden.Orden,
                            Operacion: RegistroOrden.Operacion,
                            'P/N': RegistroOrden.'P/N',
                            Prioridad: RegistroOrden.Prioridad,
                            Meta: RegistroOrden.Meta,
                            Fecha_inicio: RegistroOrden.Fecha_Inicio,
                            Fecha_Fin: RegistroOrden.Fecha_Fin,
                            Fecha_Fin_Aprox: RegistroOrden.Fecha_Fin_Aprox,
                            Jornada: LookUp(
                                JornadaPlannings,
                                Valor = RegistroOrden.Jornada
                            ).Texto,
                            Zona: RegistroOrden.Zona,
                            Horas: RegistroOrden.Horas,
                            HorasRestantes: If(
                                Value(RegistroOrden.Meta) > 0,
                                RoundUp(
                                    ((maximas - (producidas - dañadas)) / (RegistroOrden.Meta * LookUp(
                                        ZonaPlannings,
                                        Texto = RegistroOrden.Zona,
                                        Valor
                                    )) + LookUp(
                                        Orden_Ejecucion,
                                        Orden = RegistroOrden.Orden && Operacion = RegistroOrden.Operacion
                                    ).TiempoSetup) / Max(
                                        1,
                                        CountRows(
                                            Filter(
                                                Orden_MaquinasLists_1,
                                                Orden = RegistroOrden.Orden,
                                                Operacion = RegistroOrden.Operacion
                                            )
                                        )
                                    ),
                                    0
                                ),
                                0
                            ),
                            Dias: RegistroOrden.Dias,
                            CantMaquinas: CountIf(
                                MaquinasOrigin,
                                true
                            ),
                            CantMax: maximas,
                            CantPro: producidas,
                            CantDañada: dañadas,
                            User: RegistroOrden.User
                        }
                    )
                );
                ForAll(
                    InfoMaquinasViejas,
                    With(
                        {
                            Maquina: ThisRecord,
                            m: ThisRecord.Maquina,
                            ORD: ThisRecord.Orden,
                            OP: ThisRecord.Operacion,
                            HorasPro: CountIf(
                                Distinct(
                                    Filter(
                                        'Hora X Hora',
                                        Orden = ThisRecord.Orden,
                                        Operacion = ThisRecord.Operacion,
                                        Maquina = ThisRecord.Maquina
                                    ),
                                    'Fecha_Registro_Supervisor '
                                ),
                                true
                            )
                        },
                        Collect(
                            Registro_Orden_MaquinasLists,
                            {
                                Creacion_Fecha: Maquina.Fecha,
                                Maquina: Maquina.Maquina,
                                Orden: ORD,
                                Operacion: OP,
                                'P/N': RegistroOrden.'P/N',
                                Prioridad: Maquina.Prioridad,
                                Meta: Maquina.Meta,
                                Horas: Maquina.Horas,
                                HorasProducidas: CountIf(
                                    Distinct(
                                        Filter(
                                            'Hora X Hora',
                                            Orden = ORD,
                                            Operacion = OP,
                                            Maquina = m
                                        ),
                                        'Fecha_Registro_Supervisor '
                                    ),
                                    true
                                ),
                                HorasRes: Maquina.Horas - CountIf(
                                    Distinct(
                                        Filter(
                                            'Hora X Hora',
                                            Orden = ORD,
                                            Operacion = OP,
                                            Maquina = m
                                        ),
                                        'Fecha_Registro_Supervisor '
                                    ),
                                    true
                                ),
                                CantPro: Sum(
                                    Filter(
                                        'Hora X Hora',
                                        Orden = ORD,
                                        Operacion = OP,
                                        Maquina = m
                                    ),
                                    Cantidad
                                ),
                                CantDañada: Sum(
                                    Filter(
                                        Scrap_1,
                                        Orden = ORD,
                                        Maquina = m
                                    ),
                                    Cantidad
                                )
                            }
                        )
                    )
                );
                UpdateContext(
                    {
                        RegistroOrden: Blank(),
                        MaquinasOrigin: Blank()
                    }
                );
                Clear(InfoMaquinasViejas)
            PressedBorderColor: =App.Theme.Colors.Darker40
