OrdenMaquinas As screen:
    BackgroundImage: ='abstracto geométrico blanco y gris'
    Fill: =Color.White
    ImagePosition: =ImagePosition.Fill
    LoadingSpinnerColor: =App.Theme.Colors.Primary
    OnVisible: |
        =// Inicializa la colección de prioridades con los valores mínimos
        ClearCollect(
            Prioridades,
            [
                1,
                2,
                3,
                4,
                5,
                6
            ]
        );
        // Obtiene la prioridad más alta actualmente asignada en la tabla de órdenes
        Set(
            MaxPriority,
            Max(
                Orden_Maquinas_1,
                Prioridad
            )
        );
        // Si la prioridad más alta es mayor que 6, agrega las prioridades adicionales a la colección
        If(
            MaxPriority > 6,
            ForAll(
                Sequence(
                    MaxPriority - 6,
                    7
                ),// Crea una secuencia de números desde 7 hasta MaxPriority
                Collect(
                    Prioridades,
                    Value
                )
            )
        );

