        btn_ContinuarAviso_HxH_10 As button:
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisabledColor: =RGBA(166, 166, 166, 1)
            DisabledFill: =RGBA(244, 244, 244, 1)
            Fill: =RGBA(72, 163, 62, 1)
            FontWeight: =FontWeight.Semibold
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(21, 68, 18, 1)
            OnSelect: |
                =Select(btn_OrdenesAfectadas_OM);
                //Crea la orden en caso de no existir. Si ya exite la edita
                If(
                    IsBlank(
                        LookUp(
                            Orden_Maquinas_1,
                            Orden = info.Orden && Operacion = info.Operacion
                        )
                    ),
                    //Crea un registro de una orden
                    Collect(
                        Orden_Maquinas_1,
                        {
                            Orden: info.Orden,
                            Operacion: info.Operacion,
                            'P/N': info.'P/N',
                            Meta: Value(txt_Meta_OM.Text),
                            User: txt_User_OM.Text,
                            Prioridad: Value(drp_Pri_OM.SelectedText.Value),
                            Fecha_Inicio: dp_Fecha_OM.SelectedDate,
                            Fecha_Fin_Aprox: DateValue(
                                Text(
                                    txt_FechaFin_OM.Text,
                                    "mm/dd/yyyy"
                                )
                            ),
                            Fecha_Fin: Blank(),
                            Jornada: drp_Joranada_OM.SelectedText.Valor,
                            Horas: Value(txt_Horas_OM.Text),
                            Dias: Value(txt_Dias_OM.Text),
                            Zona: drp_Zona_OM.SelectedText.Texto
                        }
                    ),
                    //Almacena el registro anterior de una orden antes de editarlo
                    UpdateContext(
                        {
                            RegistroOrden: LookUp(
                                Orden_Maquinas_1,
                                Orden = info.Orden && Operacion = info.Operacion
                            )
                        }
                    );
                    Patch(//Edita el registro de una orden
                        Orden_Maquinas_1,
                        LookUp(
                            Orden_Maquinas_1,
                            Orden = info.Orden && Operacion = info.Operacion
                        ),
                        {
                            Orden: info.Orden,
                            Operacion: info.Operacion,
                            'P/N': info.'P/N',
                            Meta: Value(txt_Meta_OM.Text),
                            User: txt_User_OM.Text,
                            Prioridad: Value(drp_Pri_OM.SelectedText.Value),
                            Fecha_Inicio: dp_Fecha_OM.SelectedDate,
                            Fecha_Fin_Aprox: DateValue(
                                Text(
                                    txt_FechaFin_OM.Text,
                                    "mm/dd/yyyy"
                                )
                            ),
                            Fecha_Fin: Blank(),
                            Jornada: drp_Joranada_OM.SelectedText.Valor,
                            Horas: Value(txt_Horas_OM.Text),
                            Dias: Value(txt_Dias_OM.Text),
                            Zona: drp_Zona_OM.SelectedText.Texto
                        }
                    )
                );
                //Guarda, edita o elimina las maquinas de la orden
                ForAll(
                    MaquinasList,
                    With(
                        {
                            m: ThisRecord.Maquina
                        },
                        If(
                            IsBlank(
                                LookUp(
                                    Orden_MaquinasLists_1,
                                    Orden = info.Orden && Operacion = info.Operacion && Maquina = m
                                )
                            ),
                            //Crea un registro de la maquina
                            Collect(
                                Orden_MaquinasLists_1,
                                {
                                    Fecha: Now(),
                                    Maquina: m,
                                    Orden: info.Orden,
                                    Operacion: info.Operacion,
                                    Prioridad: Value(drp_Pri_OM.SelectedText.Value),
                                    Horas: Value(txt_Horas_OM.Text) / CountIf(
                                        MaquinasList,
                                        true
                                    ),
                                    Meta: If(
                                        m in [
                                            "MORI1",
                                            "MORI2",
                                            "MORI12",
                                            "MORI13",
                                            "MORI14",
                                            "MORI15"
                                        ],
                                        Value(txt_Meta_OM.Text) + (Value(txt_Meta_OM.Text) * 0.1),
                                        Value(txt_Meta_OM.Text)
                                    )
                                }
                            ),
                            m in MaquinasOrigin.Maquina,
                            //Almacena el registro anterior de la maquina antes de editarlo
                            Collect(
                                InfoMaquinasViejas,
                                LookUp(
                                    Orden_MaquinasLists_1,
                                    Orden = info.Orden && Operacion = info.Operacion && Maquina = m
                                )
                            );
                            Patch(//Edita el registro de la maquina
                                Orden_MaquinasLists_1,
                                LookUp(
                                    Orden_MaquinasLists_1,
                                    Orden = info.Orden && Operacion = info.Operacion && Maquina = m
                                ),
                                {
                                    Fecha: Now(),
                                    Maquina: m,
                                    Orden: info.Orden,
                                    Operacion: info.Operacion,
                                    Prioridad: Value(drp_Pri_OM.SelectedText.Value),
                                    Horas: Value(txt_Horas_OM.Text) / CountIf(
                                        MaquinasList,
                                        true
                                    ),
                                    Meta: If(
                                        m in [
                                            "MORI1",
                                            "MORI2",
                                            "MORI12",
                                            "MORI13",
                                            "MORI14",
                                            "MORI15"
                                        ],
                                        Value(txt_Meta_OM.Text) + (Value(txt_Meta_OM.Text) * 0.1),
                                        Value(txt_Meta_OM.Text)
                                    )
                                }
                            ),
                            //Almacena el registro anterior de la maquina antes de eliminarlo
                            Collect(
                                InfoMaquinasViejas,
                                LookUp(
                                    Orden_MaquinasLists_1,
                                    Orden = info.Orden && Operacion = info.Operacion && Maquina = m
                                )
                            );
                            Remove(//Elimina el registro de la maquina
                                Orden_MaquinasLists_1,
                                LookUp(
                                    Orden_MaquinasLists_1,
                                    Orden = info.Orden && Operacion = info.Operacion && Maquina = m
                                )
                            )
                        )
                    )
                );
                Select(btn_Registro_EM);
                Clear(MaquinasList);
                Refresh(Maquinas);
                UpdateContext(
                    {
                        info: Blank(),
                        info2: Blank()
                    }
                );
                Reset(txt_BuscaMaquina_OM);
                Reset(drp_Pri_OM);
                Reset(glr_Ordenes_OM);
                UpdateContext({Guardar: false});
                UpdateContext({Disable: false});
