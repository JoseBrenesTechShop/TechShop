                            Ubicacion_Bono: LookUp(
                                Maquinas,
                                Maquina = Upper(txt_Maquina_HxH2_1.Text),
                                Ubicacion_Bono
                            ),
                            Fecha_Hora: Text(
                                Now(),
                                "mm/dd/yyyy hh:mm AM/PM"
                            ),
                            Hora: drp_Hora_HxH2_1.SelectedText.'data-ADB4D7A662F548B49FAC2B986E348A1BValor'
                        }
                    );
                    Patch(
                        Orden_Ejecucion,
                        OrdenInfo,
                        {CantidadTotalProducida: txt_CantTotal_HxH2_1.Text + txt_CantProducida_HxH2_1.Text + txt_CantDañada_HxH2_1.Text}
                    );
                    If(
                        IsBlank(txt_CantTarima_HxH2_1.Text),
                        Collect(
