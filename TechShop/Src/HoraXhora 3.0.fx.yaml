                        =UpdateContext({Efi: (Value(txt_CantProducida_HxH2_1.Text + txt_CantDañada_HxH2_1.Text) / Value(txt_Meta_HxH2_1.Text)) * 100});
                        UpdateContext({Disable: true});
                        If(
                            IsBlank(OrdenInfo),//Maquina en blanco?
                            UpdateContext({TextoAdvertencia: "La maquina no esta en prioridad 1 o no exite", Mostra: true});
                          //Validacion de maquina
                            IsBlank(txt_Maquina_HxH2_1.Text),//Maquina en blanco?
                            UpdateContext({TextoAdvertencia: "Debe indicar la MAQUINA con la que esta trabajando"});
                            UpdateContext({Mostra: true}),
                            IsBlank(
                                LookUp(
                                    Maquinas,
                                    Maquina = Upper(txt_Maquina_HxH2_1.Text)
                                )
                            ),//Maquina Existe?
                            UpdateContext({TextoAdvertencia: "La MAQUINA no existe"});
                            UpdateContext({Mostra: true}),
                            LookUp(
                                Maquinas,
                                Maquina = Upper(txt_Maquina_HxH2_1.Text)
                            ).Status = "Paro",//Maquina en paro?
                            UpdateContext({TextoAdvertencia: "La MAQUINA seleccionada esta en Paro"});
                            UpdateContext({Mostra: true}),
                          //Validacion de tarima
                            IsBlank(txt_Tarima_HxH2_1.Text),//Tarima en blanco?
                            UpdateContext({TextoAdvertencia: "Debe indicar la TARIMA que se esta llenando"});
                            UpdateContext({Mostra: true}),
                            (Len(txt_Tarima_HxH2_1.Text) < 3 || Not(
                                Left(
                                    txt_Tarima_HxH2_1.Text,
                                    1
                                ) in [
                                    "T",
                                    "t"
                                ]
                            )) || !IsNumeric(
                                Mid(
                                    txt_Tarima_HxH2_1.Text,
                                    2,
                                    Len(txt_Tarima_HxH2_1.Text) - 1
                                )
                            ),//Formato valido?
                            UpdateContext({TextoAdvertencia: "El formato de la TARIMA es invalido"});
                            UpdateContext({Mostra: true}),
                          //Validacion Hora y operario
                            IsBlank(drp_Hora_HxH2_1.SelectedText),
                            UpdateContext({TextoAdvertencia: "Debe indicar la HORA del registro"});
                            UpdateContext({Mostra: true}),
                            IsBlank(drp_Operario_HxH2_1.SelectedText),
                            UpdateContext({TextoAdvertencia: "Debe indicar al OPERARIO que se le esta haciendo el registro"});
                            UpdateContext({Mostra: true}),
                          //Validacion Turno
                            txt_Turno_HxH2_1.Text in [
                                "LIBRE",
                                "TV",
                                "TF"
                            ],//Turno igual a LIBRE o TV o TF?
                            UpdateContext({TextoAdvertencia: "No puede guardar registros en turno " & txt_Turno_HxH2_1.Text & "."});
                            UpdateContext({Mostra: true}),
                          //Validacion Cantidad
                            !IsNumeric(txt_CantDañada_HxH2_1.Text) || !IsNumeric(txt_CantProducida_HxH2_1.Text),
                            UpdateContext({TextoAdvertencia: "Las cantidades deben ser NÚMERICAS"});
                            UpdateContext({Mostra: true}),
                            Value(txt_CantDañada_HxH2_1.Text) < 0 || Value(txt_CantProducida_HxH2_1.Text) < 0,
                            UpdateContext({TextoAdvertencia: "Las cantidades NO pueden ser NEGATIVAS"});
                            UpdateContext({Mostra: true}),
                            If(
                                ((txt_CantProducida_HxH2_1.Text + txt_CantDañada_HxH2_1.Text) + txt_CantTotal_HxH2_1.Text) >= Value(txt_CantMax_HxH2_1.Text),
                                Notify(
                                    "La cantidad total de la Orden junto a la operación seleccionada ha cumplido con la cantidad maxima deseada.",
                                    NotificationType.Information
                                )
                            );
                            LookUp(
                                Maquinas,
                                Maquina = Upper(txt_Maquina_HxH2_1.Text)
                            ).Guns = "SI" && ((txt_CantProducida_HxH2_1.Text + txt_CantDañada_HxH2_1.Text) + txt_CantTarima_HxH2_1.Text) > 50,
                            UpdateContext({TextoAdvertencia: "La cantidad digitada supera la cantidad maxima (50) permitida por tarima. Por favor revisar la informacion digitada."});
                            UpdateContext({Mostra: true}),
                          //Validadcion de registros
                            CountRows(
                                Filter(
                                    'Hora X Hora',
                                    Orden = txt_Orden_HxH2_1.Text,
                                    Operacion = txt_OP_HxH2_1.Text,
                                    Maquina = Upper(txt_Maquina_HxH2_1.Text),
                                    FechaRegistro >= Fecha1 && FechaRegistro <= Fecha2,
                                    Hora = drp_Hora_HxH2_1.SelectedText.'data-ADB4D7A662F548B49FAC2B986E348A1BValor'
                                )
                            ) >= 2,
                            UpdateContext({TextoAdvertencia: "Ya existen 2 registros de esta maquina en la misma hora"});
                            UpdateContext({Mostra: true}),
                            CountRows(
                                Filter(
                                    'Hora X Hora',
                                    CodigoEmpleado = drp_Operario_HxH2_1.SelectedText.Codigo,
                                    FechaRegistro >= Fecha1 && FechaRegistro <= Fecha2,
                                    Hora = HoraValor
                                )
                            ) >= 4,
                            UpdateContext({TextoAdvertencia: "Se llego al limite de 4 registros por hora del empleado"});
                            UpdateContext({Mostra: true}),
                          //lógica para establecer Cantidad_Por_Hora a 0 si ya existe un registro igual
                            If(
                                CountRows(
                                    Filter(
                                        'Hora X Hora',
                                        Maquina = Upper(txt_Maquina_HxH2_1.Text),
                                        FechaRegistro >= Fecha1 && FechaRegistro <= Fecha2,
                                        Hora = HoraValor
                                    )
                                ) > 0,
                                UpdateContext({CantidadPorHoraGuardar: 0}),//Si ya existe un registro, establece Cantidad_Por_Hora a 0
                                UpdateContext({CantidadPorHoraGuardar: Value(txt_Meta_HxH2_1.Text)})//Si no existe un registro, establece Cantidad_Por_Hora a txtMetaHxH.Text
                            );
                            //Aprovacion del 1.5
                        (txt_CantProducida_HxH2_1.Text + txt_CantTotal_HxH2_1.Text) > (txt_CantMax_HxH2_1.Text + (txt_CantMax_HxH2_1.Text * 0.015)) && OrdenInfo.'Permiso_1.5' <> "Aprobado",
                            If(
                                IsBlank(
                                    LookUp(
                                        'RegistroOredenes_1.5_1',
                                        Orden = OrdenInfo.Orden && Operacion = OrdenInfo.Operacion
                                    )
                                ),
                                Collect(
                                    'RegistroOredenes_1.5_1',
                                    {
                                        Orden: OrdenInfo.Orden,
                                        Operacion: OrdenInfo.Operacion,
                                        User_Solicitud: txtEmpleadoEnUso_HxHE_2.Text,
                                        Respuesta: "En Espera"
                                    }
                                ),
                                Remove(
                                    'RegistroOredenes_1.5_1',
                                    LookUp(
                                        'RegistroOredenes_1.5_1',
                                        Orden = OrdenInfo.Orden && Operacion = OrdenInfo.Operacion
                                    )
                                );
                                Collect(
                                    'RegistroOredenes_1.5_1',
                                    {
                                        Orden: OrdenInfo.Orden,
                                        Operacion: OrdenInfo.Operacion,
                                        User_Solicitud: txtEmpleadoEnUso_HxHE_2.Text,
                                        Respuesta: "En Espera"
                                    }
                                )
                            );
                            UpdateContext({MostraBloqueo: true}),
                          //Guarda el registro
                            If(
                                Efi < 80,
                                UpdateContext({MostraCausa: true}),
                                Collect(
                                    'Hora X Hora',
                                    {
                                        CodigoEmpleado: drp_Operario_HxH2_1.SelectedText.Codigo,
                                        Operario: drp_Operario_HxH2_1.SelectedText.Empleado,
                                        Maquina: Upper(txt_Maquina_HxH2_1.Text),
                                        Orden: OrdenInfo.Orden,
                                        Operacion: OrdenInfo.Operacion,
                                        'P/N': OrdenInfo.'P/N',
                                        Cantidad_Por_Hora: CantidadPorHoraGuardar,
                                        Cantidad: Value(txt_CantProducida_HxH2_1.Text),
                                        Scrap: Value(txt_CantDañada_HxH2_1.Text),
                                        Semana: Value(txt_Semana_HxH2_1.Text),
                                        Turno: txt_Turno_HxH2_1.Text,
                                        User: txtEmpleadoEnUso_HxHE_2.Text,
                                        'Fecha_Registro_Supervisor ': Text(
                                            Text(
                                                FechaSup,
                                                "mm/dd/yyyy"
                                            ) & " " & drp_Hora_HxH2_1.SelectedText.Value
                                        ),
                                        FechaRegistro: DateTimeValue(
                                            Text(
                                                FechaSup,
                                                "[$-en-US]yyyy-mm-dd"
                                            ) & " 12:00:00"
                                        ),
                                        Tarima: Upper(txt_Tarima_HxH2_1.Text),
                                        Comentario: drp_Comentario_HxH2_1.SelectedText.Value,
                                        Causa: "Bien",
                                        Descripcion: txt_Descripcion_HxH2_1.Text,
                                        Ubicacion_Bono: LookUp(
                                            Maquinas,
                                            Maquina = Upper(txt_Maquina_HxH2_1.Text),
                                            Ubicacion_Bono
                                        ),
                                        Fecha_Hora: Text(
                                            Now(),
                                            "mm/dd/yyyy hh:mm AM/PM"
                                        ),
                                        Hora: drp_Hora_HxH2_1.SelectedText.'data-ADB4D7A662F548B49FAC2B986E348A1BValor'
                                    }
                                );
                                Patch(
                                    Orden_Ejecucion,
                                    OrdenInfo,
                                    {CantidadTotalProducida: txt_CantTotal_HxH2_1.Text + txt_CantProducida_HxH2_1.Text + txt_CantDañada_HxH2_1.Text}
                                );
                                If(
                                    IsBlank(txt_CantTarima_HxH2_1.Text),
                                    Collect(
                                        Orden_Tarimas,
                                        {
                                            Orden: txt_Orden_HxH2_1.Text,
                                            Operacion: txt_OP_HxH2_1.Text,
                                            Tarima: Upper(txt_Tarima_HxH2_1.Text),
                                            CantidadTotalProducida: Value(txt_CantProducida_HxH2_1.Text + txt_CantDañada_HxH2_1.Text)
                                        }
                                    ),
                                    Patch(
                                        Orden_Tarimas,
                                        LookUp(
                                            Orden_Tarimas,
                                            Orden = OrdenInfo.Orden && Operacion = OrdenInfo.Operacion && Tarima = txt_Tarima_HxH2_1.Text
                                        ),
                                        {CantidadTotalProducida: txt_CantTarima_HxH2_1.Text + txt_CantProducida_HxH2_1.Text + txt_CantDañada_HxH2_1.Text}
                                    )
                                );
                                UpdateContext(
                                    {
                                        RecordHerramienta: Filter(
                                            Herramientas,
                                            Maquina = Upper(txt_Maquina_HxH2_1.Text),
                                            Operacion = OrdenInfo.Operacion
                                        )
                                    }
                                );
                                ForAll(
                                    RecordHerramienta,
                                    Patch(
                                        Herramientas,
                                        ThisRecord,
                                        {Cant_Actual: Cant_Actual + Value(txt_CantProducida_HxH2_1.Text + txt_CantDañada_HxH2_1.Text)}
                                    )
                                );
                                Reset(txt_Maquina_HxH2_1);
                                Reset(txt_Tarima_HxH2_1);
                                Reset(drp_Comentario_HxH2_1);
                                Reset(drp_Causas_HxH2_1);
                                Reset(drp_Fecha_HxH2_1);
                                Reset(drp_Hora_HxH2_1);
                                Reset(txt_CantDañada_HxH2_1);
                                Reset(txt_CantProducida_HxH2_1);
                                UpdateContext(
                                    {
                                        FechaSup: DateTimeValue(
                                            Text(
                                                Today(),
                                                "[$-en-US]yyyy-mm-dd"
                                            ) & " 12:00:00"
                                        ),
                                        Fecha1: DateTimeValue(
                                            Text(
                                                Today(),
                                                "[$-en-US]yyyy-mm-dd"
                                            ) & " 00:00:00"
                                        ),
                                        Fecha2: DateTimeValue(
                                            Text(
                                                Today(),
                                                "[$-en-US]yyyy-mm-dd"
                                            ) & " 23:59:59"
                                        ),
                                        Comentarios: {
                                            Comentario: "PRODUCION",
                                            Causa: "Bien"
                                        },
                                        FechaHorario: DateValue(Today()),
                                        Dia: Weekday(FechaSup),
                                        Hora: Blank(),
                                        turnoFinal: Blank(),
                                        turnoSeleccionado: Blank(),
                                        HoraValor: Blank(),
                                        OrdenInfo: Blank(),
                                        Disable: false,
                                        CantidadPorHoraGuardar: Blank()
                                    }
                                );
                                Notify(
                                    "Se ha Guardado exitosamente",
                                    NotificationType.Success
                                )
                            )
                        )
