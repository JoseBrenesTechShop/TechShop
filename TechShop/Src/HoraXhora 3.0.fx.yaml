                                Orden = OrdenInfo.Orden && Operacion = OrdenInfo.Operacion && Tarima = txt_Tarima_HxH2_1.Text
                            ),
                            {CantidadTotalProducida: txt_CantTarima_HxH2_1.Text + txt_CantProducida_HxH2_1.Text + txt_CantDañada_HxH2_1.Text}
                        )
                    );
                    UpdateContext(
