                OnSelect: |-
                    =Set(
                        varFirmaJefe,
                        JSON(
                            pnl_FirmaJefe_EstadoPermisos_1.Image,
                            JSONFormat.IncludeBinaryData
                        )
                    );
                    Set(
                        LogotipoTechShop,
                        JSON(
                            Logotipo_2.Image,
                            JSONFormat.IncludeBinaryData
                        )
                    );
                    UpdateContext({ConVisible: false});
                    If(
                        drp_Estado_EstadosPermisos_1.SelectedText.Value = "Aprobado",
                        EnviarCorreo.Run(
                            LookUp(
                                Empleados,
                                Codigo = GaleriaEstado_2.Selected.Codigo,
                                Correo
                            ),
                            "Revisión de Solicitudes",
                            "Estimado/a,<br><br>" & "Le informamos que su solicitud de " & GaleriaEstado_2.Selected.Solicitud & " ha sido " & drp_Estado_EstadosPermisos_1.SelectedText.Value & ".<br><br>" & ".<br><br>" & "La solicitud aprobada comprende un total de " & GaleriaEstado_2.Selected.DiasSolicitados & " días, con fecha de inicio " & lbl_FechaInicioInf_EstadoPermisos_1.Text & " y fecha de fin " & lbl_FechaFinInf_EstadoPermisos_2.Text & ".<br><br>" & "Le solicitamos que se presente en el departamento de Capital Humano para firmar su boleta correspondiente. En caso de no acudir a firmar, su solicitud no será tramitada.<br><br>" & "Gracias.<br>"
                        );
                        
                    );
                    If(
                        drp_Estado_EstadosPermisos_1.SelectedText.Value = "Rechazado",
                        EnviarCorreo.Run(
                            LookUp(
                                Empleados,
                                Codigo = GaleriaEstado_2.Selected.Codigo,
                                Correo
                            ),
                            "Revisión de Solicitudes",
                            "Estimado/a,<br><br>" & "Le informamos que su solicitud de " & GaleriaEstado_2.Selected.Solicitud & " ha sido " & drp_Estado_EstadosPermisos_1.SelectedText.Value & ".<br><br>" & ".<br><br>" & "La solicitud Rechazada comprende un total de " & GaleriaEstado_2.Selected.DiasSolicitados & " días, con fecha de inicio " & lbl_FechaInicioInf_EstadoPermisos_1.Text & " y fecha de fin " & lbl_FechaFinInf_EstadoPermisos_2.Text & ".<br><br>" & "El motivo el cual fue rechazado fue el siguiente: " & txt_MotivoRehazo_EstadoPermisos_1.Text & ".<br><br>" & "Gracias.<br>"
                        );
                        
                    );
                    If(
                        drp_Estado_EstadosPermisos_1.SelectedText.Value = "Aprobado",
                        CorreoConPDF.Run(
                            htmlPDF_1.HtmlText,
                            LookUp(
                                Empleados,
                                Codigo = VarName,
                                Correo
                            ),
                            "Revisión de Solicitudes",
                            "Estimado/a,<br><br>" & "Se ha aprobado la solicitud del colaborador " & GaleriaEstado_2.Selected.Nombre & ", con el ID " & GaleriaEstado_2.Selected.Codigo & ".<br><br>" & "La solicitud aprobada comprende un total de " & GaleriaEstado_2.Selected.DiasSolicitados & " días, con fecha de inicio " & lbl_FechaInicioInf_EstadoPermisos_1.Text & " y fecha de fin " & lbl_FechaFinInf_EstadoPermisos_2.Text & ".<br><br>" & "Para obtener más detalles sobre la solicitud aceptada, por favor, consulte el PDF adjunto o revise la solicitud desde el módulo correspondiente.<br><br>" & "Gracias,<br>"
                        );
                        
                    );
                    If(
                        drp_Estado_EstadosPermisos_1.SelectedText.Value = "Aprobado",
                        CorreoConPDF.Run(
                            htmlPDF_1.HtmlText,
                            "rrhh@tsicr.com",
