                                Empleados,
                                Codigo = VarName,
                                Nombre
                            ) & " <br><br>" & "La solicitud aprobada comprende un total de " & GaleriaEstado_2.Selected.DiasSolicitados & " días, con fecha de inicio " & lbl_FechaInicioInf_EstadoPermisos_1.Text & " y fecha de fin " & lbl_FechaFinInf_EstadoPermisos_2.Text & ".<br><br>" & "Para obtener más detalles sobre la solicitud aceptada, por favor, consulte el PDF adjunto o revise la solicitud desde el módulo correspondiente.<br><br>" & "Gracias,<br>"
                        );
                        
                    );
                    Patch(
                        TramitesSolicitudes,
                        GaleriaEstado_2.Selected,
                        {
                            EstadoDeProceso: drp_Estado_EstadosPermisos_1.SelectedText.Value,
