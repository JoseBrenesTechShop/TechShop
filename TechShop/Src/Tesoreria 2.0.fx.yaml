"'Tesoreria 2.0' As screen":
    BackgroundImage: ='abstracto geométrico blanco y gris'
    Fill: =Color.White
    ImagePosition: =ImagePosition.Fill
    LoadingSpinnerColor: =App.Theme.Colors.Primary
    OnVisible: |
        =// Inicializamos paginación
        UpdateContext({ currentPage: 1, pageSize: 13 });
        
        // Refrescar fuentes
        Refresh(poitem);
        Refresh(po);
        Refresh(Compras_Pots);
        
        // Traer todas las compras
        ClearCollect(colComprasFiltered, Compras_Pots);
        
        // Traer todos los PO distintos
        ClearCollect(colPOs, Distinct(poitem, po_num));
        
        // Calcular TotalPagar y dejar solo los que sean > 0
        ClearCollect(
            colContenedoresAll,
            Filter(
                AddColumns(
                    colPOs,
                    pon, Value,
                    TotalPagar,
                        Value( LookUp(po, po_num = Value, po_cost) )
                        - Sum( Filter(colComprasFiltered, POT = Value), Value(Total) )
                ),
                TotalPagar > 0
            )
        );
        
        // Calcular total de páginas
        UpdateContext({
            totalPages: RoundUp(CountRows(colContenedoresAll) / pageSize, 0)
        });
        
        // Crear lista de páginas para el dropdown
        ClearCollect(
            colPaginas,
            ForAll(
                Sequence(totalPages),
                { NumeroPagina: Value }
            )
        );
        
        // Cargar primera página
        ClearCollect(
            colContenedores,
            FirstN(
                Sort(colContenedoresAll, pon, SortOrder.Descending),
                pageSize
            )
        );

