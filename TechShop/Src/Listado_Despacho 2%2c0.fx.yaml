                      Descripcion: ThisRecord.Descripcion
                    },
                    If(
                      IsBlank(existing),
                      Patch(
                        LogisticDespachos,
                        Defaults(LogisticDespachos),
                        {
                         POT: POT,   
                         Fecha: Today(), 
                        'Estado (crfb9_estado)': "", 
                         descripcion: Descripcion, 
                         Cantidad: Cantidad, 
                        'Cantidad Recibida': CantidadRecibida,
                        'Cantidad Faltante': CantidadFaltante
                        }
                      ),
                      Patch(
                        LogisticDespachos,
                        existing,
                        {
                         Fecha: Today(), 
                        'Estado (crfb9_estado)': "", 
                         descripcion: Descripcion, 
                         Cantidad: Cantidad, 
                        'Cantidad Recibida': CantidadRecibida,
                        'Cantidad Faltante': CantidadFaltante
                        }
                      )
                    )
                  )
                );
                
                
                    UpdateContext(
                        {
                            MostrarAviso: true,
                            mensajeNotificacion: "Datos guardados correctamente",
                            AbrirCont: false,
                            AbrirLisDespacho: false
                        }
                    );
                
                    Clear(colPotsExpanded);
                
                    ForAll(
                        colMaterialesTracking,
                        Collect(
                            colPotsExpanded,
                            ForAll(
                                Split(POT, ","),
                                {
                                    POT: Trim(Value),
                                    CantidadFaltante: If(IsBlank(CantidadFaltante), 0, Value(Text(CantidadFaltante)))
                                }
                            )
                        )
                    );
                
                    ClearCollect(
                        colPotsSums,
                        AddColumns(
                            GroupBy(colPotsExpanded, POT, Registros),
                            TotalFaltante,
                            Sum(Registros, CantidadFaltante)
                        )
                    );
                
                    ForAll(
                        Filter(colPotsSums, TotalFaltante = 0),
                        With(
                            { thePOT: POT },
                            If(
                                !IsBlank(thePOT),
                                Patch(
                                    Compras_Pots,
                                    LookUp(Compras_Pots, POT = thePOT),
                                    { 'Estado (crfb9_estado)': "Despachado" }
                                )
                            )
                        )
                    );
                
                ForAll(
                  Filter(colPotsSums, TotalFaltante = 0),
                  With({ thePOT: POT },
                    If(
                      !IsBlank(thePOT),
                      UpdateIf(
                        Logistica_Movimientos,
                        POT = thePOT && ID_Tracking = SelectedTracking.ID_Tracking && Tracking = SelectedTracking.Tracking,
                        { 'Estado (crfb9_estado)': "Recibido" }
                      )
                    )
                  )
                );
                
                    Clear(DespachoCollection);
                    Refresh(LogisticDespachos)
                )
            Size: =15
            Text: ="Guardar"
            Width: =225
            X: =685
            Y: =559
            ZIndex: =72

