                            "[$-en-US]yyyy-mm-dd"
                        ) & " 23:59"
                    ) && tbl_Info_HxHR_1.Selected.FechaRegistro >= DateTimeValue(
                        Text(
                            Today() - 3,
                            "[$-en-US]yyyy-mm-dd"
                        ) & " 00:00"
                    ),
                    UpdateContext(
                        {
                            InfoVieja: {
                                codigo: tbl_Info_HxHR_1.Selected.CodigoEmpleado,
                                fecha: tbl_Info_HxHR_1.Selected.FechaRegistro,
                                fecha1: DateTimeValue(
                                    Text(
                                        tbl_Info_HxHR_1.Selected.FechaRegistro,
                                        "[$-en-US]yyyy-mm-dd"
                                    ) & " 00:00"
                                ),
                                fecha2: DateTimeValue(
                                    Text(
                                        tbl_Info_HxHR_1.Selected.FechaRegistro,
                                        "[$-en-US]yyyy-mm-dd"
                                    ) & " 23:59"
                                ),
                                hour: tbl_Info_HxHR_1.Selected.Hora,
                                semana: tbl_Info_HxHR_1.Selected.Semana,
                                maquina: tbl_Info_HxHR_1.Selected.Maquina,
                                turno: tbl_Info_HxHR_1.Selected.Turno
                            }
                        }
                    );
                    UpdateContext(
                        {
                            InfoNueva: {
                                codigo: tbl_Info_HxHR_1.Selected.CodigoEmpleado,
                                fecha: FechaSup,
                                hour: drp_Hora_HxHR2.SelectedText.'data-ADB4D7A662F548B49FAC2B986E348A1BValor',
                                semana: tbl_Info_HxHR_1.Selected.Semana,
                                maquina: tbl_Info_HxHR_1.Selected.Maquina,
                                turno: tbl_Info_HxHR_1.Selected.Turno
                            }
                        }
                    );
                    UpdateContext(
                        {
                            OrdenEjecucion: LookUp(
                                Orden_Ejecucion,
                                Orden = tbl_Info_HxHR_1.Selected.Orden && Operacion = tbl_Info_HxHR_1.Selected.Operacion
                            )
                        }
                    );
                    UpdateContext(
                        {
                            OrdenTarima: LookUp(
                                Orden_Tarimas,
                                Orden = tbl_Info_HxHR_1.Selected.Orden && Operacion = tbl_Info_HxHR_1.Selected.Operacion && Tarima = tbl_Info_HxHR_1.Selected.Tarima
                            )
                        }
                    );
                    UpdateContext(
                        {
                            Cantidad: Value(txt_Cantidad_HxHR2.Text + txt_Scrap_HxHR2.Text),
                            ProTotal: OrdenEjecucion.CantidadTotalProducida - (tbl_Info_HxHR_1.Selected.Cantidad + tbl_Info_HxHR_1.Selected.Scrap),
                            TarimaTotal: OrdenTarima.CantidadTotalProducida - (tbl_Info_HxHR_1.Selected.Cantidad + tbl_Info_HxHR_1.Selected.Scrap)
                        }
                    );
                    Patch(
                        Orden_Ejecucion,
                        OrdenEjecucion,
                        {CantidadTotalProducida: ProTotal}
                    );
                    Patch(
                        Orden_Tarimas,
                        OrdenTarima,
                        {CantidadTotalProducida: TarimaTotal}
                    );
                    Remove(
                        'Hora X Hora',
                        tbl_Info_HxHR_1.Selected
                    );
                    Refresh('Hora X Hora');
                    UpdateContext(
                        {
                            Mostra: false,
                            Cantidad: 0,
                            ProTotal: 0,
                            TarimaTotal: 0,
                            OrdenEjecucion: Blank(),
                            OrdenTarima: Blank(),
                            InfoNueva: Blank(),
                            InfoVieja: Blank()
                        }
                    ),
