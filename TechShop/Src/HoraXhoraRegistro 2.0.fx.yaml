"'HoraXhoraRegistro 2.0' As screen":
    BackgroundImage: ='abstracto geométrico blanco y gris'
    Fill: =Color.White
    ImagePosition: =ImagePosition.Fill
    LoadingSpinnerColor: =App.Theme.Colors.Primary
    OnVisible: |-
        =UpdateContext(
            {
                Fecha1: DateTimeValue(
                    Text(
                        Today(),
                        "[$-en-US]yyyy-mm-dd"
                    ) & " 00:00:00"
                ),
                Fecha2: DateTimeValue(
                    Text(
                        Today(),
                        "[$-en-US]yyyy-mm-dd"
                    ) & " 23:59:59"
                )
            }
        )

