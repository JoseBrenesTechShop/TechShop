        btn_Guardar_HxHR2 As button:
            BorderColor: =RGBA(52, 152, 47, 1)
            DisabledBorderColor: =RGBA(244, 244, 244, 1)
            DisabledColor: =RGBA(166, 166, 166, 1)
            DisabledFill: =RGBA(244, 244, 244, 1)
            DisplayMode: =If(Aviso || Eliminar, DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =RGBA(72, 163, 62, 1)
            Font: =App.Theme.Font
            Height: =50
            HoverBorderColor: =RGBA(52, 152, 47, 1)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(13, 99, 9, 1)
            OnSelect: |-
                =If(
                    tbl_Info_HxHR2.Selected.FechaRegistro <= DateTimeValue(
                        Text(
                            Today(),
                            "[$-en-US]yyyy-mm-dd"
                        ) & " 23:59"
                    ) && tbl_Info_HxHR2.Selected.FechaRegistro >= DateTimeValue(
                        Text(
                            Today() - 5,
                            "[$-en-US]yyyy-mm-dd"
                        ) & " 00:00"
                    ),
                    UpdateContext(
                        {
                            Disable: true,
                            InfoVieja: {
                                codigo: tbl_Info_HxHR2.Selected.CodigoEmpleado,
                                fechaRegsitro: tbl_Info_HxHR2.Selected.FechaRegistro,
                                fecha1: DateTimeValue(
                                    Text(
                                        tbl_Info_HxHR2.Selected.FechaRegistro,
                                        "[$-en-US]yyyy-mm-dd"
                                    ) & " 00:00"
                                ),
                                fecha2: DateTimeValue(
                                    Text(
                                        tbl_Info_HxHR2.Selected.FechaRegistro,
                                        "[$-en-US]yyyy-mm-dd"
                                    ) & " 23:59"
                                ),
                                hour: tbl_Info_HxHR2.Selected.Hora,
                                semana: tbl_Info_HxHR2.Selected.Semana,
                                maquina: tbl_Info_HxHR2.Selected.Maquina,
                                turno: tbl_Info_HxHR2.Selected.Turno,
                                estado: LookUp(
                                    Orden_Ejecucion,
                                    Orden = tbl_Info_HxHR2.Selected.Orden && Operacion = tbl_Info_HxHR2.Selected.Operacion,
                                    'Permiso_1.5'
                                )
                            },
                            InfoNueva: {
                                codigo: tbl_Info_HxHR2.Selected.CodigoEmpleado,
                                fecha: FechaSup,
                                hour: drp_Hora_HxHR2.SelectedText.'data-ADB4D7A662F548B49FAC2B986E348A1BValor',
                                semana: tbl_Info_HxHR2.Selected.Semana,
                                maquina: tbl_Info_HxHR2.Selected.Maquina,
                                turno: tbl_Info_HxHR2.Selected.Turno
                            },
                            OrdenEjecucion: LookUp(
                                Orden_Ejecucion,
                                Orden = tbl_Info_HxHR2.Selected.Orden && Operacion = tbl_Info_HxHR2.Selected.Operacion
                            ),
                            OrdenTarima: LookUp(
                                Orden_Tarimas,
                                Orden = tbl_Info_HxHR2.Selected.Orden && Operacion = tbl_Info_HxHR2.Selected.Operacion && Tarima = tbl_Info_HxHR2.Selected.Tarima
                            ),
                            Cantidad: Value(txt_Cantidad_HxHR2.Text + txt_Scrap_HxHR2.Text),
                            maximoTarima: With(
                                {
                                    tipo: LookUp(
                                        Maquinas,
                                        Maquina = tbl_Info_HxHR2.Selected.Maquina
                                    ).Guns
                                },
                                If(
                                    tipo = "Guns",
                                    50,
                                    tipo = "Tandem",
                                    150,
                                    tipo = "Dona",
                                    112,
                                    tipo = "Tornillo",
                                    96,
                                    50
                                )
                            )
                        }
                    );
                    If(
                        IsBlank(txt_Cantidad_HxHR2.Text) || IsBlank(txt_Scrap_HxHR2.Text) || IsBlank(txt_Meta_HxHR2.Text),
                        UpdateContext(
                            {
                                TextoAdvertencia: "Ningun campo puede estar vacio",
                                Aviso: true
                            }
                        ),
                        If(
                            Value(txt_Cantidad_HxHR2.Text) < 0 || Value(txt_Scrap_HxHR2.Text) < 0 || Value(txt_Meta_HxHR2.Text) < 0,
                            UpdateContext(
                                {
                                    TextoAdvertencia: "Ninguna cantidad puede ser negativa",
                                    Aviso: true
                                }
                            ),
                            If(
                                Hour(Now()) < drp_Hora_HxHR2.SelectedText.'data-ADB4D7A662F548B49FAC2B986E348A1BValor' && Text(
                                    Now(),
                                    "mm/dd/yyyy"
                                ) = drp_Fecha_HxHR2.SelectedText.Value,
                                UpdateContext(
                                    {
                                        TextoAdvertencia: "No se puedem hacer registros de horas futuras",
                                        Aviso: true
                                    }
                                ),
                                If(
                                    LookUp(
                                        Maquinas,
                                        Maquina = tbl_Info_HxHR2.Selected.Maquina
                                    ).Guns in ["Guns", "Tandem", "Dona", "Tornillo"] && (OrdenTarima.CantidadTotalProducida - (tbl_Info_HxHR2.Selected.Cantidad + tbl_Info_HxHR2.Selected.Scrap)) + Cantidad > maximoTarima,
                                    UpdateContext(
                                        {
                                            TextoAdvertencia: "No se puede superar la cantidad maxima permitida por Tarima. (" & maximoTarima & " piezas)",
                                            Aviso: true
                                        }
                                    ),
                                    If(
                                        (OrdenEjecucion.CantidadTotalProducida - (tbl_Info_HxHR2.Selected.Cantidad + tbl_Info_HxHR2.Selected.Scrap)) + Cantidad >= OrdenEjecucion.Cantidad + (OrdenEjecucion.Cantidad * 0.015) && InfoVieja.estado <> "Aprobado",
                                        If(
                                            IsBlank(
                                                LookUp(
                                                    'RegistroOredenes_1.5_1',
                                                    Orden = tbl_Info_HxHR2.Selected.Orden && Operacion = tbl_Info_HxHR2.Selected.Operacion
                                                )
                                            ),
                                            Collect(
                                                'RegistroOredenes_1.5_1',
                                                {
                                                    Orden: tbl_Info_HxHR2.Selected.Orden,
                                                    Operacion: tbl_Info_HxHR2.Selected.Operacion,
                                                    User_Solicitud: txtEmpleadoEnUso_2.Text,
                                                    Respuesta: "En Espera"
                                                }
                                            ),
                                            Remove(
                                                'RegistroOredenes_1.5_1',
                                                LookUp(
                                                    'RegistroOredenes_1.5_1',
                                                    Orden = tbl_Info_HxHR2.Selected.Orden && Operacion = tbl_Info_HxHR2.Selected.Operacion
                                                )
                                            );
                                            Collect(
                                                'RegistroOredenes_1.5_1',
                                                {
                                                    Orden: tbl_Info_HxHR2.Selected.Orden,
                                                    Operacion: tbl_Info_HxHR2.Selected.Operacion,
                                                    User_Solicitud: txtEmpleadoEnUso_2.Text,
                                                    Respuesta: "En Espera"
                                                }
                                            )
                                        );
                                        UpdateContext({Bloqueo: true}),
                                        /*If(
                                            ((Value(txt_Cantidad_HxHR.Text) / Value(txt_Meta_HxHR.Text)) * 100) < 85,
                                            UpdateContext({AvisoCausa: true}),*/
                                        Patch(
