    HtmlPDF_HP_1 As htmlViewer:
        Height: =14
        HtmlText: |-
            =Concatenate(
              "<!DOCTYPE html>",
              "<html>",
              "<head>",
                "<title>Horarios</title>",
                "<style>",
                  "body { font-family: Arial, sans-serif; margin: 20px; }",
                  "h1 { color: #333; font-weight: bold; margin-bottom: 10px; }",
                  "table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }",
                  "th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }",
                  "th { background-color: #f0f0f0; }",
                  ".cell { padding: 10px; border-bottom: 1px solid #ddd; }",
                  ".button { background-color: #4CAF50; color: #fff; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }",
                  ".button:hover { background-color: #3e8e41; }",
                "</style>",
              "</head>",
              "<body>",
                "<h1>Horario</h1>",
                "<table>",
                  "<tr>",
                    "<th>Día</th>",
                    "<th>Turno</th>",
                    "<th>Horario</th>",
                  "</tr>",
                  "<tr>",
                    "<td class='cell'>Lunes</td>",
                    "<td class='cell'>", drpTurno_L_1.SelectedText.Value, "</td>",
                    "<td class='cell'>", lblHorario_L_1.Text, "</td>",
                  "</tr>",
                  "<tr>",
                    "<td class='cell'>Martes</td>",
                    "<td class='cell'>", drpTurno_K_1.SelectedText.Value, "</td>",
                    "<td class='cell'>", lblHorario_K_1.Text, "</td>",
                  "</tr>",
                  "<tr>",
                    "<td class='cell'>Miércoles</td>",
                    "<td class='cell'>", drpTurno__M_1.SelectedText.Value, "</td>",
                    "<td class='cell'>", lblHorario_M_1.Text, "</td>",
                  "</tr>",
                  "<tr>",
                    "<td class='cell'>Jueves</td>",
                    "<td class='cell'>", drpTurno_J.SelectedText.Value, "</td>",
                    "<td class='cell'>", lblHorario_J.Text, "</td>",
                  "</tr>",
                  "<tr>",
                    "<td class='cell'>Viernes</td>",
                    "<td class='cell'>", drpTurno_V.SelectedText.Value, "</td>",
                    "<td class='cell'>", lblHorario_V.Text, "</td>",
                  "</tr>",
                  "<tr>",
                    "<td class='cell'>Sábado</td>",
                    "<td class='cell'>", drpTurno_S.SelectedText.Value, "</td>",
                    "<td class='cell'>", lblHorario_S.Text, "</td>",
                  "</tr>",
                  "<tr>",
                    "<td class='cell'>Domingo</td>",
                    "<td class='cell'>", drpTurno_D.SelectedText.Value, "</td>",
                    "<td class='cell'>", lblHorario_D.Text, "</td>",
                  "</tr>",
                "</table>",
                
                "<h1>Máquinas Asignadas</h1>",
                "<table>",
                  "<tr>",
                    "<th>Máquina 1</th>",
                    "<th>Máquina 2</th>",
                    "<th>Máquina 3</th>",
                    "<th>Máquina 4</th>",
                  "</tr>",
                  "<tr>",
                    "<td class='cell'>", drpMaquina.SelectedText.Value, "</td>",
                    "<td class='cell'>", drpMaquina2.SelectedText.Value, "</td>",
                    "<td class='cell'>", drpMaquina3.SelectedText.Value, "</td>",
                    "<td class='cell'>", drpMaquina4.SelectedText.Value, "</td>",
                  "</tr>",
                "</table>",
                
                "<h1>Información Adicional</h1>",
