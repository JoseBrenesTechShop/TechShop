                                Orden = OrdenInfo.Orden,
                                Operacion = OrdenInfo.Operacion,
                                Maquina = Upper(txt_Maquina_HxH2.Text)
                            )
                        }
                    );
                    ForAll(
                        RecordControladorHerramienta,
                        Patch(
                            Controlador_Herramientas,
                            ThisRecord,
                            {Produccion_Hecha: ThisRecord.Produccion_Hecha + Value(txt_CantProducida_HxH2.Text + txt_CantDañada_HxH2.Text)}
                        )
