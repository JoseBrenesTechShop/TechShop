                    btn_EnviarCorreo As button:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        BorderThickness: =3
                        Color: =App.Theme.Colors.PrimaryForeground
                        DisabledBorderColor: =RGBA(244, 244, 244, 1)
                        DisabledColor: =RGBA(166, 166, 166, 1)
                        DisabledFill: =RGBA(244, 244, 244, 1)
                        Fill: =RGBA(15, 84, 140, 1)
                        Font: =App.Theme.Font
                        FontWeight: =FontWeight.Semibold
                        Height: =35
                        HoverBorderColor: =RGBA(12, 59, 94, 1)
                        HoverColor: =App.Theme.Colors.PrimaryForeground
                        HoverFill: =RGBA(12, 59, 94, 1)
                        OnSelect: |-
                            =If(
                                !IsBlank(txt_Asunto.Text) && !IsBlank(txt_Cuerpo.Text) && (CountRows(SelectedDepartamentos) > 0 || !IsBlank(txt_Correo.Text)),
                                Office365Outlook.SendEmailV2(
                                    Concat(
                                        Filter(
                                            Empleados,
                                            Departamento in SelectedDepartamentos.Descripcion
                                        ),
                                        Correo,
                                        ";"
                                    ) & If(
                                        !IsBlank(txt_Correo.Text),
                                        ";" & txt_Correo.Text,
                                        ""
                                    ),
                                    txt_Asunto.Text,
                                    txt_Cuerpo.Text,
                                    {
                                        Attachments: AddColumns(
                                            RenameColumns(
                                                Adjuntos.Attachments,
                                                Value,
                                                ContentBytes
                                            ),
                                            odata,
                                            ""
                                        )
                                    }
                                );
                                // --- Limpiar todo después ---
                            Clear(SelectedDepartamentos);
                                Reset(txt_Asunto);
                                Reset(txt_Cuerpo);
                                Reset(txt_Correo);
                                Reset(Adjuntos),
                                UpdateContext(
                                    {
                                        MostrarAviso: true,
                                        mensajeNotificacion: "Debe completar asunto, cuerpo y seleccionar al menos un departamento o agregar un correo externo."
                                    }
                                )
                            )
                        PressedBorderColor: =RGBA(15, 84, 140, 1)
                        PressedColor: =RGBA(15, 84, 140, 1)
                        PressedFill: =RGBA(180, 214, 250, 1)
                        Size: =16
                        Text: ="Enivar correo"
