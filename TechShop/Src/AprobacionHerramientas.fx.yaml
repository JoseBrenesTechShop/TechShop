                    UpdateContext(
                        {
                            Aviso: true,
                            TextoAdvertencia: "Debe indicar el motivo del rechazo para poder continuar."
                        }
                    ),
                    Patch(
                        SolicitudHerramientas,
                        glr_Solicitudes_AH.Selected,
                        {
                            'Estado (crfb9_estado)': "Rechazado",
                            MotivoRechazo: txt_MotivoRechazo_AH.Text
                        }
                    );
                    ForAll(
                        glr_Herramientas_AH.AllItems,
                        Patch(
                            Herramientas,
                            ThisRecord,
                            {'Estado (crfb9_estado)': "Rechazado"}
                        );
                        Collect(
                            RegistroHerramientas_1,
                            {
                                id_Solicitud: ThisRecord.ID_Solicitud,
                                Maquina: ThisRecord.Maquina,
                                Orden: ThisRecord.Orden,
