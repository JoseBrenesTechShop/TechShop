                                'P/N': ThisRecord.'P/N',
                                ID_Inserto: ThisRecord.ID_Inserto,
                                Descripcion: ThisRecord.Descripcion,
                                qty: ThisRecord.qty,
                                Cant_Inserto: ThisRecord.Cant_Insertos,
                                Piezas_Meta: ThisRecord.Cant_Maxima,
                                Piezas_Hechas: ThisRecord.Cant_Actual,
                                RazonCausa: glr_Solicitudes_AH.Selected.RazonCausa,
