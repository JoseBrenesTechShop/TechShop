                                User: txtEmpleadoEnUso_AH.Text,
                                Surtido: ThisRecord.Surtido,
                                Cant_Inventario: ThisRecord.'Cantidad Inventario',
                                Requerido: ThisRecord.Requerido,
                                ubicacion: ThisRecord.Ubicacion
                            }
                        )
                    );
                    UpdateContext(
                        {
